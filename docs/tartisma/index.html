<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tartışma · Özel Alan</title>
<script>(function(){var S=null;try{var o=JSON.parse(localStorage.getItem('ae_portal')||'null');if(o&&o.S&&Date.now()<(o.son||0))S=o.S;}catch(e){}if(!S||!(S.ka||(S.anahtarlar||{}).oz_tartisma)){location.replace('../portal/');return;}window._AE_S=S;})();</script>
<style>
:root{--bg:#F3F4F6;--panel:#fff;--panel2:#F8F9FA;--line:#E2E5EA;--text:#2B2F35;--muted:#5B6470;--kirmizi:#D32027;
  --claude:#C8643C;--gpt:#1E9E73;--agy:#2F6FD6;--omer:#2B2F35;--ok:#1E9E73;--no:#C8303A;--warn:#B7791F}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:0 18px;height:56px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.geri{color:var(--kirmizi);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.bas{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.bas i{display:inline-flex;flex-direction:column;gap:2px}.bas i b{width:4px;height:4px;border-radius:50%;background:var(--kirmizi)}
.canli{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.canli b{width:8px;height:8px;border-radius:50%;background:#aab}.canli.on b{background:var(--ok)}.canli.hata b{background:var(--no)}
.listeac{display:none;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;color:var(--text)}
main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0}
aside h3{margin:0;padding:14px 16px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.oturum{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.oturum:hover{background:var(--panel2)}.oturum.on{background:#FFF5F5;box-shadow:inset 3px 0 0 var(--kirmizi)}
.oturum .ust{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.oturum .metin{margin-top:3px;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rozet{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.r-uzlasildi{background:#E3F6EE;color:var(--ok)}.r-revizyon_gerekli{background:#FDF3E1;color:var(--warn)}
.r-suruyor{background:#E6EFFC;color:var(--agy)}.r-yarim{background:#EEF0F3;color:var(--muted)}.r-karar{background:#FFF3E8;color:#B5541C}.r-canli{background:#FFF7D6;color:#8A6D00}
.karar{max-width:900px;margin:18px 0;padding:14px 16px;border-radius:12px;background:#FFF8F1;border:2px solid #E9A46B}
.karar .kb{font-weight:800;letter-spacing:.03em;color:#B5541C;margin-bottom:6px;font-size:13.5px}
.r-bekliyor{background:#EEF0F3;color:var(--muted)}.r-alindi{background:#E3F6EE;color:var(--ok)}
section{display:flex;flex-direction:column;min-height:0;min-width:0}
.baslik{padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.baslik .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.baslik .istek{font-size:14px;margin-top:4px}
.katilim{display:flex;gap:12px;flex-wrap:wrap}.katilim span{display:flex;align-items:center;gap:5px}
.katilim span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
details.tercih{margin-top:6px;font-size:12px;color:var(--muted)}details.tercih pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;max-height:160px;overflow:auto}
.sar{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.akis{flex:1;overflow:auto;padding:16px 22px 24px;min-height:0}
.ayrac{display:flex;align-items:center;gap:12px;margin:22px 0 12px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ayrac::before,.ayrac::after{content:"";flex:1;height:1px;background:var(--line)}
.mesaj{display:flex;gap:11px;margin:12px 0;max-width:900px;animation:gir .3s ease-out}
@keyframes gir{from{opacity:0;transform:translateY(5px)}}
.avatar{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--c)}
.balon{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px 12px 12px 12px;padding:11px 15px}
.mesaj.ben{flex-direction:row-reverse;margin-left:auto;max-width:680px}
.mesaj.ben .balon{background:var(--omer);color:#fff;border:0;border-radius:12px 4px 12px 12px}
.mesaj.ben .kim b{color:#fff}.mesaj.ben .kim .rol{color:#C9CED6}
.kim{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;font-size:13px}
.kim b{color:var(--c)}.kim .rol{color:var(--muted)}.kim time{margin-left:auto;font-size:11.5px;color:var(--muted)}
.icerik{white-space:pre-wrap;overflow-wrap:anywhere}
.senaryo h4{margin:0 0 8px;font-size:15px}.senaryo ol{margin:0;padding-left:22px}.senaryo li{margin:6px 0}
.senaryo li small{display:block;color:var(--muted);font-size:12px}.senaryo details{margin-top:8px;font-size:13px}.senaryo summary{cursor:pointer;color:var(--muted)}
.yaziyor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0 0 45px}
.yaziyor i{display:inline-flex;gap:4px}.yaziyor i b{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:z 1.2s infinite}
.yaziyor i b:nth-child(2){animation-delay:.15s}.yaziyor i b:nth-child(3){animation-delay:.3s}
@keyframes z{0%,60%,100%{opacity:.25}30%{opacity:1}}
.son{margin:20px 0 0;padding:12px 14px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:13.5px;max-width:900px;background:var(--panel)}
.bos{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:24px}
.yeni{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:var(--kirmizi);color:#fff;border:0;border-radius:99px;padding:7px 15px;font:600 13px system-ui;cursor:pointer;display:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
form.yaz{flex:none;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
form.yaz textarea{flex:1;resize:none;min-height:44px;max-height:160px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;color:var(--text);background:var(--panel2)}
form.yaz textarea:focus{outline:2px solid #F3C5C7;border-color:var(--kirmizi)}
form.yaz button{border:0;border-radius:12px;background:var(--kirmizi);color:#fff;font:600 14px system-ui;padding:0 18px;cursor:pointer}
form.yaz button:disabled{opacity:.5;cursor:default}
.ipucu{font-size:12px;color:var(--muted);padding:0 18px 8px;background:var(--panel)}
.ince{color:var(--muted);font-size:13px}
.kurulum{max-width:560px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.kurulum code{display:block;word-break:break-all;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;font-size:13px}
@media (max-width:760px){
  header{padding:0 12px;gap:10px}.geri span{display:none}
  main{grid-template-columns:1fr}
  aside{display:none;position:fixed;inset:56px 0 0 0;z-index:5}
  body.liste aside{display:block}.listeac{display:inline-flex}
  .baslik,.akis{padding-left:14px;padding-right:14px}.yaziyor{margin-left:0}
  .canli span{display:none}.mesaj.ben{max-width:92%}
}
</style>
</head>
<body>
<header>
  <a class="geri" href="../portal/">← <span>Portal</span></a>
  <div class="bas"><i><b></b><b></b><b></b></i>Tartışma</div>
  <button class="listeac" id="listeac">Oturumlar</button>
  <div class="canli" id="canli"><b></b><span id="canliyazi">bağlanıyor…</span></div>
</header>
<main>
  <aside><h3>Tartışma oturumları</h3><div id="liste"></div></aside>
  <section>
    <div class="baslik" id="baslik" hidden></div>
    <div class="sar">
      <div class="akis" id="akis"><div class="bos">Yükleniyor…</div></div>
      <button class="yeni" id="yeni">↓ Yeni mesaj</button>
    </div>
    <form class="yaz" id="yazForm" hidden>
      <textarea id="yazi" rows="1" maxlength="4000" placeholder="Panele yaz… (anında yanıt verir)"></textarea>
      <button id="gonder">Gönder</button>
    </form>
    <div class="ipucu" id="ipucu" hidden>Enter gönderir, Shift+Enter yeni satır. Yazdığın anda panel canlı yanıt verir ve yazar notunu senaryoya hemen uygular; tartışma sürüyorsa not sıradaki turda da kullanılır.</div>
  </section>
</main>
<script>
const API = 'https://xbay.app.n8n.cloud/webhook/tartisma-portal';
const S = window._AE_S;
const AJAN = {
  claude: { ad: 'Claude', kisa: 'C', renk: 'var(--claude)', uz: 'Hikâye yapısı & gizem' },
  gpt: { ad: 'GPT', kisa: 'G', renk: 'var(--gpt)', uz: 'Kanca & izlenme' },
  antigravity: { ad: 'Antigravity', kisa: 'A', renk: 'var(--agy)', uz: 'Stil & üretilebilirlik' },
  'drama-yazar': { ad: 'Drama Yazarı', kisa: 'DY', renk: '#9C2F5E', uz: 'drama-skills · kısa dizi senaristi' },
  'drama-elestirmen': { ad: 'Drama Eleştirmeni', kisa: 'DE', renk: '#5E3A8C', uz: 'drama-skills · kısa dizi denetçisi' },
  'gemini-argon': { ad: 'Gemini Argon', kisa: 'Ar', renk: '#7A3FB8', uz: 'Korku & gerilim' },
  sonnet: { ad: 'Claude Sonnet', kisa: 'S', renk: '#A0522D', uz: 'Türkçe dil & anlatım' },
  o3: { ad: 'o3', kisa: 'o3', renk: '#0F6E6E', uz: 'Mantık & gerçeklik' },
  'gemini-carbon': { ad: 'Gemini Carbon', kisa: 'Ca', renk: '#33507A', uz: 'Görsel yönetmen' },
  'gpt-sol': { ad: 'GPT Sol', kisa: 'So', renk: '#4E7D2E', uz: 'Seri mimarı' },
  omer: { ad: 'Moderatör', kisa: 'M', renk: 'var(--omer)' },
};
const ajan = m => AJAN[m] || { ad: m, kisa: (m || '?')[0].toUpperCase(), renk: 'var(--muted)' };
const DURUM = { karar: 'Karar verildi', uzlasildi: 'Uzlaşıldı', revizyon_gerekli: 'Revizyon gerekli', suruyor: 'Sürüyor', yarim: 'Yarım kaldı' };
const $ = id => document.getElementById(id);
const kac = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const sha = async t => hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)));
const saatYaz = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const idZaman = id => { const m = String(id).match(/^(\d{4}-\d\d-\d\d)T(\d\d)-(\d\d)/); return m ? saatYaz(`${m[1]}T${m[2]}:${m[3]}:00Z`) : id; };

let BELIRTEC = null;
let secili = (() => { try { return location.hash.slice(1) || localStorage.getItem('tartisma.secili'); } catch { return null; } })() || null;
let cizilen = { id: null, imza: '' };
let son = null;

async function api(govde) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ anahtar: BELIRTEC, ...govde }), cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error('yetkisiz'); e.yetkisiz = true; throw e; }
  if (!r.ok || j.ok === false) throw new Error(j.hata || ('HTTP ' + r.status));
  return j;
}

function canli(d, yazi) { $('canli').className = 'canli ' + d; $('canliyazi').textContent = yazi; }

function listeCiz(liste) {
  if (!secili && liste.length) secili = liste[0].id;
  $('liste').innerHTML = liste.length ? liste.map(o => `
    <button class="oturum ${o.id === secili ? 'on' : ''}" data-id="${kac(o.id)}">
      <div class="ust"><span>${idZaman(o.id)} · ${o.mesaj} mesaj</span><span class="rozet r-${kac(o.durum)}">${DURUM[o.durum] || kac(o.durum)}</span></div>
      <div class="metin">${kac(o.istek || '(istek yok)')}</div>
    </button>`).join('') : '<div style="padding:16px;color:var(--muted);font-size:13px">Henüz oturum yok. Bu bilgisayarda köprü açıkken bir tartışma başlayınca burada görünür.</div>';
}

function senaryoHtml(s) {
  if (!s || !Array.isArray(s.sahneler)) return `<div class="icerik">${kac(typeof s === 'string' ? s : JSON.stringify(s, null, 2))}</div>`;
  return `<div class="senaryo"><h4>📜 ${kac(s.baslik)}</h4><ol>${s.sahneler.map(x => `<li>${kac(x.anlatim)}<small>Altyazı: ${kac(String(x.altyazi ?? '').replace(/\n/g, ' / '))}</small></li>`).join('')}</ol>
    <details><summary>Sahne ayrıntıları (HUD, görsel istemi)</summary><ol>${s.sahneler.map(x => `<li><small>${kac(x.hud)}</small>${kac(x.gorsel)}</li>`).join('')}</ol></details></div>`;
}

function mesajHtml(o) {
  if (o.tip === 'not') {
    const a = ajan('omer');
    return `<div class="mesaj ben" style="--c:${a.renk}"><div class="avatar">${kac(a.kisa)}</div><div class="balon">
      <div class="kim"><b>${kac(a.ad)}</b><span class="rozet r-${o.durum === 'alindi' ? 'alindi' : 'bekliyor'}">${o.durum === 'alindi' ? '✓ Köprüye ulaştı' : '⏳ Bekliyor'}</span><time>${saatYaz(o.ts)}</time></div>
      <div class="icerik">${kac(o.metin)}</div></div></div>`;
  }
  const k = o, a = ajan(k.model);
  let rol, govde;
  if (k.rol === 'karar') {
    const y = { oybirligi: 'Oy birliği', cogunluk: 'Çoğunluk', hakem: 'Hakem kararı' }[k.cevap?.yontem] || 'Karar';
    return `<div class="karar"><div class="kb">⚖️ KARAR VERİLDİ · ${kac(y)}${k.cevap?.oy ? ' · oy ' + kac(k.cevap.oy) : ''}</div><div class="icerik">${kac(k.cevap?.gerekce || '')}</div></div>`;
  }
  if (k.rol === 'yanit') { rol = `<span class="rol">Moderatöre yanıt${a.uz ? ' · ' + kac(a.uz) : ''}</span><span class="rozet r-canli">⚡ canlı</span>`; govde = `<div class="icerik">${kac(k.cevap?.yanit ?? '')}</div>`; }
  else if (k.rol === 'yazar' && !k.tur) { rol = '<span class="rol">notunu senaryoya hemen uyguladı</span><span class="rozet r-canli">⚡ yeni taslak</span>'; govde = senaryoHtml(k.cevap); }
  else if (k.rol === 'yazar') { rol = `<span class="rol">${k.tur === 1 ? 'ilk taslağı yazdı' : 'eleştirilere göre yeniden yazdı'}</span>`; govde = senaryoHtml(k.cevap); }
  else if (k.rol === 'hakem') { rol = '<span class="rol">hakem olarak nihai senaryoyu yazdı</span><span class="rozet r-karar">⚖️ Hakem</span>'; govde = `<div class="icerik" style="margin-bottom:10px"><b>Gerekçe:</b> ${kac(k.cevap?.gerekce || '')}</div>` + senaryoHtml(k.cevap?.senaryo); }
  else if (k.rol === 'kullanici') { rol = '<span class="rol">notu tartışmaya iletildi</span>'; govde = `<div class="icerik">${kac(k.cevap?.metin ?? k.cevap)}</div>`; }
  else {
    const ok = k.cevap?.onay === true;
    rol = `<span class="rol">${a.uz ? kac(a.uz) + ' açısından ' : ''}değerlendirdi</span><span class="rozet ${ok ? 'r-uzlasildi' : 'r-revizyon_gerekli'}">${ok ? '✓ Onayladı' : '✗ Onaylamadı'}</span>`;
    govde = `<div class="icerik">${kac(k.cevap?.elestiri ?? JSON.stringify(k.cevap))}</div>`;
  }
  return `<div class="mesaj" style="--c:${a.renk}"><div class="avatar">${kac(a.kisa)}</div><div class="balon"><div class="kim"><b>${kac(a.ad)}</b>${rol}<time>${saatYaz(k.ts)}</time></div>${govde}</div></div>`;
}

const altta = () => { const a = $('akis'); return a.scrollHeight - a.scrollTop - a.clientHeight < 120; };

function tartismaCiz(t) {
  const akis = $('akis'), meta = t.meta || {};
  const durum = meta.durum || 'yarim';
  const ajanlar = [...new Set(t.kayitlar.map(k => k.model))].filter(m => m !== 'karar');
  $('baslik').hidden = false; $('yazForm').hidden = false; $('ipucu').hidden = false;
  $('baslik').innerHTML = `<div class="meta"><span class="rozet r-${kac(durum)}">${DURUM[durum] || kac(durum)}</span>
      <span>Tur ${meta.tur || 0}/3 · ${t.kayitlar.length} mesaj${t.notlar.length ? ' · ' + t.notlar.length + ' notun' : ''}</span>
      <span class="katilim">${ajanlar.map(m => `<span style="--c:${ajan(m).renk}">${kac(ajan(m).ad)}</span>`).join('')}</span></div>
    <div class="istek"><b>İstek:</b> ${kac(meta.istek || '')}</div>
    ${meta.tercihler ? `<details class="tercih"><summary>Tartışmaya giden tercihler</summary><pre>${kac(meta.tercihler)}</pre></details>` : ''}`;

  // Yapay zekâ mesajları ve senin notların zamana göre tek akışta.
  const ogeler = [...t.kayitlar.map(k => ({ ...k, tip: 'kayit' })), ...t.notlar.map(n => ({ ...n, tip: 'not' }))]
    .sort((x, y) => (Date.parse(x.ts) || 0) - (Date.parse(y.ts) || 0) || (x.tip === 'kayit' && y.tip === 'kayit' ? x.sira - y.sira : 0));
  const imza = JSON.stringify(ogeler.map(o => [o.tip, o.sira ?? o.not_id, o.durum])) + durum;
  if (cizilen.id === t.id && cizilen.imza === imza) return;
  const yeniOturum = cizilen.id !== t.id, dipte = yeniOturum || altta();
  const onceki = yeniOturum ? 0 : akis.querySelectorAll('.mesaj').length;
  let html = '', tur = null;
  for (const o of ogeler) {
    if (o.tip === 'kayit' && o.tur !== tur) { tur = o.tur; html += `<div class="ayrac">${o.tur ? 'Tur ' + o.tur : '⚡ Canlı sohbet'}</div>`; }
    html += mesajHtml(o);
  }
  // Son notundan sonra henüz cevap gelmediyse panelin yazdığını göster.
  const sonNot = t.notlar.at(-1), sonKayit = t.kayitlar.reduce((m, k) => Math.max(m, Date.parse(k.ts) || 0), 0);
  const notBekliyor = sonNot && (Date.parse(sonNot.ts) || 0) > sonKayit && Date.now() - (Date.parse(sonNot.ts) || 0) < 10 * 60 * 1000;
  if (notBekliyor && durum !== 'suruyor') html += `<div class="yaziyor"><i><b></b><b></b><b></b></i>${sonNot.durum === 'alindi' ? 'Panel notunu okudu, yanıtlıyor' : 'Notun köprüye gidiyor'}…</div>`;
  if (durum === 'suruyor') {
    const s = t.kayitlar.at(-1);
    html += `<div class="yaziyor"><i><b></b><b></b><b></b></i>${!s ? 'Yazar ilk taslağı yazıyor' : s.rol === 'yazar' ? 'Eleştirmenler taslağı okuyor' : (s.tur >= 3 ? 'Son tur: karar bekleniyor' : 'Sıradaki yanıt bekleniyor')}…</div>`;
  } else if (durum === 'karar') html += '<div class="son">Tartışma kapandı. Yukarıdaki karar ve son senaryo nihaidir; video üretimi ayrıca başlatılır.</div>';
  else if (durum === 'uzlasildi') html += '<div class="son">✓ Tüm eleştirmenler son taslağı onayladı. Bu editoryal bir uzlaşma; tarihî doğruluk ve senin onayın ayrıca gerekir.</div>';
  else if (durum === 'revizyon_gerekli') html += '<div class="son">Tur sınırına gelindi, uzlaşma olmadı. Buraya yazdığın not bir sonraki tartışmada dikkate alınır.</div>';
  else if (durum === 'yarim') html += '<div class="son">Bu oturum yarıda kalmış. Yazdığın not bir sonraki tartışmada dikkate alınır.</div>';
  if (!ogeler.length) html = '<div class="bos">Bu oturumda henüz mesaj yok.</div>' + html;
  akis.innerHTML = html;
  akis.querySelectorAll('.mesaj').forEach((m, i) => { if (i < onceki) m.style.animation = 'none'; });
  cizilen = { id: t.id, imza };
  if (dipte) { akis.scrollTop = akis.scrollHeight; $('yeni').style.display = 'none'; }
  else if (ogeler.length > onceki) $('yeni').style.display = 'block';
}

async function yenile() {
  try {
    const { liste } = await api({ islem: 'liste' });
    listeCiz(liste);
    if (secili && liste.some(o => o.id === secili)) { son = await api({ islem: 'oku', oturum: secili }); tartismaCiz(son); }
    else if (!liste.length) $('akis').innerHTML = '<div class="bos">Henüz tartışma yok.<br>Bu bilgisayarda köprü açıkken bir tartışma başlayınca burada canlı akacak.</div>';
    canli('on', 'canlı · ' + new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
  } catch (e) {
    if (e.yetkisiz) return kurulumGoster();
    canli('hata', 'bağlantı sorunu, yeniden deneniyor');
  }
}

async function kurulumGoster() {
  clearInterval(zamanlayici);
  const kod = await sha(BELIRTEC);
  $('liste').innerHTML = '';
  $('akis').innerHTML = `<div class="kurulum"><b>Bu tarayıcı henüz tanımlı değil</b>
    <p class="ince">Tartışma deposu yalnızca senin yönetici hesabından türetilen bir belirteci kabul eder. Aşağıdaki <b>kurulum kodunu</b> Claude'a ver. Bu kod belirtecin özetidir; kendisi değildir, kopyalanması güvenlidir.</p>
    <code id="kod">${kod}</code><button class="geri" style="border:0;background:none;cursor:pointer;padding:0" onclick="navigator.clipboard.writeText('${kod}').then(()=>this.textContent='Kopyalandı ✓')">Kodu kopyala</button></div>`;
  canli('hata', 'tanımlı değil');
}

async function gonder(ev) {
  ev.preventDefault();
  const metin = $('yazi').value.trim();
  if (!metin || !secili) return;
  $('gonder').disabled = true;
  try {
    const { not } = await api({ islem: 'yaz', oturum: secili, metin });
    $('yazi').value = ''; boyutla();
    if (son && son.id === secili) { son.notlar.push(not); cizilen.imza = ''; tartismaCiz(son); }
    const a = $('akis'); a.scrollTop = a.scrollHeight;
  } catch (e) { if (e.yetkisiz) kurulumGoster(); else alert('Gönderilemedi: ' + e.message); }
  $('gonder').disabled = false; $('yazi').focus();
}
function boyutla() { const t = $('yazi'); t.style.height = 'auto'; t.style.height = Math.min(160, t.scrollHeight) + 'px'; }

$('liste').addEventListener('click', e => {
  const b = e.target.closest('.oturum'); if (!b) return;
  secili = b.dataset.id; history.replaceState(null, '', '#' + secili);
  try { localStorage.setItem('tartisma.secili', secili); } catch {}
  document.body.classList.remove('liste'); cizilen = { id: null, imza: '' };
  $('akis').innerHTML = '<div class="bos">Yükleniyor…</div>'; yenile();
});
$('listeac').onclick = () => document.body.classList.toggle('liste');
$('yeni').onclick = () => { const a = $('akis'); a.scrollTop = a.scrollHeight; $('yeni').style.display = 'none'; };
$('akis').addEventListener('scroll', () => { if (altta()) $('yeni').style.display = 'none'; });
$('yazForm').addEventListener('submit', gonder);
$('yazi').addEventListener('input', boyutla);
$('yazi').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('yazForm').requestSubmit(); } });

let zamanlayici;
(async () => {
  // Tartışmaya özel belirteç: merkez sunucunun yönetici belirtecinden farklıdır, sızarsa yalnızca tartışmalara erişim verir.
  BELIRTEC = await sha('aesun-api|tartisma|' + (S.ka || (S.anahtarlar || {}).oz_tartisma_y || (S.anahtarlar || {}).oz_tartisma));
  await yenile();
  zamanlayici = setInterval(() => { if (!document.hidden) yenile(); }, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) yenile(); });
})();
</script>
