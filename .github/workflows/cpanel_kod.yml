name: cPanel kod incele (yalnız okuma)
on:
  workflow_dispatch:
    inputs:
      dosyalar:
        description: "docroot'a göre dosyalar, boşlukla"
        default: "api/portal.php"
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
        run: python3 cpanel/kod_incele.py ${{ inputs.dosyalar }}
