name: İçerik Yöneticisi durumu (salt okunur)
# Yükleme Yöneticisi'nin (sunucu /opt/aesun/havuz) iş durumlarını Yayın Takibi → İçerik Yöneticisi sekmesine taşır.
# Sunucuda hiçbir şeyi değiştirmez; yalnız docs/yayin/havuz.json yazılır (değişiklik varsa).
on:
  schedule:
    - cron: '23 * * * *'   # saatte bir
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sunucu/islem_havuz_disa.sh', '.github/workflows/havuz_disa.yml']
permissions:
  contents: write
concurrency: { group: havuz-disa, cancel-in-progress: true }
jobs:
  disa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Sunucudan oku
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          set -o pipefail
          mkdir -p ~/.ssh
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh -i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 root@$ADRES "bash -s" < sunucu/islem_havuz_disa.sh > /tmp/cikti.txt 2>&1
          kod=$?; rm -f ~/.ssh/k
          grep '^NOT:' /tmp/cikti.txt | sed 's/^NOT: *//' | while IFS= read -r l; do echo "::notice::$l"; done
          python3 - <<'PY'
          import json, re, os
          from datetime import datetime, timezone, timedelta
          t = open('/tmp/cikti.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'===HAVUZ===\n(.*?)\n===SON===', t, re.S)
          if not m:
              print('::error::sunucu çıktısında havuz yok'); raise SystemExit(1)
          yeni = json.loads(m.group(1))
          yol = 'docs/yayin/havuz.json'
          eski = json.load(open(yol, encoding='utf-8')) if os.path.exists(yol) else {}
          if eski.get('isler') == yeni['isler'] and eski.get('plan_guncelleme') == yeni.get('plan_guncelleme'):
              print('değişiklik yok'); raise SystemExit(0)
          yeni['zaman'] = datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='minutes')
          json.dump(yeni, open(yol, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
          exit $kod
      - name: Kaydet
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add docs/yayin/havuz.json
          git diff --cached --quiet && exit 0
          git commit -qm "İçerik Yöneticisi: durum $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
