name: Kozmos render (Blender)
# Blender render işleri GitHub'ın bulut makinelerinde çalışır (sunucunun sanal işlemcisi Blender'ı desteklemiyor; sunucu yük almaz).
# Modeller sunucudaki tampondan (/opt/tampon/kozmos/modeller) okunur, depoya girmez. Çıktı: iş eseri (artifact).
on:
  workflow_dispatch:
    inputs:
      klasor:
        description: "model klasörü: kozmos | bta"
        required: false
        default: kozmos
      gorev:
        description: "onizleme | parca | disari | arac | film | kurgu"
        required: true
        default: onizleme
      parca:
        description: "film için paralel parça sayısı (1-20)"
        required: false
        default: "1"
      ayar:
        description: "film ayarları: FPS RES SAMPLES [KARELER] (örn. '12 854x480 10' ya da '12 854x480 10 300,700')"
        required: false
        default: "12 854x480 10"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.p.outputs.liste }}
    steps:
      - id: p
        run: |
          n="${{ inputs.parca }}"; case "$n" in ''|*[!0-9]*) n=1;; esac; [ "$n" -gt 20 ] && n=20; [ "$n" -lt 1 ] && n=1
          echo "liste=[$(seq -s, 0 $((n-1)))]" >> "$GITHUB_OUTPUT"
  kurgu:
    if: inputs.gorev == 'kurgu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
      - name: Kareleri sunucudan al, kurguyu yap, geri gönder
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k; chmod 600 ~/.ssh/k
          S="ssh -i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes root@$ADRES"
          mkdir -p kareler && $S "tar cf - -C /opt/tampon/kozmos/midong_kareler ." | tar xf - -C kareler
          $S "ls /opt/tampon/kozmos/earth/*.mp4 2>/dev/null | head -1" > earth_yol.txt || true
          E=""; if [ -s earth_yol.txt ]; then $S "cat $(cat earth_yol.txt)" > earth.mp4 && E=earth.mp4; fi
          bash sunucu/kozmos/midong_kurgu.sh kareler midong_onizleme_480p.mp4 $E
          $S "cat > /opt/tampon/kozmos/midong_onizleme_480p.mp4" < midong_onizleme_480p.mp4
          rm -f ~/.ssh/k
          D=$RUNNER_TEMP/dal; git clone -q --depth 1 --branch kozmos-cikti https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} $D
          mkdir -p $D/kurgu && cp midong_onizleme_480p.mp4 $D/kurgu/ && cd $D && git add -A && git -c user.name=kozmos-bot -c user.email=bot@users.noreply.github.com commit -q -m "midong önizleme" && git push -q origin kozmos-cikti
  render:
    if: inputs.gorev != 'kurgu'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.liste) }}
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.5 LTS
        uses: actions/cache@v4
        id: bc
        with:
          path: ~/blender
          key: blender-4.5.0
      - if: steps.bc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender && curl -sL https://download.blender.org/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz | tar xJ -C ~/blender --strip-components=1
      - name: Sistem kitaplıkları
        run: sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 >/dev/null
      - name: Modelleri sunucudan al
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes root@$ADRES "tar cf - -C /opt/tampon/${{ inputs.klasor || 'kozmos' }} modeller" | tar xf - -C $RUNNER_TEMP
          rm -f ~/.ssh/k; du -sh $RUNNER_TEMP/modeller
      - name: Render
        run: |
          mkdir -p cikti
          if [ "${{ inputs.gorev }}" = "arac" ]; then
            ~/blender/blender -b --python-exit-code 1 -P sunucu/kozmos/arac_insan_disari.py -- $RUNNER_TEMP/modeller cikti 2>&1 | grep -E 'DISARI|PAKET|ATLA|YOK|MOD|Error|Traceback' || true
            cp $RUNNER_TEMP/modeller/kaynakca.json cikti/ 2>/dev/null || true
          elif [ "${{ inputs.gorev }}" = "disari" ]; then
            ~/blender/blender -b --python-exit-code 1 -P sunucu/kozmos/parca_disari.py -- $RUNNER_TEMP/modeller cikti 2>&1 | grep -E 'DISARI|YOK|Error|Traceback' || true
          elif [ "${{ inputs.gorev }}" = "parca" ]; then
            ~/blender/blender -b --python-exit-code 1 -P sunucu/kozmos/parca_onizle.py -- $RUNNER_TEMP/modeller cikti 2>&1 | grep -E 'PARCA|Error|Traceback' || true
          elif [ "${{ inputs.gorev }}" = "onizleme" ]; then
            ~/blender/blender -b --python-exit-code 1 -P sunucu/kozmos/model_onizle.py -- $RUNNER_TEMP/modeller cikti 2>&1 | grep -E 'ONIZLEME|Error|Traceback' || true
            cp $RUNNER_TEMP/modeller/kaynakca.json cikti/ 2>/dev/null || true
          else
            set -- ${{ inputs.ayar }}
            FPS=$1 RES=$2 SAMPLES=$3 FRAMES=${4:-} MODELLER=$RUNNER_TEMP/modeller PARCA=${{ matrix.i }} PARCA_SAYISI=${{ inputs.parca }} \
              ~/blender/blender -b --python-exit-code 1 -P sunucu/kozmos/midong_film.py -- cikti 2>&1 | grep -E 'KARE|BITTI|Error|Traceback' | tail -20
          fi
          ls cikti | head
      - name: Küçük çıktıları kozmos-cikti dalına yaz (önizleme ve kontak kareleri)
        if: always()
        run: |
          set +e
          D=$RUNNER_TEMP/dal; git clone -q --depth 1 --branch kozmos-cikti https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} $D 2>/dev/null || { git init -q $D; git -C $D checkout -q -b kozmos-cikti; git -C $D remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}; }
          H=${{ inputs.gorev }}/${{ matrix.i }}; rm -rf $D/$H; mkdir -p $D/$H
          if [ "${{ inputs.gorev }}" = "onizleme" ] || [ "${{ inputs.gorev }}" = "parca" ] || [ "${{ inputs.gorev }}" = "disari" ] || [ "${{ inputs.gorev }}" = "arac" ]; then cp cikti/* $D/$H/; else cp cikti/*.json $D/$H/ 2>/dev/null || true; ls cikti/kare_*.jpg | awk -v n="${{ inputs.ayar }}" 'BEGIN{split(n,a," "); k=(a[4]!="")?1:24} NR%k==1 || k==1' | xargs -r -I{} cp {} $D/$H/; fi
          cd $D && git add -A && git -c user.name=kozmos-bot -c user.email=bot@users.noreply.github.com commit -q -m "kozmos ${{ inputs.gorev }} ${{ matrix.i }}" && for k in 1 2 3; do git pull -q --rebase origin kozmos-cikti 2>/dev/null || true; git push -q origin kozmos-cikti && break; sleep $((k*3)); done
      - name: Film karelerini sunucuya gönder
        if: inputs.gorev == 'film'
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k; chmod 600 ~/.ssh/k
          tar cf - -C cikti . | ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes root@$ADRES "mkdir -p /opt/tampon/kozmos/midong_kareler && tar xf - -C /opt/tampon/kozmos/midong_kareler"
          rm -f ~/.ssh/k
