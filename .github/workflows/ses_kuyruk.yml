name: Seslendirme kuyruğu (ElevenLabs, sunucudan)
# sunucu/ses_kuyruk/<kod>.json eklenince sunucu ElevenLabs ile seslendirir; mp3'ler sunucu/ses_kuyruk/cikti/ altına yazılır,
# iş dosyası sunucu/ses_kuyruk/tamam/ altına taşınır. Bilgisayar gerekmez; anahtar sunucuda kalır.
on:
  push:
    branches: [main]
    paths: ['sunucu/ses_kuyruk/*.json', 'sunucu/islem_ses_kuyruk.sh', '.github/workflows/ses_kuyruk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ses-kuyruk, cancel-in-progress: false }
jobs:
  ses:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sunucuda seslendir
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          ls sunucu/ses_kuyruk/*.json >/dev/null 2>&1 || { echo "kuyruk boş"; exit 0; }
          mkdir -p ~/.ssh /tmp/pk/kuyruk
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          cp sunucu/islem_ses_kuyruk.sh /tmp/pk/; cp sunucu/ses_kuyruk/*.json /tmp/pk/kuyruk/
          tar czf /tmp/paket.tgz -C /tmp/pk .
          O="-i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          ssh $O root@$ADRES "rm -rf /tmp/ses_k && mkdir -p /tmp/ses_k && tar xzf - -C /tmp/ses_k && cd /tmp/ses_k && bash islem_ses_kuyruk.sh < /dev/null; tar czf /tmp/ses_cikti.tgz -C /tmp/ses_k cikti" < /tmp/paket.tgz > /tmp/cikti.txt 2>&1 || true
          scp $O root@$ADRES:/tmp/ses_cikti.tgz /tmp/ && tar xzf /tmp/ses_cikti.tgz -C sunucu/ses_kuyruk/ || echo "::warning::çıktı alınamadı"
          ssh $O root@$ADRES "rm -rf /tmp/ses_k /tmp/ses_cikti.tgz" || true
          rm -f ~/.ssh/k
          grep '^NOT:' /tmp/cikti.txt | sed 's/^NOT: *//' | tee sunucu/ses_kuyruk/cikti/gunluk.txt | while IFS= read -r l; do echo "::notice::$l"; done
          mkdir -p sunucu/ses_kuyruk/tamam
          for f in sunucu/ses_kuyruk/*.json; do git mv "$f" sunucu/ses_kuyruk/tamam/; done
      - name: Kaydet
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A sunucu/ses_kuyruk
          git diff --cached --quiet && exit 0
          git commit -qm "Seslendirme kuyruğu: sesler hazır $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
