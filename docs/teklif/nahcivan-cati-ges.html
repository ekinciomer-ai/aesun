<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nahçıvan Çatı GES</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html,body{margin:0}

/* Layout: tam ekran 3D sahne, solda yarı saydam bilgi paneli (telefonda altta açılır kart) */
:root{--bg:#e9e7e1;--ink:#16181b;--mute:#5d6066;--line:rgba(22,24,27,.14);--card:rgba(249,248,245,.88);--accent:#d6182b;--panel:#1d2b55;
 --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--ink:#ecebe7;--mute:#a3a6ab;--line:rgba(236,235,231,.16);--card:rgba(28,30,34,.88);--accent:#ff3b4e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--ink:#ecebe7;--mute:#a3a6ab;--line:rgba(236,235,231,.16);--card:rgba(28,30,34,.88);--accent:#ff3b4e;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(380px,calc(100% - 24px));
 max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--card);backdrop-filter:blur(10px);
 border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{display:flex;flex-direction:column;gap:2px}
.k b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.k span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.k.ac b{color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:6px}
button,label.t{font:500 12px var(--f-ui);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,label.t:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{font-weight:600;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:4px 4px;border-bottom:1px solid var(--line)}
td{padding:5px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
tr.b{cursor:pointer}tr.b:hover td,tr.b.sel td{background:rgba(214,24,43,.08)}
.tw{overflow-x:auto}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--mute);font-weight:600}
.note{font-size:11.5px;color:var(--mute);line-height:1.5;margin:0}
.str{font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.comp{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;
 background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:700 12px var(--f-mono);color:var(--accent)}
.more{display:none}.ui.open .more{display:flex}
#tg::after{content:'▾';margin-left:2px}.ui.open #tg::after{content:'▴'}
@media (max-width:640px){
 .ui{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));width:calc(100% - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-height:52%}
 .comp{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
}
</style>

</head>
<body>
<canvas id="c" aria-label="Çatı GES 3D modeli"></canvas>
<div class="comp" title="Kuzey yukarı (uydu görüntüsü)"><span id="needle">K</span></div>
<div class="ui" id="ui">
 <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
  <div><h1>Nahçıvan Çatı GES</h1><div class="sub">12 bina · 630 Wp panel (2382×1134 mm) · 400 V AG</div></div>
  <button id="tg" aria-expanded="false">Detay</button>
 </div>
 <div class="kpis">
  <div class="k"><b id="kN">0</b><span>Panel</span></div>
  <div class="k"><b id="kDC">0</b><span>DC kWp</span></div>
  <div class="k ac"><b id="kAC">0</b><span>AC kW</span></div>
  <div class="k"><b id="kR">0</b><span>DC/AC</span></div>
 </div>
 <div class="row">
  <button id="vTop">Tepeden</button><button id="vPer" class="on">Perspektif</button>
  <label class="t"><input type="checkbox" id="cN" checked> Kuzey yüzler</label>
  <label class="t"><input type="checkbox" id="cS" checked> Uydu</label>
 </div>
 <div class="more" style="flex-direction:column;gap:12px">
  <h2>Binalar</h2>
  <div class="tw"><table id="tb"><thead><tr><th>Bina</th><th>Yüz</th><th class="n">Panel</th><th class="n">kWp</th><th>İnv.</th></tr></thead><tbody></tbody></table></div>
  <h2>İnverterler (3 faz 400 V)</h2>
  <div class="tw"><table id="ti"><thead><tr><th>İnv.</th><th>Bölge</th><th class="n">DC kWp</th><th class="n">AC kW</th><th class="n">Oran</th><th class="n">Dizi</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="nt"></p>
 </div>
</div>

 const G=new THREE.Group();bGroups[b.id]=G;S.add(G);
 const xs=b.faces.flatMap(f=>[f.rect[0],f.rect[2]]),ys=b.faces.flatMap(f=>[f.rect[1],f.rect[3]]);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const h=b.h, w=(x1-x0)*M, d=(y1-y0)*M;
 const box=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallM);box.position.set(X((x0+x1)/2),h/2,Z((y0+y1)/2));box.castShadow=box.receiveShadow=true;G.add(box);
 const mono=b.faces.length===1;
 const rise=Math.max(...b.faces.map(f=>((f.az!=='E'&&f.az!=='W')?f.d:f.w)*Math.tan(f.tilt*Math.PI/180)));
 const mat=b.faces[0].tilt<10?roofG:roofR;
 b.faces.forEach(f=>{
  const [a0,b0,a1,b1]=f.rect;const fx0=X(a0),fz0=Z(b0),fx1=X(a1),fz1=Z(b1);
  const fa=f.az==='F'?'S':f.az;const ns=(fa==='N'||fa==='S');const fr=f.tilt*Math.PI/180, rr=mono?(ns?f.d:f.w)*Math.tan(fr):rise;const vLn=(ns?f.d:f.w)/Math.cos(fr);
  const H=h, T=h+rr;let E1,E2,R1,R2;// eave + ridge edges
  if(fa==='S'){E1=[fx0,H,fz1];E2=[fx1,H,fz1];R1=[fx0,T,fz0];R2=[fx1,T,fz0]}
  if(fa==='N'){E1=[fx1,H,fz0];E2=[fx0,H,fz0];R1=[fx1,T,fz1];R2=[fx0,T,fz1]}
  if(fa==='E'){E1=[fx1,H,fz1];E2=[fx1,H,fz0];R1=[fx0,T,fz1];R2=[fx0,T,fz0]}
  if(fa==='W'){E1=[fx0,H,fz0];E2=[fx0,H,fz1];R1=[fx1,T,fz0];R2=[fx1,T,fz1]}
  G.add(quad(E1,E2,R2,R1,mat));
  if(mono){// yan duvar üçgenleri
   G.add(tri(E1,R1,[R1[0],H,R1[2]],wallM));G.add(tri(E2,R2,[R2[0],H,R2[2]],wallM));
   G.add(quad([R1[0],H,R1[2]],[R2[0],H,R2[2]],R2,R1,wallM));
  }else{G.add(tri(E1,R1,[ (E1[0]+R1[0])/2*0+R1[0],H,R1[2]],wallM));G.add(tri(E2,R2,[R2[0],H,R2[2]],wallM))}
  if(!f.n)return;
  const v3=a=>new THREE.Vector3(...a);
  const u=v3(E2).sub(v3(E1)),uL=u.length();u.normalize();
  const v=v3(R1).sub(v3(E1)),vL=v.length();v.normalize();
  const n=new THREE.Vector3().crossVectors(v,u).normalize(); if(n.y<0)n.negate();

  const basis=new THREE.Matrix4().makeBasis(u,n,v);

   const r=rot*Math.PI/180;

   const p=o.clone().addScaledVector(u,cu).addScaledVector(v,cvv*vL/vLn).addScaledVector(n,lift);
   const m=basis.clone().multiply(new THREE.Matrix4().makeRotationZ(-r)).multiply(new THREE.Matrix4().makeScale(du,1,dv));
