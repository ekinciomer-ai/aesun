name: Müşteri Monitoring kimliği (ns1)
# SOLARMAN web hesabını ns1'e yazar: /opt/aesun/musteri.env (root, 600) → aesun-musteri yeniden başlar.
# Değerler yalnız aesun → Settings → Secrets'ta durur; loga basılmaz. Her müşteri hesabı bir çift:
#   SOLARMAN_KULLANICI / SOLARMAN_SIFRE (Çaylı Yem), SOLARMAN_KULLANICI_2 / SOLARMAN_SIFRE_2 (Tatmak GES), … _9'a kadar.
on: workflow_dispatch
concurrency: { group: sunucu-islem, cancel-in-progress: false }
jobs:
  yaz:
    runs-on: ubuntu-latest
    steps:
      - name: Yaz
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
          SIRLAR: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          ENV=$(printf '%s' "$SIRLAR" | python3 -c "import sys,json; s=json.load(sys.stdin); e=sorted({k[18:] for k in s if k.startswith('SOLARMAN_KULLANICI')}); print(''.join('SOLARMAN_KULLANICI%s=%s\nSOLARMAN_SIFRE%s=%s\n'%(x,s['SOLARMAN_KULLANICI'+x],x,s['SOLARMAN_SIFRE'+x]) for x in e if s.get('SOLARMAN_KULLANICI'+x) and s.get('SOLARMAN_SIFRE'+x)),end='')")
          [ -n "$ENV" ] || { echo "::error::SOLARMAN_KULLANICI / SOLARMAN_SIFRE sırları eksik"; exit 1; }
          echo "::notice::hesap sayısı: $(printf '%s' "$ENV" | grep -c '^SOLARMAN_KULLANICI')"
          mkdir -p ~/.ssh
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          printf '%s' "$ENV" | ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes root@"$ADRES" \
            'umask 077; cat > /opt/aesun/musteri.env.yeni && mv /opt/aesun/musteri.env.yeni /opt/aesun/musteri.env && cd /opt/aesun && docker compose up -d --force-recreate --no-deps musteri >/dev/null 2>&1 && echo "musteri yenilendi"'
          rm -f ~/.ssh/k
