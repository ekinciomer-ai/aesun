name: Nasıl Yapıldı – serbest lisanslı yemek fotoğrafları
# video/ny/gorsel/liste.json değişince Wikimedia Commons'tan (CC0/CC BY öncelikli) yemek fotoğrafları + lisans kaydı + aday şeritleri.
on:
  push:
    branches: [main]
    paths: ['video/ny/gorsel/liste.json', 'video/ny/arac/yemek_gorsel.py', '.github/workflows/ny_yemek_foto.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ny-yemek-foto, cancel-in-progress: false }
jobs:
  foto:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "video/ny"}
      - run: pip install -q pillow && python3 video/ny/arac/yemek_gorsel.py video/ny/gorsel/liste.json
      - run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A video/ny/motor/gorsel video/ny/gorsel
          git diff --cached --quiet && exit 0
          git commit -qm "Nasıl Yapıldı: yemek fotoğrafları (Commons, serbest lisans) $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
