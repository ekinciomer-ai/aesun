<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kumdan Elektriğe</title>
<style>
@font-face{font-family:Archivo;src:url(fonts/Archivo.ttf);font-stretch:62% 125%;font-weight:100 900}
@font-face{font-family:"Space Mono";src:url(fonts/SpaceMono-Regular.ttf)}
@font-face{font-family:"Space Mono";src:url(fonts/SpaceMono-Bold.ttf);font-weight:700}
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans.ttf);font-weight:400 700}
:root{--a:#6FE3FF;--g:#F2C46B;--ink:#F3F5FA}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:var(--ink);font-family:"Instrument Sans",sans-serif}
.vg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55));}
.br{position:absolute;width:5.5vmin;height:5.5vmin;border:.35vmin solid var(--a);opacity:.75}
.br.a{left:3vmin;top:3vmin;border-right:0;border-bottom:0}.br.b{right:3vmin;top:3vmin;border-left:0;border-bottom:0}
.br.c{left:3vmin;bottom:3vmin;border-right:0;border-top:0}.br.d{right:3vmin;bottom:3vmin;border-left:0;border-top:0}
#logo{position:absolute;left:6vmin;top:5.4vmin;font:700 2.1vmin "Space Mono";letter-spacing:.32em;color:var(--a)}
#logo b{color:var(--g)}
#sayac{position:absolute;right:6vmin;top:5.4vmin;font:700 2.1vmin "Space Mono";letter-spacing:.2em;color:var(--ink);opacity:.85}
#bas{position:absolute;left:6vmin;right:6vmin;top:10vmin}
#bas .n{font:700 2.2vmin "Space Mono";letter-spacing:.3em;color:var(--g)}
#bas .t{font:800 8.6vmin/0.92 Archivo;font-stretch:68%;letter-spacing:.01em;text-transform:uppercase;margin-top:1vmin;text-shadow:0 .4vmin 3vmin rgba(0,0,0,.6)}
#bas .s{font:400 2.3vmin "Space Mono";color:var(--a);margin-top:1.4vmin;letter-spacing:.06em}
#alt{position:absolute;left:7vmin;right:7vmin;bottom:15vmin;text-align:center;font:700 4.4vmin/1.22 "Instrument Sans";text-shadow:0 0 1.2vmin #000,0 .3vmin .8vmin #000}
#alt span{background:rgba(5,8,16,.55);padding:.3vmin 1.6vmin;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:.8vmin}
#alt em{font-style:normal;color:var(--g)}
#yol{position:absolute;left:6vmin;right:6vmin;bottom:7vmin;height:1vmin;display:flex;gap:.8vmin}
#yol i{flex:1;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
#yol i s{position:absolute;inset:0;background:var(--a);transform-origin:left;transform:scaleX(0)}
#yol i.done s{transform:none;background:var(--g)}
#oku{position:absolute;left:6vmin;bottom:9.4vmin;font:400 1.7vmin "Space Mono";color:rgba(243,245,250,.7);letter-spacing:.14em}
#veri{position:absolute;right:6vmin;top:28vmin;text-align:right;font:700 3.2vmin "Space Mono";color:var(--g);text-shadow:0 0 2vmin rgba(0,0,0,.8)}
#veri small{display:block;font:400 1.6vmin "Space Mono";color:var(--a);letter-spacing:.2em}
#flas{position:absolute;inset:0;background:#fff;opacity:0}
#kara{position:absolute;inset:0;background:#000;opacity:0}
body.yatay #bas .t{font-size:7.4vmin}body.yatay #alt{bottom:12vmin;font-size:3.6vmin;left:18vmin;right:18vmin}
body.yatay #veri{top:auto;bottom:22vmin}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div class="vg"></div><i class="br a"></i><i class="br b"></i><i class="br c"></i><i class="br d"></i>
<div id="logo">KOZMOS <b>LAB</b></div><div id="sayac"></div>
<div id="bas"><div class="n" id="bn"></div><div class="t" id="bt"></div><div class="s" id="bs"></div></div>
<div id="veri"></div>
<div id="alt"></div><div id="oku"></div><div id="yol"></div>
<div id="flas"></div><div id="kara"></div></div>
<script src="lib/three.min.js"></script>
<script src="lib/RoomEnvironment.js"></script>
<script src="lib/CopyShader.js"></script><script src="lib/LuminosityHighPassShader.js"></script>
<script src="lib/ACESFilmicToneMappingShader.js"></script><script src="lib/GammaCorrectionShader.js"></script>
<script src="lib/EffectComposer.js"></script><script src="lib/RenderPass.js"></script><script src="lib/ShaderPass.js"></script><script src="lib/MaskPass.js"></script><script src="lib/UnrealBloomPass.js"></script>
<script src="sahneler.js"></script>
</body></html>
