<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen drafting workspace — top bar, tool rail, canvas, layer/properties panel, command line */
:root {
  --ink: #15181c;      /* workspace frame */
  --panel: #1d2126;    /* panels */
  --raise: #262b31;    /* controls */
  --line: #333a42;     /* hairlines */
  --fg: #e7e9eb;
  --muted: #8d969f;
  --red: #e2342b;      /* Aksaray Enerji red */
  --red-soft: rgba(226, 52, 43, 0.16);
  --ok: #5fd38a;
  --warn: #ffd23f;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--fg); font-family: var(--ui); font-size: 13px; overflow: hidden; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 8px; gap: 8px; box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }

header { display: flex; align-items: center; gap: 12px; padding-block: 8px 0; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
.brand b { color: var(--red); font-weight: 600; }
.brand svg { width: 22px; height: 22px; flex: none; }
#fname { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
.hbtns { display: flex; gap: 4px; flex: none; }
.hb { display: inline-flex; align-items: center; gap: 6px; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; }
.hb:hover { border-color: #4a525b; }
.hb.primary { background: var(--red); border-color: var(--red); color: #fff; }
.hb.primary:hover { background: #c92a22; }
.hb svg { width: 15px; height: 15px; }
.hb .k { display: inline; }

.main { display: grid; grid-template-columns: 64px minmax(0, 1fr) 312px; gap: 8px; min-height: 0; }
nav.tools { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow-y: auto; padding: 6px 4px; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; }
.tg { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 8px 0 3px; }
.tg:first-child { padding-top: 2px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 5px 2px 4px; color: var(--fg); }
.tool svg { width: 20px; height: 20px; }
.tool span { font-size: 9.5px; color: var(--muted); line-height: 1; }
.tool:hover { background: var(--raise); }
.tool.on { background: var(--red-soft); border-color: var(--red); }
.tool.on span { color: var(--fg); }

#stage { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; min-height: 0; background: #1d2126; }
#stage canvas { position: absolute; inset: 0; display: block; }
#overlay { cursor: none; touch-action: none; }
#stage.drop::after { content: "Dosyayı bırakın — DWG veya DXF"; position: absolute; inset: 12px; border: 2px dashed var(--red); border-radius: 8px; display: grid; place-items: center; font-size: 15px; background: rgba(21, 24, 28, 0.7); pointer-events: none; }
#busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(21, 24, 28, 0.62); z-index: 5; }
#busy div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; display: flex; gap: 12px; align-items: center; }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--raise); border: 1px solid var(--line); padding: 6px 12px; border-radius: 5px; z-index: 6; }

aside#side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 6px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ph em { font-style: normal; font-family: var(--mono); letter-spacing: 0; }
.lbar { display: flex; gap: 4px; padding: 0 8px 6px; }
.lbar input { flex: 1; min-width: 0; background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; }
.lbar button { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
#layers { list-style: none; margin: 0; padding: 0 4px 6px; overflow-y: auto; flex: 1 1 55%; min-height: 80px; scrollbar-width: thin; }
.lrow { display: grid; grid-template-columns: 22px 16px minmax(0, 1fr) auto 22px; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
.lrow:hover { background: var(--raise); }
.lrow.cur { background: var(--red-soft); }
.lrow.cur .lname { font-weight: 600; }
.lrow.off .lname { color: var(--muted); }
.lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lct { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.eye, .lk { background: none; border: 0; padding: 2px; color: var(--fg); display: grid; place-items: center; }
.eye svg, .lk svg { width: 15px; height: 15px; }
.lk { color: var(--muted); } .lk.on { color: var(--warn); }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.25); padding: 0; }
.sep { border-top: 1px solid var(--line); }
#props { padding: 4px 10px 10px; overflow-y: auto; flex: 0 1 auto; max-height: 45%; display: flex; flex-direction: column; gap: 8px; }
#props .muted { color: var(--muted); margin: 0; line-height: 1.45; }
.psum b { font-family: var(--mono); color: var(--fg); }
.prow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; align-items: center; color: var(--muted); }
.prow select, .prow input, .prow textarea { background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-width: 0; width: 100%; box-sizing: border-box; }
.pcw { display: flex; gap: 4px; min-width: 0; }
.pcolor { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; text-align: left; min-width: 0; }
.pcolor i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.3); flex: none; }
.mini { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font-size: 11px; }
.pinfo { display: grid; gap: 3px; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.pinfo div { display: flex; justify-content: space-between; gap: 8px; } .pinfo span { color: var(--muted); }
#palette { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: grid; grid-template-columns: repeat(10, 18px); gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
.pc { width: 18px; height: 18px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.18); padding: 0; }

footer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; min-width: 0; }
.cmdbox { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 12px; min-width: 0; display: flex; flex-direction: column; }
#hist { height: 66px; overflow-y: auto; padding: 5px 10px 2px; color: #b8bfc6; scrollbar-width: thin; }
#hist div { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
#hist .err { color: #ff8a80; } #hist .res { color: var(--ok); } #hist .note { color: var(--warn); } #hist .help { color: #9ec5ff; }
.cline { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 4px 10px; }
#prompt { color: var(--red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; font-weight: 500; }
#cmd { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); padding: 3px 0; }
.status { display: flex; flex-direction: column; gap: 4px; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: var(--mono); font-size: 11.5px; min-width: 250px; }
#coords { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tog { display: flex; gap: 4px; flex-wrap: wrap; }
.tog button { background: var(--raise); border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 1px 6px; font-size: 10.5px; letter-spacing: 0.06em; }
.tog button.on { color: var(--fg); border-color: var(--red); background: var(--red-soft); }
.srow { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
#curlayer { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
#bside { display: none; }
.pbadge { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pbadge span { color: var(--fg); }
.pbadge a { color: var(--red); text-decoration: none; }
.pbadge a:hover { text-decoration: underline; }
@media (max-width: 860px) { .pbadge span { display: none; } }
.stabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
.stab { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 4px 7px; color: var(--muted); font-weight: 500; }
.stab.on { color: var(--fg); border-bottom-color: var(--red); }
.tabpane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.ges { overflow-y: auto; padding: 4px 10px 12px; gap: 4px; scrollbar-width: thin; }
.ges section { display: flex; flex-direction: column; gap: 7px; padding: 8px 0 12px; border-bottom: 1px solid var(--line); }
.ges section:last-child { border-bottom: 0; }
.ges h3 { margin: 0; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 7px; letter-spacing: 0.02em; }
.ges h3 span { width: 18px; height: 18px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 6px; }
.gf { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 11px; min-width: 0; }
.gf input, .gf select { background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; color: var(--fg); font-family: var(--mono); font-size: 12px; min-width: 0; width: 100%; box-sizing: border-box; }
.gf input:disabled { color: var(--muted); }
.gf.wide input { font-family: var(--ui); }
.brow { display: flex; gap: 6px; flex-wrap: wrap; }
.brow .gb { flex: 1; }
.gb { background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; text-align: center; }
.gb:hover { border-color: #4a525b; }
.gb.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
.gb.ghost { background: transparent; }
.gi { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
.gres { margin: 0; color: var(--ok); font-size: 12px; line-height: 1.5; font-family: var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.chip.on { border-color: var(--red); color: var(--fg); }
.ph.sub { padding: 4px 0 0; }
.ph.sub em { font-size: 10px; text-transform: none; letter-spacing: 0; }
.tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.trow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 4px 6px; background: var(--ink); border-radius: 4px; }
.trow label { display: flex; flex-direction: column; min-width: 0; cursor: pointer; }
.trow b { font-family: var(--mono); font-weight: 500; font-size: 12px; }
.trow small { color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow input { accent-color: var(--red); }


@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  nav.tools { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 4px; }
  .tg { writing-mode: vertical-rl; transform: rotate(180deg); padding: 0 2px; }
  .tool { min-width: 50px; }
  aside#side { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: 52px; bottom: 140px; width: min(300px, calc(100vw - 32px)); z-index: 10; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  aside#side.open { display: flex; }
  #bside { display: inline-flex; }
  .hb .k { display: none; }
  footer { grid-template-columns: minmax(0, 1fr); }
  .status { min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; }
  #hist { height: 46px; }
}
@media (max-width: 560px) {
  .brand .bt, #fname { display: none; }
  header { justify-content: space-between; }
  .hb { padding: 5px 7px; }
}
</style>

  <header>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0 0 20z" fill="#e2342b"/><path d="M12 2a10 10 0 0 1 0 20z" fill="#3b4148"/><path d="M13.6 4.5 8.4 13h3.4l-1.4 6.5 5.2-8.6h-3.4z" fill="#fff"/></svg><span class="bt">AKSARAY</span> <b>CAD</b></div>
    <span id="fname">Örnek çizim</span>

      <button class="hb" id="bnew" title="Yeni boş çizim"><svg viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3" fill="none" stroke="currentColor"/></svg><span class="k">Yeni</span></button>

      <button class="hb" id="bredo" title="İleri al (Ctrl+Y)" aria-label="İleri al"><svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3m2.5-3H6a3.5 3.5 0 0 0 0 7h4" fill="none" stroke="currentColor"/></svg></button>

function offsetItem(it, d, side) {

  if (it.t === 'circle' || it.t === 'arc') { const inside = Math.hypot(side[0] - it.cx, side[1] - it.cy) < it.r; const r = it.r + (inside ? -d : d); if (r <= 0) return null; return { ...it, id: newId(), r }; }

let _lib = null;
async function libre() {
  if (_lib) return _lib;
  const base = new URL('./', document.baseURI).href;
  let mod;
  try { mod = await import(base + 'dist/libredwg-web.js'); }
  catch (e) { mod = await import('https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.7.14/dist/libredwg-web.js'); }
  _lib = { mod, inst: await mod.LibreDwg.create(base + 'wasm') };
  return _lib;
}
function busy(t) { const b = $('#busy'); if (t) { b.hidden = false; $('#busyt').textContent = t; } else b.hidden = true; }
const tick = () => new Promise((r) => setTimeout(r, 16));

function setDoc(doc, name) {
  S.doc = doc; V().doc = doc; doc.name = name; V().sel = new Set(); S.curLayer = doc.layers.has('0') ? '0' : [...doc.layers.keys()][0];
  $('#fname').textContent = name; document.title = name + ' · Aksaray CAD';
  renderLayers(); updateProps(); zoomExtents(false); S.fitPending = true; redraw();

async function openFile(file) {
  if (S.cmd) cancelCmd();
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  try {
    busy('Dosya okunuyor…'); await tick();
    const buf = new Uint8Array(await file.arrayBuffer());
    let norm; const t0 = performance.now();
    if (ext === 'dxf') { busy('DXF çözümleniyor…'); await tick(); norm = parseDxf(decodeDxfBytes(buf)); }
    else if (ext === 'dwg') {
      const sig = String.fromCharCode(...buf.subarray(0, 6));
      if (!/^AC10(1[2-9]|2\d|3\d)/.test(sig)) throw new Error('Bu DWG sürümü (' + sig + ') desteklenmiyor. AutoCAD R14 (1997) ve sonrası açılabilir.');
      busy('DWG okuyucu yükleniyor…'); await tick();
      const L = await libre();
      busy('DWG çözümleniyor…'); await tick();
      const dwg = L.inst.dwg_read_data(buf.slice(0).buffer, L.mod.Dwg_File_Type.DWG);
      if (!dwg) throw new Error('DWG dosyası okunamadı.');
      busy('Nesneler dönüştürülüyor…'); await tick();
      const db = L.inst.convert(dwg); try { L.inst.dwg_free(dwg); } catch (e) { /* ignore */ }
      let solids = new Map();
      if (sig >= 'AC1018') {
        busy('3B katılar (paneller, kazıklar) çözülüyor…'); await tick();
        try {
          const r = readSections(buf); const ds = r.getSection('AcDb:AcDsPrototype_1b');
          if (ds && ds.length) { const raw = extractSolids(ds); for (const [h, u] of raw) { try { solids.set(h, sabEdges(u)); } catch (e) { /* skip */ } } }
        } catch (e) { console.warn('AcDs', e); }
      }
      norm = normalizeDwg(db, solids);
    } else throw new Error('Yalnızca .dwg ve .dxf dosyaları açılabilir.');
    busy('Bloklar derleniyor…'); await tick();
    const doc = importNormalized(norm);
    setDoc(doc, file.name.replace(/\.(dwg|dxf)$/i, ''));
    const ns = norm.solids ? norm.solids.size : 0;
    msg(file.name + ' açıldı: ' + doc.items.size.toLocaleString('tr') + ' nesne, ' + doc.blocks.size + ' blok, ' + doc.layers.size + ' katman' + (ns ? ', ' + ns.toLocaleString('tr') + ' 3B katı' : '') + ' · ' + ((performance.now() - t0) / 1000).toFixed(1) + ' sn', 'res');
  } catch (e) { console.error(e); msg('Açılamadı: ' + (e.message || e), 'err'); toast('Dosya açılamadı'); }
  finally { busy(null); }
}
async function saveDxf() {
  if (!S.doc) return;
  busy('DXF hazırlanıyor…'); await tick();
  try {
    const txt = writeDxf(S.doc); const data = new TextEncoder().encode(txt);
    const name = (S.doc.name || 'cizim').replace(/[\\/:*?"<>|]/g, '_');
    let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      const zip = zipStore(name + '.dxf', data);
      busy(null);
      try { await dl.save({ filename: name + '.zip', data: zip }); msg(name + '.zip kaydedildi (içinde ' + name + '.dxf).', 'res'); S.doc.dirty = false; }
      catch (e) { if (e && e.code === 'declined') msg('Kaydetme iptal edildi.'); else msg('Kaydedilemedi: ' + (e && (e.message || e.code) || e), 'err'); }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/dxf' })); a.download = name + '.dxf'; document.body.appendChild(a); a.click(); a.remove();

  // block: table 2x13 modules (2.384 x 1.303), portrait
  const ents = []; const mw = 1.134, mh = 2.384, gap = 0.02;
  for (let r = 0; r < 2; r++) for (let c = 0; c < 13; c++) { const x = c * (mw + gap), y = r * (mh + gap); ents.push({ type: 'LWPOLYLINE', layer: '0', colorIndex: 256, flag: 1, vertices: [{ x, y }, { x: x + mw, y }, { x: x + mw, y: y + mh }, { x, y: y + mh }] }); }
  const W = 13 * (mw + gap) - gap, H = 2 * (mh + gap) - gap;
  ents.push({ type: 'LINE', layer: '0', colorIndex: 8, startPoint: { x: 0, y: H / 2 }, endPoint: { x: W, y: H / 2 } });
  doc.blocks.set('MASA_2x13', { name: 'MASA_2x13', base: [0, 0, 0], ents });
  const items = [];
  const add = (o) => { const it = { id: newId(), lt: '', c: 256, ...o }; items.push(it); };
  const ox = 0, oy = 0, pitch = 9.5;
  for (let row = 0; row < 6; row++) for (let col = 0; col < 3; col++) add({ t: 'insert', layer: 'ORNEK-PANEL', block: 'MASA_2x13', M: mT(ox + col * (W + 4), oy + row * pitch), ap: [] });
  const fx0 = -6, fy0 = -8, fx1 = 3 * (W + 4) + 2, fy1 = 6 * pitch + 3;
  add({ t: 'pline', layer: 'ORNEK-CIT', cl: true, pts: [[fx0, fy0, 0], [fx1, fy0, 0], [fx1, fy1, 0], [fx0, fy1, 0]] });
  add({ t: 'pline', layer: 'ORNEK-YOL', cl: false, pts: [[fx0 + 2, fy0 + 2.5, 0], [fx1 - 2, fy0 + 2.5, 0]] });
  add({ t: 'pline', layer: 'ORNEK-YOL', cl: false, pts: [[fx0 + 2, fy0 + 6.5, 0], [fx1 - 14, fy0 + 6.5, 0], [fx1 - 10, fy0 + 2.5, 0.0]] });
  add({ t: 'pline', layer: 'ORNEK-TRAFO', cl: true, pts: [[fx1 - 9, fy0 + 3.5, 0], [fx1 - 3, fy0 + 3.5, 0], [fx1 - 3, fy0 + 6.5, 0], [fx1 - 9, fy0 + 6.5, 0]] });
  add({ t: 'text', layer: 'ORNEK-TRAFO', x: fx1 - 6, y: fy0 + 5, h: 0.8, rot: 0, s: 'TRAFO', ha: 1, va: 2 });
  add({ t: 'circle', layer: 'ORNEK-TRAFO', cx: fx1 - 12, cy: fy0 + 5, r: 0.9 });
  add({ t: 'text', layer: 'ORNEK-YAZI', x: fx0, y: fy1 + 3, h: 2, rot: 0, s: 'ÖRNEK ÇİZİM · GES Blok A (18 masa · 468 modül)', ha: 0, va: 0 });
  add({ t: 'text', layer: 'ORNEK-YAZI', x: fx0, y: fy1 + 1, h: 0.9, rot: 0, s: 'Kendi DWG/DXF dosyanızı açmak için üstteki “Aç” düğmesini kullanın veya dosyayı buraya sürükleyin.', ha: 0, va: 0 });
  add({ t: 'dim', layer: 'ORNEK-OLCU', x1: fx0, y1: fy0, x2: fx1, y2: fy0, lx: 0, ly: fy0 - 4, ang: 0, h: 1.2 });
  add({ t: 'dim', layer: 'ORNEK-OLCU', x1: fx1, y1: fy0, x2: fx1, y2: fy1, lx: fx1 + 4, ly: 0, ang: Math.PI / 2, h: 1.2 });
  add({ t: 'dim', layer: 'ORNEK-OLCU', x1: 0, y1: pitch, x2: 0, y2: 2 * pitch, lx: -3, ly: 0, ang: Math.PI / 2, h: 0.8 });
  for (const it of items) doc.items.set(it.id, it);
  return doc;
}

function init() {
  const view = new View($('#scene'), $('#overlay')); S.view = view; view.gridOn = false;
  buildPalette();
  gesInit();
  if (window.AE_PORTAL) { const P = window.AE_PORTAL; const box = document.createElement('div'); box.className = 'pbadge';
    const nm = document.createElement('span'); nm.textContent = P.ad || P.kul || ''; const a = document.createElement('a'); a.href = '../portal/'; a.textContent = 'Portal';
    const c = document.createElement('a'); c.href = '#'; c.textContent = 'Çıkış'; c.onclick = (e) => { e.preventDefault(); try { localStorage.removeItem('ae_portal'); } catch (x) { /* ignore */ } location.replace('../portal/'); };
    box.append(nm, a, c); document.querySelector('header').insertBefore(box, document.querySelector('.hbtns')); }
  const resize = () => { view.resize(); if (S.fitPending) zoomExtents(false); redraw(); };
  new ResizeObserver(resize).observe($('#stage')); resize();
  setDoc(sampleDoc(), 'Örnek çizim'); S.textH = 1;
  msg('Aksaray CAD hazır. Komut yazın (ör. L, PL, C, M) veya soldaki araçları kullanın. Kısayollar için ? yazın.', 'note');
  setPrompt('Komut:');
  setTimeout(() => { libre().then(() => { S.libOk = true; }).catch((e) => { console.error(e); msg('DWG okuyucu yüklenemedi (' + (e.message || e) + '). DXF dosyaları yine açılabilir.', 'err'); }); }, 1200);

  const st = $('#stage'), ov = $('#overlay');
  const pos = (e) => { const r = ov.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); S.fitPending = false; const [X, Y] = pos(e); const [wx, wy] = view.s2w(X, Y);
    const f = Math.exp(-Math.max(-60, Math.min(60, e.deltaY)) * (e.ctrlKey ? 0.01 : 0.0035) * (e.deltaMode === 1 ? 16 : 1));
    view.s *= f; view.cx = wx - (X - view.W / 2) / view.s; view.cy = wy + (Y - view.H / 2) / view.s;
    view.fast = view.lastMs > 45; redraw(); clearTimeout(init._wt); init._wt = setTimeout(() => { view.fast = false; redraw(); }, 180);
  }, { passive: false });
  let touches = new Map();
  ov.addEventListener('pointerdown', (e) => {
    ov.setPointerCapture(e.pointerId); S.fitPending = false; const [X, Y] = pos(e); S.mouse = [X, Y]; S.inside = true;
    if (e.pointerType === 'touch') { touches.set(e.pointerId, [X, Y]); if (touches.size === 2) { S.dragging = { kind: 'pinch' }; return; } }
    if (e.button === 1 || (e.button === 0 && e.shiftKey && e.altKey) || (e.button === 0 && S.space)) { S.dragging = { kind: 'pan', X, Y, cx: view.cx, cy: view.cy }; e.preventDefault(); return; }
    if (e.button === 2) return;
    if (e.button !== 0) return;
    if (S.pending && S.pending.kind === 'point') { S.dragging = { kind: 'click', X, Y }; return; }
    S.dragging = { kind: 'maybe', x0: X, y0: Y, x1: X, y1: Y, shift: e.shiftKey, touch: e.pointerType === 'touch', cx: view.cx, cy: view.cy };
  });
  ov.addEventListener('pointermove', (e) => {
    const [X, Y] = pos(e); S.mouse = [X, Y]; S.inside = true;
    const d = S.dragging;
    if (d && d.kind === 'pinch') {
      const prev = touches.get(e.pointerId); if (!prev) return; const pts = [...touches.values()]; const before = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
      touches.set(e.pointerId, [X, Y]); const p2 = [...touches.values()]; const after = Math.hypot(p2[0][0] - p2[1][0], p2[0][1] - p2[1][1]);
      const mx = (p2[0][0] + p2[1][0]) / 2, my = (p2[0][1] + p2[1][1]) / 2; const [wx, wy] = view.s2w(mx, my);
      if (before > 0) view.s *= after / before; view.cx = wx - (mx - view.W / 2) / view.s; view.cy = wy + (my - view.H / 2) / view.s;
      const dx = X - prev[0], dy = Y - prev[1]; view.cx -= dx / 2 / view.s; view.cy += dy / 2 / view.s; view.fast = true; redraw(); return;
    }
    if (d && d.kind === 'pan') { view.cx = d.cx - (X - d.X) / view.s; view.cy = d.cy + (Y - d.Y) / view.s; view.fast = view.lastMs > 40; redraw(); return; }
    if (d && d.kind === 'maybe' && d.touch && Math.hypot(X - d.x0, Y - d.y0) > 6 && !S.pending) { S.dragging = { kind: 'pan', X: d.x0, Y: d.y0, cx: d.cx, cy: d.cy }; return; }
    if (d && d.kind === 'maybe' && Math.hypot(X - d.x0, Y - d.y0) > 5) { d.kind = 'win'; }
    if (d && d.kind === 'win') { d.x1 = X; d.y1 = Y; }
    S.mw = S.pending && S.pending.kind === 'point' ? cursorWorld() : view.s2w(X, Y);
    if (!S.pending && !d) { clearTimeout(init._ht); init._ht = setTimeout(() => { const it = pickItem(S.mouse[0], S.mouse[1]); const h = it ? it.id : null; if (h !== S.hover) { S.hover = h; redrawOverlay(); } }, 40); }
    redrawOverlay(); updateStatus();
  });
  const up = (e) => {
    const [X, Y] = pos(e); const d = S.dragging; S.dragging = null; touches.delete(e.pointerId);
    if (!d) return;
    if (d.kind === 'pan' || d.kind === 'pinch') { view.fast = false; redraw(); if (touches.size) S.dragging = null; return; }
    if (d.kind === 'click') { if (S.pending && S.pending.kind === 'point') { const p = cursorWorld(); resolvePending(p); } return; }
    if (d.kind === 'maybe') {
      const it = pickItem(X, Y);
      if (S.pending && S.pending.kind === 'select') { if (it) setSel([it.id], d.shift ? 'toggle' : true); return; }
      if (it) setSel([it.id], d.shift ? 'toggle' : (e.ctrlKey || e.metaKey) ? true : false); else if (!d.shift) setSel([]);
      return;
    }
    if (d.kind === 'win') {
      const ids = windowSelect(d.x0, d.y0, X, Y, X < d.x0);
      setSel(ids, d.shift ? 'toggle' : (S.pending && S.pending.kind === 'select') ? true : (e.ctrlKey || e.metaKey) ? true : false);
      redrawOverlay(); return;
    }
  };
  ov.addEventListener('pointerup', up); ov.addEventListener('pointercancel', (e) => { touches.delete(e.pointerId); S.dragging = null; redrawOverlay(); });
  ov.addEventListener('pointerleave', () => { S.inside = false; redrawOverlay(); });
  ov.addEventListener('contextmenu', (e) => { e.preventDefault(); enterKey(); });
  ov.addEventListener('dblclick', (e) => { if (!S.pending) { const [X, Y] = pos(e); if (!pickItem(X, Y)) zoomExtents(false); } });

  // command line
  const inp = $('#cmd');
  function enterKey() {
    const v = inp.value; inp.value = '';
    if (S.pending) { if (S.pending.kind === 'select') { if (!v.trim()) resolvePending(null); else if (/^(t|all|tümü|tumu)$/i.test(v.trim())) { setSel([...S.doc.items.keys()].filter((id) => layerVisible(S.doc.items.get(id))), true); } return; } parseInput(v); return; }
    const t = v.trim();
    if (!t) { if (S.lastCmd) runCommand(S.lastCmd); return; }
    if (t === '?') { showHelp(); return; }
    runCommand(t);
  }
  window.enterKey = enterKey;
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || (e.key === ' ' && !(S.pending && S.pending.kind === 'text'))) { e.preventDefault(); enterKey(); }
    else if (e.key === 'Escape') { e.preventDefault(); inp.value = ''; if (S.cmd) cancelCmd(); else setSel([]); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, select') && e.target !== inp) return;
    if (e.key === 'F3') { e.preventDefault(); S.osnap = !S.osnap; msg('Nesne yakalama ' + (S.osnap ? 'açık' : 'kapalı')); updateStatus(); return; }
    if (e.key === 'F8') { e.preventDefault(); S.ortho = !S.ortho; msg('Orto ' + (S.ortho ? 'açık' : 'kapalı')); updateStatus(); return; }
    if (e.key === 'F7') { e.preventDefault(); view.gridOn = !view.gridOn; redraw(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); if (!S.cmd) runCommand(e.shiftKey ? 'REDO' : 'U'); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); if (!S.cmd) runCommand('REDO'); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveDxf(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); $('#file').click(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) { e.preventDefault(); setSel([...S.doc.items.keys()].filter((id) => layerVisible(S.doc.items.get(id)))); return; }
    if (e.target === inp) return;
    if (e.key === 'Escape') { if (S.cmd) cancelCmd(); else setSel([]); return; }
    if (e.key === 'Delete' && !S.cmd && V().sel.size) { runCommand('ERASE'); return; }
    if (e.key === 'Enter') { e.preventDefault(); enterKey(); return; }
    if (e.key === ' ' && !e.repeat) { if (S.pending && S.pending.kind !== 'text') { e.preventDefault(); enterKey(); } else if (!S.cmd) { e.preventDefault(); S.space = true; } return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { inp.focus(); }
  });
  document.addEventListener('keyup', (e) => { if (e.key === ' ') S.space = false; });

  // buttons
  document.querySelectorAll('.tool').forEach((b) => b.addEventListener('click', () => { runCommand(b.dataset.cmd); inp.focus({ preventScroll: true }); }));
  $('#bopen').onclick = () => $('#file').click();
  $('#file').onchange = (e) => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; };
  $('#bnew').onclick = () => { const d = new Doc(); d.ctx = { blocks: d.blocks, solids: d.solids }; setDoc(d, 'Yeni çizim'); S.textH = 2.5; V().cx = 50; V().cy = 30; V().s = Math.min(V().W, V().H) / 120; redraw(); msg('Yeni çizim. Birim: metre önerilir.'); };
  $('#bsave').onclick = saveDxf;
  $('#bundo').onclick = () => !S.cmd && runCommand('U');
  $('#bredo').onclick = () => !S.cmd && runCommand('REDO');
  $('#bext').onclick = () => zoomExtents(false);
  $('#bsnap').onclick = () => { S.osnap = !S.osnap; updateStatus(); };
  $('#bortho').onclick = () => { S.ortho = !S.ortho; updateStatus(); };
  $('#bgrid').onclick = () => { view.gridOn = !view.gridOn; redraw(); };
  $('#bside').onclick = () => $('#side').classList.toggle('open');
  $('#layerq').oninput = (e) => { S.layerFilter = e.target.value; renderLayers(); };
  $('#lall').onclick = () => { for (const L of S.doc.layers.values()) { L.on = true; L.fz = false; } renderLayers(); redraw(); };
  $('#lnew').onclick = async () => {
    const nm = $('#layerq').value.trim(); if (!nm) { msg('Yeni katman adı için arama kutusuna adı yazıp + düğmesine basın.'); $('#layerq').focus(); return; }
    if (S.doc.layers.has(nm)) { S.curLayer = nm; } else { S.doc.addLayer(nm, 7); S.curLayer = nm; msg('Katman oluşturuldu: ' + nm); }
    $('#layerq').value = ''; S.layerFilter = ''; renderLayers(); updateStatus();
  };
  // drag & drop
  ['dragenter', 'dragover'].forEach((t) => st.addEventListener(t, (e) => { e.preventDefault(); st.classList.add('drop'); }));
  ['dragleave', 'drop'].forEach((t) => st.addEventListener(t, (e) => { e.preventDefault(); st.classList.remove('drop'); }));
  st.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) openFile(f); });
  window.addEventListener('beforeunload', (e) => { if (S.doc && S.doc.dirty && S.doc.undo.length) { e.preventDefault(); e.returnValue = ''; } });
}
function showHelp() {
  const lines = [
    'ÇİZİM  L çizgi · PL polyline · REC dikdörtgen · C daire · A yay (3 nokta) · T yazı · DLI doğrusal ölçü · DAL hizalı ölçü · PO nokta',
    'DÜZENLE  M taşı · CO kopyala · RO döndür · SC ölçekle · MI aynala · O ofset · TR buda · F köşe · E sil · X patlat',
    'ÖLÇ  DI mesafe · AA alan · ID koordinat · LI liste    GÖRÜNÜM  Z zoom (K/T/P) · çift tık boş alana = kapsam',
    'KOORDİNAT  100,200 mutlak · @50,0 göreli · @25<45 kutupsal · sadece sayı = imleç yönünde mesafe',
    'TUŞLAR  Enter/Boşluk/sağ tık = onay veya son komutu tekrar · Esc iptal · F3 yakalama · F8 orto · F7 ızgara · Del sil · Ctrl+Z/Y',
    'GEZİNME  tekerlek zoom · orta tuş veya Boşluk+sürükle kaydır · sol→sağ pencere: içindekiler · sağ→sol: değenler · Shift+tık seçimden çıkar',
  ];
  for (const l of lines) msg(l, 'help');
}

window.addEventListener("DOMContentLoaded", init);
</script>
