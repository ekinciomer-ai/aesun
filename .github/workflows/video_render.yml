name: Video kaydı (paralel, ücretsiz)
# video/<proje>/ altındaki 3D sahne sayfasını kare kare kaydeder; işi parçalara bölüp paralel makinelerde çalıştırır,
# sonra birleştirip anlatım + müzikle karıştırır. Sonuç: "video-<ad>" adlı artifact (7 gün).
on:
  workflow_dispatch:
    inputs:
      dizin: {description: "proje klasörü (ör. video/kumdan)", required: true}
      kurgu: {description: "kurgu json (klasöre göre)", required: true}
      ar: {description: "916 dikey / 169 yatay", required: true, default: "916"}
      anlatim: {description: "anlatım ses dosyası (klasöre göre)", required: true}
      muzik: {description: "müzik dosyası (klasöre göre)", required: true}
      ad: {description: "çıktı adı", required: true}
      parca: {description: "paralel parça sayısı", required: false, default: "8"}
permissions:
  contents: write
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      m: ${{ steps.p.outputs.m }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "${{ inputs.dizin }}"}
      - id: p
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json,math,os
          K=json.load(open(os.path.join("${{ inputs.dizin }}","${{ inputs.kurgu }}")));N=math.ceil(K["toplam"]*30);P=int("${{ inputs.parca }}")
          s=math.ceil(N/P);print("m="+json.dumps([{"i":i,"a":i*s,"b":min(N,(i+1)*s)} for i in range(P) if i*s<N]))
          PY
  kayit:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: true
      matrix:
        p: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "${{ inputs.dizin }}\nvideo/arac"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Kurulum
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-noto-color-emoji >/dev/null
          cd video/arac && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - name: Kaydet
        run: |
          cd video/arac && node kayit.js "../../${{ inputs.dizin }}/sahne.html" ${{ inputs.ar }} "../../${{ inputs.dizin }}/${{ inputs.kurgu }}" /tmp/parca_${{ matrix.p.i }}.mp4 30 ${{ matrix.p.a }} ${{ matrix.p.b }}
      - uses: actions/upload-artifact@v4
        with: {name: "parca-${{ matrix.p.i }}", path: "/tmp/parca_${{ matrix.p.i }}.mp4", retention-days: 1}
  birlestir:
    needs: kayit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "${{ inputs.dizin }}\nvideo/arac"}
      - uses: actions/download-artifact@v4
        with: {pattern: "parca-*", path: /tmp/p, merge-multiple: true}
      - name: Birleştir ve karıştır
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          cd /tmp/p && ls parca_*.mp4 | sort -t_ -k2 -n | sed "s/^/file '/;s/$/'/" > l.txt && ffmpeg -v error -f concat -safe 0 -i l.txt -c copy /tmp/sessiz.mp4
          D="$GITHUB_WORKSPACE/${{ inputs.dizin }}"; T=$(python3 -c "import json;print(json.load(open('$D/${{ inputs.kurgu }}'))['toplam'])")
          bash $GITHUB_WORKSPACE/video/arac/karistir.sh /tmp/sessiz.mp4 "$D/${{ inputs.anlatim }}" "$D/${{ inputs.muzik }}" $T /tmp/${{ inputs.ad }}.mp4
          ls -la /tmp/${{ inputs.ad }}.mp4
      - uses: actions/upload-artifact@v4
        with: {name: "video-${{ inputs.ad }}", path: "/tmp/${{ inputs.ad }}.mp4", retention-days: 7}
  aktar:
    needs: birlestir
    uses: ./.github/workflows/video_aktar.yml
    with: {run_id: "${{ github.run_id }}", ad: "${{ inputs.ad }}"}
    secrets: inherit
