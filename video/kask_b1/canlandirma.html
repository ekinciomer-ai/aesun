<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>Kask içi canlandırma</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Kask içinden bakış canlandırması. ?sahne=kanca (su küresi büyür) | gece (karanlıkta halat, su yüzü kaplamış)
// Kayıt arayüzü: window.HAZIR, window.kare(t)
const P=new URLSearchParams(location.search), SAHNE=P.get('sahne')||'kanca', IMG=P.get('img')||'';
const c=document.getElementById('c'), x=c.getContext('2d'), W=1080, H=1920;
const bg=new Image(); let bgHazir=false;
const yap=document.createElement('canvas'); yap.width=W; yap.height=H; const yx=yap.getContext('2d');
function sahteDunya(){ // görsel yoksa: koyu uzay + Dünya kenarı
  yx.fillStyle='#02040a';yx.fillRect(0,0,W,H);
  const g=yx.createRadialGradient(W*.5,H*1.55,H*.55,W*.5,H*1.55,H*1.02);
  g.addColorStop(0,'#1b4f8f');g.addColorStop(.86,'#3d7cc4');g.addColorStop(.95,'#9fd2ff');g.addColorStop(1,'rgba(120,180,255,0)');
  yx.fillStyle=g;yx.beginPath();yx.arc(W*.5,H*1.55,H*1.02,0,7);yx.fill();
}
function hazirla(){
  if(bgHazir){const s=Math.max(W/bg.width,H/bg.height)*1.18;yx.drawImage(bg,(W-bg.width*s)/2,(H-bg.height*s)/2,bg.width*s,bg.height*s);}
  else sahteDunya();
  window.HAZIR=true;
}
if(IMG){bg.onload=()=>{bgHazir=true;hazirla()};bg.onerror=hazirla;bg.src=IMG}else hazirla();

function kolay(a){return a<0?0:a>1?1:a*a*(3-2*a)}
function arkaPlan(t,koyu,bulan){
  x.save();
  if(bulan>0)x.filter=`blur(${bulan}px)`;
  const dx=-t*10, dy=Math.sin(t*.7)*6;
  x.drawImage(yap,dx-20,dy-20,W+40,H+40);
  x.restore();
  if(koyu>0){x.fillStyle=`rgba(0,0,6,${koyu})`;x.fillRect(0,0,W,H)}
}
function damla(cx,cy,r,t,koyu){
  if(r<2)return;
  // kırılma: arkadaki görüntüyü ters ve büyütülmüş olarak damla içine çiz
  x.save();x.beginPath();
  const dal=1+0.05*Math.sin(t*3.1+cx*.01), dal2=1+0.05*Math.cos(t*2.7+cy*.01);
  x.ellipse(cx,cy,r*dal,r*dal2,0,0,7);x.clip();
  x.translate(cx,cy);x.scale(-1.5,-1.5);x.translate(-cx,-cy);
  x.filter='blur(1.5px)';x.drawImage(c,0,0);x.filter='none';
  x.restore();
  x.save();x.beginPath();x.ellipse(cx,cy,r*dal,r*dal2,0,0,7);
  const g=x.createRadialGradient(cx-r*.25,cy-r*.3,r*.1,cx,cy,r);
  g.addColorStop(0,'rgba(200,230,255,0.10)');g.addColorStop(.75,'rgba(120,170,220,0.12)');g.addColorStop(1,`rgba(10,25,45,${0.55+koyu*.3})`);
  x.fillStyle=g;x.fill();
  x.lineWidth=Math.max(1.5,r*.02);x.strokeStyle=`rgba(220,240,255,${0.35-koyu*.45})`;x.stroke();
  // parlama
  x.beginPath();x.ellipse(cx-r*.38,cy-r*.42,r*(.22-koyu*.14),r*(.11-koyu*.07),-0.7,0,7);x.fillStyle=`rgba(255,255,255,${0.75-koyu*.5})`;x.fill();
  x.beginPath();x.arc(cx+r*.42,cy+r*.36,r*.05,0,7);x.fillStyle=`rgba(255,255,255,${0.5-koyu*.3})`;x.fill();
  x.restore();
}
function vizor(koyu){
  // kask camı kenarı: eliptik koyu çerçeve + hafif altın yansıma
  const g=x.createRadialGradient(W*.5,H*.47,H*.24,W*.5,H*.47,H*.62);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.72,'rgba(0,0,0,0.25)');g.addColorStop(1,'rgba(0,0,0,0.97)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const a=x.createLinearGradient(0,0,0,H*.35);
  a.addColorStop(0,`rgba(242,196,107,${0.16*(1-koyu)})`);a.addColorStop(1,'rgba(242,196,107,0)');
  x.fillStyle=a;x.fillRect(0,0,W,H*.35);
  // camda ince yansıma çizgisi
  x.save();x.globalAlpha=.10*(1-koyu*.7);x.strokeStyle='#fff';x.lineWidth=14;
  x.beginPath();x.ellipse(W*.5,H*.5,W*.62,H*.44,0,3.55,4.25);x.stroke();x.restore();
}
function nefes(t){ // camda buğu
  const a=0.05+0.05*Math.max(0,Math.sin(t*1.6));
  const g=x.createRadialGradient(W*.5,H*.95,10,W*.5,H*.95,H*.35);
  g.addColorStop(0,`rgba(230,240,255,${a})`);g.addColorStop(1,'rgba(230,240,255,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
}
window.kare=function(t){
  if(SAHNE==='kanca'){ // 0-4 sn: kenardan büyüyen su küresi
    arkaPlan(t,0.05,0);
    const k=kolay(t/3.6);
    damla(W*.72-k*120,H*.70-k*260,40+k*300,t,0);
    damla(W*.30,H*.80-k*90,14+k*70,t,0);
    damla(W*.86,H*.52,6+k*34,t,0);
    nefes(t);vizor(0);
  }else{ // gece: 0-7 sn, istasyon gölgeye giriyor, görüş su ile bulanık, önde halat
    const n=kolay(t/2.2);
    arkaPlan(t,0.35+n*0.55,4+n*10);
    // halat ve uzaktaki hava kilidi ışığı
    const ux=W*.5+Math.sin(t*.8)*30, uy=H*.36;
    x.save();x.strokeStyle=`rgba(235,235,225,${0.85-n*.35})`;x.lineWidth=16;x.lineCap='round';
    x.beginPath();x.moveTo(W*.42,H*1.02);x.quadraticCurveTo(W*.5+Math.sin(t*1.3)*60,H*.7,ux,uy);x.stroke();
    x.lineWidth=5;x.strokeStyle=`rgba(255,255,255,${0.5-n*.25})`;x.beginPath();x.moveTo(W*.41,H*1.02);x.quadraticCurveTo(W*.49+Math.sin(t*1.3)*60,H*.7,ux-2,uy);x.stroke();x.restore();
    const il=0.25+0.5*kolay((t-4)/2.5)+0.08*Math.sin(t*5);
    const g=x.createRadialGradient(ux,uy-20,2,ux,uy-20,140);
    g.addColorStop(0,`rgba(255,236,190,${il})`);g.addColorStop(1,'rgba(255,236,190,0)');
    x.fillStyle=g;x.fillRect(0,0,W,H);
    // yüzü kaplayan su
    damla(W*.52,H*.78,600+Math.sin(t*1.1)*22,t,0.75);
    damla(W*.24,H*.40,150,t,0.6);
    damla(W*.80,H*.33,110,t,0.6);
    nefes(t*1.4);vizor(0.6);
  }
};
window.kurgu=function(){};
</script></body></html>
