name: cPanel'e yükle (aksarayenerji.net + portal.aksarayenerji.net)
# docs/ (web sitesi + portal + monitoring + demo) ve saha uygulamasını cPanel API'si (2083) ile yükler; FTP portu kapalı.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   FTP_SUNUCU    ör. ftp.aksarayenerji.net
#   FTP_KULLANICI cPanel FTP kullanıcısı
#   FTP_SIFRE     FTP şifresi
#   FTP_DIZIN     (isteğe bağlı) hedef klasör; boşsa alan adının cPanel'deki kök klasörü
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'cpanel/**', '.github/workflows/cpanel_yukle.yml']
  schedule:
    - cron: '23 */3 * * *'   # saha uygulamasındaki değişiklikleri de taşımak için
concurrency:
  group: cpanel
  cancel-in-progress: false
jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ekinciomer-ai/saha
          path: _saha
      - name: Paketleri hazırla
        run: |
          if [ -z "${{ secrets.CPANEL_ANAHTAR }}${{ secrets.FTP_SIFRE }}" ]; then echo "cPanel sırları yok; atlandı."; echo "ATLA=1" >> $GITHUB_ENV; exit 0; fi
          python3 cpanel/paketle.py _saha
      - name: Site → aksarayenerji.net
        if: env.ATLA != '1'
        env:
          CP_HOST: aksarayenerji.net
          CP_ALAN: aksarayenerji.net
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_PASS: ${{ secrets.FTP_SIFRE }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
          CP_KONTROL: "/=<title;/referanslar.html=<title;/iletisim.html=<form"
        run: python3 cpanel/yukle.py dist_site
      - name: Portal → portal.aksarayenerji.net
        if: env.ATLA != '1'
        env:
          CP_HOST: aksarayenerji.net
          CP_ALAN: portal.aksarayenerji.net
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_PASS: ${{ secrets.FTP_SIFRE }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
          CP_KONTROL: "/=Kurumsal Portal;/monitoring/=<title;/saha/=<title;/cad/=AeCAD;/api/canli.php=durum"
        run: python3 cpanel/yukle.py dist_portal
