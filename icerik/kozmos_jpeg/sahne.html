const N=256;const SRC=document.createElement('canvas');SRC.width=SRC.height=N;(function(){const c=SRC.getContext('2d');const sk=c.createLinearGradient(0,0,0,N);sk.addColorStop(0,'#1e3a8a');sk.addColorStop(.55,'#f97316');sk.addColorStop(.75,'#fde68a');c.fillStyle=sk;c.fillRect(0,0,N,N);
 c.fillStyle='#fff7d6';c.beginPath();c.arc(170,150,30,0,TAU);c.fill();c.fillStyle='#3b2a52';c.beginPath();c.moveTo(0,200);c.lineTo(60,140);c.lineTo(110,185);c.lineTo(160,130);c.lineTo(220,190);c.lineTo(256,160);c.lineTo(256,256);c.lineTo(0,256);c.fill();
 c.fillStyle='#1a1430';c.fillRect(0,215,N,41);for(let i=0;i<40;i++){c.fillStyle=`rgba(255,240,200,${R(i)*.8})`;c.fillRect(R(i+3)*N,R(i+7)*120,2,2)}c.strokeStyle='#0b0a14';c.lineWidth=3;c.beginPath();c.moveTo(40,256);c.lineTo(40,175);c.stroke();for(let k=0;k<5;k++){c.beginPath();c.moveTo(40,180+k*6);c.lineTo(40+(k%2?-14:14),172+k*6);c.stroke()}})();
const SD=SRC.getContext('2d').getImageData(0,0,N,N).data;const Yc=new Float32Array(N*N),Cb=new Float32Array(N*N),Cr=new Float32Array(N*N);
for(let i=0;i<N*N;i++){const r=SD[i*4],g2=SD[i*4+1],b=SD[i*4+2];Yc[i]=.299*r+.587*g2+.114*b;Cb[i]=128-.1687*r-.3313*g2+.5*b;Cr[i]=128+.5*r-.4187*g2-.0813*b}
const QL=[16,11,10,16,24,40,51,61,12,12,14,19,26,58,60,55,14,13,16,24,40,57,69,56,14,17,22,29,51,87,80,62,18,22,37,56,68,109,103,77,24,35,55,64,81,104,113,92,49,64,78,87,103,121,120,101,72,92,95,98,112,100,103,99];
const CS=[];for(let u=0;u<8;u++){CS[u]=[];for(let x=0;x<8;x++)CS[u][x]=Math.cos((2*x+1)*u*Math.PI/16)*(u?Math.sqrt(2/8):Math.sqrt(1/8))}
function dct(b){const o=new Float32Array(64);for(let u=0;u<8;u++)for(let v=0;v<8;v++){let s=0;for(let x=0;x<8;x++)for(let y=0;y<8;y++)s+=b[y*8+x]*CS[u][x]*CS[v][y];o[v*8+u]=s}return o}
function idct(c){const o=new Float32Array(64);for(let x=0;x<8;x++)for(let y=0;y<8;y++){let s=0;for(let u=0;u<8;u++)for(let v=0;v<8;v++)s+=c[v*8+u]*CS[u][x]*CS[v][y];o[y*8+x]=s}return o}
function comp(ch,sc,sub){const out=new Float32Array(N*N);const st=sub?16:8;let zeros=0,tot=0;
 for(let by=0;by<N;by+=st)for(let bx=0;bx<N;bx+=st){const b=new Float32Array(64);for(let y=0;y<8;y++)for(let x=0;x<8;x++){const sx=bx+x*(st/8),sy=by+y*(st/8);let a=0,n=0;for(let dy=0;dy<st/8;dy++)for(let dx=0;dx<st/8;dx++){a+=ch[(sy+dy)*N+sx+dx];n++}b[y*8+x]=a/n-128}
  const c=dct(b);for(let i=0;i<64;i++){const q=Math.max(1,QL[i]*sc);c[i]=Math.round(c[i]/q)*q;tot++;if(c[i]==0)zeros++}const r=idct(c);
  for(let y=0;y<st;y++)for(let x=0;x<st;x++)out[(by+y)*N+bx+x]=r[Math.floor(y/(st/8))*8+Math.floor(x/(st/8))]+128}return{out,z:zeros/tot}}
function toCanvas(Y,B,Rr){const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N);for(let i=0;i<N*N;i++){const y=Y[i],cb=B[i]-128,cr=Rr[i]-128;im.data[i*4]=y+1.402*cr;im.data[i*4+1]=y-.344136*cb-.714136*cr;im.data[i*4+2]=y+1.772*cb;im.data[i*4+3]=255}x.putImageData(im,0,0);return c}
let BX=0,BY=0;{let best=-1;for(let by=0;by<N;by+=8)for(let bx=0;bx<N;bx+=8){let m=0,v=0;for(let y=0;y<8;y++)for(let x=0;x<8;x++)m+=Yc[(by+y)*N+bx+x];m/=64;for(let y=0;y<8;y++)for(let x=0;x<8;x++)v+=(Yc[(by+y)*N+bx+x]-m)**2;if(v>best&&v<64*900){best=v;BX=bx;BY=by}}}
const LV={};function lv(sc){if(!LV[sc]){const y=comp(Yc,sc,false),b=comp(Cb,sc*1.5,true),r=comp(Cr,sc*1.5,true);LV[sc]={c:toCanvas(y.out,b.out,r.out),z:y.z}}return LV[sc]}

 photo(GRAY,100,560,1.6);T('parlaklık',305,1000,34,'#fff',700);photo(c?COL:toCanvas(new Float32Array(N*N).fill(140),Cb,Cr),570,560,1.6);T(c?'renk (¼ çözünürlük)':'renk',775,1000,34,'#fff',700);

function sceneD(t){T('64 hazır desen',W/2,250,56,'#fff',800);T('her kare bunların karışımı',W/2,330,38,YL,700);const k=since(t,5,2);const n=Math.floor(64*k);
 for(let i=0;i<n;i++){const u=i%8,v=Math.floor(i/8);basis(140+u*102,560+v*102,11,u,v)}T('düz ↖',140,1400,30,'#c9d4f2',600,'left');T('ince çizgiler ↘',940,1400,30,'#c9d4f2',600,'right')}
function sceneE(t){const q=t>st(6)+.8;T(q?'İnce ayrıntı → 0':'64 sayı',W/2,250,56,'#fff',800);T(t>st(7)?'birkaç sayı + uzun sıfır dizisi':'yuvarla',W/2,330,38,YL,700);
 const b=new Float32Array(64);for(let y=0;y<8;y++)for(let x=0;x<8;x++)b[y*8+x]=Yc[(BY+y)*N+BX+x]-128;const c=dct(b);
 for(let i=0;i<64;i++){const u=i%8,v=Math.floor(i/8);let val=Math.round(c[i]);if(q)val=Math.round(c[i]/QL[i]);const x=160+u*100,y=560+v*90;g.fillStyle=val==0?'rgba(143,166,216,.12)':'rgba(255,207,90,.25)';g.fillRect(x-45,y-38,90,76);T(String(val),x,y,30,val==0?'#5b6a99':'#fff',800)}
 if(t>st(7)){g.strokeStyle=GR;g.lineWidth=4;g.beginPath();const zz=[[0,0],[1,0],[0,1],[0,2],[1,1],[2,0],[3,0],[2,1],[1,2],[0,3]];zz.forEach(([u,v],i)=>{const x=160+u*100,y=560+v*90;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();T('… 0 0 0 0 0 0',W/2,1340,44,GR,800)}}

 g.fillStyle='#f4f1ea';g.beginPath();g.roundRect(220,560,640,780,16);g.fill();for(let i=0;i<14;i++){g.fillStyle='#cbd5e1';g.fillRect(270,640+i*44,540*(0.6+.4*R(i)),14)}T(p?'IEEE Transactions':'Destek başvurusu',W/2,600,30,'#334155',800);
 if(!p&&t>st(9)+1.5){g.save();g.translate(W/2,1000);g.rotate(-.25);g.strokeStyle=RD;g.lineWidth=10;g.strokeRect(-230,-70,460,140);T('RED',0,-15,70,RD,900);T('"fazla basit"',0,45,34,RD,800);g.restore()}

 const y0=Math.min(1745,1790-(lines.length-1)*60);lines.forEach((l,i)=>{const w2=g.measureText(l).width+40;g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.roundRect(W/2-w2/2,y0+i*60-32,w2,62,14);g.fill();T(l,W/2,y0+i*60,46,'#fff',700)})}

 if(t<TM.J[0])subs(t);T('KOZMOS LAB',W/2,1850,34,'rgba(255,255,255,.8)',800);T('@kozmoslabtr',W/2,1890,24,'rgba(200,210,240,.5)',500)}
