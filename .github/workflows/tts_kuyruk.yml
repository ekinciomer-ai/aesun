name: Ücretsiz tonlu seslendirme kuyruğu (sunucudan)
# sunucu/tts_kuyruk/<kod>.json eklenince sunucu edge-tts ile tonlu Türkçe seslendirir (ücretsiz, anahtarsız);
# mp3'ler sunucu/tts_kuyruk/cikti/ altına yazılır, iş dosyası sunucu/tts_kuyruk/tamam/ altına taşınır.
on:
  push:
    branches: [main]
    paths: ['sunucu/tts_kuyruk/*.json', 'sunucu/islem_tts_kuyruk.sh', 'sunucu/tts/uret.py', '.github/workflows/tts_kuyruk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tts-kuyruk, cancel-in-progress: false }
jobs:
  ses:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Sunucuda seslendir
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          ls sunucu/tts_kuyruk/*.json >/dev/null 2>&1 || { echo "kuyruk boş"; exit 0; }
          mkdir -p ~/.ssh /tmp/pk/kuyruk
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          cp sunucu/islem_tts_kuyruk.sh sunucu/tts/uret.py /tmp/pk/; cp sunucu/tts_kuyruk/*.json /tmp/pk/kuyruk/
          tar czf /tmp/paket.tgz -C /tmp/pk .
          O="-i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          ssh $O root@$ADRES "rm -rf /tmp/tts_k && mkdir -p /tmp/tts_k && tar xzf - -C /tmp/tts_k && cd /tmp/tts_k && bash islem_tts_kuyruk.sh < /dev/null; tar czf /tmp/tts_cikti.tgz -C /tmp/tts_k cikti" < /tmp/paket.tgz > /tmp/cikti.txt 2>&1 || true
          mkdir -p sunucu/tts_kuyruk
          scp $O root@$ADRES:/tmp/tts_cikti.tgz /tmp/ && tar xzf /tmp/tts_cikti.tgz -C sunucu/tts_kuyruk/ || echo "::warning::çıktı alınamadı"
          ssh $O root@$ADRES "rm -rf /tmp/tts_k /tmp/tts_cikti.tgz" || true
          rm -f ~/.ssh/k
          mkdir -p sunucu/tts_kuyruk/cikti
          grep '^NOT:' /tmp/cikti.txt | sed 's/^NOT: *//' | tee sunucu/tts_kuyruk/cikti/gunluk.txt | while IFS= read -r l; do echo "::notice::$l"; done
          mkdir -p sunucu/tts_kuyruk/tamam
          for f in sunucu/tts_kuyruk/*.json; do git mv "$f" sunucu/tts_kuyruk/tamam/ 2>/dev/null || mv "$f" sunucu/tts_kuyruk/tamam/; done
      - name: Kaydet
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A sunucu/tts_kuyruk
          git diff --cached --quiet && exit 0
          git commit -qm "Tonlu seslendirme: sesler hazır $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
