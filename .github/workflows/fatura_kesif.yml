name: Fatura sitesi keşfi (yalnız okuma)
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
        run: python3 cpanel/fatura_kesif.py
