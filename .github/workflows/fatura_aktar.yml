name: Fatura verisini aktar (gesfin → portal)
# ns1'deki fatura uygulamasının (gesfin) veritabanından fatura özetini okur (yalnız SELECT) ve
# portal.aksarayenerji.net/veri/fatura_gesfin.json olarak yükler; monitoring > Fatura analizi buradan okur.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
concurrency:
  group: fatura-aktar
  cancel-in-progress: false
jobs:
  aktar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dışa aktar ve yükle
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
          CP_ALAN: portal.aksarayenerji.net
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 root@$ADRES 'docker exec -i gesfin-db psql -U gesfin -d gesfin -At -v ON_ERROR_STOP=1' < sunucu/fatura_disari.sql > fatura_gesfin.json
          rm -f ~/.ssh/k
          python3 -c "import json;d=json.load(open('fatura_gesfin.json'));print('::notice::fatura', len(d.get('faturalar') or []), 'tesis', len(d.get('tesisler') or []))"
          python3 cpanel/tek_yukle.py fatura_gesfin.json veri
