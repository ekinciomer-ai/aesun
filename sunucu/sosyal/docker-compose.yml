# Sosyal Stüdyo: diğer servislerden bağımsız, kendi kaynak sınırıyla. Dışarıya port açmaz (yalnız sunucunun içinden 127.0.0.1:5090).
services:
  sosyal:
    build: .
    container_name: sosyal-studyo
    init: true
    restart: unless-stopped
    env_file: [/opt/sosyal/sosyal.env, /opt/sosyal/anahtar.env]
    volumes:
      - sosyal_veri:/veri
      - /opt/sosyal/kaynak:/kaynak
    ports: ["127.0.0.1:5090:8000"]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
volumes:
  sosyal_veri:
