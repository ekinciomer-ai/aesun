<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>Gece Sakız 2D</title>
<style>
@font-face{font-family:Kalam;src:url(fonts/kalam-latin-400-normal.woff2) format('woff2');font-weight:400;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+25BC,U+FEFF,U+FFFD}
@font-face{font-family:Kalam;src:url(fonts/kalam-latin-ext-400-normal.woff2) format('woff2');font-weight:400;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Kalam;src:url(fonts/kalam-latin-700-normal.woff2) format('woff2');font-weight:700;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+25BC,U+FEFF,U+FFFD}
@font-face{font-family:Kalam;src:url(fonts/kalam-latin-ext-700-normal.woff2) format('woff2');font-weight:700;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Baloo;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2');font-weight:800;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+25BC,U+FEFF,U+FFFD}
@font-face{font-family:Baloo;src:url(fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2');font-weight:800;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
html,body{margin:0;background:#e9d8b0;overflow:hidden}
svg{display:block;width:100vw;height:100vh}
</style></head>
<body>
<svg id="s" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
<script>
// Gece Sakız Short'u — 2D vektör çizgi film canlandırması (Antik Stüdyo "Cevahir" tarzı: kalın mürekkep çizgi, parşömen renkler).
// Kayıt sözleşmesi (video/arac/kayit.js): window.kurgu(K), window.kare(t), window.HAZIR
const SV=document.getElementById('s');let K=null;
const INK='#3a2c1e',PAPER='#ead9b2',P2='#dcc597',RED='#b8442e',GOLD='#d9a531',SEA='#6fa3ad',SEA2='#5a8d97',HILL='#c8b07a',HILL2='#b59c66',
TREE='#6f8a4f',TREE2='#5b7440',SKIN='#f0c9a0',SKY='#f2e4c0',NIGHT='#3f4f6b',NIGHT2='#2f3c54';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=p=>1-Math.pow(1-cl(p),3),pop=p=>{p=cl(p);return 1+Math.sin(p*Math.PI)*0.12*(1-p)};
const W=5; // mürekkep kalınlığı
const PS=1.32; // karakter büyütme
const st=(f,w=W)=>`fill="${f}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const g=(x,y,s,inner,r=0,op=1)=>`<g transform="translate(${x},${y}) rotate(${r}) scale(${s})" opacity="${op}">${inner}</g>`;

// ---------- yapı taşları ----------
function cloud(x,y,s){return g(x,y,s,`<path d="M-90,20 Q-95,-25 -50,-20 Q-40,-60 5,-45 Q35,-75 65,-35 Q105,-35 95,20 Z" ${st('#fbf3df',4)}/>`)}
function sun(x,y,r,t){let ray='';for(let i=0;i<12;i++){const a=i*30+t*12;ray+=`<line x1="${Math.cos(a*Math.PI/180)*(r+14)}" y1="${Math.sin(a*Math.PI/180)*(r+14)}" x2="${Math.cos(a*Math.PI/180)*(r+34)}" y2="${Math.sin(a*Math.PI/180)*(r+34)}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`}
 return g(x,y,1,ray+`<circle r="${r}" ${st(GOLD)}/>`)}
function bird(x,y,t){const f=Math.sin(t*9)*10;return `<path d="M${x-18},${y+f*0.3} Q${x-8},${y-10-f} ${x},${y} Q${x+8},${y-10-f} ${x+18},${y+f*0.3}" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`}
function tree(x,y,s){return g(x,y,s,`<rect x="-9" y="-40" width="18" height="44" ${st('#8a6a44',4)}/><path d="M0,-150 C55,-150 70,-90 50,-60 C70,-30 30,-20 0,-25 C-30,-20 -70,-30 -50,-60 C-70,-90 -55,-150 0,-150Z" ${st(TREE)}/>`)}
function cypress(x,y,s){return g(x,y,s,`<path d="M0,-190 C25,-120 28,-40 18,0 L-18,0 C-28,-40 -25,-120 0,-190Z" ${st(TREE2)}/>`)}
function shrub(x,y,s,t,tears){let d='';if(tears)for(let i=0;i<5;i++){const yy=-20+((t*30+i*17)%40);d+=`<ellipse cx="${-40+i*20}" cy="${yy}" rx="6" ry="8" ${st(GOLD,3)}/>`}
 return g(x,y,s,`<path d="M-15,0 Q-20,-30 -40,-40 M15,0 Q25,-35 45,-45" stroke="#7a5a38" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="-70" rx="85" ry="48" ${st(TREE)}/><ellipse cx="-45" cy="-55" rx="40" ry="28" ${st(TREE2,4)}/>`+d)}
function house(x,y,s,dome){return g(x,y,s,`<rect x="-45" y="-80" width="90" height="80" ${st('#f6efe0')}/><rect x="-14" y="-40" width="28" height="40" ${st('#8fb3bd',4)}/><rect x="-36" y="-66" width="18" height="16" ${st('#8fb3bd',3)}/><rect x="18" y="-66" width="18" height="16" ${st('#8fb3bd',3)}/>`+
 (dome?`<path d="M-32,-80 A32,32 0 0 1 32,-80Z" ${st('#5c8aa8')}/>`:`<path d="M-55,-78 L0,-118 L55,-78Z" ${st('#c46a4a')}/>`))}
function hills(y,c1,c2){return `<path d="M0,${y} C160,${y-140} 300,${y-150} 460,${y-40} C600,${y-170} 820,${y-160} 1080,${y-30} L1080,${y+60} L0,${y+60}Z" ${st(c2)}/>`+
 `<path d="M0,${y+40} C220,${y-60} 420,${y-40} 600,${y+20} C760,${y-50} 920,${y-40} 1080,${y+20} L1080,${y+200} L0,${y+200}Z" ${st(c1)}/>`}
function waves(y,t,c=SEA){let d=`<rect x="-10" y="${y}" width="1100" height="260" fill="${c}" stroke="${INK}" stroke-width="${W}"/>`;
 for(let r=0;r<3;r++)for(let i=0;i<7;i++){const x=((i*170+t*40*(r%2?1:-1)+r*60)%1250+1250)%1250-80,yy=y+50+r*70;d+=`<path d="M${x},${yy} q20,-14 40,0 q20,14 40,0" fill="none" stroke="#e9f2f2" stroke-width="4" stroke-linecap="round" opacity=".8"/>`}return d}
function ground(y){return `<rect x="-10" y="${y}" width="1100" height="${1920-y}" fill="#d8bf8a" stroke="${INK}" stroke-width="${W}"/>`+
 [[120,60],[400,140],[760,90],[950,180],[250,260]].map(([x,dy])=>`<path d="M${x},${y+dy} l12,-14 l8,10 l10,-16" fill="none" stroke="#9c7f50" stroke-width="4" stroke-linecap="round"/>`).join('')}
function sparkle(x,y,s,t,ph=0){const k=0.6+0.4*Math.sin(t*8+ph);return g(x,y,s*k,`<path d="M0,-26 L6,-6 L26,0 L6,6 L0,26 L-6,6 L-26,0 L-6,-6Z" fill="#fff6c8" stroke="${GOLD}" stroke-width="3"/>`,t*40+ph*20)}
function crate(x,y,s,full=true){return g(x,y,s,`<rect x="-60" y="-70" width="120" height="70" ${st('#b8864f')}/><line x1="-60" y1="-35" x2="60" y2="-35" stroke="${INK}" stroke-width="4"/>`+
 (full?[-36,-12,12,36].map((xx,i)=>`<ellipse cx="${xx}" cy="-76" rx="13" ry="10" ${st('#f5e7b0',3)}/>`).join(''):''))}
function jar(x,y,s,lid,t){return g(x,y,s,`<ellipse cx="0" cy="0" rx="150" ry="26" ${st('#c99a3a')}/>`+
 `<path d="M-90,-10 C-120,-80 -100,-150 -60,-170 L60,-170 C100,-150 120,-80 90,-10 Z" ${st('#cfd4d8')}/>`+
 `<path d="M-60,-120 Q0,-95 60,-120" fill="none" stroke="${INK}" stroke-width="4"/><path d="M-70,-70 Q0,-45 70,-70" fill="none" stroke="#9aa1a6" stroke-width="4"/>`+
 `<circle cx="-30" cy="-95" r="7" fill="#9aa1a6"/><circle cx="0" cy="-90" r="7" fill="#9aa1a6"/><circle cx="30" cy="-95" r="7" fill="#9aa1a6"/>`+
 `<g transform="translate(0,${-170-lid*90}) rotate(${-lid*14})"><path d="M-70,0 Q0,-50 70,0Z" ${st('#dfe3e6')}/><circle cy="-34" r="12" ${st('#dfe3e6',4)}/></g>`+
 (lid>0.3?[-40,-15,10,35].map((xx,i)=>`<ellipse cx="${xx}" cy="${-178-Math.sin(t*3+i)*4}" rx="16" ry="12" fill="#f8edc2" stroke="${INK}" stroke-width="3"/>`).join(''):''))}
function galley(x,y,s,t){let oars='';for(let i=0;i<7;i++){const a=Math.sin(t*5+i*0.3)*14;oars+=`<line x1="${-150+i*48}" y1="10" x2="${-150+i*48+Math.sin(a*Math.PI/180)*60-20}" y2="80" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`}
 return g(x,y,s,oars+`<path d="M-230,-10 L220,-10 Q200,45 150,50 L-170,50 Q-215,40 -230,-10Z" ${st('#9b6a3e')}/><line x1="-220" y1="12" x2="210" y2="12" stroke="${INK}" stroke-width="4"/>`+
 `<line x1="-20" y1="-10" x2="-20" y2="-300" stroke="${INK}" stroke-width="8"/><path d="M-20,-290 Q90,-200 140,-40 L-20,-40Z" ${st('#fbf3df')}/>`+
 `<path d="M-20,-300 L40,-285 L-20,-270Z" fill="${RED}" stroke="${INK}" stroke-width="4"/><path d="M170,-10 L240,-60" stroke="${INK}" stroke-width="6"/>`)}
function bed(x,y,s,c){return g(x,y,s,`<rect x="-230" y="-60" width="460" height="90" ${st('#9b6a3e')}/><rect x="-250" y="-200" width="40" height="230" ${st('#9b6a3e')}/>`+
 `<rect x="-215" y="-110" width="430" height="70" rx="20" ${st(c)}/>`)}
function windowNight(x,y,s,t){return g(x,y,s,`<rect x="-130" y="-170" width="260" height="300" ${st(NIGHT2)}/><circle cx="50" cy="-90" r="34" fill="#f8efc6" stroke="${INK}" stroke-width="4"/><circle cx="64" cy="-100" r="30" fill="${NIGHT2}"/>`+
 [[-70,-120],[-30,-40],[-90,40],[40,20],[80,80]].map(([a,b],i)=>`<circle cx="${a}" cy="${b}" r="${3+Math.sin(t*4+i)*1.5}" fill="#f8efc6"/>`).join('')+`<line x1="0" y1="-170" x2="0" y2="130" stroke="${INK}" stroke-width="6"/><line x1="-130" y1="-20" x2="130" y2="-20" stroke="${INK}" stroke-width="6"/>`)}

// ---------- karakter: ayaklar (x,y) ----------
function person(x,y,s,o){o=Object.assign({robe:'#3f6b4a',robe2:null,skin:SKIN,head:'turban',beard:null,a1:20,a2:-20,mouth:'smile',blink:false,glasses:false,bob:0,hair:null,face:1},o);
 const sh=-200,hy=-262,eye=o.blink?`<path d="M-17,${hy} q7,4 14,0 M5,${hy} q7,4 14,0" stroke="${INK}" stroke-width="4" fill="none"/>`:`<circle cx="-10" cy="${hy}" r="5.5" fill="${INK}"/><circle cx="12" cy="${hy}" r="5.5" fill="${INK}"/>`;
 const mouth={smile:`<path d="M-12,${hy+22} q12,10 24,0" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`,o:`<ellipse cx="1" cy="${hy+24}" rx="8" ry="10" fill="#7a2e22" stroke="${INK}" stroke-width="3"/>`,
  laugh:`<path d="M-15,${hy+18} q16,26 32,0Z" fill="#7a2e22" stroke="${INK}" stroke-width="3"/>`,grin:`<path d="M-16,${hy+18} q16,14 32,0" fill="#fff" stroke="${INK}" stroke-width="3"/>`,chew:`<ellipse cx="1" cy="${hy+24}" rx="10" ry="${3+Math.abs(o.chew||0)*6}" fill="#7a2e22" stroke="${INK}" stroke-width="3"/>`}[o.mouth];
 const arm=(sx,a,flip)=>`<g transform="translate(${sx},${sh+12}) rotate(${a})"><path d="M0,0 L${flip*8},92" stroke="${o.robe2||o.robe}" stroke-width="26" stroke-linecap="round"/><path d="M0,0 L${flip*8},92" stroke="${INK}" stroke-width="34" stroke-linecap="round" opacity="0"/><circle cx="${flip*8}" cy="100" r="15" ${st(o.skin,4)}/></g>`;
 let head='';
 if(o.head==='turban')head=`<ellipse cx="0" cy="${hy-48}" rx="50" ry="34" ${st('#f7f1e3')}/><path d="M-44,${hy-40} q44,-22 88,0" fill="none" stroke="${INK}" stroke-width="3"/><circle cx="0" cy="${hy-84}" r="9" ${st(RED,3)}/>`;
 let back='';if(o.head==='scarf'){back=`<path d="M-62,${hy+20} C-70,${hy-80} 70,${hy-80} 62,${hy+20} L56,${hy+60} L-56,${hy+60}Z" ${st('#f7f1e3')}/>`;head=`<path d="M-44,${hy-22} Q0,${hy-58} 44,${hy-22} Q0,${hy-36} -44,${hy-22}Z" fill="#f7f1e3" stroke="${INK}" stroke-width="4"/>`}
 if(o.head==='scarfFront')head='';
 if(o.head==='tricorne')head=`<path d="M-72,${hy-30} Q0,${hy-110} 72,${hy-30} Q0,${hy-52} -72,${hy-30}Z" ${st('#2c2a35')}/><path d="M-50,${hy-20} q-14,24 -4,46 M50,${hy-20} q14,24 4,46" stroke="#f3efe6" stroke-width="16" fill="none" stroke-linecap="round"/>`;
 if(o.head==='bork')head=`<path d="M-34,${hy-30} L-26,${hy-150} Q0,${hy-170} 26,${hy-150} L34,${hy-30}Z" ${st('#f7f1e3')}/><rect x="-40" y="${hy-44}" width="80" height="20" ${st(GOLD,4)}/>`;
 if(o.head==='cap')head=`<path d="M-48,${hy-20} Q0,${hy-90} 48,${hy-20}Z" ${st('#2c2a35')}/><rect x="-46" y="${hy-12}" width="92" height="14" fill="#2c2a35"/>`;
 const hair=o.hair==='curly'?[-44,-24,0,24,44,-34,34].map((xx,i)=>`<circle cx="${xx}" cy="${hy-36+(i>4?18:0)}" r="${i>4?20:22}" ${st('#5a3a22',4)}/>`).join(''):(o.hair==='wig'?`<path d="M-48,${hy-10} q-14,40 0,60 M48,${hy-10} q14,40 0,60" stroke="#f3efe6" stroke-width="18" fill="none"/>`:'');
 const beard=o.beard?`<path d="M-38,${hy+10} Q-30,${hy+80} 0,${hy+92} Q30,${hy+80} 38,${hy+10} Q0,${hy+40} -38,${hy+10}Z" ${st(o.beard,4)}/>`:'';
 const mus=o.mus?`<path d="M-30,${hy+16} q15,-12 30,0 q15,-12 30,0" fill="${INK}" stroke="${INK}" stroke-width="3"/>`:'';
 const mask=o.mask?`<rect x="-46" y="${hy-12}" width="92" height="22" rx="10" fill="#222"/><circle cx="-10" cy="${hy}" r="4" fill="#fff"/><circle cx="12" cy="${hy}" r="4" fill="#fff"/>`:'';
 const gl=o.glasses?`<circle cx="-11" cy="${hy}" r="13" fill="none" stroke="${INK}" stroke-width="3.5"/><circle cx="13" cy="${hy}" r="13" fill="none" stroke="${INK}" stroke-width="3.5"/><line x1="2" y1="${hy}" x2="0" y2="${hy}" stroke="${INK}" stroke-width="3"/>`:'';
 const stripes=o.stripes?[0,1,2,3].map(i=>`<line x1="-48" y1="${-170+i*36}" x2="48" y2="${-170+i*36}" stroke="#f3efe6" stroke-width="10"/>`).join(''):'';
 const body=`<path d="M-42,${sh} L42,${sh} L62,0 L-62,0Z" ${st(o.robe)}/>`+stripes+(o.sash?`<rect x="-50" y="-120" width="100" height="18" ${st(o.sash,3)}/>`:'')+`<rect x="-34" y="-6" width="26" height="10" rx="5" fill="${INK}"/><rect x="8" y="-6" width="26" height="10" rx="5" fill="${INK}"/>`;
 return g(x,y+o.bob,s*PS,arm(-38,o.a1,-1)+body+arm(38,o.a2,1)+back+hair+`<circle cx="0" cy="${hy}" r="${46*o.face}" ${st(o.skin)}/>`+beard+mus+eye+gl+mask+mouth+head)}

// ---------- başlık, sayaç, altyazı ----------
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const trU=s=>s.replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase();
function baslik(s,ts,op){const a=ease(ts/0.4)*op;let o='';let y=210;
 if(s.etiket){const w=s.etiket.length*21+50;o+=`<g opacity="${a}"><rect x="${540-w/2}" y="${y-48}" width="${w}" height="56" rx="14" fill="${INK}"/><text x="540" y="${y-10}" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="34" fill="${GOLD}">${esc(s.etiket)}</text></g>`;y+=78}
 const t1=trU(s.b1),t2=trU(s.b2),f1=Math.min(96,1750/Math.max(10,t1.length)),f2=Math.min(84,1650/Math.max(10,t2.length));
 const b1=ease((ts-0.1)/0.4)*op,b2=ease((ts-0.25)/0.4)*op;
 o+=`<text x="540" y="${y+(1-b1)*24}" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="${f1}" fill="${INK}" opacity="${b1}" stroke="${PAPER}" stroke-width="10" paint-order="stroke">${esc(t1)}</text>`;
 o+=`<text x="540" y="${y+f2+6+(1-b2)*24}" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="${f2}" fill="${RED}" opacity="${b2}" stroke="${PAPER}" stroke-width="10" paint-order="stroke">${esc(t2)}</text>`;
 return o}
function sayac(x,y,label,val,col){return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Kalam" font-weight="700" font-size="40" fill="${col}">${esc(label)}</text><text x="${x}" y="${y+92}" text-anchor="middle" font-family="Kalam" font-weight="700" font-size="104" fill="${col}">${val}</text>`}
let GRUP=[];
function grupla(){GRUP=[];let tam=[];const KW=K.kelimeler;
 const bos=j=>{if(!tam.length)return;const t0=KW[tam[0]].b,t1=j+1<KW.length?KW[j+1].b:KW[j].s+0.8;GRUP.push({t0,t1,w:tam.map(i=>KW[i].k)});tam=[]};
 KW.forEach((w,i)=>{tam.push(i);if(tam.length===3||/[.!?…:;]$/.test(w.k))bos(i)});bos(KW.length-1)}
const nrm=w=>w.toLowerCase().replace(/İ/g,'i').replace(/[^\wçğıöşüâ]/g,'');
function sari(w){const n=nrm(w);return K.anahtar.some(a=>n.startsWith(nrm(a)))}
function altyazi(t){const G=GRUP.find(x=>t>=x.t0&&t<x.t1);if(!G)return'';const u=ease((t-G.t0)/0.15);
 const parts=G.w.map(w=>`<tspan fill="${sari(w)?RED:INK}">${esc(w)}</tspan>`).join(' ');const fs=Math.min(78,1700/Math.max(12,G.w.join(' ').length));
 return `<g opacity="${u}" transform="translate(540,1560) scale(${0.92+0.08*u})"><rect x="-500" y="-78" width="1000" height="112" rx="26" fill="#f7eed6" stroke="${INK}" stroke-width="4" opacity=".93"/><text x="0" y="0" text-anchor="middle" font-family="Kalam" font-weight="700" font-size="${fs}">${parts}</text></g>`}

// ---------- sahneler: f(ts, u, t) → çizim (sahne alanı ~ y 420–1400) ----------
const SAHNE={
 yatak(ts,u,t,fin){const bub=fin?ease(ts/2.2)*1.6:(ts<2.4?ease(ts/2.2):0),popd=!fin&&ts>2.4&&ts<2.8;const chew=Math.sin(ts*12);
  let o=`<rect x="-10" y="420" width="1100" height="1000" fill="${NIGHT}" stroke="${INK}" stroke-width="${W}"/>`+`<rect x="-10" y="1150" width="1100" height="270" fill="#6b5a46" stroke="${INK}" stroke-width="${W}"/>`;
  o+=windowNight(300,800,1,t)+`<rect x="700" y="560" width="220" height="560" ${st('#8a6a44')}/><circle cx="880" cy="860" r="12" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>`;
  o+=`<path d="M600,1150 L600,1000 L640,960 L680,1000 L680,1150Z" ${st('#e6c36a')}/><ellipse cx="640" cy="1150" rx="70" ry="14" fill="#f8e9a8" opacity=".5"/>`;
