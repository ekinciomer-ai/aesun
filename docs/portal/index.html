<script>
'use strict';
// ===== Aksaray Enerji Portal (GitHub Pages) =====
// Sunucu yok: kayıtlar şifreli. Her kullanıcının kaydı kendi şifresinden türetilen anahtarla (PBKDF2-SHA256 600k + AES-GCM)
// şifrelenir; uygulama bağlantıları ayrı anahtarlarla şifrelidir ve yalnız yetkili kullanıcının kaydında o anahtar bulunur.
// Yönetim kayıtları (rehber + tüm uygulama anahtarları) yönetici anahtarıyla şifrelidir. Veri: epias-ptf/portal/veri.json
const DEPO = 'ekinciomer-ai/epias-ptf', YOL = 'portal/veri.json';
const API = 'https://api.github.com/repos/' + DEPO + '/contents/' + YOL, RAW = 'https://raw.githubusercontent.com/' + DEPO + '/main/' + YOL;
const ITER = 600000, OTURUM_SN = 12 * 3600;
// Uygulama alt başlıkları (yetki kutuları). Monitoring paneli bu kimliklere göre sekme ve para bilgisini gösterir.
/* varsayılan KAPALI (hassas / yönetici) yetkiler — modül açılınca otomatik verilmez, elle seçilir */
const KAPALI = new Set(['parasal', 'yedek', 'proje', 'rapor', 'ilerleme', 'ekip', 'od_hakedis', 'od_taseron']);
/* Saha projeleri — saha uygulaması ile AYNI origin'de localStorage'ta tutulur; n8n yedeği */
const N8N_SAHA = (() => { try { return localStorage.getItem('sh2:n8n') || 'https://xbay.app.n8n.cloud/webhook'; } catch (e) { return 'https://xbay.app.n8n.cloud/webhook'; } })();
// Saha API yetkisi: portal oturumundan türetilen belirteç (GET: k=, POST: gövdede k) — anahtarın kendisi gönderilmez
async function sahaK() { if (!S) return null; const src = S.ka ? 'aesun-api|yonetici|' + S.ka : (S.anahtarlar && S.anahtarlar.saha ? 'aesun-api|saha|' + S.anahtarlar.saha : null); if (!src) return null; return [...new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(src)))].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function sahaFetch(url, o) { o = o || {}; const k = await sahaK().catch(() => null); if (k) { if (!o.method || o.method === 'GET') url += (url.includes('?') ? '&' : '?') + 'k=' + k; else if (typeof o.body === 'string') { const b = JSON.parse(o.body); b.k = k; o = { ...o, body: JSON.stringify(b) }; } } return fetch(url, o); }
function sahaProjeListesi() { let l = []; try { l = JSON.parse(localStorage.getItem('sh2:projeler') || '[]') || []; } catch (e) {} if (!l.some(p => p && p.id === 'tr1')) l.unshift({ id: 'tr1', ad: 'SHAMS-1 GES', renk: '#E8622A' }); return l; }
function sahaRegParse(rows) { const arr = Array.isArray(rows) ? rows : (rows && rows.data) || []; const map = {}, blob = {}; arr.forEach(x => { const k = x.anahtar || ''; if (k.indexOf('p:') === 0) { try { const o = JSON.parse(x.deger); if (o && o.id && !o.sil) map[o.id] = o; } catch (e) {} } else if (k === 'projeler') { try { const a = JSON.parse(x.deger); if (a && a.length) a.forEach(p => { if (p && p.id && !blob[p.id]) blob[p.id] = p; }); } catch (e) {} } }); let list = Object.values(map); if (!list.length) list = Object.values(blob); if (!list.some(p => p.id === 'tr1')) list.unshift({ id: 'tr1', ad: 'SHAMS-1 GES', renk: '#E8622A' }); return list; }
function sahaProjeTazele(cb) { try { sahaFetch(N8N_SAHA + '/saha-get?proje=SHAMS1-reg&t=' + Date.now()).then(r => r.ok ? r.json() : null).then(rows => { const list = sahaRegParse(rows); if (list && list.length) { try { localStorage.setItem('sh2:projeler', JSON.stringify(list)); } catch (e) {} cb && cb(list); } }).catch(() => {}); } catch (e) {} }
const KONULAR = {
  monitoring: [['genel', 'Genel bakış'], ['sayac', 'Sayaçlar ve mahsup'], ['inverter', 'İnverter analizi'], ['maden', 'Madencilik'], ['epias', 'EPİAŞ'], ['parasal', 'Parasal bilgiler (₺, fatura, gelir, pay)']],
  saha: [['gunluk', 'Günlük'], ['puantaj', 'Puantaj'], ['ilerleme', 'İlerleme (iş kalemleri)'], ['od_maas', 'Ödeme · Maaş'], ['od_harcama', 'Ödeme · Harcamalar'], ['od_taseron', 'Ödeme · Taşeron'], ['od_hakedis', 'Ödeme · Hakediş'], ['ekip', 'Ekip yönetimi (personel/araç)'], ['rapor', 'Saha raporu'], ['yedek', 'Yedek / geri yükle']]
};
const te = new TextEncoder(), td = new TextDecoder();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const ss = { al(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, koy(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, sil(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
const ghAnahtar = () => { try { return localStorage.getItem('aesun_gh_anahtar') || ''; } catch (e) { return ''; } };
const ghKaydet = v => { try { localStorage.setItem('aesun_gh_anahtar', v); } catch (e) {} };

async function kdf(sifre, tuz, iter) {
  const k = await crypto.subtle.importKey('raw', te.encode(sifre), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(tuz), iterations: iter }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const hamAnahtar = r => crypto.subtle.importKey('raw', ub(r), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function sifrele(key, obj) { const iv = rnd(12); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj))); return { iv: b64(iv), ct: b64(ct) }; }
async function coz(key, k) { const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(k.iv) }, key, ub(k.ct)); return JSON.parse(td.decode(p)); }
async function kulOz(tuz, kul) { const h = await crypto.subtle.digest('SHA-256', te.encode(tuz + ':' + kul.trim().toLocaleLowerCase('tr'))); return Array.from(new Uint8Array(h)).slice(0, 16).map(x => x.toString(16).padStart(2, '0')).join(''); }

// ---- veri ----
let V = null, VSHA = null, S = null, R = null;   // V: veri.json, S: oturum (çözülmüş kullanıcı kaydı), R: yönetim rehberi
async function veriYukle() {
  // Depo gizli olabilir: yetkisiz GitHub isteğinin 404'ü "veri yok" sayılmaz. Yönetici anahtarı varsa GitHub API, yoksa merkez (api.aksarayenerji.net) ya da CDN.
  const t = ghAnahtar();
  if (t) {
    try {
      const r = await fetch(API + '?t=' + Date.now(), { headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + t }, cache: 'no-store' });
      if (!r.ok) console.warn('GitHub anahtarı veri.json okuyamadı (' + r.status + '); merkezden okunuyor');   // 404: anahtarın gizli depoya yetkisi yok — girişi engellemez
      if (r.ok) { const j = await r.json(); VSHA = j.sha; V = JSON.parse(td.decode(ub(j.content.replace(/\n/g, '')))); return; }
    } catch (e) {}
  }
  let son = '';
  for (const u of ['https://api.aksarayenerji.net/v1/acik/' + YOL, RAW]) {
    try { const r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { V = await r.json(); VSHA = null; return; } son = r.status; } catch (e) { son = e.message; }
  }
  throw new Error('Veri alınamadı (' + son + ')');
}
async function vitrinGuncelle() {
  if (!R) return;
  const vs = [];
  for (const [id, r] of Object.entries(R.anahtarlar)) { if (!V.moduller[id]) continue; const d = await coz(await hamAnahtar(r), V.moduller[id]); vs.push({ id, ad: d.ad, ikon: d.ikon || 'diger', renk: d.renk || 'kirmizi', aktif: d.aktif !== false, sira: d.sira || 0 }); }
  V.vitrin = vs.sort((a, b) => a.sira - b.sira);
}
async function veriKaydet(mesaj) {
  await vitrinGuncelle();
  const t = ghAnahtar(); if (!t) throw new Error('Kaydetmek için GitHub anahtarı gerekli (Yönetim → Ayar).');
  const hd = { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' };
  if (!VSHA) { const r0 = await fetch(API + '?t=' + Date.now(), { headers: hd, cache: 'no-store' }); if (r0.ok) VSHA = (await r0.json()).sha; }
  V.guncellendi = new Date().toISOString();
  const icerik = b64(te.encode(JSON.stringify(V, null, 1)));
  const r = await fetch(API, { method: 'PUT', headers: hd, body: JSON.stringify({ message: 'portal: ' + mesaj, content: icerik, ...(VSHA ? { sha: VSHA } : {}) }) });
