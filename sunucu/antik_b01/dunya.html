// ---------- evreler: tel kafes → kil → renk ----------
function evre(T){ // sahne zamanlarından: 0..1 tel, kil, renk
  const s=Z.sahneler; const b1=s[1].bas, b2=s[2].bas;
  return {tel:1, kil:ease((T-(b1-0.4))/1.2), renk:ease((T-(b2-0.4))/1.4)}}

    const gor=ease((T-0.15-p.sira*0.35)/0.6)*(T<s0.bas+s0.sure?1:1); // parçalar sırayla belirir

    p.me.material.opacity=kati; p.me.material.transparent=kati<0.999; p.me.material.depthWrite=kati>0.5;
    p.me.material.color.copy(p.kil||KIL).lerp(p.gercek,e.renk);
    p.e.material.opacity=gor*lerp(0.95,0.0,e.kil)+ (e.renk<1?0.06*e.kil:0);

  else if(i===3){const t0=TEKNE[0];const z=t0.z0+ (T*3.2); bak(t0.x+24,lerp(14,9,k),z+lerp(30,18,k),t0.x,1.5,z)}

// ---------- hareket ----------
function hareket(T,i,q,d){
  const s=Z.sahneler, k=q/d;
  // tepe taşı: kancada kaybolur, finalde iner
  const kancaK=i===0?q/d:1;
  let ty=TEPE_Y, top=0;
  if(i===0){top=1-ease((kancaK-0.2)/0.3); ty=TEPE_Y+ease((kancaK-0.15)/0.45)*14}
  if(i===4){const iner=ease((k-0.55)/0.3); top=ease((k-0.48)/0.1); ty=lerp(TEPE_Y+16,TEPE_Y,iner)}
  tepe.position.set(0,ty,0); tepe.rotation.y=T*0.6; tepeM.opacity=top; tepe.visible=top>0.01; tepeM.emissiveIntensity=0.5+0.4*Math.sin(T*4);
  // karolar: sahne 3'te parlar, sonra Kahire'ye uçar
  const s3=s[2], q3=T-s3.bas, d3=s3.sure;
  for(const c of KAROLAR){const gor=ease((q3+0.0)/(d3*0.25))*(T>=s3.bas?1:0), uc=ease((q3-d3*(0.45+c.gec*0.25))/(d3*0.25));

    c.m.position.copy(c.p0).addScaledVector(c.dr,uc*40); c.m.rotation.copy(c.r0); c.m.rotation.z+=uc*3*c.gec}
  // tekneler kuzeye akar
  for(const t of TEKNE){t.grp.position.set(t.x,Math.sin(T*1.5+t.x)*0.15,t.z0+T*3.2);t.grp.rotation.z=Math.sin(T*1.2+t.x)*0.03}

  for(const w of ISCI){w.grp.position.y=Math.abs(Math.sin(T*5+w.faz))*0.18; w.grp.rotation.z=Math.sin(T*5+w.faz)*0.06}
}

  // filigran

}

  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();for(const [x,y] of [[x1,y1],[x2,y2]]){g.beginPath();g.moveTo(x-22,y);g.lineTo(x+22,y);g.stroke()}
  g.save();g.translate((x1+x2)/2-yan*60,(y1+y2)/2);g.rotate(-yan*Math.PI/2);kutu(-95,-34,190,68,12,'rgba(8,6,4,0.7)');yazi(metin,0,2,44,'#ffffff');g.restore();g.globalAlpha=1}
function kaplama(i,q,d,T){
