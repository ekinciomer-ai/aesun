<style>
:root{--k:#D7262E;--kk:#A8131B;--s:#2B2F35;--y:#5B6470;--z:#F4F5F7;--c:#E2E5EA;--b:#fff;--g:#F08A24;--m:#2a78d6;--ok:#1E9E5A;--mor:#7C3AED}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--s);background:var(--z);min-height:100vh}
.ust{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--b);border-bottom:1px solid var(--c)}
.ust a,.ust button{color:var(--s);text-decoration:none;font:inherit;background:none;border:0;cursor:pointer;padding:0}.ust a:hover,.ust button:hover{color:var(--k)}
.marka b{letter-spacing:.06em}.marka .m2{color:var(--k)}
main{max-width:1220px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}.alt{color:var(--y);font-size:13px;margin:2px 0 0}
.bas{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
select,input[type=date]{padding:8px 12px;border:1px solid #CCD2DA;border-radius:9px;font:inherit;background:#fff;color:var(--s);max-width:100%}
.btn{padding:7px 12px;border:1px solid #CCD2DA;border-radius:8px;background:#fff;color:var(--s);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--s)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.aktif{background:var(--s);color:#fff;border-color:var(--s)}
.kart{background:var(--b);border:1px solid var(--c);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.03)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:14px}
.kpi div{background:var(--b);border:1px solid var(--c);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.kpi div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kp-r,#CCD2DA)}
.kpi small{display:block;color:var(--y);font-size:12px}.kpi b{font-size:20px;font-variant-numeric:tabular-nums}.kpi i{font-style:normal;color:var(--y);font-size:12px;margin-left:3px}
.et{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#EEF0F3;font-weight:600}.et.ok{background:#E8F5EC;color:#1D6B36}.et.k{background:#FDECEC;color:#8E1117}.et.u{background:#FFF4DC;color:#9A5B00}.et.m{background:#EAF2FD;color:#1956A8}.et.mor{background:#F3E8FF;color:#6D28D9}
.sek{display:flex;gap:4px;background:#E9ECF0;padding:4px;border-radius:10px;width:max-content;max-width:100%;margin-bottom:14px;flex-wrap:wrap}.sek button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--y);padding:6px 12px;border-radius:7px;cursor:pointer}.sek button.on{background:#fff;color:var(--s);box-shadow:0 1px 2px rgba(0,0,0,.06)}
svg{display:block;width:100%;height:auto}
.hata{background:#FDECEC;color:#8E1117;border-radius:9px;padding:12px}
.bos{color:var(--y);padding:24px;text-align:center}
.tablo-kutu{overflow-x:auto;border:1px solid var(--c);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--c);white-space:nowrap}
th{color:var(--y);font-size:12px;background:#F8F9FB;font-weight:600}
th.sol,td.sol{text-align:left}
td.sifir{color:#9AA6B5}
tr.top td{font-weight:700;border-top:2px solid #CCD2DA;background:#F5F7FA}
.ayr{border-left:1px solid var(--c)}
.tip{position:fixed;pointer-events:none;background:var(--s);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;display:none;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.18);max-width:340px}

/* Şematik Enerji Akışı & Proje Günlük Grafik Kartları */
@keyframes akis{to{stroke-dashoffset:-28}}

.sema-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:12px;margin-top:12px}
.oran-kutu{background:#F8F9FB;border:1px solid var(--c);border-radius:11px;padding:12px 14px}
.oran-bas{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}
.bar-dis{height:10px;background:#E2E5EA;border-radius:99px;overflow:hidden;display:flex;position:relative}
.bar-ic{height:100%;border-radius:99px;transition:width .3s}
.inv-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px;margin:10px 0 18px}

.reak-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.proje-sekmeler{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.proje-sekme{padding:8px 14px;border:1px solid var(--c);border-radius:10px;background:#fff;color:var(--s);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.proje-sekme:hover{border-color:#9AA6B5}
.proje-sekme.on{background:var(--s);color:#fff;border-color:var(--s);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.proje-grafik-kutu{background:#F8FAFC;border:1px solid var(--c);border-radius:13px;padding:14px 16px;margin-bottom:14px}
.proje-grafik-kutu.secili{border-color:#2a78d6;box-shadow:0 0 0 2px rgba(42,120,214,.12)}
.proje-ozet-serit{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin:10px 0 12px}
.proje-ozet-huc{background:#fff;border:1px solid var(--c);border-radius:9px;padding:8px 11px}
.proje-ozet-huc small{display:block;font-size:11.5px;color:var(--y)}
.proje-ozet-huc b{font-size:15.5px;font-variant-numeric:tabular-nums}

<script>
// Müşteri Monitoring — Her Proje İçin Günlük Üretim & Tüketim Grafiği + Şematik Enerji Akışı + Saatlik OSOS & İnverter Paneli.
const API = 'https://api.aksarayenerji.net/v1/musteri', te = new TextEncoder(), $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
const nf = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('tr-TR', { maximumFractionDigits: d, minimumFractionDigits: d });
const AYLAR = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const AYLAR_UZUN = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const RENK = ['#2a78d6', '#F08A24', '#1E9E5A', '#7C3AED', '#2B2F35'];
let S = null, BEL = {}, SANT = [], SEC = null, GRAF = null, SEC_GUN = null, TUM_ACIK = true, GUNLUK_BELLEK = {};

function oturum() { try { const o = JSON.parse(localStorage.getItem('ae_portal') || 'null'); return o && o.S && Date.now() < (o.son || 0) ? o.S : null; } catch (e) { return null; } }
async function belirtecler() {
  if (S.ka) return { '*': await sha('aesun-api|yonetici|' + S.ka) };
  const b = {}; for (const [sid, m] of Object.entries(S.musteri || {})) b[sid] = await sha('aesun-api|ms_' + sid + '|' + m.k); return b;
}
const bel = sid => BEL['*'] || BEL[sid];
async function al(url, b) { const r = await fetch(url, { headers: { 'X-AE-Anahtar': b }, cache: 'no-store' }); if (r.status === 404) return null; if (!r.ok) throw new Error('Sunucu yanıtı: ' + r.status); return r.json(); }
async function liste() {
  const out = {}, ek = {};
  for (const b of new Set(Object.values(BEL))) { const d = await al(API + '/liste', b); (d && d.santraller || []).forEach(s => out[s.sid] = s); if (d && d.toplayici) ek.toplayici = d.toplayici; }
  return [Object.values(out).sort((a, b) => String(a.ad).localeCompare(String(b.ad), 'tr')), ek.toplayici];
}
const invVar = s => !!(s && (s.inverter_var || (s.kaynak !== 'ace' && s.kapasite_kwp != null)));
const sayacVar = s => !!(s && (s.sayac_var || s.kaynak === 'ace' || s.sayac));
const durumEt = s => !invVar(s) ? '<span class="et u">İnverter bekleniyor</span>' : s.iletisim === 'ALL_OFFLINE' ? '<span class="et k">İnverter çevrimdışı</span>' : s.iletisim === 'PARTIAL_OFFLINE' ? '<span class="et u">Kısmen çevrimdışı</span>' : '<span class="et ok">İnverter normal</span>';
const zaman = t => t ? new Date(t * 1000).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const tarihK = g => { if (!g) return '—'; const [y, a, d] = g.split('-').map(Number); return d + ' ' + AYLAR[a - 1]; };
const tk = (x, sn) => (((x || {}).tuk || {})[sn] || {}).kwh;

function hucreBar(v, var_, mx, renk, h = 2, ekSinif = '') {
  if (!var_ || v == null) return `<td class="sifir${ekSinif ? ' ' + ekSinif : ''}">—</td>`;
  const sifirMi = Math.round(v * 100) === 0;
  const oran = !sifirMi && mx > 0 ? Math.min(100, Math.round((v / mx) * 100)) : 0;
  const st = oran > 0 ? ` style="background:linear-gradient(90deg, ${renk}22 ${oran}%, transparent ${oran}%)"` : '';
  const cls = [sifirMi ? 'sifir' : '', ekSinif].filter(Boolean).join(' ');
  return `<td${cls ? ` class="${cls}"` : ''}${st}>${nf(v, h)}</td>`;
}

// ---- HER PROJE İÇİN GÜNLÜK ÜRETİM VE TÜKETİM VERİSİNİ BİRLEŞTİREN TOPLAYICI ----
async function projeGunlukVeriAl(s) {
  const n = new Date(), y = n.getFullYear(), a = String(n.getMonth() + 1).padStart(2, '0'), b = bel(s.sid), sy = s.sayac || {};
  const ts = sy.tuketim_sn || [];
  const [invAy, sayacAy, osf] = await Promise.all([
    invVar(s) ? al(`${API}/${s.sid}/ay_${y}${a}.json`, b).catch(() => null) : Promise.resolve(null),
    sayacVar(s) ? al(`${API}/${s.sid}/${invVar(s) ? 'sayac_ay_' : 'ay_'}${y}${a}.json`, b).catch(() => null) : Promise.resolve(null),
    sayacVar(s) ? al(`${API}/${s.sid}/osf07_${y}${a}.json`, b).catch(() => null) : Promise.resolve(null)
  ]);

  const invMap = Object.fromEntries((invAy || []).map(x => [Number(x.g), Number(x.kwh) || 0]));
  const sayMap = Object.fromEntries((sayacAy || []).map(x => [Number(x.g), x]));

  // OSF-07 saatlik rapordan günlük toplamları da çıkar (eksik gün varsa tamamlar)
  const osfGunUretim = {}, osfGunTuk = {}, osfGunVeris = {}, osfSayacTuk = {};
  const sayacMap = (osf && osf.sayaclar) ? osf.sayaclar : (osf && osf.saatler ? { [osf.sayac_seri_no || s.sid]: osf } : {});
  const snList = Object.keys(sayacMap);
  const gesVarMi = snList.some(sn => {
    const sm = sayacMap[sn];
    const ad = sm.abone_adi || sm.santral_adi || '';
    return !!sm.ges_cekiste || (/GES/i.test(ad) && (sm.toplam_veris_kwh || 0) === 0 && (sm.toplam_cekis_kwh || 0) > 0);
  });

  for (const sn of snList) {
    const sm = sayacMap[sn];
    const ad = sm.abone_adi || sm.santral_adi || '';
    const gesMi = !!sm.ges_cekiste || (/GES/i.test(ad) && (sm.toplam_veris_kwh || 0) === 0 && (sm.toplam_cekis_kwh || 0) > 0);
    const gs = sm.gun_saat || {};
    for (const [gStr, saatler] of Object.entries(gs)) {
      if (!gStr.startsWith(`${y}-${a}-`)) continue;
      const gNo = Number(gStr.slice(8));
      let u = 0, v = 0, c = 0;
      for (const st of Object.values(saatler || {})) {
        if (gesMi) u += (st.cekis || st.veris || 0);
        else { v += (st.veris || 0); c += (st.cekis || 0); }
      }
      if (gesMi) osfGunUretim[gNo] = (osfGunUretim[gNo] || 0) + u;
      else {
        osfGunVeris[gNo] = (osfGunVeris[gNo] || 0) + v;
        osfGunTuk[gNo] = (osfGunTuk[gNo] || 0) + c;
        (osfSayacTuk[sn] = osfSayacTuk[sn] || {})[gNo] = c;
        if (!gesVarMi) osfGunUretim[gNo] = (osfGunUretim[gNo] || 0) + v;
      }
    }
  }

  const gunSet = [...new Set([
    ...Object.keys(invMap).map(Number),
    ...Object.keys(sayMap).map(Number),
    ...Object.keys(osfGunUretim).map(Number),
    ...Object.keys(osfGunTuk).map(Number)
  ])].filter(g => g >= 1 && g <= 31).sort((p, q) => p - q);

  const satirlar = gunSet.map(g => {
    const sm = sayMap[g] || {};
    const invKwh = invMap[g] != null ? invMap[g] : null;
    const sayUretim = sm.kwh != null ? Number(sm.kwh) : (osfGunUretim[g] != null ? osfGunUretim[g] : null);
    let topTuk = 0;
    const tukDetay = {};
    if (ts.length) {
      ts.forEach(sn => {
        const v = tk(sm, sn) != null ? Number(tk(sm, sn)) : ((osfSayacTuk[sn] || {})[g] || 0);
        tukDetay[sn] = v;
        topTuk += v;
      });
    } else if (osfGunTuk[g] != null) {
      topTuk = osfGunTuk[g];
    }
    const verisKwh = sm.veris ? Object.values(sm.veris).reduce((a, b) => a + (Number(b) || 0), 0) : (osfGunVeris[g] || 0);
    const uretimAna = sayacVar(s) && sayUretim != null ? sayUretim : (invKwh || 0);
    return {
      g,
      tarih: `${y}-${a}-${String(g).padStart(2, '0')}`,
      etiket: `${g} ${AYLAR[n.getMonth()]}`,
      inv_kwh: invKwh,
      sayac_uretim_kwh: sayUretim,
      uretim_kwh: uretimAna,
      tuketim_kwh: topTuk,
      veris_kwh: verisKwh,
      tuk_detay: tukDetay
    };
  });

  return { y, a: Number(a), aKod: a, satirlar, ts, uretimSn: sy.uretim_sn || s.sid };
}

function projeGunSec(sid, tarih) {
  SEC = sid;
  SEC_GUN = tarih;
  GRAF = 'saatlik';
  ciz();
  const el = $('graf');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---- PROJE BAZLI GÜNLÜK ÜRETİM VE TÜKETİM GRAFİĞİ ÇİZİCİ ----
function cizProjeGunlukGrafikKart(s, veri, kompakt = false) {
  const satirlar = (veri && veri.satirlar) || [];
  const sy = s.sayac || {}, ts = (veri && veri.ts) || sy.tuketim_sn || [];
  const uretimSn = (veri && veri.uretimSn) || sy.uretim_sn || s.sid;
  const ayAd = AYLAR_UZUN[((veri && veri.a) || (new Date().getMonth() + 1)) - 1];
  const yil = (veri && veri.y) || new Date().getFullYear();

  const topInv = satirlar.reduce((t, r) => t + (r.inv_kwh || 0), 0);
  const topSayUretim = satirlar.reduce((t, r) => t + (r.sayac_uretim_kwh || 0), 0);
  const topUretim = sayacVar(s) && topSayUretim > 0 ? topSayUretim : (topInv || topSayUretim);
  const topTuk = satirlar.reduce((t, r) => t + (r.tuketim_kwh || 0), 0);
  const topVeris = satirlar.reduce((t, r) => t + (r.veris_kwh || 0), 0);
  const gunSayisi = Math.max(1, satirlar.length);
  const ortUretim = topUretim / gunSayisi;
  const ortTuk = topTuk / gunSayisi;
  const karsilama = topTuk > 0 ? (topUretim / topTuk) * 100 : (topUretim > 0 ? 100 : 0);
  const netFark = topUretim - topTuk;

  // Serileri oluştur
  const seriler = [];
  if (invVar(s) && satirlar.some(r => (r.inv_kwh || 0) > 0)) {
    seriler.push({ ad: '☀️ İnverter Günlük Üretim', kisa: 'İnverter Üretim', renk: '#F08A24', v: satirlar.map(r => r.inv_kwh || 0) });
  }
  if (sayacVar(s)) {
    seriler.push({ ad: `📟 GES Sayaç Günlük Üretim (#${uretimSn})`, kisa: 'GES Sayaç Üretim', renk: '#1E9E5A', v: satirlar.map(r => r.sayac_uretim_kwh || 0) });
    if (ts.length > 1) {
      ts.forEach((sn, idx) => {
        seriler.push({ ad: `🏭 Fabrika Günlük Tüketim (#${sn})`, kisa: `Tüketim #${sn}`, renk: idx === 0 ? '#2a78d6' : '#2B2F35', v: satirlar.map(r => (r.tuk_detay || {})[sn] || 0) });
      });
    } else {
      seriler.push({ ad: `🏭 Fabrika Günlük Tüketim${ts[0] ? ' (#' + ts[0] + ')' : ''}`, kisa: 'Fabrika Tüketim', renk: '#2a78d6', v: satirlar.map(r => r.tuketim_kwh || 0) });
    }
    if (satirlar.some(r => (r.veris_kwh || 0) > 0) && topVeris !== topSayUretim) {
      seriler.push({ ad: '⚡ Şebekeye Günlük Veriş', kisa: 'Şebekeye Veriş', renk: '#7C3AED', v: satirlar.map(r => r.veris_kwh || 0) });
    }
  }

  let svgHtml = '<div class="bos">Bu ay için günlük üretim/tüketim verisi henüz oluşmadı.</div>';
  if (satirlar.length && seriler.length) {
    const W = 920, H = kompakt ? 235 : 275, P = 56;
    const aktifSeriler = seriler.filter(sr => sr.v.some(v => v > 0));
    const cizSeriler = aktifSeriler.length ? aktifSeriler : seriler;
    const n = Math.max(cizSeriler.length, 1);
    const mx = Math.max(1, ...cizSeriler.flatMap(sr => sr.v.map(v => v || 0))) * 1.12;
    const bw = (W - P - 12) / satirlar.length;
    const cizH = H - 58;
    const altY = H - 42;

    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = (mx / 4) * i;
      const yy = altY - (v / mx) * cizH;
      g += `<line x1="${P}" x2="${W - 10}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#E2E5EA"/>`
        + `<text x="${P - 6}" y="${(yy + 4).toFixed(1)}" font-size="11" fill="#5B6470" text-anchor="end">${nf(v, 0)}</text>`;
    }

    // Günlük ortalama üretim kesikli referans çizgisi
    if (ortUretim > 0) {
      const ortY = altY - (ortUretim / mx) * cizH;
      g += `<line x1="${P}" x2="${W - 10}" y1="${ortY.toFixed(1)}" y2="${ortY.toFixed(1)}" stroke="#1E9E5A" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/>`
        + `<text x="${W - 12}" y="${Math.max(14, ortY - 4).toFixed(1)}" font-size="10" fill="#1D6B36" font-weight="600" text-anchor="end">Ort. Üretim: ${nf(ortUretim, 0)} kWh/gün</text>`;
    }

    satirlar.forEach((r, i) => {
      const gw = (bw * 0.82) / n;
      const gunOran = r.tuketim_kwh > 0 ? `%${nf((r.uretim_kwh / r.tuketim_kwh) * 100, 0)} karşılama` : '';
      const ortBilgi = `${r.etiket} ${yil} · Üretim: ${nf(r.uretim_kwh, 1)} kWh`
        + (sayacVar(s) ? ` · Tüketim: ${nf(r.tuketim_kwh, 1)} kWh` : '')
        + (gunOran ? ` (${gunOran})` : '');

      // Arka plan seçim şeridi (tıklanabilir)
      g += `<rect x="${(P + i * bw).toFixed(1)}" y="14" width="${bw.toFixed(1)}" height="${cizH}" fill="transparent" style="cursor:pointer" data-t="${esc(ortBilgi)}" onclick="projeGunSec('${esc(s.sid)}','${r.tarih}')"/>`;

      cizSeriler.forEach((sr, j) => {
        const v = sr.v[i] || 0;
        const h = (v / mx) * cizH;
        const xx = P + i * bw + bw * 0.09 + j * gw;
        const yy = altY - h;
        const tipMetin = `${r.etiket} ${yil} · ${sr.kisa}: ${nf(v, 2)} kWh`
          + (sayacVar(s) ? ` (Üretim: ${nf(r.uretim_kwh, 1)} / Tüketim: ${nf(r.tuketim_kwh, 1)} kWh)` : '');
        g += `<rect x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(gw - 1.2, 1.5).toFixed(1)}" height="${Math.max(h, v > 0 ? 2 : 0).toFixed(1)}" rx="2" fill="${sr.renk}" style="cursor:pointer" data-t="${esc(tipMetin)}" onclick="projeGunSec('${esc(s.sid)}','${r.tarih}')"/>`;
      });

      g += `<text x="${(P + i * bw + bw / 2).toFixed(1)}" y="${H - 25}" font-size="${satirlar.length > 22 ? '10' : '11'}" fill="#2B2F35" font-weight="600" text-anchor="middle">${r.g}</text>`;
    });

    let lx = P;
    cizSeriler.forEach(sr => {
      g += `<rect x="${lx}" y="${H - 13}" width="11" height="11" rx="2.5" fill="${sr.renk}"/>`
        + `<text x="${lx + 15}" y="${H - 4}" font-size="11.5" font-weight="600" fill="#2B2F35">${esc(sr.ad)}</text>`;
      lx += 30 + sr.ad.length * 6.6;
    });

    svgHtml = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.ad)} günlük üretim ve tüketim grafiği">${g}<text x="${P}" y="12" font-size="11" font-weight="600" fill="#5B6470">Günlük Enerji (kWh) — ${esc(ayAd)} ${yil}</text></svg>`;
  }

  return `<div class="proje-grafik-kutu${s.sid === SEC && kompakt ? ' secili' : ''}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">

        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

          ${sayacVar(s) ? `<span class="et ok">Üretim #${esc(uretimSn)}</span>` : ''}
          ${ts.length ? `<span class="et m">Tüketim #${ts.map(esc).join(', #')}</span>` : ''}

      </div>
      ${kompakt && SANT.length > 1 ? `<button class="btn${s.sid === SEC ? ' aktif' : ''}" type="button" onclick="SEC='${esc(s.sid)}';ciz()">${s.sid === SEC ? '✓ Seçili Proje' : 'Projeyi Aç ▸'}</button>` : ''}
    </div>

      </div>
      ${sayacVar(s) ? `<div class="proje-ozet-huc" style="border-left:4px solid #2a78d6">
        <small>🔵 Bu Ay Toplam Tüketim</small>
        <b>${nf(topTuk, 0)} kWh</b> <small style="display:inline">(${nf(topTuk / 1000, 2)} MWh)</small>
        <small>Günlük Ort: <b>${nf(ortTuk, 0)} kWh/gün</b></small>

      <div class="proje-ozet-huc" style="border-left:4px solid #F08A24">

        <small>${karsilama >= 100 ? 'Üretim tüketimi fazlasıyla karşıladı' : 'Tüketimin GES ile karşılanan payı'}</small>

// Tüm projelerin günlük üretim & tüketim grafiklerini yükleyip çizen pano
async function tumProjelerGunlukCiz() {
  const kutu = $('tum_projeler_grafik');
  if (!kutu) return;
  try {
    const sonuclar = await Promise.all(SANT.map(async s => {
      if (!GUNLUK_BELLEK[s.sid]) GUNLUK_BELLEK[s.sid] = await projeGunlukVeriAl(s);
      return [s, GUNLUK_BELLEK[s.sid]];
    }));
    kutu.innerHTML = sonuclar.map(([s, v]) => cizProjeGunlukGrafikKart(s, v, true)).join('');
  } catch (e) {
    kutu.innerHTML = '<div class="hata">' + esc(e.message) + '</div>';
  }
}

function cizgi(noktalar, kap, baslik = 'Gün içi güç eğrisi (kW)') {
  if (!noktalar || !noktalar.length) return '<div class="bos">Bugün için 5 dakikalık güç verisi yok.</div>';
  const W = 900, H = 260, P = 46, gun = new Date(noktalar[0].t * 1000); gun.setHours(0, 0, 0, 0); const t0 = gun.getTime() / 1000 + 5 * 3600, t1 = t0 + 15 * 3600;
  const mx = Math.max(kap || 0, ...noktalar.map(n => (n.w || 0) / 1000)) * 1.05 || 1;
  const x = t => P + (Math.min(Math.max(t, t0), t1) - t0) / (t1 - t0) * (W - P - 8), y = v => H - 24 - v / mx * (H - 40);
  const yol = noktalar.map((n, i) => (i ? 'L' : 'M') + x(n.t).toFixed(1) + ' ' + y((n.w || 0) / 1000).toFixed(1)).join('');
  let g = ''; for (let h = 6; h <= 18; h += 2) { const xx = x(t0 + (h - 5) * 3600); g += `<line x1="${xx}" x2="${xx}" y1="10" y2="${H - 24}" stroke="#E2E5EA"/><text x="${xx}" y="${H - 6}" font-size="11" fill="#5B6470" text-anchor="middle">${String(h).padStart(2, '0')}:00</text>`; }
  for (let i = 0; i <= 4; i++) { const v = mx / 4 * i, yy = y(v); g += `<line x1="${P}" x2="${W - 8}" y1="${yy}" y2="${yy}" stroke="#F0F2F5"/><text x="${P - 6}" y="${yy + 4}" font-size="11" fill="#5B6470" text-anchor="end">${nf(v)}</text>`; }
  const son = noktalar[noktalar.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(baslik)}">${g}<path d="${yol}L${x(son.t)} ${H - 24}L${x(noktalar[0].t)} ${H - 24}Z" fill="#F08A24" opacity=".16"/><path d="${yol}" fill="none" stroke="#F08A24" stroke-width="2.4" stroke-linejoin="round"/><text x="${P}" y="12" font-size="11" fill="#5B6470">kW</text></svg>`;
}

function cubukN(eti, seriler, baslik) {
  const aktifSeriler = seriler.filter(s => s.v && s.v.some(v => v != null && v > 0));
  const cizSeriler = aktifSeriler.length ? aktifSeriler : seriler;
  if (!eti.length) return '<div class="bos">Veri yok.</div>';
  const W = 900, H = 275, P = 54, n = Math.max(cizSeriler.length, 1), mx = Math.max(1, ...cizSeriler.flatMap(s => s.v.map(v => v || 0))) * 1.1, bw = (W - P - 8) / eti.length;
  let g = ''; for (let i = 0; i <= 4; i++) { const v = mx / 4 * i, yy = H - 42 - v / mx * (H - 58); g += `<line x1="${P}" x2="${W - 8}" y1="${yy}" y2="${yy}" stroke="#E2E5EA"/><text x="${P - 6}" y="${yy + 4}" font-size="11" fill="#5B6470" text-anchor="end">${nf(v)}</text>`; }
  eti.forEach((d, i) => {
    const gw = bw * .8 / n;
    cizSeriler.forEach((s, j) => { const v = s.v[i] || 0, h = v / mx * (H - 58), xx = P + i * bw + bw * .1 + j * gw; g += `<rect x="${xx.toFixed(1)}" y="${(H - 42 - h).toFixed(1)}" width="${Math.max(gw - 1, 1).toFixed(1)}" height="${h.toFixed(1)}" rx="1.8" fill="${s.renk || RENK[j % RENK.length]}" data-t="${esc(d.e)} · ${esc(s.ad)}: ${nf(v, 2)} kWh"/>`; });
    if (eti.length <= 14 || i % 2 === 0) g += `<text x="${(P + i * bw + bw / 2).toFixed(1)}" y="${H - 25}" font-size="10.5" fill="#5B6470" text-anchor="middle">${esc(d.k)}</text>`;
  });
  let lx = P; cizSeriler.forEach((s, j) => { const rk = s.renk || RENK[j % RENK.length]; g += `<rect x="${lx}" y="${H - 13}" width="10" height="10" rx="2" fill="${rk}"/><text x="${lx + 14}" y="${H - 4}" font-size="11.5" font-weight="600" fill="#2B2F35">${esc(s.ad)}</text>`; lx += 28 + s.ad.length * 6.8; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(baslik)}">${g}<text x="${P}" y="12" font-size="11" fill="#5B6470">kWh</text></svg>`;
}

// 5 dk inverter güç kayıtlarından (gun_YYYYMMDD.json) saatlik (00..23) kWh üretimi hesaplar
function invSaatlikHesapla(noktalar) {
  if (!noktalar || !noktalar.length) return null;
  const kovalar = {};
  for (const n of noktalar) {
    if (!n || !n.t) continue;
    const d = new Date((n.t + 3 * 3600) * 1000);
    const h = String(d.getUTCHours()).padStart(2, '0');
    (kovalar[h] = kovalar[h] || []).push(Math.max(0, Number(n.w) || 0) / 1000);
  }
  const out = {};
  for (const [h, arr] of Object.entries(kovalar)) {
    out[h] = arr.reduce((a, b) => a + b, 0) / arr.length;
  }
  return Object.keys(out).length ? out : null;
}

async function cizSaatlikOsos(s, el, b) {
  const simdi = new Date(), y = simdi.getFullYear(), a = String(simdi.getMonth() + 1).padStart(2, '0');
  const [osf, invAy, sayacAy] = await Promise.all([
    al(`${API}/${s.sid}/osf07_${y}${a}.json`, b),
    invVar(s) ? al(`${API}/${s.sid}/ay_${y}${a}.json`, b) : Promise.resolve(null),
    al(`${API}/${s.sid}/${invVar(s) ? 'sayac_ay_' : 'ay_'}${y}${a}.json`, b)
  ]);

  const sayacMap = (osf && osf.sayaclar) ? osf.sayaclar : (osf && osf.saatler ? { [osf.sayac_seri_no || s.sid]: osf } : {});
  const snList = Object.keys(sayacMap);
  if (!snList.length) {
    el.innerHTML = '<div class="bos">Bu santral için saatlik sayaç (OSOS) verisi henüz oluşmadı.</div>';
    return;
  }

  const tumGunler = [...new Set(snList.flatMap(sn => Object.keys(sayacMap[sn].gun_saat || {})))].sort();
  if (!tumGunler.length) {
    const sonOkumaGun = (osf.son_okuma && osf.son_okuma.gun) || simdi.getDate();
    for (let d = 1; d <= sonOkumaGun; d++) {
      const gStr = `${y}-${a}-${String(d).padStart(2, '0')}`;
      tumGunler.push(gStr);
      for (const sn of snList) {
        const sm = sayacMap[sn];
        sm.gun_saat = sm.gun_saat || {};
        sm.gun_saat[gStr] = sm.gun_saat[gStr] || {};
        for (const st of (sm.saatler || [])) {
          const hKod = String(st.saat || '00').slice(0, 2);
          const hs = sm.gun_saat[gStr][hKod] = sm.gun_saat[gStr][hKod] || { veris: 0, cekis: 0 };
          hs[st.yon === 'Veriş' ? 'veris' : 'cekis'] = (st.gunler || [])[d - 1] || 0;
        }
      }
    }
  }

  const sonG = tumGunler[tumGunler.length - 1];
  if (!SEC_GUN || !tumGunler.includes(SEC_GUN)) SEC_GUN = sonG;
  const ix = tumGunler.indexOf(SEC_GUN);
  const [gy, ga, gd] = SEC_GUN.split('-').map(Number);
  const gunAdi = GUNLER[new Date(Date.UTC(gy, ga - 1, gd)).getUTCDay()];

  const gunDosya = SEC_GUN.replace(/-/g, '');
  const invGunNoktalar = invVar(s) ? await al(`${API}/${s.sid}/gun_${gunDosya}.json`, b) : null;
  const invSaat = invSaatlikHesapla(invGunNoktalar);

  let th1 = '<th class="sol" rowspan="2">Saat</th>';
  let th2 = '';
  th1 += `<th class="ayr" style="text-align:center" rowspan="2" title="İnverter saatlik üretimi">${invVar(s) ? '☀️ İnverter<br><small>(kWh)</small>' : '☀️ İnverter<br><small>(Bekleniyor)</small>'}</th>`;

  for (const sn of snList) {
    const sm = sayacMap[sn];
    const ad = sm.abone_adi || sm.santral_adi || ('Sayaç ' + sn);
    const gesMi = !!sm.ges_cekiste || (/GES/i.test(ad) && (sm.toplam_veris_kwh || 0) === 0 && (sm.toplam_cekis_kwh || 0) > 0);
    sm._gesMi = gesMi;
    if (gesMi) {
      th1 += `<th class="ayr" style="text-align:center" colspan="1"><span style="color:#1E9E5A">●</span> <b>${esc(sn)}</b> · ${esc(ad)}</th>`;
      th2 += `<th class="ayr" title="GES Üretim Sayacı">📟 Sayaç Üretim (kWh)</th>`;
    } else {
      th1 += `<th class="ayr" style="text-align:center" colspan="2"><span style="color:#2a78d6">●</span> <b>${esc(sn)}</b> · ${esc(ad)}</th>`;
      th2 += `<th class="ayr" title="Şebekeye Veriş (Üretim Fazlası)">⚡ Şebekeye Veriş (kWh)</th><th title="Şebekeden Çekiş (Tüketim)">🏭 Tüketim / Çekiş (kWh)</th>`;
    }
  }
  th1 += `<th class="ayr" style="text-align:center" rowspan="2" title="İnverter üretimi − Sayaç üretimi">İç Tük. / Fark<br><small>(kWh)</small></th>`;

  const saatEti = [];
  const seriInv = [], seriSayacU = [], seriTuk = [], seriVeris = [];
  let mxSaatDeger = 1;

  for (let h = 0; h < 24; h++) {
    const hKod = String(h).padStart(2, '0');
    saatEti.push({ e: `${hKod}:00 - ${String((h + 1) % 24).padStart(2, '0')}:00`, k: `${hKod}:00` });
    const iv = invSaat && invSaat[hKod] != null ? invSaat[hKod] : 0;
    let sU = 0, sT = 0, sV = 0;
    for (const sn of snList) {
      const sm = sayacMap[sn];
      const rec = ((sm.gun_saat || {})[SEC_GUN] || {})[hKod];
      if (sm._gesMi) {
        sU += rec ? (rec.cekis || rec.veris || 0) : 0;
      } else {
        const v = rec ? (rec.veris || 0) : 0;
        const c = rec ? (rec.cekis || 0) : 0;
        if (!snList.some(k => sayacMap[k]._gesMi)) sU += v;
        sV += v;
        sT += c;
      }
    }
    seriInv.push(iv);
    seriSayacU.push(sU);
    seriTuk.push(sT);
    seriVeris.push(sV);
    mxSaatDeger = Math.max(mxSaatDeger, iv, sU, sT, sV);
  }

  let topInv = 0, topSayacUretim = 0, topSebekeVeris = 0, topTuketim = 0, topFark = 0;
  const sayacTop = Object.fromEntries(snList.map(sn => [sn, { u: 0, v: 0, c: 0 }]));
  let satirlar = '';

  for (let h = 0; h < 24; h++) {
    const hKod = String(h).padStart(2, '0');
    const saatEtiket = `${hKod}:00 - ${String((h + 1) % 24).padStart(2, '0')}:00`;
    const iv = invSaat && invSaat[hKod] != null ? invSaat[hKod] : null;
    if (iv != null) topInv += iv;

    let saatUretim = 0;
    let hucreler = '';
    for (const sn of snList) {
      const sm = sayacMap[sn];
      const rec = ((sm.gun_saat || {})[SEC_GUN] || {})[hKod];
      const var_ = !!rec;
      if (sm._gesMi) {
        const u = rec ? (rec.cekis || rec.veris || 0) : 0;
        sayacTop[sn].u += u;
        saatUretim += u;
        topSayacUretim += u;
        hucreler += hucreBar(u, var_, mxSaatDeger, '#1E9E5A', 2, 'ayr');
      } else {
        const v = rec ? (rec.veris || 0) : 0;
        const c = rec ? (rec.cekis || 0) : 0;
        sayacTop[sn].v += v;
        sayacTop[sn].c += c;
        if (!snList.some(k => sayacMap[k]._gesMi)) {
          saatUretim += v;
          topSayacUretim += v;
        }
        topSebekeVeris += v;
        topTuketim += c;
        hucreler += hucreBar(v, var_, mxSaatDeger, '#7C3AED', 2, 'ayr') + hucreBar(c, var_, mxSaatDeger, '#2a78d6', 2);
      }
    }

    const fark = iv != null ? Math.max(0, iv - saatUretim) : null;
    if (fark != null) topFark += fark;

    satirlar += `<tr><td class="sol" style="font-weight:600">${saatEtiket}</td>`
      + hucreBar(iv, iv != null, mxSaatDeger, '#F08A24', 2, 'ayr')
      + hucreler
      + hucreBar(fark, fark != null, mxSaatDeger, '#8A94A3', 2, 'ayr')
      + `</tr>`;
  }

  let topHucreler = '';
  for (const sn of snList) {
    const sm = sayacMap[sn];
    if (sm._gesMi) {
      topHucreler += `<td class="ayr">${nf(sayacTop[sn].u, 2)}</td>`;
    } else {
      topHucreler += `<td class="ayr">${nf(sayacTop[sn].v, 2)}</td><td>${nf(sayacTop[sn].c, 2)}</td>`;
    }
  }
  satirlar += `<tr class="top"><td class="sol">Toplam (24 Saat)</td><td class="ayr">${invSaat ? nf(topInv, 2) : '—'}</td>${topHucreler}<td class="ayr">${invSaat ? nf(topFark, 2) : '—'}</td></tr>`;

  const saatlikGrafSeriler = [];
  if (invSaat) saatlikGrafSeriler.push({ ad: 'İnverter Üretimi', renk: '#F08A24', v: seriInv });
  saatlikGrafSeriler.push({ ad: 'GES Sayaç Üretimi', renk: '#1E9E5A', v: seriSayacU });
  if (seriTuk.some(v => v > 0)) saatlikGrafSeriler.push({ ad: 'Fabrika Tüketimi (Çekiş)', renk: '#2a78d6', v: seriTuk });
  if (seriVeris.some(v => v > 0) && snList.some(k => sayacMap[k]._gesMi)) saatlikGrafSeriler.push({ ad: 'Şebekeye Veriş', renk: '#7C3AED', v: seriVeris });
  const saatlikGrafikHtml = cubukN(saatEti, saatlikGrafSeriler, `${gd} ${AYLAR_UZUN[ga - 1]} 24 saatlik üretim ve tüketim profili`);

  const invGunMap = Object.fromEntries((invAy || []).map(x => [x.g, x.kwh]));
  const buAyKod = `${y}-${a}`;
  const buAyGunler = tumGunler.filter(g => g.startsWith(buAyKod));
  let gunSatirlar = '';
  let ayTopInv = 0, ayTopSayacU = 0, ayTopVeris = 0, ayTopTuk = 0;

  for (const gStr of buAyGunler) {
    const gNo = Number(gStr.slice(8));
    const ig = invGunMap[gNo] != null ? invGunMap[gNo] : null;
    let gUretim = 0, gVeris = 0, gTuk = 0;
    for (const sn of snList) {
      const sm = sayacMap[sn];
      const saatMap = (sm.gun_saat || {})[gStr] || {};
      for (const st of Object.values(saatMap)) {
        if (sm._gesMi) gUretim += (st.cekis || st.veris || 0);
        else { gVeris += (st.veris || 0); gTuk += (st.cekis || 0); }
      }
    }
    if (!snList.some(k => sayacMap[k]._gesMi)) gUretim = gVeris;
    if (ig != null) ayTopInv += ig;
    ayTopSayacU += gUretim;
    ayTopVeris += gVeris;
    ayTopTuk += gTuk;
    const gFark = ig != null ? (ig - gUretim) : null;
    const gOran = gTuk > 0 ? (gUretim / gTuk) * 100 : (gUretim > 0 ? 100 : 0);
    gunSatirlar += `<tr style="${gStr === SEC_GUN ? 'background:#EEF3FA;font-weight:600' : ''};cursor:pointer" onclick="SEC_GUN='${gStr}';ciz()">`
      + `<td class="sol"><span style="color:#2a78d6">▸</span> ${tarihK(gStr)}</td>`
      + `<td class="ayr">${ig != null ? nf(ig, 2) : '—'}</td>`
      + `<td style="color:#1D6B36;font-weight:600">${nf(gUretim, 2)}</td>`
      + `<td>${nf(gVeris, 2)}</td>`
      + `<td style="color:#1956A8;font-weight:600">${nf(gTuk, 2)}</td>`
      + `<td class="ayr"><span class="et ${gOran >= 100 ? 'ok' : (gOran >= 50 ? 'm' : 'u')}">%${nf(gOran, 0)}</span></td>`
      + `<td class="ayr">${gFark != null ? nf(gFark, 2) : '—'}</td></tr>`;
  }
  const ayOran = ayTopTuk > 0 ? (ayTopSayacU / ayTopTuk) * 100 : 0;
  gunSatirlar += `<tr class="top"><td class="sol">${AYLAR_UZUN[Number(a) - 1]} Toplamı</td><td class="ayr">${invVar(s) && ayTopInv > 0 ? nf(ayTopInv, 2) : '—'}</td><td>${nf(ayTopSayacU, 2)}</td><td>${nf(ayTopVeris, 2)}</td><td>${nf(ayTopTuk, 2)}</td><td class="ayr"><span class="et ${ayOran >= 100 ? 'ok' : 'm'}">%${nf(ayOran, 1)}</span></td><td class="ayr">${invVar(s) && ayTopInv > 0 ? nf(ayTopInv - ayTopSayacU, 2) : '—'}</td></tr>`;

  const gunKarsilama = topTuketim > 0 ? (topSayacUretim / topTuketim) * 100 : (topSayacUretim > 0 ? 100 : 0);

  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px">`
    + `<div><h2 style="margin:0">${gd} ${AYLAR_UZUN[ga - 1]} ${gy}, ${gunAdi} · Saatlik Enerji Profili ve Sayaç (OSOS) Dökümü</h2>`
    + `<p class="alt">Gündüz GES üretim eğrisi ile 24 saatlik fabrika tüketiminin saat saat karşılaştırması</p></div>`
    + `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">`
    + `<button class="btn" type="button"${ix <= 0 ? ' disabled' : ''} onclick="SEC_GUN='${tumGunler[ix - 1] || ''}';ciz()">◀ Önceki gün</button>`
    + `<input type="date" value="${SEC_GUN}" min="${tumGunler[0]}" max="${sonG}" onchange="if(this.value){SEC_GUN=this.value;ciz()}">`
    + `<button class="btn" type="button"${ix >= tumGunler.length - 1 ? ' disabled' : ''} onclick="SEC_GUN='${tumGunler[ix + 1] || ''}';ciz()">Sonraki gün ▶</button>`
    + `</div></div>`
    + `<div class="kpi" style="margin-bottom:14px">`
    + `<div style="--kp-r:#F08A24"><small>☀️ Seçili Gün İnverter Üretimi</small><b>${invSaat ? nf(topInv, 2) : '—'}</b><i>kWh</i>${!invVar(s) ? '<small>İnverter eklendiğinde görünür</small>' : ''}</div>`
    + `<div style="--kp-r:#1E9E5A"><small>📟 Seçili Gün GES Sayaç Üretimi</small><b>${nf(topSayacUretim, 2)}</b><i>kWh</i><small>Resmi OSOS Üretim</small></div>`
    + `<div style="--kp-r:#2a78d6"><small>🏭 Seçili Gün Fabrika Tüketimi</small><b>${nf(topTuketim, 2)}</b><i>kWh</i><small>Karşılama: %${nf(gunKarsilama, 1)}</small></div>`
    + `<div style="--kp-r:#7C3AED"><small>⚡ Seçili Gün Şebekeye Veriş</small><b>${nf(topSebekeVeris, 2)}</b><i>kWh</i><small>Net: ${(topSayacUretim - topTuketim) >= 0 ? '+' : ''}${nf(topSayacUretim - topTuketim, 1)} kWh</small></div>`
    + `</div>`
    + `<div style="background:#F8FAFC;border:1px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:16px">`
    + `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:6px"><b>📊 24 Saatlik Üretim ve Tüketim Grafiği (${gd} ${AYLAR_UZUN[ga - 1]})</b><small class="alt">Çubukların üzerine gelerek saatlik kWh değerlerini görebilirsiniz</small></div>`
    + saatlikGrafikHtml
    + `</div>`
    + `<div class="tablo-kutu" style="margin-bottom:18px"><table><thead><tr>${th1}</tr><tr>${th2}</tr></thead><tbody>${satirlar}</tbody></table></div>`
    + `<h2 style="margin-top:16px">📅 Günlük İnverter ve Sayaç Karşılaştırma Tablosu (${AYLAR_UZUN[Number(a) - 1]} ${y})</h2>`
    + `<p class="alt" style="margin-bottom:8px">Tablodaki herhangi bir güne tıklayarak o günün 24 saatlik grafiğini ve sayaç dökümünü yukarıda açabilirsiniz.</p>`
    + `<div class="tablo-kutu"><table><thead><tr><th class="sol">Gün</th><th class="ayr">☀️ İnverter Üretimi (kWh)</th><th>📟 GES Sayaç Üretimi (kWh)</th><th>⚡ Şebekeye Veriş (kWh)</th><th>🏭 Fabrika Tüketimi (kWh)</th><th class="ayr">🎯 Karşılama</th><th class="ayr">İç Tüketim / Fark (kWh)</th></tr></thead><tbody>${gunSatirlar}</tbody></table></div>`;
}

function cizInverterTablo(invDetay) {
  if (!invDetay || !invDetay.cihazlar || !invDetay.cihazlar.length) return '';
  const ch = (c, k, carpan = 1, h = 1) => {
    const o = (c.kanallar || {})[k];
    return o && o.deger != null ? nf(o.deger * carpan, h) : '—';
  };
  let topGuc = 0, topGun = 0, topAy = 0;
  const mxGun = Math.max(1, ...invDetay.cihazlar.map(c => c.gunluk_kwh || 0));

  const kartlar = invDetay.cihazlar.map(c => {
    const kw = (c.guc_w || 0) / 1000;
    const gun = c.gunluk_kwh || 0;
    const ay = c.aylik_kwh || 0;
    const aktif = kw > 0.05;
    const pay = Math.round((gun / mxGun) * 100);
    return `<div class="inv-kart">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b>🔌 ${esc(c.ad)}</b>
        <span class="et ${aktif ? 'ok' : ''}" style="font-size:11px">${aktif ? '● Üretimde' : '○ Beklemede'}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div><small class="alt">Bugün</small><b style="font-size:16px;color:#1E9E5A">${nf(gun, 1)}</b> <small>kWh</small></div>
        <div style="text-align:right"><small class="alt">Anlık</small><b style="font-size:15px;color:#F08A24">${nf(kw, 1)}</b> <small>kW</small></div>
      </div>
      <div class="bar-dis" style="height:6px;margin-bottom:6px"><div class="bar-ic" style="width:${pay}%;background:#F08A24"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--y)">
        <span>Bu Ay: <b>${ay ? nf(ay, 0) + ' kWh' : '—'}</b></span>
        <span>DC: ${ch(c, 'udcmean', 1, 0)}V</span>
      </div>
    </div>`;
  }).join('');

  const satirlar = invDetay.cihazlar.map(c => {
    const kw = (c.guc_w || 0) / 1000;
    const gun = c.gunluk_kwh || 0;
    const ay = c.aylik_kwh || 0;
    topGuc += kw; topGun += gun; topAy += ay;
    return `<tr>`
      + `<td class="sol"><b>${esc(c.ad)}</b></td>`
      + `<td class="ayr">${nf(kw, 2)}</td>`
      + `<td><b>${nf(gun, 2)}</b></td>`
      + `<td>${ay ? nf(ay, 1) : '—'}</td>`
      + `<td class="ayr">${ch(c, 'udcmean', 1, 0)} V / ${ch(c, 'idcmean', 1, 1)} A</td>`
      + `<td class="ayr">${ch(c, 'uacmeanl1', 1, 0)} / ${ch(c, 'uacmeanl2', 1, 0)} / ${ch(c, 'uacmeanl3', 1, 0)}</td>`
      + `<td>${ch(c, 'iacmeanl1', 1, 1)} / ${ch(c, 'iacmeanl2', 1, 1)} / ${ch(c, 'iacmeanl3', 1, 1)}</td>`
      + `<td class="ayr">${ch(c, 'powerreactive', 0.001, 2)} kVAr</td>`
      + `<td>${ch(c, 'cosphi', 1, 2)}</td>`
      + `</tr>`;
  }).join('');

  return `<h2 style="margin-top:18px">🔌 İnverter Sahası Görsel Durum Panosu (${invDetay.cihazlar.length} Cihaz)</h2>`
    + `<p class="alt">Her bir inverterin günlük üretime katkısı, anlık gücü ve DC gerilim durumu</p>`
    + `<div class="inv-izgara">${kartlar}</div>`
    + `<h2>📋 Detaylı Elektriksel İnverter Ölçümleri (DC / AC Faz / CosPhi)</h2>`
    + `<div class="tablo-kutu"><table><thead><tr>`
    + `<th class="sol">İnverter</th><th class="ayr">Anlık Güç (kW)</th><th>Bugün Üretim (kWh)</th><th>Bu Ay Üretim (kWh)</th>`
    + `<th class="ayr">DC MPP1 (V / A)</th><th class="ayr">AC Gerilim L1/L2/L3 (V)</th><th>AC Akım L1/L2/L3 (A)</th>`
    + `<th class="ayr">Reaktif Güç</th><th>CosPhi</th>`
    + `</tr></thead><tbody>${satirlar}`
    + `<tr class="top"><td class="sol">Toplam (${invDetay.cihazlar.length} İnverter)</td><td class="ayr">${nf(topGuc, 2)}</td><td>${nf(topGun, 2)}</td><td>${topAy ? nf(topAy, 1) : '—'}</td><td class="ayr" colspan="5"></td></tr>`
    + `</tbody></table></div>`;
}

async function seciliProjeGunlukCiz(s) {
  const el = $('secili_proje_gunluk');
  if (!el) return;
  try {
    if (!GUNLUK_BELLEK[s.sid]) GUNLUK_BELLEK[s.sid] = await projeGunlukVeriAl(s);
    el.innerHTML = cizProjeGunlukGrafikKart(s, GUNLUK_BELLEK[s.sid], false);
  } catch (e) {
    el.innerHTML = '<div class="hata">' + esc(e.message) + '</div>';
  }
}

async function icerikCiz(s) {
  const n = new Date(), y = n.getFullYear(), a = String(n.getMonth() + 1).padStart(2, '0'), g = String(n.getDate()).padStart(2, '0'), b = bel(s.sid), el = $('graf'), sy = s.sayac || {};
  const ts = sy.tuketim_sn || [];
  el.innerHTML = '<div class="bos">Yükleniyor…</div>';
  try {
    if (GRAF === 'saatlik') {
      await cizSaatlikOsos(s, el, b);
      if (invVar(s)) {
        const invDetay = await al(`${API}/${s.sid}/inverterler.json`, b);
        if (invDetay) el.insertAdjacentHTML('beforeend', cizInverterTablo(invDetay));
      }
      return;
    }
    if (GRAF === 'inverterler') {
      const [noktalar, invDetay] = await Promise.all([
        invVar(s) ? al(`${API}/${s.sid}/gun_${y}${a}${g}.json`, b) : Promise.resolve(null),
        al(`${API}/${s.sid}/inverterler.json`, b)
      ]);
      el.innerHTML = (invDetay ? cizInverterTablo(invDetay) : '<div class="bos">İnverter detay verisi bulunamadı.</div>')
        + (noktalar && noktalar.length ? `<h2 style="margin-top:18px">📈 Bugün 5 Dakikalık Toplam İnverter Güç Eğrisi (kW)</h2>` + cizgi(noktalar, s.kapasite_kwp) : '');
      return;
    }
    if (GRAF === 'gun') {
      if (invVar(s)) {
        const [noktalar, invDetay] = await Promise.all([
          al(`${API}/${s.sid}/gun_${y}${a}${g}.json`, b),
          al(`${API}/${s.sid}/inverterler.json`, b)
        ]);
        el.innerHTML = `<h2>📈 Bugün 5 Dakikalık Anlık Güç Eğrisi (kW)</h2><p class="alt" style="margin-bottom:8px">Güneş ışınımına bağlı anlık inverter güç değişimi</p>` + cizgi(noktalar, s.kapasite_kwp) + (invDetay ? cizInverterTablo(invDetay) : '');
      } else {
        el.innerHTML = '<div class="bos">Bu tesis için inverter bağlantısı eklendiğinde 5 dakikalık anlık güç eğrisi burada görüntülenecektir. Saatlik üretim ve tüketim dökümü için <b>Saatlik (Sayaç & İnverter)</b> sekmesini kullanabilirsiniz.</div>';
      }
      return;
    }
    if (GRAF === 'ay') {
      if (!GUNLUK_BELLEK[s.sid]) GUNLUK_BELLEK[s.sid] = await projeGunlukVeriAl(s);
      const v = GUNLUK_BELLEK[s.sid];
      let tabloSat = '';
      for (const r of v.satirlar) {
        const oran = r.tuketim_kwh > 0 ? (r.uretim_kwh / r.tuketim_kwh) * 100 : (r.uretim_kwh > 0 ? 100 : 0);
        tabloSat += `<tr style="cursor:pointer" onclick="projeGunSec('${esc(s.sid)}','${r.tarih}')">`
          + `<td class="sol"><b>${r.etiket} ${v.y}</b></td>`
          + (invVar(s) ? `<td class="ayr">${r.inv_kwh != null ? nf(r.inv_kwh, 2) : '—'}</td>` : '')
          + `<td class="ayr" style="color:#1D6B36;font-weight:600">${nf(r.uretim_kwh, 2)}</td>`
          + (sayacVar(s) ? `<td style="color:#1956A8;font-weight:600">${nf(r.tuketim_kwh, 2)}</td><td>${nf(r.veris_kwh, 2)}</td><td class="ayr"><span class="et ${oran >= 100 ? 'ok' : (oran >= 50 ? 'm' : 'u')}">%${nf(oran, 0)}</span></td>` : '')
          + `</tr>`;
      }
      el.innerHTML = cizProjeGunlukGrafikKart(s, v, false)
        + `<h2 style="margin-top:14px">📋 Günlük Üretim ve Tüketim Tablosu (${AYLAR_UZUN[v.a - 1]} ${v.y})</h2>`
        + `<div class="tablo-kutu"><table><thead><tr><th class="sol">Tarih</th>`
        + (invVar(s) ? `<th class="ayr">☀️ İnverter Üretimi (kWh)</th>` : '')
        + `<th class="ayr">🟢 Günlük Üretim (kWh)</th>`
        + (sayacVar(s) ? `<th>🔵 Günlük Tüketim (kWh)</th><th>🟣 Şebekeye Veriş (kWh)</th><th class="ayr">🎯 Karşılama</th>` : '')
        + `</tr></thead><tbody>${tabloSat}</tbody></table></div>`;
      return;
    }
    if (GRAF === 'yil') {
      const [i0, i1, s0, s1] = await Promise.all([
        invVar(s) ? al(`${API}/${s.sid}/yil_${y - 1}.json`, b) : Promise.resolve([]),
        invVar(s) ? al(`${API}/${s.sid}/yil_${y}.json`, b) : Promise.resolve([]),
        sayacVar(s) ? al(`${API}/${s.sid}/${invVar(s) ? 'sayac_yil_' : 'yil_'}${y - 1}.json`, b) : Promise.resolve([]),
        sayacVar(s) ? al(`${API}/${s.sid}/${invVar(s) ? 'sayac_yil_' : 'yil_'}${y}.json`, b) : Promise.resolve([])
      ]);
      const birlestir = (r0, r1) => [...(r0 || []).filter(d => d.ay > n.getMonth() + 1).map(d => ({ ...d, y: y - 1 })), ...(r1 || []).map(d => ({ ...d, y }))];
      const invYil = birlestir(i0, i1), sayYil = birlestir(s0, s1);
      const anahtarlar = [...new Set([...invYil.map(d => d.y * 100 + d.ay), ...sayYil.map(d => d.y * 100 + d.ay)])].sort((p, q) => p - q);
      const iMap = Object.fromEntries(invYil.map(d => [d.y * 100 + d.ay, d.kwh]));
      const sMap = Object.fromEntries(sayYil.map(d => [d.y * 100 + d.ay, d]));
      const seriler = [];
      if (invVar(s)) seriler.push({ ad: 'İnverter Üretim', renk: '#F08A24', v: anahtarlar.map(k => iMap[k] || 0) });
      if (sayacVar(s)) {
        seriler.push({ ad: 'GES Sayaç Üretim', renk: '#1E9E5A', v: anahtarlar.map(k => (sMap[k] || {}).kwh || 0) });
        ts.forEach((sn, idx) => seriler.push({ ad: 'Fabrika Tüketim (#' + sn + ')', renk: idx === 0 ? '#2a78d6' : '#2B2F35', v: anahtarlar.map(k => tk(sMap[k], sn) || 0) }));
      }
      el.innerHTML = `<h2>📅 Son 12 Ay Aylık Üretim ve Tüketim Grafiği</h2><p class="alt" style="margin-bottom:8px">Mevsimsel GES üretim seyri ve fabrika aylık enerji tüketimi</p>` + cubukN(anahtarlar.map(k => ({ e: AYLAR[k % 100 - 1] + ' ' + Math.floor(k / 100), k: AYLAR[k % 100 - 1] })), seriler, 'Son 12 ay üretim ve tüketim');
      return;
    }
    if (GRAF === 'reaktif') {
      const r = await al(`${API}/${s.sid}/reaktif.json`, b);
      if (!r) { el.innerHTML = '<div class="bos">Reaktif verisi yok.</div>'; return; }
      const si = r.sinir || { ind: 20, kap: 15 }, hc = (v, l) => v == null ? '—' : `<span class="et ${v > l ? 'k' : 'ok'}">%${nf(v, 2)}</span>`;
      const sat = [['GES Üretim #' + (sy.uretim_sn || s.sid), r.uretim || []], ...Object.entries(r.tuketim || {}).map(([sn, v]) => ['Fabrika Tüketim #' + sn, v])];
      const anah = [...new Set(sat.flatMap(([, v]) => v.map(z => z.yil * 100 + z.ay)))].sort((p, q) => q - p);
      const sonAyAnah = anah[0];

      const reaktifKartlar = sat.map(([ad, v]) => {
        const z = v.find(q => q.yil * 100 + q.ay === sonAyAnah) || {};
        const ind = z.ind || 0, kap = z.kap || 0;
        const indAsim = ind > si.ind, kapAsim = kap > si.kap;
        return `<div class="oran-kutu">
          <div class="oran-bas"><span>🛡️ ${esc(ad)}</span><span class="et ${indAsim || kapAsim ? 'k' : 'ok'}">${indAsim || kapAsim ? 'Sınır Aşımı Var' : 'Güvenli Bölgede'}</span></div>
          <div style="margin:8px 0">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>Endüktif Oran (Ceza Sınırı: %${nf(si.ind)})</span><b>%${nf(ind, 2)}</b></div>
            <div class="bar-dis"><div class="bar-ic" style="width:${Math.min(100, (ind / si.ind) * 75).toFixed(1)}%;background:${indAsim ? '#D7262E' : '#1E9E5A'}"></div></div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>Kapasitif Oran (Ceza Sınırı: %${nf(si.kap)})</span><b>%${nf(kap, 2)}</b></div>
            <div class="bar-dis"><div class="bar-ic" style="width:${Math.min(100, (kap / si.kap) * 75).toFixed(1)}%;background:${kapAsim ? '#D7262E' : '#1E9E5A'}"></div></div>
          </div>
        </div>`;
      }).join('');

      el.innerHTML = `<h2>🛡️ Reaktif Güç Oranları ve Ceza Sınırı Kontrolü</h2>`
        + `<p class="alt" style="margin:0 0 12px">EPDK reaktif ceza sınırı: Endüktif <b>%${nf(si.ind)}</b> · Kapasitif <b>%${nf(si.kap)}</b> (aktif enerjiye oran). Yeşil çubuklar ceza sınırının altında (güvenli) olduğunu gösterir.</p>`
        + `<div class="reak-izgara">${reaktifKartlar}</div>`
        + `<div class="tablo-kutu"><table><thead><tr><th class="sol">Ay</th>${sat.map(([ad]) => `<th>${esc(ad)}<br>Endüktif / Kapasitif</th>`).join('')}</tr></thead><tbody>`
        + anah.map(k => `<tr><td class="sol"><b>${AYLAR_UZUN[k % 100 - 1]} ${Math.floor(k / 100)}</b></td>${sat.map(([, v]) => { const z = v.find(q => q.yil * 100 + q.ay === k) || {}; return `<td>${hc(z.ind, si.ind)} ${hc(z.kap, si.kap)}</td>`; }).join('')}</tr>`).join('') + '</tbody></table></div>';
      return;
    }
  } catch (e) { el.innerHTML = '<div class="hata">' + esc(e.message) + '</div>'; }
}

function ciz(toplayici = TOP) {
  if (!SANT.length) { $('ana').innerHTML = '<div class="kart bos">Görüntülenecek santral yok.' + (S.ka ? ' Toplayıcı henüz veri yazmadı' + (toplayici && toplayici.hata ? ': ' + esc(toplayici.hata) : '.') : ' Yetki için yöneticinize başvurun.') + '</div>'; return; }
  const s = SANT.find(x => x.sid === SEC) || SANT[0]; SEC = s.sid;
  const sy = s.sayac || {}, ts = sy.tuketim_sn || [], aytopTuk = ts.reduce((t, sn) => t + ((sy.ay_tuketim || {})[sn] || 0), 0);
  const bugunTuk = ts.reduce((t, sn) => t + ((sy.bugun_tuketim || {})[sn] || 0), 0);
  const sekmeler = [];
  if (sayacVar(s)) sekmeler.push(['saatlik', '⏱️ Saatlik (Sayaç & İnverter)']);
  if (s.inverter_sayisi || s.kaynak === 'fronius') sekmeler.push(['inverterler', `🔌 İnverterler (${s.inverter_sayisi || 11} Cihaz)`]);
  sekmeler.push(['ay', '📊 Bu Ay (Günlük Tablo)'], ['yil', '📅 Son 12 Ay'], ['gun', '📈 Gün İçi Güç']);
  if (sayacVar(s)) sekmeler.push(['reaktif', '🛡️ Reaktif']);
  if (!GRAF || !sekmeler.some(([k]) => k === GRAF)) GRAF = sayacVar(s) ? 'saatlik' : 'gun';

  const ns = s.kapasite_kwp && s.guc_w != null ? (s.guc_w || 0) / 1000 / s.kapasite_kwp * 100 : null;
  const altBilgi = [
    s.adres ? esc(s.adres) : null,
    s.kapasite_kwp ? nf(s.kapasite_kwp, 1) + ' kWp' : null,
    durumEt(s),
    sayacVar(s) ? `OSOS Sayaç: Üretim <b>#${esc(sy.uretim_sn || s.sid)}</b>${ts.length ? ' · Tüketim <b>#' + ts.map(esc).join(', #') + '</b>' : ''}` : null,
    'son okuma ' + zaman(s.son_veri)
  ].filter(Boolean).join(' · ');

  let h = '';

  // Birden fazla proje varsa: Hızlı Proje Sekmeleri + Her Proje İçin Günlük Üretim & Tüketim Grafikleri Panosu
  if (SANT.length > 1) {
    h += `<div class="proje-sekmeler">`
      + SANT.map(x => `<button type="button" class="proje-sekme${x.sid === SEC ? ' on' : ''}" onclick="SEC='${esc(x.sid)}';SEC_GUN=null;GRAF=null;ciz()"><span>${sayacVar(x) ? '🏭' : '☀️'}</span><span>${esc(x.ad)}</span></button>`).join('')
      + `<button type="button" class="btn" style="margin-left:auto" onclick="TUM_ACIK=!TUM_ACIK;ciz()">${TUM_ACIK ? '▲ Tüm Projelerin Günlük Grafiklerini Gizle' : '📊 Tüm Projelerin Günlük Üretim/Tüketim Grafiklerini Göster'}</button>`
      + `</div>`;

    if (TUM_ACIK) {
      h += `<div class="kart" style="background:#EFF4FA;border-color:#CBD5E1">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
          <div>
            <h2 style="margin:0;font-size:18px">📊 Tüm Projeler · Günlük Üretim ve Tüketim Grafikleri (${SANT.length} Proje)</h2>
            <p class="alt">Her proje için bu ayın günlük GES üretimi (yeşil/turuncu) ve fabrika tüketimi (mavi) karşılaştırma grafikleri</p>
          </div>
          <span class="et m">Her Proje İçin Günlük Grafik</span>
        </div>
        <div id="tum_projeler_grafik"><div class="bos">Projelerin günlük üretim ve tüketim grafikleri yükleniyor…</div></div>
      </div>`;
    }
  }

  h += `<div class="bas"><div><h1>${esc(s.ad)}</h1><p class="alt">${altBilgi}</p></div>`
    + (SANT.length > 1 ? `<select onchange="SEC=this.value;SEC_GUN=null;GRAF=null;ciz()">${SANT.map(x => `<option value="${esc(x.sid)}"${x.sid === SEC ? ' selected' : ''}>${esc(x.ad)}</option>`).join('')}</select>` : '') + '</div>';

  h += `<div class="kpi">`
    + `<div style="--kp-r:#F08A24"><small>☀️ Anlık Güç (İnverter)</small><b>${invVar(s) && s.guc_w != null ? nf((s.guc_w || 0) / 1000, 2) : '—'}</b><i>kW</i>${ns != null ? `<small>%${nf(ns, 1)} kapasite kullanım</small>` : (!invVar(s) ? `<small>İnverter bekleniyor</small>` : '')}</div>`
    + `<div style="--kp-r:#1E9E5A"><small>⚡ Bugün Üretim</small><b>${nf(invVar(s) && s.gunluk_kwh != null ? s.gunluk_kwh : sy.bugun_uretim_kwh)}</b><i>kWh</i>`
    + (invVar(s) && sayacVar(s) ? `<small>İnv: ${nf(s.gunluk_kwh)} · Sayaç: ${nf(sy.bugun_uretim_kwh)}</small>` : (sy.dun_uretim_kwh != null ? `<small>Dün: ${nf(sy.dun_uretim_kwh)} kWh</small>` : '')) + `</div>`
    + `<div style="--kp-r:#1E9E5A"><small>📟 Bu Ay Üretim</small><b>${nf(invVar(s) && s.aylik_kwh != null ? s.aylik_kwh : (sy.ay_uretim_kwh ?? s.aylik_kwh))}</b><i>kWh</i>`
    + (invVar(s) && sayacVar(s) && sy.ay_uretim_kwh != null ? `<small>İnv: ${nf(s.aylik_kwh)} · Sayaç: ${nf(sy.ay_uretim_kwh)}</small>` : `<small>≈ ${nf(((sy.ay_uretim_kwh ?? s.aylik_kwh) || 0) / 1000, 2)} MWh</small>`) + `</div>`
    + (sayacVar(s) ? `<div style="--kp-r:#2a78d6"><small>🏭 Bu Ay Fabrika Tüketimi</small><b>${nf(aytopTuk)}</b><i>kWh</i>${bugunTuk ? `<small>Bugün: ${nf(bugunTuk)} kWh</small>` : `<small>≈ ${nf(aytopTuk / 1000, 2)} MWh</small>`}</div>` : '')
    + `<div style="--kp-r:#7C3AED"><small>📅 Bu Yıl Toplam Üretim</small><b>${nf(((s.yillik_kwh ?? sy.yil_uretim_kwh) || 0) / 1000, 1)}</b><i>MWh</i><small>${nf((s.yillik_kwh ?? sy.yil_uretim_kwh) || 0, 0)} kWh</small></div>`
    + `</div>`;

  // Şematik Tek Hat ve Enerji Dengesi Kartı
  h += cizSemaKart(s);

  // Tek proje görünümündeyken (veya tüm projeler kapalıyken) seçili projenin Günlük Üretim & Tüketim Grafiği her zaman doğrudan görünür
  if (SANT.length === 1 || !TUM_ACIK) {
    h += `<div id="secili_proje_gunluk"></div>`;
  }

  h += `<div class="kart"><div class="sek">${sekmeler.map(([k, a]) => `<button class="${GRAF === k ? 'on' : ''}" onclick="GRAF='${k}';ciz()">${a}</button>`).join('')}</div><div id="graf"></div></div>`;

  const al_ = s.alarmlar || [];
  h += `<div class="kart"><h2>🔔 Alarmlar ve Uyarılar</h2>${al_.length ? '<div class="tablo-kutu"><table><thead><tr><th class="sol">Zaman</th><th class="sol">Uyarı / Alarm</th><th class="sol">Cihaz</th></tr></thead><tbody>' + al_.map(x => `<tr><td class="sol">${zaman(x.alertTime)}</td><td class="sol">${esc(x.alertName || x.content || '')}</td><td class="sol">${esc(x.deviceSn || '')}</td></tr>`).join('') + '</tbody></table></div>' : '<div class="alt">✅ Aktif alarm veya reaktif ceza sınırı aşımı yok.</div>'}</div>`;

  if (S.ka && toplayici) h += `<p class="alt">Toplayıcı (yalnız yönetici): ${toplayici.tamam ? 'çalışıyor' : 'HATA — ' + esc(toplayici.hata || '')} · son tur ${zaman(toplayici.zaman)}</p>`;
  $('ana').innerHTML = h;

  if (SANT.length > 1 && TUM_ACIK) tumProjelerGunlukCiz();
  else seciliProjeGunlukCiz(s);

  icerikCiz(s);
}

document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-t]'), tip = $('tip'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.t; tip.style.display = 'block'; tip.style.left = Math.min(window.innerWidth - 350, e.clientX + 12) + 'px'; tip.style.top = Math.max(8, e.clientY - 34) + 'px'; });
let TOP = null;
async function yukle() { try { GUNLUK_BELLEK = {}; [SANT, TOP] = await liste(); ciz(TOP); } catch (e) { $('ana').innerHTML = '<div class="hata">' + esc(e.message) + '</div>'; } }
(async () => {
  S = oturum();
  if (!S || !(S.ka || (S.musteri && Object.keys(S.musteri).length))) { location.replace('../?git=musteri'); return; }
  $('kim').textContent = S.ad || S.kul;
  BEL = await belirtecler(); await yukle();
  setInterval(yukle, 5 * 60 * 1000);
})();
</script>
</body>
