<script type="module">
import * as THREE from './three.module.min.js';
const Q=new URLSearchParams(location.search);
const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toLocaleString('tr-TR');
const PHI=39, CO=Math.cos(PHI*Math.PI/180), LON0=35.25;
let EX=11; const KM=111000;
const X=lon=>(lon-LON0)*CO, Z=lat=>-(lat-PHI);
let AR, AH, AM, AI; // arazi meta, yükseklik, maske
function h(lon,lat){ // bilinear yükseklik (m)
 const fx=(lon-AR.lon0)/(AR.lon1-AR.lon0)*AR.w-.5, fy=(AR.lat1-lat)/(AR.lat1-AR.lat0)*AR.h-.5;
 const x0=cl(Math.floor(fx),0,AR.w-2), y0=cl(Math.floor(fy),0,AR.h-2), tx=cl(fx-x0), ty=cl(fy-y0);
 const g=(x,y)=>AH[y*AR.w+x];
 return lerp(lerp(g(x0,y0),g(x0+1,y0),tx),lerp(g(x0,y0+1),g(x0+1,y0+1),tx),ty);
}
const Y=m=>Math.max(m,0)/KM*EX;
const V3=(lon,lat,up=0)=>new THREE.Vector3(X(lon),Y(h(lon,lat))+up,Z(lat));

const W=innerWidth,H=innerHeight;
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(devicePixelRatio);R.setSize(W,H,false);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const S=new THREE.Scene();const BG=new THREE.Color('#06101c');S.background=BG;S.fog=new THREE.Fog(BG,10,40);let ILL=false;
const CAM=new THREE.PerspectiveCamera(38,W/H,.05,200);
const HEMI=new THREE.HemisphereLight('#9fc3ff','#1a1208',.55);S.add(HEMI);
const SUN=new THREE.DirectionalLight('#fff1dc',2.4);SUN.position.set(-6,7,-3);S.add(SUN);

let K, OG={}, NESNE={}; const SINIR=[];
const ILD=new Uint8Array(128*4);const ILT=new THREE.DataTexture(ILD,128,1,THREE.RGBAFormat);ILT.needsUpdate=true;
const ILO={};const UDIM={value:0};
function ilNesne(ad){if(ILO[ad])return ILO[ad];const rs=GEO.il[ad];if(!rs){console.error('il yok',ad);return null}
 const big=rs.reduce((a,b)=>a.length>b.length?a:b);const cx=big.reduce((s,p)=>s+p[0],0)/big.length,cy=big.reduce((s,p)=>s+p[1],0)/big.length;
 const kenar=[];for(const r of rs){const p=r.map(([lo,la])=>V3(lo,la,.014));p.push(p[0]);
  const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p,false,'centripetal'),p.length*2,.012,4),new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:0,fog:false}));S.add(m);kenar.push(m)}
 const o={ad,idx:(GEO.il_ad.indexOf(ad)+1),kenar,pts:big.filter((_,i)=>i%3==0).map(([lo,la])=>V3(lo,la)),merkez:V3(cx,cy,.05)};o.etk=etiket(ad.toLocaleUpperCase('tr-TR'),o.merkez.clone().add(new THREE.Vector3(0,.06,0)),'#ffd23f');ILO[ad]=o;return o}
function ilBoya(ad,renk,a){const o=ilNesne(ad);if(!o)return;const c=new THREE.Color(renk);const i=o.idx*4;ILD[i]=c.r*255;ILD[i+1]=c.g*255;ILD[i+2]=c.b*255;ILD[i+3]=Math.max(ILD[i+3],a*200)}
async function yukle(){
 const ar=Q.get('arazi')||'720';
 AR=await (await fetch(`arazi_${ar}.json`)).json();
 const buf=await (await fetch(`arazi_${ar}.bin`)).arrayBuffer();
 AH=new Int16Array(buf,0,AR.w*AR.h); AM=new Uint8Array(buf,AR.w*AR.h*2,AR.w*AR.h); AI=buf.byteLength>=AR.w*AR.h*4?new Uint8Array(buf,AR.w*AR.h*3,AR.w*AR.h):new Uint8Array(AR.w*AR.h);
 window.GEO=await (await fetch('geo.json')).json();
 await document.fonts.load('900 40px M');await document.fonts.load('700 40px M');
}
function renk(m,mask){ // hipsometrik koyu palet
 const c=new THREE.Color();
 if(m<=0){c.set('#0b2236').lerp(new THREE.Color('#03101c'),cl(-m/1500));}
 else{
  const st=[[0,'#28402c'],[400,'#3d5233'],[1000,'#6b6a45'],[1700,'#8d7656'],[2500,'#a08b72'],[3200,'#e9eef2']];
  for(let i=0;i<st.length-1;i++){if(m<=st[i+1][0]||i==st.length-2){const t=cl((m-st[i][0])/(st[i+1][0]-st[i][0]));c.set(st[i][1]).lerp(new THREE.Color(st[i+1][1]),t);break}}
 }
 const k=mask/255, g=(c.r+c.g+c.b)/3;
 const dim=m>0?.42:.8;
 c.r=lerp(lerp(c.r,g,.6)*dim,c.r,k);c.g=lerp(lerp(c.g,g,.6)*dim,c.g,k);c.b=lerp(lerp(c.b,g,.6)*dim+.012,c.b,k);
 return c;
}
const PASTEL=['#f6c85f','#f4a259','#9bc995','#6fb7a8','#e88a8a','#b8a1d9','#f2d49b','#8cc0e8','#f0b5c8','#c9d97a','#ffd166','#a7d3a6','#f7a072','#b5c7ed','#e6b89c','#c3e0a8'];
const PCOL=PASTEL.map(c=>new THREE.Color(c));
function renkIll(k,i,j,w,hh,m){
 const id=AI[k];
 if(id){const nb=[k-1,k+1,k-w,k+w];for(const q of nb){if(q<0||q>=w*hh)continue;if(AI[q]!==id)return new THREE.Color('#ffffff')}
  return PCOL[(id*7+3)%PCOL.length].clone();}
 if(m>0)return new THREE.Color(AM[k]>40?'#ffffff':'#ece2c9');
 return new THREE.Color('#5ec3d9');
}
function arazi(){
 const w=AR.w,hh=AR.h, pos=new Float32Array(w*hh*3), col=new Float32Array(w*hh*3);
 for(let j=0;j<hh;j++)for(let i=0;i<w;i++){
  const k=j*w+i, lon=AR.lon0+(i+.5)/w*(AR.lon1-AR.lon0), lat=AR.lat1-(j+.5)/hh*(AR.lat1-AR.lat0), m=AH[k];
  pos[k*3]=X(lon);pos[k*3+1]=ILL?(m>0?Y(m)*.07:-.006):(m>0?Y(m):m/KM*EX*.25-.004);pos[k*3+2]=Z(lat);
  const c=ILL?renkIll(k,i,j,w,hh,m):renk(m,AM[k]);col[k*3]=c.r;col[k*3+1]=c.g;col[k*3+2]=c.b;
 }
 const idx=new Uint32Array((w-1)*(hh-1)*6);let n=0;
 for(let j=0;j<hh-1;j++)for(let i=0;i<w-1;i++){const a=j*w+i,b=a+1,c=a+w,d=c+1;idx[n++]=a;idx[n++]=c;idx[n++]=b;idx[n++]=b;idx[n++]=c;idx[n++]=d;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(new THREE.BufferAttribute(idx,1));g.computeVertexNormals();
 const ila=new Float32Array(w*hh);for(let k=0;k<w*hh;k++)ila[k]=AI[k];g.setAttribute('ilid',new THREE.BufferAttribute(ila,1));
 const mat=new THREE.MeshLambertMaterial({vertexColors:true});
 mat.onBeforeCompile=sh=>{sh.uniforms.ilT={value:ILT};
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute float ilid;varying float vIl;').replace('#include <begin_vertex>','#include <begin_vertex>\nvIl=ilid;vec4 ic0=texture2D(ilT,vec2((floor(ilid+.5)+.5)/128.,.5));transformed.y+=ic0.a*uLift;');sh.uniforms.uLift={value:ILL?.07:0.};sh.vertexShader=sh.vertexShader.replace('attribute float ilid;','attribute float ilid;uniform sampler2D ilT;uniform float uLift;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D ilT;varying float vIl;').replace('#include <color_fragment>','#include <color_fragment>\nvec4 ic=texture2D(ilT,vec2((floor(vIl+.5)+.5)/128.,.5));diffuseColor.rgb=mix(diffuseColor.rgb,ic.rgb,ic.a);if(ic.a<.01&&vIl>.5)diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.92,.93,.94),uDim);');sh.uniforms.uDim=UDIM;sh.fragmentShader=sh.fragmentShader.replace('uniform sampler2D ilT;varying float vIl;','uniform sampler2D ilT;varying float vIl;uniform float uDim;');};
 S.add(new THREE.Mesh(g,mat));
 // il sınırları (silik)
 const lp=[];for(const ad of GEO.il_ad||[])for(const r of GEO.il[ad]){for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];lp.push(V3(a[0],a[1],.006),V3(b[0],b[1],.006))}}
 if(lp.length){const lg=new THREE.BufferGeometry().setFromPoints(lp);S.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:'#ffffff',transparent:true,opacity:ILL?.95:.16,fog:false})))}
 const deniz=new THREE.Mesh(new THREE.PlaneGeometry(60,40),(ILL?new THREE.MeshBasicMaterial({color:'#5ec3d9'}):new THREE.MeshPhongMaterial({color:'#0d3150',transparent:true,opacity:.72,shininess:90,specular:'#5f8fb0'})));
 deniz.rotation.x=-Math.PI/2;deniz.position.y=ILL?-.012:.0005;if(ILL)deniz.scale.set(3,3,1);S.add(deniz);
 // Türkiye sınırı (parlak çizgi)
 for(const r of GEO.ulke.TUR){if(r.length<40)continue;
  const p=r.map(([lo,la])=>V3(lo,la,.012));p.push(p[0]);
  const cu=new THREE.CatmullRomCurve3(p,false,'centripetal');
  const m1=new THREE.Mesh(new THREE.TubeGeometry(cu,p.length*2,.009,4),new THREE.MeshBasicMaterial({color:'#e8f4ff',transparent:true,opacity:.75,fog:false}));m1.userData.op=ILL?.95:.75;if(ILL)m1.material.color.set('#ffffff');
  const m2=new THREE.Mesh(new THREE.TubeGeometry(cu,p.length*2,.04,4),new THREE.MeshBasicMaterial({color:'#7fc4ff',transparent:true,opacity:.13,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));m2.userData.op=ILL?0:.13;S.add(m1,m2);SINIR.push(m1,m2);
 }
}

function tup(pts,r,c,op,add){
 const cu=new THREE.CatmullRomCurve3(pts,false,'centripetal');const seg=Math.max(8,pts.length*3);
 const g=new THREE.TubeGeometry(cu,seg,r,6);
 const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op,fog:false,...(add?{blending:THREE.AdditiveBlending,depthWrite:false}:{})}));
