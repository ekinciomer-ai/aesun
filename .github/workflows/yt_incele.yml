name: YouTube video inceleme (içerik analizi)
# Bir YouTube videosunun başlık/açıklama/etiket/istatistiklerini (API) ve kanalın son videolarını okur; sesi yazıya döker (yt-dlp + faster-whisper).
# Salt okunur; sonuç icerik/inceleme/<video>.md'ye yazılır.
on:
  workflow_dispatch:
    inputs:
      video: { description: 'Video kimliği (ör. aFdY33F2C0g)', required: true }
permissions:
  contents: write
jobs:
  incele:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp faster-whisper "av==13.1.0"
      - name: İncele
        env: { V: '${{ inputs.video }}', KEY: '${{ secrets.YT_API_KEY }}' }
        run: |
          mkdir -p icerik/inceleme; python3 - <<'PY'
          import os, json, urllib.request, subprocess, glob
          V, KEY = os.environ["V"], os.environ["KEY"]; out = [f"# Video inceleme: {V}\n"]
          def api(u): return json.load(urllib.request.urlopen(u, timeout=60))
          try:
              d = api(f"https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id={V}&key={KEY}")["items"][0]
              s, st = d["snippet"], d.get("statistics", {})
              out += [f"- Başlık: {s['title']}", f"- Kanal: {s['channelTitle']} ({s['channelId']})", f"- Yayın: {s['publishedAt']}", f"- Süre: {d['contentDetails']['duration']}",
                      f"- İzlenme: {st.get('viewCount')} · Beğeni: {st.get('likeCount')} · Yorum: {st.get('commentCount')}", f"- Etiketler: {', '.join(s.get('tags', []))}", f"- Açıklama:\n```\n{s.get('description','')[:1500]}\n```"]
              ch = api(f"https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id={s['channelId']}&key={KEY}")["items"][0]
              out += [f"- Kanal abone: {ch['statistics'].get('subscriberCount')} · video: {ch['statistics'].get('videoCount')} · toplam izlenme: {ch['statistics'].get('viewCount')}", f"- Kanal açıklaması: {ch['snippet'].get('description','')[:400]}"]
              ids = [i["id"]["videoId"] for i in api(f"https://www.googleapis.com/youtube/v3/search?part=id&channelId={s['channelId']}&order=date&type=video&maxResults=25&key={KEY}")["items"]]
              vs = api(f"https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id={','.join(ids)}&key={KEY}")["items"]
              out.append("\n## Kanalın son 25 videosu (izlenmeye göre)")
              for v in sorted(vs, key=lambda x: -int(x.get("statistics", {}).get("viewCount", 0))):
                  out.append(f"- {v['statistics'].get('viewCount','?')} izl · {v['contentDetails']['duration']} · {v['snippet']['publishedAt'][:10]} · {v['snippet']['title']}")
          except Exception as e: out.append(f"- API hatası: {type(e).__name__}: {e}")
          try:
              subprocess.run(["yt-dlp", "-q", "-x", "--audio-format", "mp3", "-o", "/tmp/v.%(ext)s", f"https://www.youtube.com/watch?v={V}"], check=True, timeout=300)
              from faster_whisper import WhisperModel
              m = WhisperModel("small", device="cpu", compute_type="int8"); segs, info = m.transcribe("/tmp/v.mp3", word_timestamps=True)
              segs = list(segs); out.append(f"\n## Anlatım yazıya dökümü (dil: {info.language}, {segs[-1].end if segs else 0:.0f} sn)")
              for sg in segs: out.append(f"- [{sg.start:5.1f}] {sg.text.strip()}")
              w = [x for sg in segs for x in sg.words]; out.append(f"\n- Kelime sayısı: {len(w)} · hız: {len(w)/max(1,segs[-1].end)*60:.0f} kelime/dk")
          except Exception as e: out.append(f"\n- Ses indirilemedi/çözülemedi: {type(e).__name__}: {str(e)[:200]}")
          open(f"icerik/inceleme/{V}.md", "w", encoding="utf-8").write("\n".join(out)); print("\n".join(out)[:3000])
          PY
      - name: Kaydet
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A icerik/inceleme; git diff --cached --quiet && exit 0
          git commit -qm "Video inceleme: ${{ inputs.video }}"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
