name: Araç keşfi (günlük)
# public-apis + awesome-selfhosted + GitHub aramasını tarar, portal/kesif kütüphanesini günceller,
# yeni bulunanları "Keşif bülteni" konusuna yazar. Yapay zekâ kullanmaz.
on:
  schedule:
    - cron: '17 3 * * *'   # her gün 06:17 (TR)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: { group: kesif, cancel-in-progress: false }
jobs:
  tara:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tara
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install -q pyyaml
          python3 kesif/kesif.py
      - name: Kaydet
        run: |
          git config user.name "aesun-kesif"; git config user.email "kesif@aksarayenerji.net"
          git add docs/kesif/katalog.json kesif/gorulen.json
          git diff --cached --quiet && exit 0
          git commit -qm "Keşif: $(date +%d.%m.%Y) kütüphane güncellendi"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
