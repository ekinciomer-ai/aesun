name: Railway yönetimi
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "durum | duzelt"
        default: durum
      filtre:
        description: "yalnız bu proje (boş = hepsi)"
        default: ""
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          FILTRE: ${{ inputs.filtre }}
        run: python3 cpanel/railway.py "${{ inputs.islem }}"
