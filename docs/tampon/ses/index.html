<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Ses denemesi · Tampon bölge</title>
<style>body{font:15px/1.5 system-ui,sans-serif;background:#F6F5F3;color:#2B2F35;margin:0;padding:16px}main{max-width:720px;margin:0 auto}
.k{background:#fff;border:1px solid #E4E1DC;border-radius:12px;padding:12px 14px;margin:10px 0}.k b{display:block;margin-bottom:6px}audio{width:100%}.i{color:#6B6F76;font-size:13px}</style></head>
<body><main><h1 style="font-size:20px">Seslendirme denemesi (tampon bölge)</h1>
<p class="i">Sunucuda, ücretsiz ve açık kaynak araçlarla üretildi. Hangisi kanala uygun?</p><div id="l">Yükleniyor…</div></main>
<script>
const AD={piper_tr_fahrettin:'Piper · Türkçe (Fahrettin)',piper_tr_dfki:'Piper · Türkçe (DFKI)',piper_en_ryan:'Piper · İngilizce (Ryan)',chatterbox_tr:'Chatterbox · Türkçe',chatterbox_tr_vurgulu:'Chatterbox · Türkçe (vurgulu)',chatterbox_en:'Chatterbox · İngilizce'};
fetch('sonuc.json?'+Date.now()).then(r=>r.json()).then(s=>{document.getElementById('l').innerHTML=Object.keys(AD).map(k=>s[k]?'<div class="k"><b>'+AD[k]+'</b><audio controls preload="none" src="'+k+'.mp3"></audio><div class="i">üretim '+s[k].sure_sn+' sn'+(s[k].lisans?' · '+s[k].lisans:'')+'</div></div>':'').join('')+(s.piper_hata?'<p class="i">Piper: '+s.piper_hata+'</p>':'')+(s.chatterbox_hata?'<p class="i">Chatterbox: '+s.chatterbox_hata+'</p>':'')}).catch(()=>document.getElementById('l').textContent='Henüz sonuç yok.')
</script></body></html>
