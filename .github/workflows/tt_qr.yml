name: TikTok QR giriş (kalıcı tarayıcıya, hesap seçmeli)
# Sunucudaki kalıcı tarayıcıda (tt-tarayici / tt-tarayici-yr) TikTok QR'ını açar; QR 15 sn'de bir docs/tampon/tiktok<_hesap>/qr.png olarak depoya gider (7 dk).
# Ömer telefondaki TikTok uygulamasıyla okutur; oturum o tarayıcının profilinde kalır. Şifre yok, port açılmaz. Sunucu kilidini beklemez (yalnız o hesabın tarayıcısına dokunur).
on:
  workflow_dispatch:
    inputs:
      hesap:
        description: "boş = @antikstudyo, yr = @yolu.se"
        required: false
        default: "yr"
permissions:
  contents: write
concurrency:
  group: tt-qr-${{ inputs.hesap }}
  cancel-in-progress: true
jobs:
  giris:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - name: QR
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
          H: ${{ inputs.hesap }}
        run: |
          case "$H" in ""|yr) ;; *) echo "::error::geçersiz hesap"; exit 1;; esac
          KOK=/opt/aesun/tiktok${H:+_$H}; D=docs/tampon/tiktok${H:+_$H}; mkdir -p ~/.ssh $D
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          O="-i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          tar czf /tmp/p.tgz sunucu/islem_tt_qr.sh sunucu/islem_tt_tarayici.sh
          ssh $O root@$ADRES "rm -rf /tmp/ttq && mkdir -p /tmp/ttq && tar xzf - -C /tmp/ttq && TT_HESAP=$H bash /tmp/ttq/sunucu/islem_tt_qr.sh < /dev/null" < /tmp/p.tgz | sed 's/^NOT: */::notice::/'
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          son=""
          for i in $(seq 1 55); do
            sleep 10
            scp -q $O root@$ADRES:$KOK/giris.json $D/giris.json 2>/dev/null || true
            scp -q $O root@$ADRES:$KOK/qr.png $D/qr.png 2>/dev/null || true
            scp -q $O root@$ADRES:$KOK/sayfa.png $D/sayfa.png 2>/dev/null || true
            h=$(sha1sum $D/qr.png $D/giris.json 2>/dev/null | sha1sum | cut -c1-12)
            if [ "$h" != "$son" ]; then
              son=$h; git add -A $D
              git diff --cached --quiet || { git commit -qm "TikTok QR ${H:-as}: $(TZ=Europe/Istanbul date +'%H:%M:%S')"; for t in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break || { echo "::warning::itme denemesi $t başarısız"; git rebase --abort 2>/dev/null; sleep 2; }; done; }
            fi
            grep -q '"ok": true' $D/giris.json 2>/dev/null && { echo "::notice::oturum açıldı"; break; }
            grep -q 'süre doldu\|bağlanılamadı' $D/giris.json 2>/dev/null && break
          done
          ssh $O root@$ADRES "docker logs --tail 30 tampon-qr${H:+-$H} 2>&1; docker rm -f tampon-qr${H:+-$H} >/dev/null 2>&1; rm -f $KOK/qr.png; rm -rf /tmp/ttq" > $D/gunluk.txt 2>&1 || true
          rm -f ~/.ssh/k
          git rm -q --ignore-unmatch $D/qr.png $D/sayfa.png; git add -A $D
          git diff --cached --quiet || { git commit -qm "TikTok QR ${H:-as}: bitti"; git pull -q --rebase origin main; git push -q origin HEAD:main; }
