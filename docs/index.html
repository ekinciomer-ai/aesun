<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEMonitoring</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cpath%20d%3D%22M60%208%20A52%2052%200%200%200%2060%20112%20Z%22%20fill%3D%22%23D7262E%22/%3E%3Cpath%20d%3D%22M60%208%20A52%2052%200%200%201%2060%20112%20Z%22%20fill%3D%22%232B2D31%22/%3E%3Cpath%20d%3D%22M20%2063%20H44%20L66%2030%20L76%2063%20H100%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2214%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..750&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9EDF2;font-family:'Archivo',system-ui,sans-serif;color:#10233F}
a{color:#10233F}a:hover{color:#2a78d6}
.num{font-variant-numeric:tabular-nums;font-stretch:88%}
.kab{display:flex;flex-wrap:wrap;min-height:100vh}
.nav{flex:1 1 232px;max-width:260px;background:#10233F;padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:#C9D3E0;font-size:14px;min-height:24px}
.nav a:hover{background:#1B3254;color:#fff}
.nav a.aktif{background:#fff;color:#10233F;font-weight:600}
.nav a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #86b6ef;outline-offset:2px}
.rozet{margin-left:auto;font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}
.rozet.k{background:#B42318;color:#fff}.rozet.u{background:#C98500;color:#10233F}
main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:24px;max-width:1240px}
.panel{background:#fff;border-radius:14px;border:1px solid #D5DCE5;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.k{font-size:13px;color:#4A5A70}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;font-stretch:105%}
h2{margin:0;font-size:20px;font-weight:700}
.bas{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px;background:#fff;color:#10233F;border:1px solid #B9C4D2}
.btn.koyu{background:#10233F;color:#fff;border-color:#10233F}
.btn.sec{background:#10233F;color:#fff;border-color:#10233F}
select{font:inherit;font-size:13px;border:1px solid #B9C4D2;border-radius:8px;padding:8px 10px;min-height:40px;background:#fff;color:#10233F}
.iki{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.uc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
ul.uy{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.uy li{display:flex;gap:12px;padding:10px 12px;border-radius:10px}
ul.uy li.kritik{background:#FDECEA}ul.uy li.uyari{background:#FFF4DC}
.sayaclar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px 0}
.sayac{padding:4px 18px;border-left:1px solid #E3E8EE;display:flex;flex-direction:column;gap:10px}
.cubuk{display:flex;gap:2px;height:26px}
.cubuk div:first-child{border-radius:4px 0 0 4px}.cubuk div:last-child{border-radius:0 4px 4px 0}
.cubuk div:only-child{border-radius:4px}
.kutular{display:flex;gap:3px;flex-wrap:wrap}.kutular span{width:14px;height:14px;border-radius:3px}
.durum-ok{font-size:13px;color:#1E7A3C;display:flex;align-items:center;gap:6px}
.durum-k{font-size:13px;color:#B42318;font-weight:600;display:flex;align-items:center;gap:6px}
.durum-u{font-size:13px;color:#9A5B00;font-weight:600;display:flex;align-items:center;gap:6px}
.hata{padding:20px;color:#B42318}
@media (max-width:700px){main{padding:20px 16px 40px}.nav{max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap;padding:14px}.nav .bosluk{display:none}.sayac{border-left:0;padding:4px 0}}
</style>
</head>
<body>
<div class="kab">
<nav class="nav" aria-label="Ana menü">
  <div style="display:flex;align-items:center;gap:10px;padding:4px 12px 24px 12px">
    <svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 8 A52 52 0 0 0 60 112 Z" fill="#E0353C"/><path d="M60 8 A52 52 0 0 1 60 112 Z" fill="#3A3D43"/><path d="M16 63 H38 L46 50 L56 82 L65 28 L74 63 H104" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div style="font-size:18px;color:#fff;font-stretch:110%"><b style="font-weight:800">AE</b><span style="font-weight:600;color:#F2555B">Monitoring</span></div>
    <div style="font-size:12px;color:#9FB0C6">Aksaray Enerji · GES izleme</div></div>
  </div>
  <a href="#genel" class="aktif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Genel bakış</a>
  <a href="#sayaclar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Sayaçlar ve mahsup</a>
  <a href="#inverterler"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>İnverterler<span id="r-inv"></span></a>
  <a href="#madencilik"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h4M7 14h2M15 10v4"/></svg>Madencilik<span id="r-mad"></span></a>
  <a href="#piyasa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Piyasa (PTF)</a>
  <a href="#genel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>Uyarılar<span id="r-uy"></span></a>
  <div class="bosluk" style="flex:1 1 auto;min-height:24px"></div>
  <div class="k" style="color:#9FB0C6;padding:0 12px;font-size:12px" id="kaynakNot"></div>
</nav>

<main id="genel">
  <header class="bas" style="align-items:flex-end">
    <div><h1>Genel bakış</h1><p style="margin:6px 0 0;font-size:15px;color:#4A5A70" id="altBaslik">Yükleniyor…</p></div>
    <div style="display:flex;gap:8px"><button class="btn koyu" type="button" onclick="yukle()">Yenile</button></div>
  </header>
  <div id="icerik"></div>
</main>
</div>

<script>
const KOK = 'https://raw.githubusercontent.com/ekinciomer-ai/epias-ptf/main/';
const LIMIT_2026 = 2905914;
const SAYAC = [
  { key: 'tekyildiz_1', kod: 'T1', ad: 'Tekyıldız 1', renk: '#2a78d6', mahsup: true, uretir: true },
  { key: 'tekyildiz_2', kod: 'T2', ad: 'Tekyıldız 2', renk: '#eb6834', mahsup: true, uretir: true },
  { key: 'aksaray_3', kod: 'A3', ad: 'Aksaray 3', renk: '#1baf7a', mahsup: true, uretir: false },
  { key: 'yilmaz_darilmaz', kod: 'YD', ad: 'Yılmaz Darılmaz', renk: '#C98500', mahsup: false, uretir: true },
  { key: 'anka_mineral', kod: 'Anka', ad: 'Anka Mineral', renk: '#d55181', mahsup: false, uretir: true },
  { key: 'aksaray_enerji', kod: 'AE', ad: 'Aksaray Enerji Üretim', renk: '#6b5bd6', mahsup: false, uretir: true }
];
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
let D = null, gunSayisi = 30, secAy = null;

const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const say = (v, h = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('tr-TR', { minimumFractionDigits: h, maximumFractionDigits: h });
const trSimdi = () => new Date(Date.now() + 3 * 3600000);
const bugunTR = () => trSimdi().toISOString().slice(0, 10);
const gunEkle = (g, n) => new Date(Date.parse(g + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const saatTR = iso => { if (!iso) return '—'; const d = new Date(new Date(iso).getTime() + 3 * 3600000); return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0'); };
const tarihK = g => { const [y, a, d] = g.split('-').map(Number); return d + ' ' + AYK[a - 1]; };
const ICON_K = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.2" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';
const ICON_U = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A5B00" stroke-width="2.2" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3l10 18H2z"/><path d="M12 10v4.5M12 17.5v.5"/></svg>';
const TIK = c => '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.5" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>';
const UNL = c => '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';

async function al(yol) {
  const r = await fetch(KOK + yol + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(yol + ' okunamadı (HTTP ' + r.status + ')');
  return r.json();
}

// OSOS: gün → { veris, cekis } toplamları ve saatlik mahsup
function gunluk(osos, key, gun) {
  const v = ((osos[key] || {}).veri || {})[gun];
  if (!v) return null;
  let veris = 0, cekis = 0, saat = 0;
  for (const [s, x] of Object.entries(v)) { veris += Number(x.veris) || 0; cekis += Number(x.cekis) || 0; saat = Math.max(saat, parseInt(s, 10) + 1); }
  return { veris, cekis, saat };
}
function mahsupGun(osos, gun) {
  let uretim = 0, tuketim = 0, mahsup = 0;
  for (let h = 0; h < 24; h++) {
    const s = String(h).padStart(2, '0');
    let u = 0, t = 0;
    for (const sc of SAYAC.filter(x => x.mahsup)) {
      const x = (((osos[sc.key] || {}).veri || {})[gun] || {})[s];
      if (x) { u += Number(x.veris) || 0; t += Number(x.cekis) || 0; }
    }
    uretim += u; tuketim += t; mahsup += Math.min(u, t);
  }
  return { uretim, tuketim, mahsup, bedelli: uretim - mahsup, sebeke: tuketim - mahsup };
}
function sonOsosSaati(osos) {
  let enSon = null;
  for (const sc of SAYAC) {
    const v = (osos[sc.key] || {}).veri || {};
    const g = Object.keys(v).sort().pop(); if (!g) continue;
    const s = Object.keys(v[g]).sort().pop();
    const t = g + ' ' + s; if (!enSon || t > enSon) enSon = t;
  }
  return enSon;
}

function spark(degerler, renk, etiket) {
  const max = Math.max(1, ...degerler);
  const n = degerler.length;
  const pts = degerler.map((v, i) => (n > 1 ? (i * 174 / (n - 1)) : 0).toFixed(1) + ',' + (38 - v / max * 36).toFixed(1)).join(' ');
  return '<svg width="100%" height="40" viewBox="0 0 174 40" preserveAspectRatio="none" role="img" aria-label="' + esc(etiket) + '" style="max-width:174px"><polyline fill="none" stroke="' + renk + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="' + pts + '"/></svg>';
}

function grafik(gunler, seriler) {
  const W = 840, H = 180;
  const max0 = Math.max(1, ...seriler.flatMap(s => s.v));
  const adim = Math.pow(10, Math.floor(Math.log10(max0)));
  const tavan = Math.ceil(max0 / adim) * adim;
  const n = gunler.length;
  const x = i => n > 1 ? i * W / (n - 1) : 0;
  const y = v => H - v / tavan * H;
  let s = '<svg viewBox="0 0 900 222" width="100%" style="min-width:640px;display:block" role="img" aria-label="Günlük üretim ve tüketim"><g font-family="Archivo, sans-serif" font-size="11" fill="#4A5A70">';
  for (let k = 0; k <= 3; k++) { const v = tavan * k / 3, yy = 10 + y(v); s += '<line x1="48" y1="' + yy + '" x2="900" y2="' + yy + '" stroke="' + (k ? '#E3E8EE' : '#B9C4D2') + '"/><text x="40" y="' + (yy + 4) + '" text-anchor="end">' + say(v) + '</text>'; }
  const et = [0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1];
  et.forEach((i, j) => { s += '<text x="' + (52 + x(i)) + '" y="212"' + (j === 3 ? ' text-anchor="end"' : '') + '>' + tarihK(gunler[i]) + '</text>'; });
  s += '</g><g transform="translate(52,10)">';
  for (const sr of seriler) {
    s += '<polyline fill="none" stroke="' + sr.renk + '" stroke-width="' + (sr.kalin ? 2.5 : 2) + '" stroke-linejoin="round" points="' + sr.v.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ') + '"><title>' + esc(sr.ad) + '</title></polyline>';
    s += '<circle cx="' + x(n - 1) + '" cy="' + y(sr.v[n - 1]) + '" r="4" fill="' + sr.renk + '" stroke="#fff" stroke-width="2"/>';
  }
  for (let i = 0; i < n; i++) s += '<rect x="' + (x(i) - W / n / 2) + '" y="0" width="' + (W / n) + '" height="' + H + '" fill="transparent"><title>' + tarihK(gunler[i]) + ' · ' + seriler.map(sr => sr.ad + ' ' + say(sr.v[i]) + ' kWh').join(' · ') + '</title></rect>';
  return s + '</g></svg>';
}

function ciz() {
  const { son, osos, mad } = D;
  const bugun = bugunTR();
  const simdiTR = trSimdi();
  const sonSaat = sonOsosSaati(osos);
  const sonOsosGun = sonSaat ? sonSaat.slice(0, 10) : bugun;
  const sonSaatNo = sonSaat ? parseInt(sonSaat.slice(11), 10) + 1 : 0;

  // ---- Uyarılar
  const uy = (son && son.uyarilar || []).filter(u => u.seviye === 'kritik' || u.seviye === 'uyari').map(u => ({ seviye: u.seviye, baslik: u.baslik, detay: u.detay || '' }));
  if (mad && mad.summary && mad.summary.offline > 0) {
    const off = (mad.devices || []).filter(d => !d.online && !d.sleeping).map(d => d.name);
    uy.push({ seviye: 'uyari', baslik: mad.summary.offline + ' madenci yanıt vermiyor', detay: off.join(', ') });
  }
  if (mad && mad.timestamp && (Date.now() - new Date(mad.timestamp + '+03:00').getTime()) / 60000 > 60) uy.push({ seviye: 'uyari', baslik: 'Saha madencilik verisi güncel değil', detay: 'Son kayıt ' + mad.timestamp.slice(0, 16).replace('T', ' ') });
  uy.sort((a, b) => (a.seviye === 'kritik' ? 0 : 1) - (b.seviye === 'kritik' ? 0 : 1));
  const kritikN = uy.filter(u => u.seviye === 'kritik').length;
  document.getElementById('r-uy').outerHTML = '<span id="r-uy" class="rozet ' + (kritikN ? 'k' : 'u') + '"' + (uy.length ? '' : ' hidden') + '>' + uy.length + '</span>';

  // ---- Başlık
  const g = simdiTR;
  document.getElementById('altBaslik').textContent = GUNLER[g.getUTCDay()] + ', ' + g.getUTCDate() + ' ' + AYLAR[g.getUTCMonth()] + ' ' + g.getUTCFullYear() + '. Sayaç verisi ' + tarihK(sonOsosGun) + ' ' + String(sonSaatNo).padStart(2, '0') + ':00\'e kadar, inverter verisi ' + saatTR(son && son.guncellendi) + ', saha ' + (mad && mad.timestamp ? mad.timestamp.slice(11, 16) : '—') + ' itibarıyla.';

  // ---- Ay seçimi ve enerji dengesi
  const ayList = [...new Set(Object.keys((osos.tekyildiz_1 || {}).veri || {}).map(x => x.slice(0, 7)))].sort().reverse();
  if (!secAy || !ayList.includes(secAy)) secAy = sonOsosGun.slice(0, 7);
  const ayGunleri = Object.keys((osos.tekyildiz_1 || {}).veri || {}).filter(x => x.startsWith(secAy)).sort();
  const ay = { uretim: 0, tuketim: 0, mahsup: 0, bedelli: 0, sebeke: 0 };
  for (const gg of ayGunleri) { const m = mahsupGun(osos, gg); for (const k in ay) ay[k] += m[k]; }
  let yilBedelli = 0;
  for (const gg of Object.keys((osos.tekyildiz_1 || {}).veri || {}).filter(x => x.startsWith(sonOsosGun.slice(0, 4)))) yilBedelli += mahsupGun(osos, gg).bedelli;
  const enBuyuk = Math.max(ay.uretim, ay.tuketim, 1);
  const limitPct = yilBedelli / LIMIT_2026 * 100;
  const [yy, aa] = secAy.split('-').map(Number);
  const aralik = ayGunleri.length ? Number(ayGunleri[0].slice(8)) + '–' + Number(ayGunleri[ayGunleri.length - 1].slice(8)) + ' ' + AYLAR[aa - 1] : '';

  const uyHtml = uy.length ? '<ul class="uy">' + uy.slice(0, 8).map(u => '<li class="' + u.seviye + '">' + (u.seviye === 'kritik' ? ICON_K : ICON_U) + '<div><div style="font-size:15px;font-weight:650;color:' + (u.seviye === 'kritik' ? '#7A1A12' : '#5E3800') + '">' + esc(u.baslik) + '</div>' + (u.detay ? '<div style="font-size:13px;color:' + (u.seviye === 'kritik' ? '#5B2A24' : '#5E3800') + ';margin-top:2px">' + esc(u.detay) + '</div>' : '') + '</div><span style="margin-left:auto;font-size:12px;font-weight:700;color:' + (u.seviye === 'kritik' ? '#B42318' : '#9A5B00') + ';flex:none">' + (u.seviye === 'kritik' ? 'Kritik' : 'Uyarı') + '</span></li>').join('') + '</ul>' + (uy.length > 8 ? '<div class="k">+' + (uy.length - 8) + ' uyarı daha</div>' : '') : '<p class="k" style="margin:0">Şu an dikkat isteyen bir durum yok.</p>';

  const denge = '<section class="panel" aria-labelledby="h-denge" style="gap:18px">'
    + '<div class="bas"><h2 id="h-denge">' + AYLAR[aa - 1] + ' enerji dengesi</h2><label class="k" style="display:flex;align-items:center;gap:8px">Ay <select id="aySec" onchange="secAy=this.value;ciz()">' + ayList.map(m => '<option value="' + m + '"' + (m === secAy ? ' selected' : '') + '>' + AYLAR[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4) + '</option>').join('') + '</select></label></div>'
    + '<div class="k" style="margin-top:-10px">Saatlik mahsup, ' + aralik + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:14px;font-weight:600">Üretim (T1 + T2)</span><span class="num" style="font-size:22px;font-weight:700">' + say(ay.uretim) + ' <span style="font-size:13px;font-weight:500;color:#4A5A70">kWh</span></span></div>'
    + '<div class="cubuk" style="width:' + (ay.uretim / enBuyuk * 100).toFixed(1) + '%">' + (ay.mahsup ? '<div style="flex:' + ay.mahsup + ' 1 0;background:#1baf7a"></div>' : '') + (ay.bedelli ? '<div style="flex:' + ay.bedelli + ' 1 0;background:#eda100"></div>' : '') + '</div></div>'
    + '<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:14px;font-weight:600">Tüketim (T1 + T2 + A3)</span><span class="num" style="font-size:22px;font-weight:700">' + say(ay.tuketim) + ' <span style="font-size:13px;font-weight:500;color:#4A5A70">kWh</span></span></div>'
    + '<div class="cubuk" style="width:' + (ay.tuketim / enBuyuk * 100).toFixed(1) + '%">' + (ay.mahsup ? '<div style="flex:' + ay.mahsup + ' 1 0;background:#1baf7a"></div>' : '') + (ay.sebeke ? '<div style="flex:' + ay.sebeke + ' 1 0;background:#eb6834"></div>' : '') + '</div></div>'
    + '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:4px">'
    + [['Mahsuplaşan', '#1baf7a', ay.mahsup], ['Bedelli satış', '#eda100', ay.bedelli], ['Şebekeden alınan', '#eb6834', ay.sebeke]].map(([ad, r, v]) => '<div><div class="k" style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:' + r + '"></span>' + ad + '</div><div class="num" style="font-size:20px;font-weight:700;margin-top:2px">' + say(v) + '</div></div>').join('') + '</div>'
    + '<div style="border-top:1px solid #E3E8EE;padding-top:14px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span style="font-size:14px;font-weight:600">' + sonOsosGun.slice(0, 4) + ' bedelli satış limiti</span><span class="num" style="font-size:14px"><strong>' + say(yilBedelli) + '</strong> / ' + say(LIMIT_2026) + ' kWh</span></div>'
    + '<div role="meter" aria-label="Bedelli satış limiti kullanımı" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(limitPct) + '" style="height:10px;background:#E3E8EE;border-radius:5px;overflow:hidden"><div style="width:' + Math.min(100, limitPct).toFixed(1) + '%;height:100%;background:' + (limitPct >= 80 ? '#B42318' : '#1E7A3C') + ';border-radius:5px"></div></div>'
    + '<div class="k">Yüzde ' + say(limitPct, 1) + ' kullanıldı. Yüzde 80\'de uyarı verilecek. (OSOS kayıtlarından, ' + sonOsosGun.slice(0, 4) + ' başından bugüne)</div></div></section>';

  // ---- Sayaçlar
  const otuz = []; for (let i = 29; i >= 0; i--) otuz.push(gunEkle(sonOsosGun, -i));
  const uyAnahtar = new Set((son && son.uyarilar || []).map(u => u.anahtar));
  const sayaclar = SAYAC.map((sc, i) => {
    const o = osos[sc.key] || {};
    const bg = gunluk(osos, sc.key, sonOsosGun) || { veris: 0, cekis: 0, saat: 0 };
    const seri = otuz.map(gg => { const x = gunluk(osos, sc.key, gg); return x ? (sc.uretir ? x.veris : x.cekis) : 0; });
    const sonG = Object.keys(o.veri || {}).sort().pop();
    const yasSaat = sonG ? (Date.now() - Date.parse(sonG + 'T00:00:00Z') + 3 * 3600000 - (gunluk(osos, sc.key, sonG).saat) * 3600000) / 3600000 : 999;
    const durdu = uyAnahtar.has('osos:uretim_durdu:' + o.tesisat_no);
    const durum = durdu ? '<div class="durum-k">' + UNL('#B42318') + 'Üretim durdu</div>' : (yasSaat > 30 ? '<div class="durum-u">' + UNL('#9A5B00') + 'Veri gecikti</div>' : '<div class="durum-ok">' + TIK('#1E7A3C') + 'Veri güncel</div>');
    return '<div class="sayac"' + (i === 0 ? ' style="border-left:0;padding-left:0"' : '') + '>'
      + '<div style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:' + sc.renk + '"></span><span style="font-size:17px;font-weight:700">' + sc.kod + '</span><span class="k">' + esc(sc.ad) + '</span></div>'
      + '<div class="k">' + esc(o.tesisat_no || '') + (sc.mahsup ? ' · mahsupta' : ' · sadece izleme') + '</div>'
      + (sc.uretir
        ? '<div><div class="k">Üretim</div><div class="num" style="font-size:24px;font-weight:700' + (durdu ? ';color:#B42318' : '') + '">' + say(bg.veris) + ' <span style="font-size:13px;font-weight:500;color:#4A5A70">kWh</span></div></div><div class="k">Tüketim <span class="num" style="color:#10233F;font-weight:600">' + say(bg.cekis) + ' kWh</span></div>'
        : '<div><div class="k">Tüketim</div><div class="num" style="font-size:24px;font-weight:700">' + say(bg.cekis) + ' <span style="font-size:13px;font-weight:500;color:#4A5A70">kWh</span></div></div><div class="k">Üretim yok</div>')
      + spark(seri, sc.renk, sc.kod + ' son 30 gün ' + (sc.uretir ? 'üretimi' : 'tüketimi')) + durum + '</div>';
  }).join('');

  // ---- Mahsup havuzu grafiği
  const tamSon = sonSaatNo >= 24 ? sonOsosGun : gunEkle(sonOsosGun, -1);
  const gunler = []; for (let i = gunSayisi - 1; i >= 0; i--) gunler.push(gunEkle(tamSon, -i));
  const mg = gunler.map(gg => mahsupGun(osos, gg));
  const trend = '<section class="panel" aria-labelledby="h-trend" style="gap:12px"><div class="bas"><h2 id="h-trend">Mahsup havuzu, son ' + gunSayisi + ' gün</h2>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' + [30, 90, 180].map(n => '<button type="button" class="btn' + (n === gunSayisi ? ' sec' : '') + '" onclick="gunSayisi=' + n + ';ciz()">' + n + ' gün</button>').join('') + '</div></div>'
    + '<div style="display:flex;gap:18px;font-size:13px;color:#4A5A70"><span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:3px;border-radius:2px;background:#2a78d6"></span>Üretim (T1 + T2)</span><span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:3px;border-radius:2px;background:#eb6834"></span>Tüketim (T1 + T2 + A3)</span><span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:3px;border-radius:2px;background:#1baf7a"></span>Mahsuplaşan</span></div>'
    + '<div style="overflow-x:auto">' + grafik(gunler, [{ ad: 'Tüketim', renk: '#eb6834', v: mg.map(m => Math.round(m.tuketim)) }, { ad: 'Mahsuplaşan', renk: '#1baf7a', v: mg.map(m => Math.round(m.mahsup)) }, { ad: 'Üretim', renk: '#2a78d6', kalin: true, v: mg.map(m => Math.round(m.uretim)) }]) + '</div>'
    + '<div class="k">Tamamlanmış günler (' + tarihK(gunler[0]) + '–' + tarihK(tamSon) + '). Toplam: üretim ' + say(mg.reduce((t, m) => t + m.uretim, 0)) + ' kWh · tüketim ' + say(mg.reduce((t, m) => t + m.tuketim, 0)) + ' kWh · mahsuplaşan ' + say(mg.reduce((t, m) => t + m.mahsup, 0)) + ' kWh</div></section>';

  // ---- İnverterler
  const santraller = (son && son.son || []).filter(r => ['sungrow', 'fusion', 'inavitas'].includes(r.kaynak));
  const invUy = uy.filter(u => /inverter|şebeke|üretim saatinde|Sungrow|Inavitas|FusionSolar/i.test(u.baslik)).length;
  document.getElementById('r-inv').outerHTML = '<span id="r-inv" class="rozet k"' + (invUy ? '' : ' hidden') + '>' + invUy + '</span>';
  const kaynakSatir = (ad, k) => {
    const rs = santraller.filter(r => r.kaynak === k);
    const ozet = son && son.ozet ? son.ozet[k] : null;
    if (ozet === 'kapali') return '<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:650">' + ad + '</span><span style="font-size:12px;font-weight:700;color:#3B5878">Bağlı değil</span></div><div class="k">Kimlik bilgisi eklenince santraller burada görünecek.</div>';
    if (!rs.length) return '<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:650">' + ad + '</span><span style="font-size:12px;font-weight:700;color:#3B5878">Veri yok</span></div>';
    const hatali = rs.find(r => r.durum !== 'ok');
    const top = rs.reduce((t, r) => t + (Number(r.guc_kw) || 0), 0), gun = rs.reduce((t, r) => t + (Number(r.gunluk_kwh) || 0), 0);
    const invT = rs.reduce((t, r) => t + ((r.ek || {}).inv_toplam || 0), 0), invU = rs.reduce((t, r) => t + ((r.ek || {}).inv_uretmeyen || 0), 0);
    const plant = rs.filter(r => r.plant_id !== '*');
    return '<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:650">' + ad + '</span><span style="font-size:12px;font-weight:700;color:' + (hatali ? '#B42318' : '#1E7A3C') + '">' + (hatali ? (hatali.durum === 'bayat' ? 'Bayat' : 'Hata') : 'Bağlı · ' + saatTR(rs[0].son_ok_ts)) + '</span></div>'
      + (plant.length ? '<div class="k">' + plant.length + ' santral' + (invT ? ', ' + invT + ' inverter' : '') + '. Anlık ' + say(top, 1) + ' kW, bugün ' + say(gun) + ' kWh' + (invT ? ', ' + (invT - invU) + '/' + invT + ' üretiyor' : '') + '.</div>' : '')
      + plant.map(r => '<div style="display:flex;justify-content:space-between;font-size:13px"><span>' + esc(r.ad) + '</span><span class="num">' + say(r.guc_kw, 1) + ' kW · ' + say(r.gunluk_kwh) + ' kWh</span></div>').join('')
      + (hatali ? '<div class="k" style="color:#7A1A12">' + esc(String(hatali.hata_mesaji || '').replace(/^(GIRIS|OTURUM|LIMIT): /, '').slice(0, 160)) + '</div>' : '');
  };
  const inv = '<section class="panel" id="inverterler" aria-labelledby="h-inv"><h2 id="h-inv">İnverterler</h2>'
    + '<div style="display:flex;flex-direction:column;gap:6px">' + kaynakSatir('Sungrow', 'sungrow') + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #E3E8EE;padding-top:12px">' + kaynakSatir('FusionSolar', 'fusion') + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #E3E8EE;padding-top:12px">' + kaynakSatir('Inavitas', 'inavitas') + '</div>'
    + '<div class="k" style="margin-top:auto">Saha Pi: ' + (son && son.pi && son.pi.son_ts ? 'nabız ' + saatTR(son.pi.son_ts) : 'henüz nabız yok') + '</div></section>';

  // ---- Madencilik
  let madH = '<section class="panel" id="madencilik"><h2>Madencilik</h2><p class="k">Saha verisi okunamadı.</p></section>', gelirH = '';
  if (mad && mad.summary) {
    const s = mad.summary;
    const offN = s.offline || 0;
    document.getElementById('r-mad').outerHTML = '<span id="r-mad" class="rozet u"' + (offN ? '' : ' hidden') + '>' + offN + '</span>';
    madH = '<section class="panel" id="madencilik" aria-labelledby="h-mine"><div class="bas"><h2 id="h-mine">Madencilik</h2><span class="k">Saha PC ' + esc((mad.timestamp || '').slice(11, 16)) + '</span></div>'
      + '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">'
      + '<div><div class="k">Çalışan cihaz</div><div class="num" style="font-size:24px;font-weight:700">' + s.online + ' <span style="font-size:15px;font-weight:500;color:#4A5A70">/ ' + s.total + '</span></div></div>'
      + '<div><div class="k">Toplam hash</div><div class="num" style="font-size:24px;font-weight:700">' + say(s.total_hashrate_TH) + ' <span style="font-size:13px;font-weight:500;color:#4A5A70">TH/s</span></div></div>'
      + '<div><div class="k">Hedefe göre</div><div class="num" style="font-size:24px;font-weight:700">%' + say(s.efficiency_pct) + '</div></div>'
      + '<div><div class="k">Ortalama sıcaklık</div><div class="num" style="font-size:24px;font-weight:700">' + say(s.avg_temp_C) + ' <span style="font-size:13px;font-weight:500;color:#4A5A70">°C</span></div></div></div>'
      + '<div class="kutular" role="img" aria-label="' + s.total + ' cihaz: ' + s.online + ' çalışıyor, ' + offN + ' yanıt vermiyor">' + (mad.devices || []).map(d => '<span title="' + esc(d.name + ' · ' + (d.online ? say(d.hashrate_TH, 1) + ' TH/s · ' + (d.temp_max ?? '—') + '°C' : d.status)) + '" style="background:' + (d.online ? (d.health_issues && d.health_issues.some(h => h.severity === 'high') ? '#C98500' : '#1E7A3C') : (d.sleeping ? '#9AA6B5' : '#B42318')) + '"></span>').join('') + '</div>'
      + '<div class="k" style="display:flex;gap:14px;flex-wrap:wrap"><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#1E7A3C"></span> çalışıyor</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#C98500"></span> sıcaklık uyarısı</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#B42318"></span> yanıt yok</span></div></section>';
    const ay6 = (mad.monthly_history || []).slice().sort((a, b) => a.month.localeCompare(b.month)).slice(-6);
    const btcVar = ay6.some(m => m.earn_btc > 0);
    const deger = m => btcVar ? m.earn_btc : m.avg_hash_TH;
    const mx = Math.max(1, ...ay6.map(deger));
    const bw = 280 / Math.max(ay6.length, 1);
    const sonAy = ay6[ay6.length - 1];
    gelirH = '<section class="panel" aria-labelledby="h-gelir"><div class="bas"><h2 id="h-gelir">' + (btcVar ? 'Mining geliri' : 'Hash geçmişi') + '</h2><span class="k">' + (btcVar ? 'F2Pool, aylık BTC' : 'Aylık ortalama TH/s') + '</span></div>'
      + (sonAy ? '<div><div class="k">' + AYLAR[Number(sonAy.month.slice(5)) - 1] + (sonAy.days ? ' (' + sonAy.days + ' gün)' : '') + '</div><div class="num" style="font-size:24px;font-weight:700">' + (btcVar ? say(sonAy.earn_btc, 5) + ' BTC' : say(sonAy.avg_hash_TH) + ' <span style="font-size:15px;font-weight:500;color:#4A5A70">TH/s</span>') + '</div></div>' : '')
      + '<svg viewBox="0 0 280 110" width="100%" role="img" aria-label="Aylık geçmiş"><g font-family="Archivo, sans-serif" font-size="11" fill="#4A5A70" text-anchor="middle">'
      + ay6.map((m, i) => { const h = deger(m) / mx * 79; return '<rect x="' + (i * bw + 8) + '" y="' + (89 - h) + '" width="' + (bw - 14) + '" height="' + h + '" rx="4" fill="' + (i === ay6.length - 1 ? '#86b6ef' : '#2a78d6') + '"><title>' + m.month + ': ' + (btcVar ? say(m.earn_btc, 5) + ' BTC' : say(m.avg_hash_TH) + ' TH/s') + '</title></rect><text x="' + (i * bw + bw / 2 + 1) + '" y="104">' + AYK[Number(m.month.slice(5)) - 1] + '</text>'; }).join('')
      + '<line x1="0" y1="89" x2="280" y2="89" stroke="#B9C4D2"/></g></svg>'
      + (btcVar ? '' : '<div class="k" style="border-top:1px solid #E3E8EE;padding-top:12px">BTC kazanç verisi şu an gelmiyor: F2Pool eşleşmesi ' + ((s.f2pool || {}).matched_devices || 0) + '/' + s.total + ' cihaz.</div>') + '</section>';
  }

  // ---- PTF
  const ep = (son && son.son || []).find(r => r.kaynak === 'epias');
  let ptfH = '<section class="panel" id="piyasa"><h2>PTF bugün</h2><p class="k" style="margin:0">EPİAŞ verisi henüz alınmadı.</p></section>';
  if (ep && ep.ek && Array.isArray(ep.ek.bugun_ptf)) {
    const e = ep.ek;
    const dizi = e.bugun === bugun ? e.bugun_ptf : (e.yarin === bugun ? e.yarin_ptf : e.bugun_ptf);
    const oz = e.bugun === bugun ? e.bugun_ozet : (e.yarin === bugun ? e.yarin_ozet : e.bugun_ozet);
    const mx = Math.max(1, ...dizi.filter(v => v != null));
    const sa = simdiTR.getUTCHours();
    ptfH = '<section class="panel" id="piyasa" aria-labelledby="h-ptf"><div class="bas"><h2 id="h-ptf">PTF bugün</h2><span class="k">TL/MWh · yarın ' + (e.yarin_var ? 'alındı' : 'henüz yok') + '</span></div>'
      + '<div><div class="k">Şu an (' + String(sa).padStart(2, '0') + ':00)</div><div class="num" style="font-size:24px;font-weight:700">' + say(dizi[sa], 2) + '</div></div>'
      + '<div style="display:flex;align-items:flex-end;gap:2px;height:90px">' + dizi.map((v, i) => '<span title="' + String(i).padStart(2, '0') + ':00 · ' + say(v, 2) + '" style="flex:1;border-radius:2px 2px 0 0;height:' + (v == null ? 2 : Math.max(2, Math.round(v / mx * 88))) + 'px;background:' + (v == null ? '#E3E8EE' : (i === sa ? '#10233F' : '#2a78d6')) + '"></span>').join('') + '</div>'
      + '<div class="k num" style="display:flex;justify-content:space-between"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>'
      + (oz ? '<div class="k">Ortalama ' + say(oz.ort, 2) + ' · en düşük ' + say(oz.min, 2) + ' · en yüksek ' + say(oz.max, 2) + '</div>' : '') + '</section>';
  }

  document.getElementById('icerik').innerHTML =
    '<div style="display:flex;flex-direction:column;gap:24px">'
    + '<div class="iki"><section class="panel" aria-labelledby="h-uyari"><div class="bas"><h2 id="h-uyari">Dikkat isteyenler</h2><span class="k">' + uy.length + ' etkin</span></div>' + uyHtml + '</section>' + denge + '</div>'
    + '<section class="panel" id="sayaclar" aria-labelledby="h-abone" style="gap:16px"><div class="bas"><h2 id="h-abone">Sayaçlar</h2><span class="k">' + tarihK(sonOsosGun) + ' 00:00–' + String(sonSaatNo).padStart(2, '0') + ':00, son 30 gün çizgisi</span></div><div class="sayaclar">' + sayaclar + '</div></section>'
    + trend
    + '<div class="uc">' + inv + madH + gelirH + ptfH + '</div>'
    + '</div>';
  document.getElementById('kaynakNot').textContent = 'Veri: n8n · OSOS · saha PC';
}

async function yukle() {
  try {
    const [son, osos, mad] = await Promise.all([
      al('n8n/aesun_son.json').catch(() => null),
      al('2026_osos_endeks.json'),
      al('antminer_panel.json').catch(() => null)
    ]);
    D = { son: son && Array.isArray(son.son) ? son : null, osos, mad };
    ciz();
  } catch (e) {
    if (!D) document.getElementById('icerik').innerHTML = '<div class="panel hata">Veri okunamadı: ' + esc(e.message || e) + '</div>';
  }
}
yukle();
setInterval(yukle, 180000);
</script>
</body>
</html>
