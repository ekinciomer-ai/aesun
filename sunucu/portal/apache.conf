# aesun-web: aksarayenerji.net (kurumsal site) + portal.aksarayenerji.net — Hostigen cPanel yerine (30 Eki 2026)
ServerTokens Prod
ServerSignature Off
<Directory /ev/p>
    AllowOverride All
    Require all granted
</Directory>
<VirtualHost *:80>
    ServerName aksarayenerji.net
    ServerAlias www.aksarayenerji.net
    DocumentRoot /ev/p/site
</VirtualHost>
<VirtualHost *:80>
    ServerName portal.aksarayenerji.net
    ServerAlias www.portal.aksarayenerji.net
    DocumentRoot /ev/p/portal
</VirtualHost>
