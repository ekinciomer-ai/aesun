<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Kodla Film Stilleri: Antik Stüdyo deneme</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// 5 stil x 3 sn = 15 sn. Her sahne draw(g,t) saf fonksiyon; rastgelelik tohumlu.
const W=1080,H=1920,c=document.getElementById('c'),g=c.getContext('2d');
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-cl(x),3), lerp=(a,b,x)=>a+(b-a)*x;
function yazi(t,x,y,boy,renk,font='Georgia, serif',hiza='center',agirlik='700'){g.font=`${agirlik} ${boy}px ${font}`;g.fillStyle=renk;g.textAlign=hiza;g.textBaseline='middle';g.fillText(t,x,y)}
function etiket(no,ad,renk,zemin){g.fillStyle=zemin;g.fillRect(70,110,560,84);yazi(no+' · '+ad,350,153,40,renk,'Georgia, serif','center','700')}
function piramit(cx,by,w,h){g.beginPath();g.moveTo(cx-w/2,by);g.lineTo(cx,by-h);g.lineTo(cx+w/2,by);g.closePath()}

// 1) UKIYO-E: washi, bokashi gök, blok blok baskı, 2px kayık, kırmızı mühür, dikey kartuş
function ukiyoe(t){
  const r=rng(11);g.fillStyle='#efe3c8';g.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){g.fillStyle=`rgba(120,90,50,${r()*0.06})`;g.fillRect(r()*W,r()*H,r()*40,1)}
  const p1=ease(t/0.6),p2=ease((t-0.5)/0.6),p3=ease((t-1.0)/0.6),p4=ease((t-1.5)/0.5);
  let gr=g.createLinearGradient(0,0,0,900);gr.addColorStop(0,`rgba(38,70,120,${0.9*p1})`);gr.addColorStop(1,'rgba(38,70,120,0)');g.fillStyle=gr;g.fillRect(0,0,W,900);
  g.fillStyle=`rgba(214,80,50,${p1})`;g.beginPath();g.arc(760,520,120,0,7);g.fill();
  // kum blokları (2px kayık baskı)
  g.save();g.translate(2,2);g.fillStyle=`rgba(196,150,80,${p2})`;g.fillRect(0,1300,W,620);g.restore();
  // dalga çizgileri
  g.strokeStyle=`rgba(40,30,20,${p3})`;g.lineWidth=5;
  for(let k=0;k<6;k++){g.beginPath();for(let x=0;x<=W;x+=20)g.lineTo(x,1380+k*90+Math.sin(x/70+k)*14);g.stroke()}
  // piramit blokları
  g.fillStyle=`rgba(170,110,55,${p2})`;piramit(470,1320,820,700*p2);g.fill();
  g.fillStyle=`rgba(120,75,35,${p3})`;g.beginPath();g.moveTo(470,1320-700);g.lineTo(880,1320);g.lineTo(470,1320);g.closePath();g.fill();
  g.strokeStyle=`rgba(25,20,15,${p3})`;g.lineWidth=7;piramit(470,1320,820,700);g.stroke();
  // dikey kartuş
  g.fillStyle=`rgba(245,236,214,${p4})`;g.fillRect(900,260,110,520);g.strokeStyle=`rgba(25,20,15,${p4})`;g.lineWidth=4;g.strokeRect(900,260,110,520);
  ['F','İ','R','A','V','U','N'].forEach((h,i)=>yazi(h,955,310+i*68,54,`rgba(25,20,15,${p4})`,'Georgia, serif'));
  // kırmızı mühür (tek vurgu)
  const m=ease((t-2.1)/0.3);g.fillStyle=`rgba(190,30,30,${m})`;g.fillRect(890,800,130,130);yazi('印',955,868,80,`rgba(255,240,230,${m})`,'serif');
  // altyazı
  const a=ease((t-0.8)/0.5);g.fillStyle=`rgba(25,20,15,${0.85*a})`;g.fillRect(90,1640,900,120);yazi('Hemiunu: Efendim, piramit bitti.',540,1700,46,`rgba(245,236,214,${a})`);
  etiket('01','UKIYO-E','#efe3c8','#1d1610');
  // el kaydırma geçişi (sona doğru)
  if(t>2.6){g.fillStyle='#1d1610';g.fillRect(0,0,W*ease((t-2.6)/0.4),H)}
}

// 2) SESSİZ FİLM: sepya, 16 fps hareket, 24 fps gren, kapı sallantısı, çizik, ara yazı kartı
function sessiz(t){
  const tq=Math.floor(t*16)/16, fr=Math.floor(t*24), r=rng(100+fr);
  const sx=(r()-.5)*8, sy=(r()-.5)*10;g.save();g.translate(sx,sy);
  const kart=t>1.3;
  if(!kart){
    let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#c9b48a');gr.addColorStop(1,'#5a4630');g.fillStyle=gr;g.fillRect(-20,-20,W+40,H+40);
    g.fillStyle='#3b2c1c';piramit(540,1450,900,760);g.fill();
    // figür: firavun yukarı bakıyor (16 fps)
    const x=lerp(250,420,cl(tq/1.2));g.fillStyle='#1e150c';g.fillRect(x,1300,46,160);g.beginPath();g.arc(x+23,1275,34,0,7);g.fill();
    g.fillRect(x-10,1230,66,22);
  } else {
    g.fillStyle='#14100b';g.fillRect(-20,-20,W+40,H+40);
    g.strokeStyle='#d9c79e';g.lineWidth=6;g.strokeRect(120,640,840,640);g.lineWidth=2;g.strokeRect(140,660,800,600);
    const a=ease((t-1.35)/0.3);yazi('FİRAVUN:',540,830,58,`rgba(230,215,180,${a})`,'Georgia, serif');
    yazi('"Ucu neden',540,960,76,`rgba(230,215,180,${a})`,'Georgia, serif');yazi('sivri?"',540,1060,76,`rgba(230,215,180,${a})`,'Georgia, serif');
  }
  g.restore();
  // gren + titreşim + çizik + vinyet
  const fl=0.88+r()*0.18;g.fillStyle=`rgba(0,0,0,${1-fl})`;g.fillRect(0,0,W,H);
  for(let i=0;i<1600;i++){g.fillStyle=`rgba(${r()<.5?0:255},${r()<.5?0:240},200,${r()*0.08})`;g.fillRect(r()*W,r()*H,2,2)}
  if(r()<0.6){g.strokeStyle='rgba(240,230,200,0.35)';g.lineWidth=2;const x=r()*W;g.beginPath();g.moveTo(x,0);g.lineTo(x+(r()-.5)*30,H);g.stroke()}
  let v=g.createRadialGradient(W/2,H/2,300,W/2,H/2,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.85)');g.fillStyle=v;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(112,66,20,0.18)';g.fillRect(0,0,W,H);
  etiket('02','SESSİZ FİLM','#e6d7b4','#000');
}

// 3) KÂĞIT KESİK: katmanlar alttan kalkar, gölgeli, delik; altın yalnız bir kez
function kagit(t){
  g.fillStyle='#f1e2c9';g.fillRect(0,0,W,H);
  const renk=['#7a0e12','#9c1419','#c0201f','#de3a2c'];
  for(let k=0;k<4;k++){
    const p=ease((t-k*0.25)/0.6), y0=H-(k*230+420)*p;
    g.save();g.shadowColor='rgba(40,0,0,0.45)';g.shadowBlur=30;g.shadowOffsetY=-12;g.fillStyle=renk[k];
    g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=36)g.lineTo(x,y0+Math.sin(x/90+k*1.7)*40+(k%2?18:0));g.lineTo(W,H);g.closePath();g.fill();g.restore();
  }
  // piramit katmanı, içinde kapı deliği (destination-out)
  const pp=ease((t-0.8)/0.6);
  const lay=document.createElement('canvas');lay.width=W;lay.height=H;const l=lay.getContext('2d');
  l.fillStyle='#5e0a0d';l.beginPath();l.moveTo(540-380,1250);l.lineTo(540,1250-620);l.lineTo(540+380,1250);l.closePath();l.fill();
  l.globalCompositeOperation='destination-out';l.fillRect(510,1160,60,90);l.beginPath();l.arc(540,1160,30,0,7);l.fill();
  g.save();g.globalAlpha=pp;g.shadowColor='rgba(40,0,0,0.5)';g.shadowBlur=36;g.shadowOffsetY=14;g.drawImage(lay,0,(1-pp)*400);g.restore();
  // tek altın: tepe taşı (taş bitti şakası)
  const gp=ease((t-1.8)/0.4);g.fillStyle=`rgba(212,170,60,${gp})`;g.beginPath();g.moveTo(540,630-10);g.lineTo(565,670);g.lineTo(515,670);g.closePath();g.fill();
  const a=ease((t-1.1)/0.4);g.fillStyle=`rgba(94,10,13,${0.92*a})`;g.fillRect(90,330,900,130);yazi('Hemiunu: Taş bitti efendim.',540,395,48,`rgba(241,226,201,${a})`);
  etiket('03','KÂĞIT KESİK','#f1e2c9','#5e0a0d');
}

// 4) MÜREKKEP: pirinç kâğıdı, sise eriyen tepeler, fırça darbesi, tek vermilyon mühür
function murekkep(t){
  g.fillStyle='#f4efe3';g.fillRect(0,0,W,H);const r=rng(44);
  for(let i=0;i<500;i++){g.fillStyle=`rgba(90,80,60,${r()*0.05})`;g.fillRect(r()*W,r()*H,r()*30,1)}
  for(let k=0;k<3;k++){
    const p=ease((t-k*0.3)/0.9), by=1250+k*170, al=(0.85-k*0.25)*p;
    let gr=g.createLinearGradient(0,by-650,0,by+120);gr.addColorStop(0,`rgba(20,20,20,${al})`);gr.addColorStop(0.7,`rgba(20,20,20,${al*0.35})`);gr.addColorStop(1,'rgba(20,20,20,0)');
    g.fillStyle=gr;piramit(260+k*290,by+120,640-k*90,620-k*120);g.fill();
  }
  // fırça darbesi (yazarken uzayan)
  const fp=ease((t-0.6)/1.0);g.strokeStyle='rgba(15,15,15,0.92)';g.lineCap='round';
  for(let i=0;i<14;i++){g.lineWidth=26-i*1.5;g.beginPath();g.moveTo(140,520+i*2);g.quadraticCurveTo(540,430+i*3,140+800*fp,560+i*2);g.stroke()}
  const a=ease((t-1.3)/0.5);yazi('"Bilerek yaptık" deyin.',540,760,62,`rgba(15,15,15,${a})`,'Georgia, serif','center','400');
  const m=ease((t-2.0)/0.3);g.fillStyle=`rgba(200,50,30,${m})`;g.fillRect(850,820,110,110);yazi('令',905,878,70,`rgba(250,240,230,${m})`,'serif');
  etiket('04','MÜREKKEP','#f4efe3','#141414');
}

// 5) VİTRAY: voronoi cam parçaları, kurşun çizgi, arkadan artan ışık; final marka
function vitray(t){
  const r=rng(7),N=70,pts=[];for(let i=0;i<N;i++)pts.push([r()*W,r()*H]);
  const isik=ease(t/1.6), S=12, renk=['#1f4fa3','#2c7a3e','#b8322c','#d9a52a','#5a2f8a','#1f8a8a'];
  const kim=[];for(let i=0;i<N;i++)kim.push(renk[Math.floor(r()*renk.length)]);
  for(let y=0;y<H;y+=S)for(let x=0;x<W;x+=S){
    let b=0,bd=1e12,d2=1e12;for(let i=0;i<N;i++){const d=(pts[i][0]-x)**2+(pts[i][1]-y)**2;if(d<bd){d2=bd;bd=d;b=i}else if(d<d2)d2=d}
    const ic=(x>540-400+Math.abs(y-1500)*0)&&(y>1500-700)&&(y<1500)&&(Math.abs(x-540)<(y-(1500-700))*400/700);
    if(Math.sqrt(d2)-Math.sqrt(bd)<10){g.fillStyle='#16110c'}else{g.fillStyle=ic?'#c98b2e':kim[b]}
    g.globalAlpha=ic?1:0.35+0.65*isik;g.fillRect(x,y,S,S);g.globalAlpha=1;
  }
  let gl=g.createRadialGradient(540,900,50,540,900,900);gl.addColorStop(0,`rgba(255,240,200,${0.35*isik})`);gl.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
  const k=ease((t-1.7)/0.5);g.fillStyle=`rgba(10,8,6,${0.85*k})`;g.fillRect(0,700,W,420);
  yazi('ANTİK STÜDYO',540,860,112,`rgba(255,207,102,${k})`,'Georgia, serif','center','900');
  yazi('Tarih, bugünün diliyle.',540,990,46,`rgba(243,227,194,${k})`,'Georgia, serif','center','400');
  etiket('05','VİTRAY','#ffcf66','#16110c');
}

const SAHNE=[ukiyoe,sessiz,kagit,murekkep,vitray], SURE=3, TOPLAM=SAHNE.length*SURE;
window.TOPLAM=TOPLAM;
window.renderAt=function(t){const i=Math.min(SAHNE.length-1,Math.floor(t/SURE));g.save();SAHNE[i](t-i*SURE);g.restore()};
window.__REC=true; window.renderAt(4);
</script></body></html>
