<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>Shazam — Bu Matematik Hayatında Nerede? · Kozmos Lab</title>
<style>html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center}canvas{height:100vh;max-width:100vw;aspect-ratio:9/16}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>window.TM={"A": [0, 8.28], "B": [8.28, 13.82], "C": [13.82, 23.14], "D": [23.14, 27.16], "E": [27.16, 40.64], "F": [40.64, 46.5]};window.SUB=[[0.3, 1.92, "Kafede bir şarkı çalıyor."], [1.92, 6.64, "Telefonunu kaldırıyorsun ve birkaç saniyede şarkının adı ekranda."], [6.64, 8.28, "Shazam bunu nasıl yapıyor?"], [8.28, 13.82, "Önce dönen çemberler: Fourier, sesi an be an frekanslarına ayırıp bir harita çıkarır."], [13.82, 17.0, "Sonra en güçlü noktalar seçilir, gerisi atılır."], [17.0, 19.16, "Geriye bir yıldız haritası kalır."], [19.16, 23.14, "Shazam'ın kurucularından biri buna gerçekten takımyıldız haritası diyor."], [23.14, 27.16, "Noktalar ikişer ikişer bağlanır, her çift küçük bir parmak izi olur."], [27.16, 33.2, "Telefonundaki parmak izleri, milyonlarca şarkının içinde aynı aralıklarla dizilmiş olanı arar."], [33.2, 35.06, "Eşleşti: işte şarkın."], [35.06, 40.64, "Gürültülü bir yerde bile çoğu zaman çalışır, çünkü en güçlü noktalar gürültünün üstünde kalır."], [40.64, 44.02, "Sıradaki bölüm: Gürültü önleyici kulaklık sesi nasıl yok eder?"], [44.02, 45.34, "Takip et."]];window.DUR=46.5;</script>
<script>
let TM=window.TM||{A:[0,6],B:[6,12],C:[12,19],D:[19,24],E:[24,34],F:[34,40]},SUB=window.SUB||[],DUR=window.DUR||40;
const W=1080,H=1920,TAU=Math.PI*2,cv=document.getElementById('c'),g=cv.getContext('2d');
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),R=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const F='Inter, "DejaVu Sans", sans-serif';
function T(s,x,y,sz,c,w,al){g.font=(w||700)+' '+sz+'px '+F;g.fillStyle=c;g.textAlign=al||'center';g.textBaseline='middle';g.fillText(s,x,y)}
function pill(s,x,y,c,sz){g.font='800 '+sz+'px '+F;const w=g.measureText(s).width+sz*1.3;g.fillStyle=c;g.beginPath();g.roundRect(x-w/2,y-sz*.9,w,sz*1.8,sz*.9);g.fill();T(s,x,y+2,sz,'#fff',800)}
function bg(t){g.fillStyle='#070c20';g.fillRect(0,0,W,H);for(let i=0;i<150;i++){g.fillStyle='rgba(200,220,255,'+(.15+.3*Math.abs(Math.sin(t*.7+i)))+')';const s=R(i+900)*2+.6;g.fillRect(R(i)*W,R(i+500)*H,s,s)}
 g.strokeStyle='rgba(120,160,255,.05)';g.lineWidth=1;for(let x=0;x<=W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<=H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}
const loc=(t,k)=>(t-TM[k][0])/(TM[k][1]-TM[k][0]);
const GX=110,GY=520,GW=860,GH=760,NC=48,NR=40;
const PK=[];for(let i=0;i<70;i++){PK.push([R(i*3+1)*NC|0,(R(i*7+2)**1.3)*NR|0,.6+.4*R(i+50)])}
function cellV(c,r,t){let v=.12+.12*R(c*31+r*7);v+=.35*Math.exp(-((r-8-4*Math.sin(c*.3))**2)/12)+.25*Math.exp(-((r-22-3*Math.cos(c*.2))**2)/20);for(const[pc,pr,a]of PK)v+=a*Math.exp(-((c-pc)**2+(r-pr)**2)/1.6);return Math.min(1,v)}
function heat(v){const a=Math.min(1,v);return 'rgb('+(20+235*Math.max(0,a-.5)*2|0)+','+(40+180*a|0)+','+(90+165*Math.min(1,a*1.5)|0)+')'}
function grid(t,show,alpha){const cw=GW/NC,ch=GH/NR;g.globalAlpha=alpha;for(let c=0;c<show;c++)for(let r=0;r<NR;r++){g.fillStyle=heat(cellV(c,r,t));g.fillRect(GX+c*cw,GY+GH-(r+1)*ch,cw+.5,ch+.5)}g.globalAlpha=1;
 g.strokeStyle='rgba(255,255,255,.25)';g.strokeRect(GX,GY,GW,GH);T('zaman →',GX+GW,GY+GH+40,30,'#8fa6d8',500,'right');g.save();g.translate(GX-30,GY+GH/2);g.rotate(-Math.PI/2);T('frekans →',0,0,30,'#8fa6d8',500);g.restore()}
const PP=()=>PK.map(([c,r,a])=>[GX+(c+.5)*GW/NC,GY+GH-(r+.5)*GH/NR,a]);
function stars(t,a){PP().forEach(([x,y,s],i)=>{const tw=.7+.3*Math.sin(t*3+i);g.globalAlpha=a;g.fillStyle='#fff';g.beginPath();g.arc(x,y,6*s*tw,0,TAU);g.fill();g.strokeStyle='rgba(255,207,90,.5)';g.lineWidth=2;g.beginPath();g.arc(x,y,13*s*tw,0,TAU);g.stroke();g.globalAlpha=1})}
const PAIRS=(()=>{const P=PP(),o=[];P.forEach((p,i)=>{P.map((q,j)=>[j,q]).filter(([j,q])=>q[0]>p[0]&&q[0]-p[0]<120&&Math.abs(q[1]-p[1])<160).slice(0,1).forEach(([j])=>o.push([i,j]))});return o})();
function sceneA(t){const p=loc(t,'A');T('Bu matematik',W/2,250,64,'#8fa6d8',600);T('hayatında nerede?',W/2,330,64,'#8fa6d8',600);pill('BÖLÜM 2 · SHAZAM',W/2,440,'#e8364f',46);
 const cx=W/2,cy=1000;for(let i=0;i<5;i++){const r=((t*140+i*80)%400);g.strokeStyle='rgba(64,196,255,'+(1-r/400)*.8+')';g.lineWidth=4;g.beginPath();g.arc(cx,cy,r+120,0,TAU);g.stroke()}
 g.fillStyle='#10183a';g.strokeStyle='#8fa6d8';g.lineWidth=6;g.beginPath();g.roundRect(cx-130,cy-240,260,480,40);g.fill();g.stroke();g.fillStyle='#5dffb0';g.beginPath();g.ellipse(cx-38,cy+10,26,20,-.4,0,TAU);g.fill();g.beginPath();g.ellipse(cx+42,cy-10,26,20,-.4,0,TAU);g.fill();g.fillRect(cx-16,cy-110,10,120);g.fillRect(cx+64,cy-130,10,120);g.beginPath();g.moveTo(cx-16,cy-110);g.lineTo(cx+74,cy-130);g.lineTo(cx+74,cy-105);g.lineTo(cx-16,cy-85);g.fill();
 if(p>.55){const k=ease((p-.55)*4);g.globalAlpha=k;g.fillStyle='#1f8a4c';g.beginPath();g.roundRect(cx-120,cy+90,240,90,18);g.fill();T('şarkı bulundu',cx,cy+135,30,'#fff',700);g.globalAlpha=1;T('birkaç saniyede',W/2,1360,60,'#5dffb0',800)}}
function sceneB(t){const p=loc(t,'B');T('1 · Fourier: frekans haritası',W/2,250,56,'#fff',800);T('ses an be an frekanslarına ayrılır',W/2,330,36,'#c9d4f2',500);grid(t,Math.max(1,Math.ceil(NC*ease(p*1.3))),1);
 const x=GX+GW*ease(p*1.3);g.fillStyle='#5dffb0';g.fillRect(x-2,GY,4,GH)}
function sceneC(t){const p=loc(t,'C');T('2 · En güçlü noktalar kalır',W/2,250,56,'#fff',800);T('gerisi atılır',W/2,330,36,'#c9d4f2',500);grid(t,NC,1-ease(p*2));stars(t,ease(p*2.2-.2));
 if(p>.55){g.globalAlpha=ease((p-.55)*4);pill('takımyıldız haritası',W/2,1400,'#2a5bd7',46);g.globalAlpha=1}}
function sceneD(t){const p=loc(t,'D');T('3 · Noktalar ikişer bağlanır',W/2,250,56,'#fff',800);T('her çift = küçük bir parmak izi',W/2,330,36,'#c9d4f2',500);stars(t,1);const P=PP();const n=Math.floor(PAIRS.length*ease(p*1.4));
 for(let k=0;k<n;k++){const[i,j]=PAIRS[k];g.strokeStyle=k%2?'rgba(64,196,255,.8)':'rgba(255,154,90,.8)';g.lineWidth=3;g.beginPath();g.moveTo(P[i][0],P[i][1]);g.lineTo(P[j][0],P[j][1]);g.stroke()}
 if(p>.4){g.globalAlpha=ease((p-.4)*4);g.fillStyle='rgba(255,255,255,.08)';g.beginPath();g.roundRect(170,1380,740,90,20);g.fill();T('frekans 1 · frekans 2 · aradaki süre',W/2,1426,38,'#ffcf5a',700);g.globalAlpha=1}}
function songStrip(y,label,match,t,k){g.fillStyle=match?'rgba(31,138,76,'+(.25+.35*k)+')':'rgba(255,255,255,.06)';g.beginPath();g.roundRect(110,y,860,70,14);g.fill();for(let i=0;i<26;i++){const x=150+i*31+(R(i+y)*12),yy=y+15+R(i*3+y)*40;g.fillStyle=match&&k>0?'#5dffb0':'rgba(200,210,240,.5)';g.beginPath();g.arc(x,yy,4,0,TAU);g.fill()}T(label,950,y+35,26,match&&k>0?'#fff':'#8fa6d8',600,'right')}
function sceneE(t){const p=loc(t,'E');T('4 · Milyonlarca şarkıda arama',W/2,250,56,'#fff',800);T('aynı aralıklarla dizilmiş olanı bulur',W/2,330,36,'#c9d4f2',500);
 const off=(t*260)%90;for(let i=0;i<11;i++){const y=470+i*90-off*(p<.5?1:0);if(y<440||y>1400)continue;const m=(i===5);songStrip(y,'şarkı #'+(1000+i*3719)%99999,m,t,m?ease((p-.5)*3):0)}
 if(p>.55){g.globalAlpha=ease((p-.55)*4);pill('EŞLEŞTİ',W/2,1490,'#1f8a4c',56);g.globalAlpha=1}
 if(p>.75){g.globalAlpha=ease((p-.75)*4)*.6;for(let i=0;i<220;i++){g.fillStyle='rgba(180,180,200,.6)';g.fillRect(R(i+t*7|0)*W,440+R(i*3+(t*7|0))*960,3,3)}g.globalAlpha=1;T('gürültüde bile çoğu zaman',W/2,1580,36,'#e9eefc',600)}}
function sceneF(t){const p=loc(t,'F');T('Sıradaki bölüm',W/2,520,56,'#8fa6d8',600);T('Gürültü önleyici kulaklık',W/2,640,68,'#fff',800);T('sesi nasıl yok eder?',W/2,740,68,'#fff',800);
 g.lineWidth=5;[['#40c4ff',1],['#ff9a5a',-1]].forEach(([c,s])=>{g.strokeStyle=c;g.beginPath();for(let x=140;x<=940;x+=4){const y=1080+s*70*Math.sin(x*.025-t*4)*(1-ease(p*1.5)*0);x>140?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()});
 g.strokeStyle='#5dffb0';g.beginPath();g.moveTo(140,1260);g.lineTo(940,1260);g.stroke();T('= sessizlik',W/2,1320,40,'#5dffb0',700);pill('Takip et',W/2,1480,'#e8364f',58)}
function subs(t){const s=SUB.find(z=>t>=z[0]&&t<z[1]);if(!s)return;g.font='700 46px '+F;const words=s[2].split(' ');const lines=[];let cur='';for(const w2 of words){const tr=cur?cur+' '+w2:w2;if(g.measureText(tr).width>900){lines.push(cur);cur=w2}else cur=tr}lines.push(cur);
 const y0=1745-(lines.length-1)*30;lines.forEach((l,i)=>{const w2=g.measureText(l).width+40;g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.roundRect(W/2-w2/2,y0+i*60-32,w2,62,14);g.fill();T(l,W/2,y0+i*60,46,'#fff',700)})}
function renderAt(t){bg(t);const S=[['A',sceneA],['B',sceneB],['C',sceneC],['D',sceneD],['E',sceneE],['F',sceneF]];let f=sceneA;for(const[k,fn]of S)if(t>=TM[k][0])f=fn;f(t);
 if(t<TM.F[0])subs(t);T('KOZMOS LAB',W/2,1850,34,'rgba(255,255,255,.8)',800);T('@kozmoslabtr',W/2,1890,24,'rgba(200,210,240,.5)',500)}
window.renderAt=renderAt;
if(!/rec/.test(location.search)){const t0=performance.now();(function f(){renderAt(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(f)})()}
</script></body></html>
