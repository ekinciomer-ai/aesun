name: Nasıl Yapıldı – Google TTS seslendirme
# video/ny/kuyruk/<kod>.json eklenince sunucuda Google Cloud Text-to-Speech (nöral ses) ile seslendirir.
# Anahtar sunucu kasasında (google_tts_anahtar); depoya ve günlüğe yazılmaz. Anahtar yoksa iş bekler, kuyruk silinmez.
# Çıktı: video/ny/ses/<kod>/<parca>.mp3 + meta.json ; iş dosyası video/ny/kuyruk/tamam/ altına taşınır.
on:
  push:
    branches: [main]
    paths: ['video/ny/kuyruk/*.json', 'sunucu/islem_ny_gtts.sh', '.github/workflows/ny_gtts.yml']
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ny-gtts, cancel-in-progress: false }
jobs:
  ses:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sunucuda seslendir
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          ls video/ny/kuyruk/*.json >/dev/null 2>&1 || { echo "kuyruk boş"; exit 0; }
          mkdir -p ~/.ssh /tmp/pk/kuyruk
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          cp sunucu/islem_ny_gtts.sh /tmp/pk/; cp video/ny/kuyruk/*.json /tmp/pk/kuyruk/
          tar czf /tmp/paket.tgz -C /tmp/pk .
          O="-i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          ssh $O root@$ADRES "rm -rf /tmp/ny_t && mkdir -p /tmp/ny_t && tar xzf - -C /tmp/ny_t && cd /tmp/ny_t && bash islem_ny_gtts.sh < /dev/null; tar czf /tmp/ny_t.tgz -C /tmp/ny_t cikti 2>/dev/null" < /tmp/paket.tgz > /tmp/cikti.txt 2>&1 || true
          mkdir -p /tmp/al && scp $O root@$ADRES:/tmp/ny_t.tgz /tmp/ && tar xzf /tmp/ny_t.tgz -C /tmp/al || true
          ssh $O root@$ADRES "rm -rf /tmp/ny_t /tmp/ny_t.tgz" || true
          rm -f ~/.ssh/k
          grep '^NOT:' /tmp/cikti.txt | sed 's/^NOT: *//' | while IFS= read -r l; do echo "::notice::$l"; done
          grep -q ANAHTAR_YOK /tmp/cikti.txt && { echo "::error::Kasaya google_tts_anahtar girilmeli (portal → Kasa)"; exit 1; }
          for d in /tmp/al/cikti/*/; do k=$(basename $d); [ -f $d/meta.json ] || continue
            rm -rf video/ny/ses/$k; mkdir -p video/ny/ses/$k; cp $d/* video/ny/ses/$k/
            mkdir -p video/ny/kuyruk/tamam; git mv -f video/ny/kuyruk/$k.json video/ny/kuyruk/tamam/$k.json; done
      - name: Kaydet
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A video/ny
          git diff --cached --quiet && exit 0
          git commit -qm "Nasıl Yapıldı: Google Cloud TTS sesleri $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
