<style>
*{box-sizing:border-box}
body{margin:0;background:#E9EDF2;font-family:'Archivo',system-ui,sans-serif;color:#10233F}
a{color:#10233F}a:hover{color:#2a78d6}
.num{font-variant-numeric:tabular-nums;font-stretch:88%}
.kab{display:flex;flex-wrap:wrap;min-height:100vh}
.nav{flex:1 1 232px;max-width:260px;background:#10233F;padding:24px 16px;display:flex;flex-direction:column;gap:4px}
@media (min-width:701px){.nav{position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto;box-sizing:border-box}}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:#C9D3E0;font-size:14px;min-height:24px}
.nav a:hover{background:#1B3254;color:#fff}
.nav a.aktif{background:#fff;color:#10233F;font-weight:600}
.nav a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #86b6ef;outline-offset:2px}
.rozet{margin-left:auto;font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}
.rozet.k{background:#B42318;color:#fff}.rozet.u{background:#C98500;color:#10233F}
main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:24px;max-width:1240px}
.panel{background:#fff;border-radius:14px;border:1px solid #D5DCE5;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.k{font-size:13px;color:#4A5A70}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;font-stretch:105%}
h2{margin:0;font-size:20px;font-weight:700}
.bas{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px;background:#fff;color:#10233F;border:1px solid #B9C4D2}

.iki{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.uc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}

.durum-u{font-size:13px;color:#9A5B00;font-weight:600;display:flex;align-items:center;gap:6px}
.hata{padding:20px;color:#B42318}
.sekmeler{display:flex;gap:4px;border-bottom:1px solid #D5DCE5}

.tablo-kutu{overflow-x:auto;background:#fff;border:1px solid #D5DCE5;border-radius:14px}

table.tb td.sifir{color:#9AA6B5}
table.tb tr.top td{font-weight:700;border-top:2px solid #D5DCE5;background:#F5F7FA}
table.tb .ayr{border-left:1px solid #E3E8EE}
table.tb td.saat{font-weight:600;text-align:left}
input[type=date]{font:inherit;font-size:15px;border:1px solid #B9C4D2;border-radius:8px;padding:8px 10px;min-height:40px;color:#10233F;background:#fff}
.kartlar5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
@media (max-width:700px){.kab{align-content:flex-start;align-items:flex-start}main{padding:16px 16px 40px;gap:16px}.nav{max-width:none;flex:0 0 100%;height:auto;align-self:flex-start;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:4px;padding:10px 12px;position:sticky;top:0;z-index:5;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav>div:first-child{padding:0 8px 0 0!important;flex:none}.nav>div:first-child>div{display:none}.nav a{flex:none;white-space:nowrap;padding:8px 10px}.nav .bosluk,#kaynakNot{display:none}.sayac{border-left:0;padding:4px 0}h1{font-size:26px}.panel{padding:16px}.iki,.uc{grid-template-columns:minmax(0,1fr)}.kartlar5{grid-template-columns:repeat(2,minmax(0,1fr))}#kontrol{width:100%}#kontrol select{max-width:100%}#hizBekci{display:none!important}.nav .kullanici{flex:none!important;flex-wrap:nowrap!important;white-space:nowrap;padding:8px 6px!important;order:99}}
#ipucu{position:fixed;z-index:60;pointer-events:none;display:none;background:#10233F;color:#fff;font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:6px;white-space:pre-line;max-width:300px;box-shadow:0 6px 18px rgba(16,35,63,.22);font-variant-numeric:tabular-nums}
rect.hit.on{fill:rgba(16,35,63,.07)}
.grafust{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.tursec{display:inline-flex;border:1px solid #D5DCE5;border-radius:6px;overflow:hidden;flex:none}
.tursec button{border:0;background:#fff;padding:5px 10px;font:inherit;font-size:12.5px;color:#4A5A70;cursor:pointer}
.tursec button+button{border-left:1px solid #D5DCE5}
.tursec button[aria-pressed=true]{background:#10233F;color:#fff}
table.tb thead th{cursor:pointer;user-select:none}
table.tb thead th[colspan]{cursor:default}
.btn:disabled{opacity:.45;cursor:not-allowed}
tr.acilmis .ok{display:inline-block;transform:rotate(90deg)}
tr.acik table.tb{font-size:13px}
table.tb thead th[aria-sort=ascending]::after{content:" ▲";font-size:10px}
table.tb thead th[aria-sort=descending]::after{content:" ▼";font-size:10px}
</style>

<script>
// ===== Portal girişi ve yetkiler: oturum portal sayfasından (aynı site, localStorage 'ae_portal') okunur =====
const PORTAL = (() => { try { const o = JSON.parse(localStorage.getItem('ae_portal') || 'null'); if (o && o.S && Date.now() < (o.son || 0)) return o.S; } catch (e) {} return null; })();
if (!PORTAL || !(PORTAL.ka || (PORTAL.anahtarlar && PORTAL.anahtarlar.monitoring))) location.replace('../portal/?git=monitoring');
const YONETICI = !!(PORTAL && PORTAL.ka);
const IZIN = YONETICI ? null : new Set((((PORTAL || {}).izinler || {}).monitoring) || []);
const yetkili = k => k === 'bildirim' ? YONETICI : k === 'kompanzasyon' ? yetkili('inverter') : k === 'fatura' ? yetkili('parasal') : (!IZIN || IZIN.has(k));
const PARA = yetkili('parasal');
const PARA_DOSYA = /(^|\/)(fatura\/|maden_maliyet|maden_odeme|arsiv_f2pool_gelir|arsiv_btc_fiyat)/;
(function () {
  const nav = document.querySelector('.nav'); if (!nav) return;

  nav.querySelectorAll('a[href^="#"]').forEach(a => {
    const sf = a.dataset.sayfa || (a.getAttribute('href') === '#inverterler' || a.getAttribute('href') === '#genel' ? 'genel' : null);
    if (sf && !yetkili(sf)) a.style.display = 'none';
  });
  if (PORTAL) {
    const d = document.createElement('div'); d.className = 'kullanici';
    d.style.cssText = 'color:#C9D4E3;font-size:12.5px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap';
    d.innerHTML = '<span>👤 ' + String(PORTAL.ad || PORTAL.kul).replace(/[<>&"]/g, '') + '</span><a href="../portal/" style="color:#F2555B;padding:0;display:inline">Portal</a><a href="#" style="color:#9FB0C6;padding:0;display:inline" onclick="localStorage.removeItem(\'ae_portal\');location.replace(\'../portal/\');return false">Çıkış</a>';
    const k = document.getElementById('kaynakNot'); nav.insertBefore(d, k);
  }
  if (!PARA) {
    // Para tutarlarını ekranda maskele (₺/TL, $/USD, BTC); birim fiyatlar (₺/kWh, TL/MWh) kalır
    const RX = /([-+−]?\s?\d[\d.,]*\s?(?:₺|TL|USD|\$|BTC|mBTC|sat)(?![\/\w]))|((?:₺|\$)\s?[-+−]?\d[\d.,]*)/g;
    const maske = kok => {
      const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT); let n;
      while ((n = w.nextNode())) if (RX.test(n.nodeValue)) { RX.lastIndex = 0; n.nodeValue = n.nodeValue.replace(RX, '•••'); }
      kok.querySelectorAll && kok.querySelectorAll('[data-tip],[title]').forEach(e => { for (const at of ['data-tip', 'title']) { const v = e.getAttribute(at); if (v && RX.test(v)) { RX.lastIndex = 0; e.setAttribute(at, v.replace(RX, '•••')); } } });
    };
    new MutationObserver(ms => { for (const m of ms) for (const nd of m.addedNodes) { if (nd.nodeType === 1) maske(nd); else if (nd.nodeType === 3 && RX.test(nd.nodeValue)) { RX.lastIndex = 0; nd.nodeValue = nd.nodeValue.replace(RX, '•••'); } } })
      .observe(document.body, { childList: true, subtree: true });
  }
})();
const KOK = 'https://raw.githubusercontent.com/ekinciomer-ai/epias-ptf/main/';
// Merkez API: veriyi yetkiyle sunar (api.aksarayenerji.net). Belirteç portal oturumundaki anahtardan türetilir; ulaşılamazsa geçiş süresince GitHub'a düşülür.
const API = 'https://api.aksarayenerji.net/v1/dosya/';
const API_BEL = (async () => {
  const P = PORTAL || {}, h = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
  try {
    if (P.ka) return await h('aesun-api|yonetici|' + P.ka);
    if (P.parasal && P.parasal.d) return await h('aesun-api|parasal|' + P.parasal.d);
    if (P.anahtarlar && P.anahtarlar.monitoring) return await h('aesun-api|monitoring|' + P.anahtarlar.monitoring);
  } catch (e) {}
  return null;
})();
let API_DURUM = 'bekliyor';   // ok | kapali
async function veriFetch(yol) {
  const b = await API_BEL;
  if (b && API_DURUM !== 'kapali') {
    try {
      const r = await fetch(API + yol, { headers: { 'X-AE-Anahtar': b }, cache: 'no-cache' });
      if (r.ok) { API_DURUM = 'ok'; return r; }
      if (r.status === 404 || r.status === 403) return r;
      if (r.status === 401) API_DURUM = 'kapali';      // yetki özeti henüz yayımlanmadı: geçişte GitHub'a düş
    } catch (e) { API_DURUM = 'kapali'; setTimeout(() => { API_DURUM = 'bekliyor'; }, 60e3); }
  }
  return fetch(KOK + yol + '?t=' + Date.now(), { cache: 'no-store' });
}
// S19e XP Hyd ayrı su sensörü bildirmez: "temp_water" aslında kart (PCB) sıcaklığıdır ve S21e'lerden ~20 °C yüksek çalışması
// normaldir. Sıcaklık sınırları modele göre (epias-ptf/bildirim_isler.py SAGLIK_MODEL ile aynı).
const SUSUZ = d => /S19e XP/.test((d && d.model) || '');
const suEt = d => SUSUZ(d) ? 'kart' : 'su';
const SICAK_SINIR = d => SUSUZ(d) ? 85 : 75;
const sicakUyari = d => (d.health_issues || []).some(h => h.severity === 'high' && !(SUSUZ(d) && /HOT/.test(h.code || '') && (d.temp_max || 0) < 85));
const LIMIT_2026 = 2905914;
const ESLE = { T1: 'fusionsolar:NE=59224704', T2: 'fusionsolar:NE=73686040', YD: 'sungrow:5064453', Anka: 'sungrow:5038906', AE: 'inavitas:189' }, ESLE_KISA = { T1: 'Sera-1', T2: 'Sera-2' };
const SAYAC = [
  { key: 'tekyildiz_1', kod: 'T1', ad: 'Tekyıldız 1', renk: '#2a78d6', mahsup: true, uretir: true },
  { key: 'tekyildiz_2', kod: 'T2', ad: 'Tekyıldız 2', renk: '#eb6834', mahsup: true, uretir: true },
  { key: 'aksaray_3', kod: 'A3', ad: 'Aksaray 3', renk: '#1baf7a', mahsup: true, uretir: false },
  { key: 'yilmaz_darilmaz', kod: 'YD', ad: 'Yılmaz Darılmaz', renk: '#C98500', mahsup: false, uretir: true },
  { key: 'anka_mineral', kod: 'Anka', ad: 'Anka Mineral', renk: '#d55181', mahsup: false, uretir: true },
  { key: 'aksaray_enerji', kod: 'AE', ad: 'Aksaray Enerji Üretim', renk: '#6b5bd6', mahsup: false, uretir: true }
];
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
let D = null, gunSayisi = 30, secAy = null;

const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const say = (v, h = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('tr-TR', { minimumFractionDigits: h, maximumFractionDigits: h });
const trSimdi = () => new Date(Date.now() + 3 * 3600000);
const bugunTR = () => trSimdi().toISOString().slice(0, 10);
const gunEkle = (g, n) => new Date(Date.parse(g + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const saatTR = iso => { if (!iso) return '—'; const d = new Date(new Date(iso).getTime() + 3 * 3600000); return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0'); };
const tarihK = g => { const [y, a, d] = g.split('-').map(Number); return d + ' ' + AYK[a - 1]; };
const ICON_K = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.2" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';

    + '<span style="flex:1"></span><button type="button" onclick="anlikCiz()" style="font:inherit;background:#1C2F4A;color:#fff;border:1px solid #33496A;border-radius:10px;padding:8px 14px;cursor:pointer">↻ Yenile</button><button type="button" onclick="anlikKapat()" style="font:inherit;background:#D7262E;color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer">✕ Kapat</button></div>'

    + kart('Cihazlar', say_('c') + ' <span style="font-size:14px;color:#8FA2BC">/ ' + dv.length + '</span>', say_('u') + ' uykuda · ' + say_('i') + ' ısınıyor · ' + say_('x') + ' yanıtsız')
    + kart('Madencilik yükü', say(kw, 0) + ' <span style="font-size:14px">kW</span>', 'hash × verim · en sıcak çip ' + say(sicMax) + '°', '#F5B83D')
    + kart('Güneş (Sera-2)', s2 != null ? say(s2, 0) + ' <span style="font-size:14px">kW</span>' : '—', 'Sera-1 ' + (s1 != null ? say(s1, 0) + ' kW' : '—'), '#F0B429')
    + kart('Şebeke (Sera-2 sayacı)', net == null ? '—' : (net >= 0 ? '→ ' : '← ') + say(Math.abs(net), 0) + ' <span style="font-size:14px">kW</span>', net == null ? '' : net >= 0 ? 'şebekeye veriliyor (tahmini)' : 'şebekeden çekiliyor (tahmini)', net == null ? '#fff' : net >= 0 ? '#2BD27A' : '#F0525A')

    + '</div>'

    + '<p style="color:#5F7391;font-size:12px;margin-top:14px">Cihaz verisi ' + (canliTaze ? 'Pi\'den doğrudan (~10 sn)' : 'Pi toplayıcısından (~2 dk)') + ', güneş FusionSolar\'dan (~10 dk), karar cihaz yönetiminden (~5 dk) gelir. Güç, hash × model verimi ile tahmindir; ısınan cihaz ' + ISI + ' kW sayılır. Kutuya tıklayınca cihazın hash grafiği açılır.</p></div>';
