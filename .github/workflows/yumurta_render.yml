name: Yumurta Stili Render (stills / paralel final)
on:
  workflow_dispatch:
    inputs:
      proje:
        description: "video/<proje> klasörü (örn. cotard)"
        required: true
      kod:
        description: "TTS kod öneki (örn. COTARD_TR)"
        required: true
      mod:
        description: "stills | final"
        required: true
        default: "stills"
      scale:
        description: "Render ölçeği (stills: 0.5, final: 0.75)"
        required: false
        default: "0.75"
      parca:
        description: "Paralel parça sayısı (final için, 1-8)"
        required: false
        default: "6"
      stills_sn:
        description: "İsteğe bağlı özel stills saniyeleri (boşsa otomatik 15 kare)"
        required: false
        default: ""
      tempo:
        description: "Konuşma hız çarpanı (örn. 1.0 normal, 1.20 hızlı)"
        required: false
        default: "1.20"

permissions:
  contents: read
  actions: read

jobs:
  hazirla:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      parcalar: ${{ steps.plan.outputs.parcalar }}
      dur: ${{ steps.plan.outputs.dur }}
      story_name: ${{ steps.plan.outputs.story_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            video/${{ inputs.proje }}
            video/pumpkin2/motor
            sunucu/tts_kuyruk/cikti
      - name: Motoru kur ve ses+miks hazırla
        id: plan
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg python3-numpy >/dev/null
          git clone --depth 1 https://github.com/kodlaciz/yumurta-stili.git /tmp/ys
          cd /tmp/ys/engine
          npm ci --no-audit --no-fund
          patch -p0 < "$GITHUB_WORKSPACE/video/pumpkin2/motor/toon_pumpkin.patch"
          patch -p0 < "$GITHUB_WORKSPACE/video/pumpkin2/motor/faces_full.patch"

          STORY=$(python3 -c "import re; s=open('$GITHUB_WORKSPACE/video/${{ inputs.proje }}/story.js',encoding='utf-8').read(); print(re.search(r\"NAME\s*=\s*'([^']+)'\", s).group(1))")
          echo "story_name=$STORY" >> "$GITHUB_OUTPUT"
          SD="/tmp/ys/stories/$STORY"
          mkdir -p "$SD"
          cp "$GITHUB_WORKSPACE/video/${{ inputs.proje }}/story.js" "$SD/"
          cp "$GITHUB_WORKSPACE/video/${{ inputs.proje }}/mix.py" "$SD/"
          cp "$GITHUB_WORKSPACE/video/${{ inputs.proje }}/metin_tr.json" "$SD/"

          # 1) Ses parçalarını birleştir (voice.wav, words.json, env.json)
          python3 -I "$GITHUB_WORKSPACE/video/pumpkin2/motor/parcalar.py" \
            "$GITHUB_WORKSPACE/sunucu/tts_kuyruk/cikti" "${{ inputs.kod }}" \
            "$SD/metin_tr.json" "$SD"

          # 1b) İsteğe bağlı tempo hızlandırma + zamanlama ölçekleme (voice.wav, words.json, env.json)
          TEMPO="${{ inputs.tempo }}"
          if [ "$TEMPO" != "1.0" ] && [ "$TEMPO" != "1" ]; then
            ffmpeg -y -loglevel error -i "$SD/voice/voice.wav" -af "atempo=${TEMPO}" -ar 48000 -ac 1 "$SD/voice/voice_fast.wav"
            mv "$SD/voice/voice_fast.wav" "$SD/voice/voice.wav"
            python3 -c 'import json,sys,wave,numpy as np; sd,tp=sys.argv[1],float(sys.argv[2]); wd=json.load(open(sd+"/voice/words.json",encoding="utf-8")); wd["words"]=[{**w,"start":round(w["start"]/tp,3),"end":round(max(w["start"]/tp+0.05,w["end"]/tp),3)} for w in wd["words"]]; wd["duration"]=round(wd["duration"]/tp,3); json.dump(wd,open(sd+"/voice/words.json","w",encoding="utf-8"),ensure_ascii=False,indent=0); wf=wave.open(sd+"/voice/voice.wav","rb"); y=np.frombuffer(wf.readframes(wf.getnframes()),np.int16).astype(float)/32768.0; sr=wf.getframerate(); h=sr//30; fr=len(y)//h; e=np.sqrt((y[:fr*h].reshape(fr,h)**2).mean(1)); e=np.clip(e/(np.percentile(e,95)+1e-9),0,1); json.dump([round(float(v),3) for v in e],open(sd+"/voice/env.json","w")); print("TEMPO APPLIED:",tp,"new_dur:",wd["duration"])' "$SD" "$TEMPO"
          fi

          # 2) Cues çıkar ve özgün müzik + efekt miksi üret (mix.wav)
          export CHROME_PATH=$(which google-chrome chromium chromium-browser 2>/dev/null | head -1)
          node render.mjs "$STORY" --cues
          python3 -I "$SD/mix.py" "$SD"

          # LUFS & TP ölçümü
          ffmpeg -i "$SD/audio/mix.wav" -af ebur128=peak=true -f null - 2>&1 | tail -20 > "$SD/audio/ses_olcum.txt" || true
          cat "$SD/audio/ses_olcum.txt"

          DUR=$(python3 -c "import json; print(json.load(open('$SD/audio/cues.json'))['DUR'])")
          echo "dur=$DUR" >> "$GITHUB_OUTPUT"

          # 3) Eğer mod=stills ise 15 kilit kareyi hemen çek!
          if [ "${{ inputs.mod }}" = "stills" ]; then
            TIMES="${{ inputs.stills_sn }}"
            if [ -z "$TIMES" ]; then
              TIMES=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); dur=float(sys.argv[2]); parts={}; [parts.__setitem__(w["part"],[min(parts[w["part"]][0],w["start"]),max(parts[w["part"]][1],w["end"])] if w["part"] in parts else [w["start"],w["end"]]) for w in d["words"]]; ts=[0.25]; [ts.extend([round(s+(e-s)*0.35,2),round(s+(e-s)*0.65,2),round(s+(e-s)*0.9,2)] if k=="P01" else [round(s+(e-s)*0.3,2),round(s+(e-s)*0.75,2)] if k=="P06" else [round((s+e)/2,2)]) for k,(s,e) in sorted(parts.items())]; ts.append(round(max(0.5,dur-0.3),2)); print(",".join(str(x) for x in ts))' "$SD/voice/words.json" "$DUR")
            fi
            echo "STILLS TIMES: $TIMES"
            node render.mjs "$STORY" --stills="$TIMES" --scale=0.5 --cols=5 --name=stills.jpg
            mkdir -p /tmp/stills_out
            cp "$SD/out/stills.jpg" /tmp/stills_out/
            cp "$SD/audio/ses_olcum.txt" /tmp/stills_out/
            cp "$SD/voice/words.json" /tmp/stills_out/
            cp "$SD/audio/cues.json" /tmp/stills_out/
          fi

          # Paralel parça planı
          python3 -c 'import json,sys; dur=float(sys.argv[1]); n=max(1,min(8,int(sys.argv[2]))); step=dur/n; print("parcalar="+json.dumps([{"i":i,"a":round(i*step,3),"b":round(min(dur,(i+1)*step),3)} for i in range(n)]))' "$DUR" "${{ inputs.parca }}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/bundle
          cp -r "$SD/voice" /tmp/bundle/
          cp -r "$SD/audio" /tmp/bundle/

      - uses: actions/upload-artifact@v4
        if: inputs.mod == 'stills'
        with:
          name: yumurta-stills-${{ inputs.proje }}
          path: /tmp/stills_out/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: inputs.mod == 'final'
        with:
          name: yumurta-bundle-${{ inputs.proje }}
          path: /tmp/bundle/
          retention-days: 1

  parca:
    needs: hazirla
    if: inputs.mod == 'final'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix:
        p: ${{ fromJson(needs.hazirla.outputs.parcalar) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            video/${{ inputs.proje }}
            video/pumpkin2/motor
      - uses: actions/download-artifact@v4
        with:
          name: yumurta-bundle-${{ inputs.proje }}
          path: /tmp/bundle
      - name: Parça ${{ matrix.p.i }} render (${{ matrix.p.a }}s - ${{ matrix.p.b }}s)
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          git clone --depth 1 https://github.com/kodlaciz/yumurta-stili.git /tmp/ys
          cd /tmp/ys/engine
          npm ci --no-audit --no-fund
          patch -p0 < "$GITHUB_WORKSPACE/video/pumpkin2/motor/toon_pumpkin.patch"
          patch -p0 < "$GITHUB_WORKSPACE/video/pumpkin2/motor/faces_full.patch"

          STORY="${{ needs.hazirla.outputs.story_name }}"
          SD="/tmp/ys/stories/$STORY"
          mkdir -p "$SD"
          cp "$GITHUB_WORKSPACE/video/${{ inputs.proje }}/story.js" "$SD/"
          cp -r /tmp/bundle/voice "$SD/"
          # Parça renderinde sessiz video üret (finalde tek mix.wav ile birleşecek)
          export CHROME_PATH=$(which google-chrome chromium chromium-browser 2>/dev/null | head -1)
          node render.mjs "$STORY" --scale=${{ inputs.scale }} --from=${{ matrix.p.a }} --to=${{ matrix.p.b }} --name=p_${{ matrix.p.i }}
          mkdir -p /tmp/part_out
          cp "$SD/out/p_${{ matrix.p.i }}.mp4" /tmp/part_out/

      - uses: actions/upload-artifact@v4
        with:
          name: yumurta-part-${{ inputs.proje }}-${{ matrix.p.i }}
          path: /tmp/part_out/
          retention-days: 1

  birlestir:
    needs: [hazirla, parca]
    if: inputs.mod == 'final'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yumurta-bundle-${{ inputs.proje }}
          path: /tmp/bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: yumurta-part-${{ inputs.proje }}-*
          path: /tmp/parts
          merge-multiple: true
      - name: Birleştir, 1080x1920 lanczos büyüt ve kontrol panosu çıkar
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          cd /tmp/parts
          ls -1 p_*.mp4 | sort -V | sed "s/^/file '/; s/$/'/" > liste.txt
          cat liste.txt
          mkdir -p /tmp/final_out
          ffmpeg -y -loglevel error -f concat -safe 0 -i liste.txt \
            -i /tmp/bundle/audio/mix.wav \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=1080:1920:flags=lanczos" \
            -c:v libx264 -crf 17 -preset slow -pix_fmt yuv420p \
            -c:a aac -b:a 256k -movflags +faststart -shortest \
            /tmp/final_out/${{ inputs.proje }}_final.mp4
          DUR="${{ needs.hazirla.outputs.dur }}"
          ffmpeg -y -loglevel error -i /tmp/final_out/${{ inputs.proje }}_final.mp4 \
            -vf "fps=40/${DUR},scale=240:-2,tile=8x5" -frames:v 1 \
            /tmp/final_out/${{ inputs.proje }}_pano.jpg
          cp /tmp/bundle/audio/ses_olcum.txt /tmp/final_out/
          ls -lh /tmp/final_out/

      - uses: actions/upload-artifact@v4
        with:
          name: yumurta-final-${{ inputs.proje }}
          path: /tmp/final_out/
          retention-days: 7
