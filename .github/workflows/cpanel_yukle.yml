name: cPanel'e yükle (aksarayenerji.net + portal.aksarayenerji.net)
# docs/ (web sitesi + portal + monitoring + demo) ve saha uygulamasını cPanel API'si (2083) ile yükler; FTP portu kapalı.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   FTP_SUNUCU    ör. ftp.aksarayenerji.net
#   FTP_KULLANICI cPanel FTP kullanıcısı
#   FTP_SIFRE     FTP şifresi
#   FTP_DIZIN     (isteğe bağlı) hedef klasör; boşsa alan adının cPanel'deki kök klasörü
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'cpanel/**', 'pi/**', '.github/workflows/cpanel_yukle.yml']
  schedule:
    - cron: '23 */3 * * *'   # saha uygulamasındaki değişiklikleri de taşımak için
permissions:
  contents: read
  actions: read
concurrency:
  group: cpanel
  cancel-in-progress: false
jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ekinciomer-ai/saha
          path: _saha
      - name: Paketleri hazırla
        run: |
          if [ -z "${{ secrets.CPANEL_ANAHTAR }}${{ secrets.FTP_SIFRE }}" ]; then echo "cPanel sırları yok; atlandı."; echo "ATLA=1" >> $GITHUB_ENV; exit 0; fi
          python3 cpanel/paketle.py _saha
      - name: Site → aksarayenerji.net
        if: env.ATLA != '1'
        env:
          CP_HOST: aksarayenerji.net
          CP_ALAN: aksarayenerji.net
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_PASS: ${{ secrets.FTP_SIFRE }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
          CP_KONTROL: "/=<title;/referanslar.html=<title;/gundem.html=<title;/iletisim.html=<form"
        run: python3 cpanel/yukle.py dist_site
      - name: Portal → portal.aksarayenerji.net
        if: env.ATLA != '1'
        env:
          CP_HOST: aksarayenerji.net
          CP_ALAN: portal.aksarayenerji.net
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_PASS: ${{ secrets.FTP_SIFRE }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
          CP_KONTROL: "/=Kurumsal Portal;/monitoring/=<title;/saha/=<title;/aecad/=AeCAD;/gundem/=<title;/kapasite/=<title;/musteri/=<title;/api/canli.php=durum"
        run: |
          python3 cpanel/yukle.py dist_portal
          curl -fsSL "https://portal.aksarayenerji.net/api/canli.php?hedef_kod=${GITHUB_SHA:0:12}" >/dev/null || true
      # Yüklemeden sonra TÜM uçlar denenir (izleme/uclar.json). Biri bozulduysa son başarılı sürüm geri yüklenir ve iş kırmızı biter.
      - name: Duman testi
        id: duman
        if: env.ATLA != '1'
        continue-on-error: true
        run: |
          sleep 10
          python3 izleme/duman_testi.py ns1 || echo "::warning::ns1 uçlarında sorun var (bu yüklemeyle ilgisiz; geri alma yapılmaz)"
          python3 izleme/duman_testi.py cpanel
      - name: Geri al (duman testi kaldıysa)
        if: env.ATLA != '1' && steps.duman.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CP_HOST: aksarayenerji.net
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_PASS: ${{ secrets.FTP_SIFRE }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/cpanel_yukle.yml/runs?status=success&branch=main&per_page=20" --jq '[.workflow_runs[] | select(.head_sha != "${{ github.sha }}")][0].head_sha')
          echo "::error::Duman testi kaldı → son başarılı sürüm ${SHA:0:7} geri yükleniyor"
          git fetch -q origin "$SHA" && git checkout -q "$SHA"
          rm -rf dist_site dist_portal && python3 cpanel/paketle.py _saha
          CP_ALAN=aksarayenerji.net CP_KONTROL="/=<title" python3 cpanel/yukle.py dist_site || true
          CP_ALAN=portal.aksarayenerji.net CP_KONTROL="/=<title" python3 cpanel/yukle.py dist_portal || true
          git checkout -q ${{ github.sha }}
          sleep 10; python3 izleme/duman_testi.py cpanel || echo "::error::Geri alma sonrası da sorun var — elle bakılmalı"
          exit 1
