name: TikTok istatistik (sunucudan, günlük)
# Sunucudaki TikTok oturumuyla Studio içerik listesini okur; izlenme/beğeni/yorum sayılarını Yayın Takibi'ne (yayin.json) işler.
# Bilgisayar gerekmez; hiçbir şey yayınlamaz/değiştirmez.
on:
  schedule: [{ cron: '23 6,15 * * *' }]   # 09:23 ve 18:23 İstanbul
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tt-istatistik, cancel-in-progress: false }
jobs:
  oku:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sunucudan oku
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          mkdir -p ~/.ssh /tmp/pk/sunucu
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          cp sunucu/islem_tt_istatistik.sh /tmp/pk/sunucu/; tar czf /tmp/paket.tgz -C /tmp/pk .
          S="ssh -i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 root@$ADRES"
          $S "rm -rf /tmp/tt_i && mkdir -p /tmp/tt_i && tar xzf - -C /tmp/tt_i && cd /tmp/tt_i && bash sunucu/islem_tt_istatistik.sh; k=\$?; rm -rf /tmp/tt_i; exit \$k" < /tmp/paket.tgz > /tmp/cikti.txt 2>&1 || true
          rm -f ~/.ssh/k
          grep '^NOT:' /tmp/cikti.txt | sed 's/^NOT: *//' | while IFS= read -r l; do echo "::notice::$l"; done
          python3 - <<'PY'
          import json, re, unicodedata
          from datetime import datetime, timezone, timedelta
          t = open('/tmp/cikti.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'===TT===\n(.*?)\n===SON===', t, re.S)
          if not m: print('::error::sunucu sonucu okunamadı'); print(t[-800:]); raise SystemExit(1)
          d = json.loads(m.group(1)); G = d.get('gonderiler') or []
          if not G: print('::warning::gönderi okunamadı'); raise SystemExit(0)
          def norm(x): return re.sub(r'\W+', '', unicodedata.normalize('NFKD', (x or '')).lower())[:40]
          yol = 'docs/yayin/yayin.json'; j = json.load(open(yol, encoding='utf-8')); n = 0
          simdi = datetime.now(timezone(timedelta(hours=3)))
          for k in j['kayitlar']:
              if k.get('platform') != 'TikTok': continue
              for g in G:
                  if norm(g['metin']).startswith(norm(k.get('baslik'))[:30]) and len(norm(k.get('baslik'))) >= 10:
                      k['izlenme'] = g['izlenme']; k['begeni'] = g['begeni']; k['yorum_sayisi'] = g['yorum']; k['tt_gizlilik'] = g['gizlilik']; n += 1; break
          j['tiktok'] = {'okuma': simdi.strftime('%Y-%m-%d %H:%M'), 'hesap_7g': d.get('hesap', {}), 'gonderi': len(G)}
          json.dump(j, open(yol, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print(f'::notice::{n} TikTok kaydına sayılar işlendi')
          PY
      - name: Kaydet
        if: always()
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add docs/yayin/yayin.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "TikTok istatistik: $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
