name: Uydu görüntüsü indir (NASA GIBS, kamu malı)
on:
  workflow_dispatch:
  push:
    paths: ['video/uydu/istek.json']
permissions: {contents: write}
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow numpy
      - working-directory: video/uydu
        run: python3 indir.py istek.json
      - run: |
          git config user.name "uydu-bot"; git config user.email "uydu-bot@users.noreply.github.com"
          git add video/uydu/*.jpg video/uydu/secim.json
          git commit -m "Uydu görüntüleri (NASA GIBS)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
