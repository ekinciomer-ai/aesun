name: DNS (aksarayenerji.net)
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "listele | ekle | tasi"
        default: listele
      ad:
        description: "alt alan adı (ekle için), IP = ns1"
        default: ""
      yeni_ip:
        description: "tasi için yeni IP (ad alanına virgüllü adlar)"
        default: ""
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CP_USER: ${{ secrets.FTP_KULLANICI }}
          CP_TOKEN: ${{ secrets.CPANEL_ANAHTAR }}
          IP: ${{ secrets.SUNUCU_ADRES }}
        run: if [ "${{ inputs.islem }}" = tasi ]; then python3 cpanel/dns.py tasi "${{ inputs.ad }}" "$IP" "${{ inputs.yeni_ip }}"; else python3 cpanel/dns.py "${{ inputs.islem }}" "${{ inputs.ad }}" "$IP"; fi
