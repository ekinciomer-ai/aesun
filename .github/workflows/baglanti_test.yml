name: cPanel bağlantı testi
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Port taraması
        env:
          H: ${{ secrets.FTP_SUNUCU }}
        run: |
          IP=$(getent hosts "$H" | awk '{print $1}' | head -1); echo "::notice::ip=$IP"
          for h in "$H" aksarayenerji.net www.aksarayenerji.net; do echo "::notice::$h -> $(getent hosts $h | awk '{print $1}' | head -1)"; done
          for p in 21 22 990 2082 2083 443; do timeout 6 bash -c "</dev/tcp/$IP/$p" 2>/dev/null && echo "::notice::port $p AÇIK" || echo "::notice::port $p kapalı"; done
