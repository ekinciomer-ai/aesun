name: Video aktar (artifact → sunucu + önizleme)
# Bir video_render çalışmasının "video-<ad>" çıktısını sunucuya (/opt/aesun/video_bekleyen/) taşır,
# küçük önizlemesini "video-onizleme" dalına koyar. YouTube'a yüklemez (yükleme yalnız onaylı kuyrukla).
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "video_render çalışma kimliği", required: true}
      ad: {description: "çıktı adı (video-<ad>)", required: true}
  workflow_call:
    inputs:
      run_id: {type: string, required: true}
      ad: {type: string, required: true}
    secrets:
      SUNUCU_SSH: {required: true}
      SUNUCU_ADRES: {required: true}
permissions:
  contents: write
  actions: read
jobs:
  aktar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: "video-${{ inputs.ad }}", path: /tmp/v, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - name: Sunucuya taşı
        env: {ANAHTAR: "${{ secrets.SUNUCU_SSH }}", ADRES: "${{ secrets.SUNUCU_ADRES }}"}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k; O="-i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          ssh $O root@$ADRES "mkdir -p /opt/aesun/video_bekleyen"
          scp $O /tmp/v/${{ inputs.ad }}.mp4 root@$ADRES:/opt/aesun/video_bekleyen/${{ inputs.ad }}.mp4
          ssh $O root@$ADRES "ls -la /opt/aesun/video_bekleyen/${{ inputs.ad }}.mp4; find /opt/aesun/video_bekleyen -name '*.mp4' -mtime +30 -delete"; rm -f ~/.ssh/k
      - uses: actions/checkout@v4
        with: {ref: main, sparse-checkout: README.md}
      - name: Önizleme dalı
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          ffmpeg -v error -y -i /tmp/v/${{ inputs.ad }}.mp4 -vf "scale='if(gt(iw,ih),960,540)':-2" -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 96k -movflags +faststart /tmp/${{ inputs.ad }}.mp4
          ls -la /tmp/${{ inputs.ad }}.mp4
          cd /tmp && rm -rf o && mkdir o && cd o && git init -q && git config user.name "aesun-yayin" && git config user.email "yayin@aksarayenerji.net"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin video-onizleme; then git checkout -q -b video-onizleme FETCH_HEAD; else git checkout -q --orphan video-onizleme; fi
          for f in $(ls -A | grep -v -E '\.mp4$|^\.git$'); do git rm -rq --ignore-unmatch "$f"; rm -rf "$f"; done
          cp /tmp/${{ inputs.ad }}.mp4 . && git add -A && git commit -qm "önizleme: ${{ inputs.ad }}" && git push -q origin HEAD:video-onizleme
