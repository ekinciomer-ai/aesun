name: YouTube yükleme kuyruğu (otomatik)
# sunucu/yt_kuyruk/<kod>.json + <kod>.mp4 (+ isteğe bağlı <kod>.jpg/.png kapak) eklenince sunucudaki resmi YouTube bağlantısıyla yükler ve publishAt'e planlar.
# Bilgisayar gerekmez. Başarılı işler sunucu/yt_kuyruk/tamam/ altına taşınır, video/kapak dosyası depodan çıkarılır,
# kayıt docs/yayin/yayin.json'a "Planlı" olarak yazılır. Kurallar: YAYIN_TAKIBI.md (yol haritası, kota, tekrar yok).
on:
  push:
    branches: [main]
    paths: ['sunucu/yt_kuyruk/*.json', 'sunucu/islem_yt_kuyruk.sh', '.github/workflows/yt_kuyruk.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency: { group: yt-kuyruk-v2, cancel-in-progress: false }
jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kuyrukta iş var mı
        id: k
        run: |
          python3 - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone, timedelta
          bugun = datetime.now(timezone(timedelta(hours=3))).strftime("%Y-%m-%d")
          vadesi_gelen = []
          bekleyen = []
          for jf in sorted(glob.glob("sunucu/yt_kuyruk/*.json")):
              it = json.load(open(jf, encoding="utf-8"))
              kod = os.path.basename(jf)[:-5]
              eey = it.get("en_erken_yukle")
              if eey and bugun < eey:
                  bekleyen.append(f"{kod}({eey})")
              else:
                  vadesi_gelen.append(kod)
          open("/tmp/vadesi_gelenler.txt", "w", encoding="utf-8").write("\n".join(vadesi_gelen))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"n={len(vadesi_gelen)}\n")
          print(f"Bugün ({bugun}): vadesi gelen {len(vadesi_gelen)} iş {vadesi_gelen}; ileri tarihli bekleyen {len(bekleyen)} iş {bekleyen}")
          PY
      - name: Sunucuda yükle
        if: steps.k.outputs.n != '0'
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          set -o pipefail
          mkdir -p ~/.ssh /tmp/pk/sunucu /tmp/pk/kuyruk
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          cp sunucu/islem_yt_kuyruk.sh /tmp/pk/sunucu/
          while IFS= read -r kod; do
            [ -z "$kod" ] && continue
            cp "sunucu/yt_kuyruk/${kod}.json" /tmp/pk/kuyruk/
            for ext in mp4 jpg png; do [ -f "sunucu/yt_kuyruk/${kod}.${ext}" ] && cp "sunucu/yt_kuyruk/${kod}.${ext}" /tmp/pk/kuyruk/ || true; done
          done < /tmp/vadesi_gelenler.txt
          tar czf /tmp/paket.tgz -C /tmp/pk .
          S="ssh -i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 root@$ADRES"
          $S "rm -rf /tmp/yt_kuyruk && mkdir -p /tmp/yt_kuyruk && tar xzf - -C /tmp/yt_kuyruk && cd /tmp/yt_kuyruk && bash sunucu/islem_yt_kuyruk.sh; k=\$?; rm -rf /tmp/yt_kuyruk; exit \$k" < /tmp/paket.tgz > /tmp/cikti.txt 2>&1 || true
          rm -f ~/.ssh/k
          { grep '^NOT:' /tmp/cikti.txt || true; } | sed 's/^NOT: *//' | while IFS= read -r l; do echo "::notice::$l"; done
          python3 - <<'PY'
          import json, re, os, subprocess
          from datetime import datetime
          t = open('/tmp/cikti.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'===KUYRUK===\n(.*?)\n===SON===', t, re.S)
          if not m:
              print('::error::sunucu sonucu okunamadı'); print(t[-1500:]); raise SystemExit(1)
          sonuc = json.loads(m.group(1))
          yol = 'docs/yayin/yayin.json'; j = json.load(open(yol, encoding='utf-8')); K = j['kayitlar']
          ix = {x.get('vid'): x for x in K if x.get('vid')}
          os.makedirs('sunucu/yt_kuyruk/tamam', exist_ok=True)
          for s in sonuc:
              kod = s['kod']
              if s.get('durum') == 'plan kaldırıldı':
                  if s['eski'] in ix: ix[s['eski']]['durum'] = 'Gizli'; ix[s['eski']]['not'] = 'planı kaldırıldı'
                  subprocess.run(['git', 'mv', f'sunucu/yt_kuyruk/{kod}.json', f'sunucu/yt_kuyruk/tamam/{kod}.json'], check=False)
                  print(f'::notice::{kod}: planı kaldırıldı → {s["eski"]}'); continue
              if not s.get('vid'):
                  print('::warning::' + kod + ' ' + s['durum'] + ' ' + s.get('detay', '')); continue
              p = datetime.fromisoformat(s['publishAt'])
              durum_str = 'Yayında' if p <= datetime.now(p.tzinfo) else 'Planlı'
              kanal = {'TR': 'Antik Stüdyo', 'EN': 'Ancient Studio', 'ES': 'Estudio Antiguo', 'KZ_TR': 'Kozmos Lab TR', 'KZ_EN': 'Kozmos Lab', 'OD': 'Ömür Dediğin'}.get(s['kanal'], s['kanal'])
              dil = {'TR': 'TR', 'EN': 'EN', 'ES': 'ES', 'KZ_TR': 'TR', 'KZ_EN': 'EN', 'OD': 'TR'}.get(s['kanal'], s['kanal'])
              taslak_eslesme = next((r for r in K if not r.get('vid') and r.get('kanal') == kanal and (r.get('baslik') == s['baslik'] or (s.get('seri') and r.get('seri') == s.get('seri') and r.get('tarih') == p.strftime('%Y-%m-%d')))), None)
              x = ix.get(s['vid']) or taslak_eslesme or {}
              tur = s.get('tur') or 'Short'
              x.update(platform='YouTube', kanal=kanal, dil=dil, tur=tur, seri=s.get('seri') or x.get('seri') or 'Gündem + Tarih',
                       baslik=s['baslik'], durum=durum_str, tarih=p.strftime('%Y-%m-%d'), saat=p.strftime('%H:%M'), izlenme=x.get('izlenme'),
                       link=(f"https://youtube.com/shorts/{s['vid']}" if tur == 'Short' else f"https://youtube.com/watch?v={s['vid']}"), vid=s['vid'], ureten=s.get('ureten') or x.get('ureten') or 'Claude')
              if taslak_eslesme is not None: x.pop('not', None)
              if s['vid'] not in ix and taslak_eslesme is None: K.append(x)
              if s.get('eski_gizlendi') and s['eski_gizlendi'] in ix:
                  e = ix[s['eski_gizlendi']]; e['durum'] = 'Gizli'; e['not'] = f"yerine sesli sürüm yüklendi: {s['vid']}"
              subprocess.run(['git', 'mv', f'sunucu/yt_kuyruk/{kod}.json', f'sunucu/yt_kuyruk/tamam/{kod}.json'], check=False)
              subprocess.run(['git', 'rm', '-q', '--ignore-unmatch', f'sunucu/yt_kuyruk/{kod}.mp4', f'sunucu/yt_kuyruk/{kod}.jpg', f'sunucu/yt_kuyruk/{kod}.png'], check=False)
              print(f'::notice::{kod}: {s["durum"]} → {s["vid"]}')
          json.dump(j, open(yol, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
      - name: Kaydet
        if: steps.k.outputs.n != '0'
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A sunucu/yt_kuyruk docs/yayin/yayin.json
          git diff --cached --quiet && exit 0
          git commit -qm "YouTube kuyruğu: yüklendi ve planlandı $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
