<script>
// Kara Kutu · 2D vektör çizgi film (Format 1, kalın mürekkep çizgi). Konu: "Kavşağa önce giren geçer" miti.
// Olay, kesinleşmiş bir Yargıtay kararındaki olgulara dayanır; kişi, plaka, yer ve karar numarası gösterilmez.
// Kayıt sözleşmesi (video/arac/kayit.js): window.kurgu(K), window.kare(t), window.HAZIR
// K = {toplam, dil, parca:{V1:[bas,son],...,V7}, sayac:[bas,son], altyazi:[{bas,son,metin}]}
const SV=document.getElementById('s');let K=null;
const Q=new URLSearchParams(location.search);
const INK='#1f1a16',PAPER='#efe3c6',P2='#e2d0a6',ASF='#8d8a84',ASF2='#7b7872',CIZ='#f4f0e4',KALD='#cfc4ab',CIM='#9db06c',CIM2='#87a05a';
const MAV='#4f86b8',SAR='#e9b93a',KIR='#c8432f',YES='#4e9a5b',TEN='#f0c9a0';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=p=>{p=cl(p);return p*p*(3-2*p)},eout=p=>1-Math.pow(1-cl(p),3),lerp=(a,b,k)=>a+(b-a)*k;
const W=6;
const st=(f,w=W)=>`fill="${f}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const g=(x,y,s,inner,r=0,op=1)=>`<g transform="translate(${x},${y}) rotate(${r}) scale(${s})" opacity="${op}">${inner}</g>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

// ---------- dil ----------
const T={
 tr:{kanal:'KARA KUTU',renk:'#e2702c',seri:'MİT Mİ GERÇEK Mİ?',mit:['KAVŞAĞA ÖNCE','GİREN GEÇER?'],adim:['MİT','KAZA','OYLA','KARAR','DERS'],
  van:'KAMYONET',moto:'MOTOSİKLET',sag:'SAĞDAN',dur:'DUR',temsili:'TEMSİLİ CANLANDIRMA',bilgi:'Hava açık · yol kuru · hız sınırı 50',cat:'ÇARPIŞMA!',
  soru:'SENCE KİM KUSURLU?',sik:['Sadece kamyonet','Sadece motosiklet','İkisi de'],yorum:'Cevabını yoruma yaz',geri:'GERİ SARALIM',
  ipucu:['DUR levhası vardı','Motosiklet sağdan geliyordu','Motosiklet yavaşlamadı'],ip:'İPUCU',
  karar:'MAHKEME KARARI',kv:['KAMYONET','ASLİ KUSURLU','DUR\'da durmadı · yol vermedi','4.500 TL adli para cezası','Ehliyet 4 ay geri alındı'],
  km:['MOTOSİKLET','TALİ KUSURLU','Geçiş hakkı vardı ama yavaşlamadı'],onay:'YARGITAY ONADI',dogru:'Doğru şık: C',
  ders:'KAVŞAKTA SIRA',dk:['1. Levha ve ışık','2. Yol türü (ana yol, dönel…)','3. İşaret yoksa: sağdan gelen önce'],yav:'Geçiş hakkın olsa da YAVAŞLA',ceza:'Kurala uymamak: 5.000 TL idari ceza',
  efsane:'"Önce giren geçer" diye kural YOK',son:['SEN HANGİ','ŞIKKI SEÇTİN?'],
  not:'Yargıtay kararından uyarlanmıştır · Kişi, plaka ve yer bilgisi verilmemiştir · Genel bilgidir, hukuki danışmanlık değildir'},
 en:{kanal:'BLACK BOX FILES',renk:'#3d7fc4',seri:'MYTH OR FACT?',mit:['FIRST INTO THE','INTERSECTION GOES?'],adim:['MYTH','CRASH','VOTE','RULING','LESSON'],
  van:'VAN',moto:'MOTORCYCLE',sag:'FROM RIGHT',dur:'STOP',temsili:'DRAMATIZATION',bilgi:'Clear weather · dry road · limit 50 km/h',cat:'CRASH!',
  soru:'WHO IS AT FAULT?',sik:['Only the van','Only the motorcycle','Both'],yorum:'Answer in the comments',geri:'REWIND',
  ipucu:['There was a STOP sign','The motorcycle came from the right','The motorcycle didn\'t slow down'],ip:'CLUE',

  km:['MOTORCYCLE','SECONDARY FAULT','Had right of way, didn\'t slow down'],onay:'SUPREME COURT UPHELD',dogru:'Right answer: C',
  ders:'WHO GOES FIRST',dk:['1. Signs and lights','2. Road type (main road, roundabout…)','3. No signs: yield to the right'],yav:'Right of way? Still SLOW DOWN',ceza:'Turkish law · fine for breaking it',
  efsane:'No "first in goes first" rule',son:['WHICH OPTION','DID YOU PICK?'],
  not:'Based on a Turkish Supreme Court ruling · Names, plates and places withheld · General information, not legal advice'},
 es:{kanal:'CAJA NEGRA',renk:'#e0b21f',seri:'¿MITO O VERDAD?',mit:['¿EL PRIMERO QUE','ENTRA, PASA?'],adim:['MITO','CHOQUE','VOTA','FALLO','LECCIÓN'],
  van:'FURGONETA',moto:'MOTO',sag:'POR LA DERECHA',dur:'STOP',temsili:'RECREACIÓN',bilgi:'Despejado · asfalto seco · límite 50',cat:'¡CHOQUE!',
  soru:'¿QUIÉN TIENE LA CULPA?',sik:['Solo la furgoneta','Solo la moto','Los dos'],yorum:'Responde en los comentarios',geri:'REBOBINEMOS',
  ipucu:['Había una señal de STOP','La moto venía por la derecha','La moto no frenó'],ip:'PISTA',
  karar:'EL FALLO',kv:['FURGONETA','CULPA PRINCIPAL','No paró en el STOP · no cedió','Multa penal de 4.500 liras','4 meses sin carné'],
  km:['MOTO','CULPA SECUNDARIA','Tenía prioridad, pero no frenó'],onay:'CONFIRMADO POR EL SUPREMO',dogru:'Respuesta correcta: C',
  ders:'QUIÉN PASA PRIMERO',dk:['1. Señales y semáforos','2. Tipo de vía (principal, rotonda…)','3. Sin señales: prioridad a la derecha'],yav:'Aunque tengas prioridad: FRENA',ceza:'Ley turca · multa por incumplir',
  efsane:'No existe "el primero que entra, pasa"',son:['¿QUÉ OPCIÓN','ELEGISTE?'],

};
let L=T.tr;

// ---------- sahne ögeleri ----------
const CX=540,CY=900;            // kavşak merkezi
const YOL=170;                   // yol genişliği
function zemin(){
 let o=`<rect x="-20" y="380" width="1120" height="1080" fill="${CIM}"/>`;
 // çimen dokusu
 for(let i=0;i<70;i++){const x=(i*137)%1080,y=400+((i*271)%1040);o+=`<path d="M${x},${y} l6,-12 l5,10 l6,-14" fill="none" stroke="${CIM2}" stroke-width="4" stroke-linecap="round"/>`}
 // kaldırım + bloklar
 const blok=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" ${st(KALD)}/>`;
 o+=blok(40,420,CX-YOL/2-70,CY-YOL/2-450)+blok(CX+YOL/2+30,420,1040-CX-YOL/2-30,CY-YOL/2-450)+blok(40,CY+YOL/2+30,CX-YOL/2-70,1420-CY-YOL/2-30)+blok(CX+YOL/2+30,CY+YOL/2+30,1040-CX-YOL/2-30,1420-CY-YOL/2-30);
 // evler (çatılı)
 const ev=(x,y,s,c)=>g(x,y,s,`<rect x="-70" y="-60" width="140" height="120" ${st('#f6efe0')}/><path d="M-80,-55 L0,-115 L80,-55Z" ${st(c)}/><rect x="-18" y="10" width="36" height="50" ${st('#8fb3bd',4)}/><rect x="-55" y="-35" width="28" height="26" ${st('#8fb3bd',4)}/><rect x="27" y="-35" width="28" height="26" ${st('#8fb3bd',4)}/>`);
 o+=ev(220,620,1,'#c46a4a')+ev(850,620,1,'#5c8aa8')+ev(870,1210,1,'#c46a4a');
 const agac=(x,y,s)=>g(x,y,s,`<rect x="-9" y="-10" width="18" height="40" ${st('#8a6a44',4)}/><circle cy="-40" r="46" ${st('#6f8a4f')}/><circle cx="-26" cy="-22" r="26" ${st('#7d9a59',4)}/>`);
 o+=agac(330,1240,1)+agac(170,1150,0.8)+agac(960,980,0.7)+agac(120,800,0.75);
 // yollar
 o+=`<rect x="-20" y="${CY-YOL/2}" width="1120" height="${YOL}" ${st(ASF)}/><rect x="${CX-YOL/2}" y="370" width="${YOL}" height="1100" ${st(ASF)}/>`;
 o+=`<rect x="${CX-YOL/2+3}" y="${CY-YOL/2+3}" width="${YOL-6}" height="${YOL-6}" fill="${ASF2}"/>`;
 // şerit çizgileri
 for(let x=-20;x<CX-YOL/2-20;x+=70)o+=`<rect x="${x}" y="${CY-4}" width="40" height="8" fill="${CIZ}"/>`;
 for(let x=CX+YOL/2+20;x<1100;x+=70)o+=`<rect x="${x}" y="${CY-4}" width="40" height="8" fill="${CIZ}"/>`;
 for(let y=370;y<CY-YOL/2-20;y+=70)o+=`<rect x="${CX-4}" y="${y}" width="8" height="40" fill="${CIZ}"/>`;
 for(let y=CY+YOL/2+20;y<1470;y+=70)o+=`<rect x="${CX-4}" y="${y}" width="8" height="40" fill="${CIZ}"/>`;
 // kamyonetin durma çizgisi (batı kol, doğuya giden şerit)
 o+=`<rect x="${CX-YOL/2-22}" y="${CY+4}" width="12" height="${YOL/2-6}" fill="${CIZ}"/>`;
 return o;
}
function durLevha(x,y,s,parla){
 const p=parla?`<circle r="72" fill="none" stroke="${SAR}" stroke-width="${8+6*parla}" opacity="${0.5+0.5*parla}"/>`:'';
 let o='';for(let i=0;i<8;i++){const a=(i*45+22.5)*Math.PI/180;o+=`${i?'L':'M'}${Math.cos(a)*48},${Math.sin(a)*48}`}
 return g(x,y,s,`<rect x="-5" y="40" width="10" height="70" ${st('#9aa0a4',4)}/>`+p+`<path d="${o}Z" ${st(KIR,5)}/><text y="13" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="${L.dur.length>3?30:34}" fill="#fff">${esc(L.dur)}</text>`);
}
// kamyonet (üstten görünüş, burnu +x yönünde)
function kamyonet(x,y,r){return g(x,y,1,`<rect x="-82" y="-36" width="164" height="72" rx="10" ${st('#f2f2ee')}/><rect x="-82" y="-36" width="104" height="72" rx="8" ${st('#e8e6df',5)}/>`+
 `<rect x="28" y="-30" width="40" height="60" rx="8" ${st('#9ec3d6',5)}/><rect x="62" y="-32" width="18" height="64" rx="6" ${st('#d8d6cf',4)}/>`+
 `<rect x="-70" y="-42" width="26" height="10" rx="3" fill="${INK}"/><rect x="-70" y="32" width="26" height="10" rx="3" fill="${INK}"/><rect x="40" y="-42" width="26" height="10" rx="3" fill="${INK}"/><rect x="40" y="32" width="26" height="10" rx="3" fill="${INK}"/>`,r)}
// motosiklet (burnu +x; sürücü yüzsüz, kask)
function motor(x,y,r){return g(x,y,1,`<rect x="-46" y="-9" width="92" height="18" rx="9" ${st('#3b3f45',5)}/><ellipse cx="-38" cy="0" rx="13" ry="7" fill="${INK}"/><ellipse cx="38" cy="0" rx="13" ry="7" fill="${INK}"/>`+
 `<rect x="-14" y="-17" width="40" height="34" rx="12" ${st(MAV,5)}/><line x1="24" y1="-24" x2="24" y2="24" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><circle cx="-4" cy="0" r="15" ${st('#f1f1ec',5)}/>`,r)}
function etiket(x,y,txt,c=INK,bg='#fffaf0',fs=30){const w=txt.length*fs*0.56+34;return `<g transform="translate(${x},${y})"><rect x="${-w/2}" y="-26" width="${w}" height="46" rx="14" fill="${bg}" stroke="${INK}" stroke-width="4"/><text y="8" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="${fs}" fill="${c}">${esc(txt)}</text></g>`}
function ok(x1,y1,x2,y2,c=SAR){const a=Math.atan2(y2-y1,x2-x1),h=22;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="9" stroke-linecap="round"/><path d="M${x2+Math.cos(a)*h},${y2+Math.sin(a)*h} L${x2+Math.cos(a+2.4)*h},${y2+Math.sin(a+2.4)*h} L${x2+Math.cos(a-2.4)*h},${y2+Math.sin(a-2.4)*h}Z" fill="${c}" stroke="${INK}" stroke-width="4"/>`}
function patlama(x,y,s,txt,t){let d='';const n=14;for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,r=i%2?78:140+12*Math.sin(t*40+i);d+=`${i?'L':'M'}${Math.cos(a)*r},${Math.sin(a)*r*0.8}`}
 return g(x,y,s,`<path d="${d}Z" fill="${SAR}" stroke="${INK}" stroke-width="7"/><text y="16" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="${txt.length>9?40:48}" fill="${KIR}" stroke="${INK}" stroke-width="2">${esc(txt)}</text>`,-8)}
function kart(x,y,w,h,ic,c='#fffaf0',r=0){return g(x,y,1,`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="26" fill="${c}" stroke="${INK}" stroke-width="7"/>`+ic,r)}
function damga(x,y,txt,a,c=KIR){const s=1+1.4*(1-eout(a));return a<=0?'':g(x,y,s,`<rect x="${-txt.length*15-30}" y="-46" width="${txt.length*30+60}" height="88" rx="10" fill="none" stroke="${c}" stroke-width="9"/><text y="16" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="50" fill="${c}">${esc(txt)}</text>`,-9,cl(a*3))}

// ---------- araç hareketleri (olay zamanı z: 0 → 1 V2 sonu, 1 → 2 V3 çarpışma, sonrası) ----------
// kamyonet batıdan doğuya (alt şerit y=CY+42), motosiklet güneyden kuzeye (sağ şerit x=CX+42)
const CARP=[CX+20,CY+42];
function konumlar(z){
 // z<1: yaklaşma; 1..1.7: kavşağa giriş; 1.7: çarpışma; >1.7 savrulma
 const vx=z<1?lerp(-160,CX-YOL/2-110,ease(z)):z<1.7?lerp(CX-YOL/2-110,CARP[0]-80,(z-1)/0.7):CARP[0]-80+22*eout((z-1.7)/0.5);
 const my=z<1?lerp(1600,CY+YOL/2+180,ease(z)):z<1.7?lerp(CY+YOL/2+180,CARP[1]+40,(z-1)/0.7):CARP[1]+40;
 let m={x:CX+42,y:my,r:-90};
 if(z>1.7){const k=eout((z-1.7)/0.6);m={x:CX+42+150*k,y:CARP[1]+40-70*k,r:-90+130*k}}
 return {v:{x:vx,y:CY+42,r:0},m};
}

// ---------- bölümler ----------
let SAY=0;
function bolum(t){const P=K.parca;for(const k of ['V7','V6','V5','V4','V3','V2','V1'])if(t>=P[k][0])return k;return 'V1'}
function ilerleme(t){const P=K.parca;const v=bolum(t);return {V1:0,V2:1,V3:1,V4:2,V5:3,V6:3,V7:4}[v]}
function olayZ(t){const P=K.parca;
 if(t<P.V2[0])return 0.55;
 if(t<P.V3[0])return cl((t-P.V2[0])/(P.V2[1]-P.V2[0]))*0.98;
 if(t<P.V4[0]){const ct=K.carp-P.V3[0];const k=cl((t-P.V3[0])/ct);return 1+k*0.7+(k>=1?cl((t-K.carp)/0.9)*0.6:0)}
 if(t<P.V5[0])return 2.3;
 if(t<P.V6[0]){const k=cl((t-P.V5[0])/1.6);return lerp(2.3,0.9,eout(k))}
 return 2.3;
}

function kare(t){
 const P=K.parca,v=bolum(t),tv=t-P[v][0],dv=P[v][1]-P[v][0];
 const S3=window.sahne3d(t,K);
 let o=`<path fill-rule="evenodd" fill="${PAPER}" d="M0,0H1080V1920H0Z M50,380H1030A30,30 0 0 1 1060,410V1430A30,30 0 0 1 1030,1460H50A30,30 0 0 1 20,1430V410A30,30 0 0 1 50,380Z"/>`;
 // ---- sahne alanı (y 380–1460) ----
 let s=zemin();
 const z=olayZ(t),{v:va,m:mo}=konumlar(z);
 const durParla=(v==='V5'&&tv>K.ip[0]-P.V5[0]&&tv<K.ip[1]-P.V5[0])?0.5+0.5*Math.sin(t*10):(v==='V3'&&z>1&&z<1.7?0.6:0);
 s+=durLevha(CX-YOL/2-60,CY+YOL/2+70,1,durParla);
 if(v!=='V1'||true){s+=kamyonet(va.x,va.y,va.r);s+=motor(mo.x,mo.y,mo.r)}
 // etiketler
 if(v==='V2'||v==='V5'){const a=v==='V2'?ease(tv/0.6):1;
  s+=`<g opacity="${a}">`+etiket(va.x,va.y-70,L.van)+etiket(mo.x+(mo.x>800?-120:140),mo.y,L.moto)+`</g>`;
  if(v==='V2'&&tv>dv*0.55)s+=`<g opacity="${ease((tv-dv*0.55)/0.5)}">`+ok(mo.x+70,mo.y+120,mo.x+70,mo.y+10)+etiket(mo.x+160,mo.y+150,L.sag,INK,SAR,26)+`</g>`;
 }
 // V5 ipuçları vurgusu
 if(v==='V5'){
  if(t>=K.ip[1])s+=ok(CX+130,CY+330,CX+130,CY+190);
  if(t>=K.ip[2])s+=g(mo.x+110,mo.y+40,1,`<circle r="46" ${st('#fffaf0',5)}/><path d="M-30,10 A32,32 0 0 1 30,10" fill="none" stroke="${INK}" stroke-width="5"/><line x1="0" y1="10" x2="${22*Math.cos(-0.5)}" y2="${10-22}" stroke="${KIR}" stroke-width="7" stroke-linecap="round"/><text y="36" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="20" fill="${KIR}">50+</text>`);
 }
 // çarpışma anı: gösterilmez → patlama yazısı
 const carpT=K.carp;
 let titre=0;
 if(t>=carpT-0.05&&t<P.V4[0]){const k=t-carpT;if(k<0.6)titre=(1-k/0.6)*14;s+=patlama(CARP[0]+30,CARP[1]-30,eout(k/0.25),L.cat,t)}
 // kamera: V3'te yakınlaşma, V1'de hafif uzak
 let zoom=1,fx=CX,fy=CY;
 if(v==='V1')zoom=1.0+0.03*ease(tv/dv);
 if(v==='V3'){zoom=1+0.35*ease(tv/(dv*0.6));fx=lerp(CX,CARP[0],ease(tv/dv));fy=lerp(CY,CARP[1],ease(tv/dv))}
 if(v==='V4')zoom=1.35,fx=CARP[0],fy=CARP[1];
 const sx=Math.sin(t*90)*titre,sy=Math.cos(t*77)*titre;
 o+=`<defs><clipPath id="kes"><rect x="20" y="380" width="1040" height="1080" rx="30"/></clipPath></defs>`;
 o+=`<g clip-path="url(#kes)">`;
 if(v==='V2'||v==='V5'){const a=v==='V2'?ease(tv/0.6):1;o+=`<g opacity="${a}">`+etiket(S3.van[0],S3.van[1],L.van)+etiket(S3.moto[0],S3.moto[1],L.moto)+etiket(S3.dur[0],S3.dur[1]-20,'DUR','#fff',KIR,24)+`</g>`;
  if(v==='V2'&&tv>dv*0.55)o+=`<g opacity="${ease((tv-dv*0.55)/0.5)}">`+etiket(S3.moto[0],S3.moto[1]-60,L.sag,INK,SAR,26)+`</g>`}
 if(t>=carpT-0.05&&t<P.V4[0]){const k=t-carpT;o+=patlama(S3.carp[0],S3.carp[1]-40,eout(k/0.25),L.cat,t)}
 // geri sarma efekti
