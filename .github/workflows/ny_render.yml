name: Nasıl Yapıldı – 3D video üretimi (paralel render)
# video/ny/istek/<KOD>.json  {"kod": "...", "mod": "onizleme" | "final"} eklenince:
#  1) hazırla: Google TTS parçalarından anlatım + kodla ses tasarımı + kurgu (uret.py --sadece-hazirla)
#  2) parça: 3D sahne (three.js) kare kare, paralel işlerde kaydedilir
#  3) birleştir: parçalar + miks (-14 LUFS) → video/ny/cikti/<mod>/<KOD>.mp4 ; istek tamam/ altına taşınır
# Ücretsiz (açık depo GitHub Actions). Bilgisayar ve sunucu yükü yok.
on:
  push:
    branches: [main]
    paths: ['video/ny/istek/*.json']
  workflow_run:
    workflows: ["Nasıl Yapıldı – Google TTS seslendirme"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ny-render, cancel-in-progress: false }
jobs:
  hazirla:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matris: ${{ steps.m.outputs.matris }}
      var: ${{ steps.m.outputs.var }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "video/ny"}
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q numpy scipy pillow matplotlib
      - id: m
        run: |
          cd video/ny
          python3 - <<'PY'
          import json, glob, math, subprocess, os
          M = []
          for f in sorted(glob.glob("istek/*.json")):
              r = json.load(open(f)); kod, mod = r["kod"], r.get("mod", "onizleme")
              if not os.path.isdir(f"ses/{kod}"): print("ses bekleniyor", kod); continue
              subprocess.run(["python3", "arac/uret.py", kod, mod, "--sadece-hazirla"], check=True)
              T = json.load(open(f"is/{kod}/kurgu.json"))["toplam"]; N = math.ceil(T * 30)
              P = 5 if mod == "onizleme" else 12; adim = math.ceil(N / P)
              for i in range(P): M.append({"kod": kod, "mod": mod, "i": i, "a": i * adim, "b": min(N, (i + 1) * adim)})
          open(os.environ["GITHUB_OUTPUT"], "a").write("matris=" + json.dumps({"include": M}) + "\n")
          open(os.environ["GITHUB_OUTPUT"], "a").write("var=" + ("1" if M else "0") + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: hazir, path: video/ny/is, retention-days: 2}
  parca:
    needs: hazirla
    if: needs.hazirla.outputs.var == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.hazirla.outputs.matris) }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "video/ny"}
      - uses: actions/download-artifact@v4
        with: {name: hazir, path: video/ny/is}
      - shell: bash
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          cd video/ny && npm i --silent playwright@1.49.1 && npx playwright install --with-deps chromium >/dev/null
          W=$([ "${{ matrix.mod }}" = final ] && echo 1080 || echo 540); AR=$([ "${{ matrix.mod }}" = final ] && echo 1300 || echo 900)
          if [ ! -f motor/arazi_$AR.bin ]; then pip install -q numpy pillow matplotlib scipy && python3 arac/arazi_hazirla.py motor $AR; fi
          set +e; node arac/kayit.js motor is/${{ matrix.kod }}/kurgu.json /tmp/p_${{ matrix.i }}.mp4 $W 30 ${{ matrix.a }} ${{ matrix.b }} $AR > /tmp/log.txt 2>&1; s=$?
          cat /tmp/log.txt; if [ $s != 0 ]; then tail -n 12 /tmp/log.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: {name: "p-${{ matrix.kod }}-${{ matrix.mod }}-${{ matrix.i }}", path: "/tmp/p_${{ matrix.i }}.mp4", retention-days: 2}
  birlestir:
    needs: [hazirla, parca]
    if: needs.hazirla.outputs.var == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "video/ny"}
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: {path: /tmp/a}
      - run: |
          cd video/ny
          for f in istek/*.json; do
            KOD0=$(python3 -c "import json;print(json.load(open('$f'))['kod'])"); [ -f /tmp/a/hazir/$KOD0/miks.wav ] || continue
            KOD=$(python3 -c "import json;print(json.load(open('$f'))['kod'])"); MOD=$(python3 -c "import json;print(json.load(open('$f')).get('mod','onizleme'))")
            ls -d /tmp/a/p-$KOD-$MOD-* | sort -t- -k4 -n | while read d; do echo "file '$(ls $d/*.mp4)'"; done > /tmp/liste_$KOD.txt
            cat /tmp/liste_$KOD.txt
            ffmpeg -v error -y -f concat -safe 0 -i /tmp/liste_$KOD.txt -c copy /tmp/sessiz_$KOD.mp4
            mkdir -p cikti/$MOD rapor/kontrol
            CRF=$([ "$MOD" = final ] && echo 18 || echo 24)
            OUT=cikti/$MOD/$KOD.mp4; [ "$MOD" = final ] && OUT=/tmp/teslim/${KOD}_kaynak.mp4 && mkdir -p /tmp/teslim
            ffmpeg -v error -y -i /tmp/sessiz_$KOD.mp4 -i /tmp/a/hazir/$KOD/miks.wav -filter_complex "[1:a]loudnorm=I=-14:TP=-1.5:LRA=11[a]" \
              -map 0:v -map "[a]" -vf "eq=saturation=1.3:contrast=1.04" -c:v libx264 -preset slow -crf $CRF -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart $OUT
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $OUT)
            ffmpeg -v error -y -i $OUT -vf "fps=6/$D,scale=180:-1,tile=6x1" -frames:v 1 rapor/kontrol/$KOD.jpg || true
            echo "::notice::$KOD $MOD hazır ($D sn)"
            if [ "$MOD" = final ]; then python3 arac/kart_yaz.py $KOD /tmp/teslim/$KOD.json; fi
            mkdir -p istek/tamam && git mv -f "$f" istek/tamam/
          done
      - name: Yükleme Yöneticisi'ne teslim
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          set +e
          ls /tmp/teslim/*.json >/dev/null 2>&1 || { echo "teslim yok"; exit 0; }
          mkdir -p ~/.ssh
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k; O="-i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          ssh $O root@$ADRES "mkdir -p /opt/aesun/video_bekleyen /tmp/ny_teslim"
          scp $O /tmp/teslim/* root@$ADRES:/tmp/ny_teslim/
          ssh $O root@$ADRES 'cd /tmp/ny_teslim && for j in *.json; do k=${j%.json}; install -m 644 ${k}_kaynak.mp4 /opt/aesun/video_bekleyen/${k}_kaynak.mp4 && python3 /opt/aesun/havuz/yonetici.py teslim $j; done; python3 /opt/aesun/havuz/yonetici.py planla; rm -rf /tmp/ny_teslim' > /tmp/teslim.txt 2>&1
          rm -f ~/.ssh/k; cat /tmp/teslim.txt
          grep '^NOT:' /tmp/teslim.txt | sed 's/^NOT: *//' | while IFS= read -r l; do echo "::notice::$l"; done
          G=$(TZ=Europe/Istanbul date +%Y-%m-%d); mkdir -p video/ny/rapor
          python3 - "$G" <<'PY'
          import json, glob, os, sys, subprocess
          f = f"video/ny/rapor/{sys.argv[1]}.json"; r = json.load(open(f)) if os.path.exists(f) else {"tarih": sys.argv[1], "teslim": []}
          notlar = [l[5:].strip() for l in open("/tmp/teslim.txt", encoding="utf-8", errors="replace") if l.startswith("NOT:")]
          for j in sorted(glob.glob("/tmp/teslim/*.json")):
              k = json.load(open(j)); d = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", k["kaynak_dosya"].replace("/opt/aesun/video_bekleyen", "/tmp/teslim")], capture_output=True, text=True).stdout.strip()
              r["teslim"].append({"kod": k["kod"], "seri": k["seri"], "baslik": k["baslik"], "sure": d, "notlar": [n for n in notlar if k["kod"] in n]})
          r["son_plan"] = [n for n in notlar if "plan" in n.lower()][-5:]
          json.dump(r, open(f, "w"), ensure_ascii=False, indent=1)
          PY
      - run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A video/ny/cikti video/ny/istek video/ny/rapor
          git commit -qm "Nasıl Yapıldı: video çıktısı $(TZ=Europe/Istanbul date +'%d.%m %H:%M')" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
