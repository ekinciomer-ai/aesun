name: TikTok yükleme kuyruğu (sunucudan)
# sunucu/tt_kuyruk/<kod>.json eklenince sunucudaki TikTok oturumuyla (tt-tarayici) yükler ve planlar. Bilgisayar gerekmez.
# Video: sunucu/tt_kuyruk/<kod>.mp4, ya da json'daki kaynak.git_commit+yol (depo geçmişinden çıkarılır), ya da sunucudaki medya kopyası.
on:
  push:
    branches: [main]
    paths: ['sunucu/tt_kuyruk/*.json', 'sunucu/islem_tt_yukle.sh', '.github/workflows/tt_kuyruk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tt-kuyruk, cancel-in-progress: false }
jobs:
  yukle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Kuyruk
        id: k
        run: |
          n=$(ls sunucu/tt_kuyruk/*.json 2>/dev/null | wc -l); echo "n=$n" >> $GITHUB_OUTPUT; echo "kuyruk: $n iş"
      - name: Sunucuda yükle
        if: steps.k.outputs.n != '0'
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          set -o pipefail
          mkdir -p ~/.ssh /tmp/pk/sunucu /tmp/pk/kuyruk
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          cp sunucu/islem_tt_yukle.sh /tmp/pk/sunucu/
          for j in sunucu/tt_kuyruk/*.json; do
            k=$(basename "$j" .json); cp "$j" /tmp/pk/kuyruk/
            [ -f "sunucu/tt_kuyruk/$k.mp4" ] && cp "sunucu/tt_kuyruk/$k.mp4" /tmp/pk/kuyruk/
            c=$(python3 -c "import json;d=json.load(open('$j'));print((d.get('kaynak') or {}).get('git_commit',''))"); y=$(python3 -c "import json;d=json.load(open('$j'));print((d.get('kaynak') or {}).get('yol',''))")
            [ -n "$c" ] && [ ! -f "/tmp/pk/kuyruk/$k.mp4" ] && git show "$c:$y" > "/tmp/pk/kuyruk/$k.mp4" 2>/dev/null && echo "$k: video depo geçmişinden alındı ($(stat -c %s /tmp/pk/kuyruk/$k.mp4) bayt)"
            [ -f "sunucu/tt_kuyruk/${k}_kapak.jpg" ] && cp "sunucu/tt_kuyruk/${k}_kapak.jpg" /tmp/pk/kuyruk/ || true
          done
          tar czf /tmp/paket.tgz -C /tmp/pk .
          S="ssh -i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 root@$ADRES"
          $S "rm -rf /tmp/tt_k && mkdir -p /tmp/tt_k && tar xzf - -C /tmp/tt_k && cd /tmp/tt_k && bash sunucu/islem_tt_yukle.sh; k=\$?; rm -rf /tmp/tt_k; exit \$k" < /tmp/paket.tgz > /tmp/cikti.txt 2>&1 || true
          grep '^NOT:' /tmp/cikti.txt | sed 's/^NOT: *//' | while IFS= read -r l; do echo "::notice::$l"; done
          mkdir -p docs/tampon/tiktok/adim
          scp -q -i ~/.ssh/k -o StrictHostKeyChecking=accept-new "root@$ADRES:/opt/aesun/tiktok/adim/*" docs/tampon/tiktok/adim/ 2>/dev/null || true
          rm -f ~/.ssh/k
          python3 - <<'PY'
          import json, re, os, subprocess
          from datetime import datetime
          t = open('/tmp/cikti.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'===TT===\n(.*?)\n===SON===', t, re.S)
          if not m:
              print('::error::sunucu sonucu okunamadı'); print(t[-1200:]); raise SystemExit(1)
          sonuc = json.loads(m.group(1))
          yol = 'docs/yayin/yayin.json'; j = json.load(open(yol, encoding='utf-8')); K = j['kayitlar']
          os.makedirs('sunucu/tt_kuyruk/tamam', exist_ok=True)
          for s in sonuc:
              kod = s['kod']
              if not s['durum'].startswith(('yüklendi', 'zaten')):
                  print('::warning::' + kod + ' ' + s['durum']); continue
              it = json.load(open(f'sunucu/tt_kuyruk/{kod}.json', encoding='utf-8'))
              p = datetime.fromisoformat(s.get('planla') or it['planla'])
              K.append(dict(platform='TikTok', kanal='Antik Stüdyo (@antikstudyo)', dil='TR', tur='Short', seri=it.get('seri', 'Gündem + Tarih'),
                            baslik=it['metin'].split('\n')[0][:90], durum='Planlı', tarih=p.strftime('%Y-%m-%d'), saat=p.strftime('%H:%M'),
                            izlenme=None, link='https://www.tiktok.com/@antikstudyo', ureten='Claude', **{'not': 'sunucudan TikTok Studio ile planlandı'}))
              subprocess.run(['git', 'mv', f'sunucu/tt_kuyruk/{kod}.json', f'sunucu/tt_kuyruk/tamam/{kod}.json'], check=False)
              subprocess.run(['git', 'rm', '-q', '--ignore-unmatch', f'sunucu/tt_kuyruk/{kod}.mp4', f'sunucu/tt_kuyruk/{kod}_kapak.jpg'], check=False)
              print(f'::notice::{kod}: {s["durum"]}')
          json.dump(j, open(yol, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
      - name: Kaydet
        if: always()
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A sunucu/tt_kuyruk docs/yayin/yayin.json docs/tampon/tiktok/adim 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "TikTok kuyruğu: $(TZ=Europe/Istanbul date +'%d.%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
