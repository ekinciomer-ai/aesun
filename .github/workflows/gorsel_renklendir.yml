name: Siyah-beyaz görseli renklendir (Zhang, CPU, ücretsiz)
# <klasör>/renk_istek.txt içindeki görselleri (klasöre göre yol) OpenCV + Zhang renklendirme modeliyle renklendirir,
# sonuçları <klasör>/renkli/ altına yazar. Model indirme yalnız çalışma makinesinde; anahtar/sır gerekmez.
on:
  workflow_dispatch:
    inputs:
      klasor: {description: "proje klasörü (ör. video/vecihi)", required: true}
permissions: {contents: write}
concurrency: {group: gorsel-renk}
jobs:
  renk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Model
        run: |
          pip install -q "opencv-python-headless==4.10.0.84" "numpy<2.3"
          mkdir -p /tmp/m && cd /tmp/m
          curl -sfL -o p.prototxt https://raw.githubusercontent.com/richzhang/colorization/caffe/colorization/models/colorization_deploy_v2.prototxt
          curl -sfL -o pts.npy https://raw.githubusercontent.com/richzhang/colorization/caffe/colorization/resources/pts_in_hull.npy
          for u in "https://huggingface.co/spaces/annapurnapadmaprema-ji/Colorizer/resolve/main/colorization_release_v2.caffemodel" "https://huggingface.co/spaces/Th3BossC/OpenCvColourize/resolve/main/imageModel/utils/models/colorization_release_v2.caffemodel" "http://eecs.berkeley.edu/~rich.zhang/projects/2016_colorization/files/demo_v2/colorization_release_v2.caffemodel" "https://www.dropbox.com/s/dx0qvhhp5hbcx7z/colorization_release_v2.caffemodel?dl=1" "https://huggingface.co/spaces/akhaliq/lama/resolve/main/colorization_release_v2.caffemodel"; do curl -sfL -o m.caffemodel "$u" && [ $(stat -c%s m.caffemodel) -gt 100000000 ] && break; done
          ls -la; [ $(stat -c%s m.caffemodel 2>/dev/null || echo 0) -gt 100000000 ] || { echo '::error::renklendirme modeli indirilemedi'; exit 1; }; echo "::notice::model $(stat -c%s m.caffemodel)"
      - name: Renklendir
        env: {KL: "${{ inputs.klasor }}"}
        run: |
          python3 - <<'PY' 2>&1 | tee /tmp/r.log; grep -E "Error|error" /tmp/r.log | tail -3 | sed "s/^/::notice::/"; ls "$KL"/renkli/*.jpg >/dev/null
          import cv2, numpy as np, os
          kl=os.environ["KL"]; os.makedirs(f"{kl}/renkli",exist_ok=True)
          net=cv2.dnn.readNetFromCaffe("/tmp/m/p.prototxt","/tmp/m/m.caffemodel"); pts=np.load("/tmp/m/pts.npy").transpose().reshape(2,313,1,1)
          net.getLayer(net.getLayerId("class8_ab")).blobs=[pts.astype("float32")]; net.getLayer(net.getLayerId("conv8_313_rh")).blobs=[np.full([1,313],2.606,dtype="float32")]
          for ad in open(f"{kl}/renk_istek.txt").read().split():
              im=cv2.imread(f"{kl}/{ad}"); f=im.astype("float32")/255; lab=cv2.cvtColor(f,cv2.COLOR_BGR2LAB)
              L=cv2.split(cv2.cvtColor(cv2.resize(f,(224,224)),cv2.COLOR_BGR2LAB))[0]-50
              net.setInput(cv2.dnn.blobFromImage(L)); ab=net.forward()[0].transpose((1,2,0)); ab=cv2.resize(ab,(im.shape[1],im.shape[0]))*1.25
              out=np.clip(cv2.cvtColor(np.concatenate([lab[:,:,:1],ab],axis=2),cv2.COLOR_LAB2BGR),0,1)
              cv2.imwrite(f"{kl}/renkli/"+os.path.basename(ad),(out*255).astype("uint8"),[cv2.IMWRITE_JPEG_QUALITY,92]); print("renkli",ad)
          PY
      - name: Kaydet
        run: |
          git config user.name "aesun-yayin"; git config user.email "yayin@aksarayenerji.net"
          git add -A "${{ inputs.klasor }}/renkli"; git diff --cached --quiet && exit 0
          git commit -qm "Renklendirme: ${{ inputs.klasor }}"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
