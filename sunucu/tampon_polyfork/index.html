<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polyfork tampon testi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f5f8;color:#1c2330}
header{padding:12px 14px;background:#12324f;color:#fff}
header h1{margin:0;font-size:17px}
header p{margin:4px 0 0;font-size:12px;opacity:.8}
#sahne{position:relative;width:100%;height:52vh;min-height:280px;background:#e9edf3}
#sahne canvas{display:block;width:100%;height:100%}
#bilgi{position:absolute;left:8px;bottom:8px;background:rgba(18,50,79,.85);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:calc(100% - 16px)}
.cubuk{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;border-bottom:1px solid #dde2ea}
.cubuk button{flex:0 0 auto;border:1px solid #c9d1dc;background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;color:#1c2330}
.cubuk button.on{background:#12324f;color:#fff;border-color:#12324f}
#galeri{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:8px}
.kart{background:#fff;border:1px solid #dde2ea;border-radius:8px;padding:4px;text-align:center;font-size:11px;line-height:1.25;cursor:pointer}
.kart img{width:100%;aspect-ratio:1;object-fit:contain;background:#eef1f5;border-radius:6px}
.kart.on{outline:2px solid #12324f}
.kart small{color:#6b7686}
footer{padding:10px 14px 18px;font-size:11px;color:#6b7686}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
</head>
<body>
<header>
  <h1>Polyfork · tampon bölge testi</h1>
  <p>Modeller sunucuya indirildi, sayfa dış bağlantı kullanmadan çalışıyor.</p>
</header>
<div id="sahne"><div id="bilgi">Yükleniyor…</div></div>
<div class="cubuk" id="filtre"></div>
<div id="galeri"></div>
<footer>Modeller: Polyfork (polyfork.dev), CC BY 4.0. Bu sayfa yalnızca deneme içindir.</footer>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kutu = document.getElementById('sahne'), bilgi = document.getElementById('bilgi');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
kutu.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9edf3');
scene.add(new THREE.HemisphereLight('#ffffff', '#8a94a6', 2.2));
const gunes = new THREE.DirectionalLight('#ffffff', 2);
gunes.position.set(8, 14, 6); gunes.castShadow = true;
gunes.shadow.mapSize.set(1024, 1024);
Object.assign(gunes.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 });
scene.add(gunes);
const zemin = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#d8dde4' }));
zemin.rotation.x = -Math.PI / 2; zemin.receiveShadow = true; scene.add(zemin);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 500);
const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;

function boyut() {
  const w = kutu.clientWidth, h = kutu.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', boyut); boyut();
renderer.setAnimationLoop(() => { ctrl.update(); renderer.render(scene, camera); });

const loader = new GLTFLoader(), onbellek = new Map();
let grup = new THREE.Group(); scene.add(grup);
async function yukle(id) {
  if (!onbellek.has(id)) onbellek.set(id, loader.loadAsync(`./modeller/${id}.glb`));
  const g = await onbellek.get(id);
  const k = g.scene.clone(true);
  k.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return k;
}
function oturt(o) { // tabanı zemine oturt
  const b = new THREE.Box3().setFromObject(o); o.position.y -= b.min.y; return b;
}
function kameraAyarla(obj) {
  const b = new THREE.Box3().setFromObject(obj), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z) || 1;
  camera.position.set(c.x + r * 1.3, c.y + r * 0.8, c.z + r * 1.5);
  ctrl.target.copy(c); ctrl.update();
}
function temizle() { scene.remove(grup); grup = new THREE.Group(); scene.add(grup); }

let liste = [];
async function tekModel(m, kart) {
  document.querySelectorAll('.kart').forEach(x => x.classList.toggle('on', x === kart));
  bilgi.textContent = `${m.ad} yükleniyor…`;
  const t0 = performance.now();
  temizle();
  const o = await yukle(m.id); oturt(o); grup.add(o); kameraAyarla(grup);
  bilgi.textContent = `${m.ad} · ${m.tur} · ${m.ucgen.toLocaleString('tr-TR')} üçgen · ${Math.round(performance.now() - t0)} ms`;
}

async function santiye() {
  document.querySelectorAll('.kart').forEach(x => x.classList.remove('on'));
  bilgi.textContent = 'GES şantiyesi kuruluyor…';
  const t0 = performance.now();
  temizle();
  const var_ = id => liste.some(m => m.id === id);
  const koy = async (id, x, z, ry = 0, s = 1) => {
    if (!var_(id)) return;
    const o = await yukle(id); o.scale.setScalar(s); o.rotation.y = ry; oturt(o); o.position.x = x; o.position.z = z; grup.add(o);
  };
  // panel sıraları
  const ras = 'solar-array-rack-789c93';
  if (var_(ras)) {
    const ornek = await yukle(ras); const b = new THREE.Box3().setFromObject(ornek); const s = b.getSize(new THREE.Vector3());
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) await koy(ras, -10 + c * (s.x + 0.4), -8 + r * (s.z + 2.5));
  }
  await Promise.all([
    koy('mobile-crane-671d3f', 9, 2, -0.6),
    koy('tracked-excavator-8ebd3c', 6, 9, 2.4),
    koy('concrete-mixer-truck-4a8d94', -6, 10, 1.6),
    koy('cargo-container-fd73bc', 13, -6, 0.2),
    koy('pickup-truck-a34bf2', 2, 12, 3.0),
    koy('construction-worker-c1ad8c', 4, 4, 0.8),
    koy('groundworker-083f5c', -2, 5, -0.4),
    koy('crane-banksman-3994e0', 6, 0, -1.2),
    koy('tall-pine-tree-ab4108', -16, -12), koy('tall-pine-tree-ab4108', -18, 4),
    koy('oak-tree-50ee7c', 16, 12), koy('oak-tree-50ee7c', -15, 14),
  ]);
  kameraAyarla(grup);
  let ucgen = 0; grup.traverse(o => { if (o.isMesh && o.geometry.index) ucgen += o.geometry.index.count / 3; });
  bilgi.textContent = `GES şantiyesi · ${grup.children.length} model · ${Math.round(ucgen).toLocaleString('tr-TR')} üçgen · ${Math.round(performance.now() - t0)} ms`;
}

const turAd = { all: 'Tümü', vehicle: 'Araç', building: 'Bina', character: 'İnsan', animal: 'Hayvan', prop: 'Obje' };
let secili = 'all';
function ciz() {
  const g = document.getElementById('galeri'); g.innerHTML = '';
  for (const m of liste.filter(m => secili === 'all' || m.tur === secili)) {
    const d = document.createElement('div'); d.className = 'kart';
    d.innerHTML = `<img loading="lazy" src="./kapak/${m.id}.png" alt=""><div>${m.ad}</div><small>${m.ucgen.toLocaleString('tr-TR')} üçgen</small>`;
    d.onclick = () => { tekModel(m, d); scrollTo({ top: 0, behavior: 'smooth' }); };
    g.appendChild(d);
  }
}
function filtre() {
  const f = document.getElementById('filtre'); f.innerHTML = '';
  const s = document.createElement('button'); s.textContent = '🏗️ GES şantiyesi'; s.onclick = santiye; f.appendChild(s);
  for (const t of ['all', ...new Set(liste.map(m => m.tur))]) {
    const b = document.createElement('button'); b.textContent = turAd[t] || t; b.className = t === secili ? 'on' : '';
    b.onclick = () => { secili = t; filtre(); ciz(); }; f.appendChild(b);
  }
}
liste = await (await fetch('./liste.json')).json();
filtre(); ciz(); santiye().catch(e => bilgi.textContent = 'Hata: ' + e.message);
</script>
</body>
</html>
