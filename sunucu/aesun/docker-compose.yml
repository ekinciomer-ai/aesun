# AEMonitoring merkez servisi. gesfin'in ağına (gesfin-net) yalnız Caddy'nin ulaşması için katılır; dışarıya port açmaz.
services:
  api:
    build: .
    container_name: aesun-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - aesun_veri:/veri
      - /opt/aesun/ssh:/home/aesun/.ssh:ro
    networks: [gesfin-net]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  isler:
    build: ./isler
    container_name: aesun-isler
    restart: unless-stopped
    env_file: [/opt/aesun/isler.env]
    volumes:
      - aesun_isler:/veri
      - /opt/aesun/ssh:/home/aesun/.ssh:ro
    mem_limit: 384m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  aesun_veri:
  aesun_isler:
networks:
  gesfin-net:
    external: true
