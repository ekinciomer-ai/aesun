<svg id="s" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet"></svg>
<script>
// Format 9 · Kâğıt eskiz hikâye: krem kâğıt, elle çizilmiş ikonlar kendiliğinden çizilir (stroke çizimi),
// kırmızı keçeli kalemle daire, ok, üstünü çizme, damga. Aynı kurgu dosyası (V1..V7) kullanılır.
const SV=document.getElementById('s');let K=null;
const KAG='#f3ead6',KAG2='#e6d8b8',KUR='#2b2723',KIR='#d23a2a',GRI='#8a8070',SAR='#e8b330';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=p=>{p=cl(p);return p*p*(3-2*p)},eout=p=>1-Math.pow(1-cl(p),3);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
// sabit tohumlu titreme (el çizimi)
const h=(i)=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
let SID=0;
// el çizgisi: iki noktayı hafif eğri ve iki kat çizgiyle bağlar; p: 0..1 çizim ilerlemesi
function cz(x1,y1,x2,y2,p,c=KUR,w=6,j=1){if(p<=0)return'';const id=SID++;const mx=(x1+x2)/2+(h(id)-0.5)*14*j,my=(y1+y2)/2+(h(id+7)-0.5)*14*j;
 const d=`M${x1},${y1} Q${mx},${my} ${x2},${y2}`;const d2=`M${x1+(h(id+3)-0.5)*5},${y1+(h(id+4)-0.5)*5} Q${mx+3},${my-3} ${x2+(h(id+5)-0.5)*5},${y2+(h(id+6)-0.5)*5}`;
 return `<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-cl(p)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`+
  `<path d="${d2}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-cl(p*1.1-0.1)}" fill="none" stroke="${c}" stroke-width="${w*0.45}" stroke-linecap="round" opacity=".6"/>`}
function yol(d,p,c=KUR,w=6,fill='none'){if(p<=0)return'';return `<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-cl(p)}" fill="${fill}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`}
// elle daire (kırmızı keçeli): elips, biraz taşan
function daire(x,y,rx,ry,p,c=KIR,w=8){if(p<=0)return'';const id=SID++;let d='';for(let i=0;i<=40;i++){const a=-0.6+i/40*Math.PI*2.15,r=1+(h(id+i)-0.5)*0.06;d+=`${i?'L':'M'}${x+Math.cos(a)*rx*r},${y+Math.sin(a)*ry*r}`}return yol(d,p,c,w)}
function ok(x1,y1,x2,y2,p,c=KIR,w=8){const a=Math.atan2(y2-y1,x2-x1),L=30;return cz(x1,y1,x2,y2,p,c,w)+(p>0.85?cz(x2,y2,x2-Math.cos(a-0.5)*L,y2-Math.sin(a-0.5)*L,(p-0.85)/0.15,c,w,0)+cz(x2,y2,x2-Math.cos(a+0.5)*L,y2-Math.sin(a+0.5)*L,(p-0.85)/0.15,c,w,0):'')}
function yazi(x,y,t,fs,c=KUR,a=1,anc='middle',fam='Kalam',wt=700,rot=0){if(a<=0)return'';return `<text x="${x}" y="${y}" text-anchor="${anc}" font-family="${fam}" font-weight="${wt}" font-size="${fs}" fill="${c}" opacity="${a}" transform="rotate(${rot},${x},${y})">${esc(t)}</text>`}
function damga(x,y,t,a,c=KIR,rot=-10,fs=54){if(a<=0)return'';const s=1+1.2*(1-eout(a)),w=t.length*fs*0.58+50;return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})" opacity="${cl(a*3)*0.92}"><rect x="${-w/2}" y="${-fs*0.85}" width="${w}" height="${fs*1.5}" rx="8" fill="none" stroke="${c}" stroke-width="8"/><text y="${fs*0.3}" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="${fs}" fill="${c}">${esc(t)}</text></g>`}
// ikonlar (yandan, elle)
function kamyonetI(x,y,s,p){return `<g transform="translate(${x},${y}) scale(${s})">`+yol('M-90,20 L-90,-40 L30,-40 L30,20 Z',p)+yol('M30,-20 L70,-20 L90,5 L90,20 L30,20',p*1.1-0.1)+yol('M40,-14 L64,-14 L78,4 L40,4 Z',p*1.2-0.2,KUR,4)+
 daire(-55,28,18,18,p*1.3-0.3,KUR,6)+daire(55,28,18,18,p*1.3-0.3,KUR,6)+'</g>'}
function motorI(x,y,s,p){return `<g transform="translate(${x},${y}) scale(${s})">`+daire(-45,20,22,22,p,KUR,6)+daire(45,20,22,22,p,KUR,6)+yol('M-45,20 L-10,-15 L25,-15 L45,20 M25,-15 L35,-40 L50,-42',p*1.2-0.2)+
 daire(0,-55,16,16,p*1.4-0.4,KUR,6)+yol('M0,-39 L-5,-12',p*1.4-0.4)+'</g>'}
function durI(x,y,s,p,dur){let d='';for(let i=0;i<=8;i++){const a=(i*45+22.5)*Math.PI/180;d+=`${i?'L':'M'}${Math.cos(a)*44},${Math.sin(a)*44}`}
 return `<g transform="translate(${x},${y}) scale(${s})">`+yol(d,p,KIR,6)+yol('M0,44 L0,130',p*1.2-0.2)+yazi(0,12,dur,30,KIR,ease(p*2-1),'middle','Baloo',800)+'</g>'}
function hizI(x,y,s,p,ibre){return `<g transform="translate(${x},${y}) scale(${s})">`+yol('M-60,10 A60,60 0 1 1 60,10',p)+cz(0,0,Math.cos(ibre)*48,Math.sin(ibre)*48,p*1.3-0.3,KIR,6,0)+yazi(0,40,'50',30,KUR,ease(p*2-1),'middle','Baloo',800)+'</g>'}
// kavşak eskizi (üstten): iki çift çizgi
function kavsakI(x,y,s,p){const a=70;return `<g transform="translate(${x},${y}) scale(${s})">`+
 cz(-330,-a,-a,-a,p)+cz(a,-a,330,-a,p)+cz(-330,a,-a,a,p)+cz(a,a,330,a,p)+cz(-a,-330,-a,-a,p)+cz(-a,a,-a,330,p)+cz(a,-330,a,-a,p)+cz(a,a,a,330,p)+
 [-280,-200,-130].map(xx=>cz(xx,0,xx+40,0,p*1.2-0.2,GRI,4,0)).join('')+[130,200,280].map(xx=>cz(xx,0,xx+40,0,p*1.2-0.2,GRI,4,0)).join('')+
 [-280,-200,-130].map(yy=>cz(0,yy,0,yy+40,p*1.2-0.2,GRI,4,0)).join('')+[130,200,280].map(yy=>cz(0,yy,0,yy+40,p*1.2-0.2,GRI,4,0)).join('')+'</g>'}
// üstten basit araç kutucukları
const vanT=(x,y,p)=>yol(`M${x-55},${y-24} h110 v48 h-110 Z M${x+25},${y-24} v48`,p,KUR,6);
const motoT=(x,y,p)=>yol(`M${x-12},${y-40} h24 v80 h-24 Z`,p,KUR,6)+daire(x,y,10,10,p,KUR,5);


const lerp=(a,b,k)=>a+(b-a)*k;
// ---- düz yol eskizi (üstten) ----
function yolH(p,duz,refuj){let o=cz(130,680,990,680,p)+cz(130,840,990,840,p);
 if(refuj)o+=cz(130,750,990,750,p*1.2-0.2,GRI,5,0)+cz(130,770,990,770,p*1.2-0.2,GRI,5,0);
 else if(duz)o+=cz(130,760,990,760,p*1.2-0.2,KIR,5,0);
 else for(let x=160;x<980;x+=110)o+=cz(x,760,x+50,760,p*1.2-0.2,GRI,4,0);return o}
const vanH=(x,y,p,r=0)=>`<g transform="translate(${x},${y}) rotate(${r})">`+yol('M-55,-24 h110 v48 h-110 Z M25,-24 v48',p,KUR,6)+'</g>';
const otoH=(x,y,p,r=0)=>`<g transform="translate(${x},${y}) rotate(${r})">`+yol('M-50,-24 h100 v48 h-100 Z M-15,-24 v48 M22,-24 v48',p,KUR,6)+'</g>';
const motoH=(x,y,p,r=0)=>`<g transform="translate(${x},${y}) rotate(${r})">`+yol('M-40,-12 v24 h80 v-24 Z',p,KUR,6)+daire(0,0,10,10,p,KUR,5)+'</g>';
const yayaT=(x,y,p,r=0)=>`<g transform="translate(${x},${y}) rotate(${r})">`+daire(0,-16,13,13,p,KUR,6)+yol('M0,-3 L0,26 M-16,8 L16,8',p,KUR,6)+'</g>';
const agacT=(x,y,p)=>daire(x,y,40,40,p,'#5d7d4a',6)+daire(x,y,16,16,p,'#5d7d4a',4);
const buzT=(p)=>{let o=yol('M480,684 L700,684 L700,836 L480,836 Z',p,'#5b9bd5',5);for(let i=0;i<9;i++){const x=490+i*24;o+=cz(x,836,x+60,690,p*1.3-0.3,'#5b9bd5',3,0)}return o};
const isikT=(x,y,p)=>yol(`M${x-18},${y-50} h36 v100 h-36 Z`,p,KUR,6)+daire(x,y-28,9,9,p,KIR,4)+daire(x,y,9,9,p,'#b8860b',4)+daire(x,y+28,9,9,p,'#3a8a4a',5);
const evI=(x,y,s,p)=>`<g transform="translate(${x},${y}) scale(${s})">`+yol('M-70,10 L-70,-50 L0,-100 L70,-50 L70,10 Z M-20,10 v-40 h40 v40',p)+'</g>';
const yayaI=(x,y,s,p)=>`<g transform="translate(${x},${y}) scale(${s})">`+daire(0,-60,22,22,p,KUR,6)+yol('M0,-38 L0,20 M-35,-15 L35,-15 M0,20 L-25,60 M0,20 L25,60',p*1.2-0.2)+'</g>';
const yazilI=(t)=>(x,y,s,p)=>yazi(x,y+20,t,110*s,KIR,ease(p),'middle','Baloo',800);
function patla(x,y,a,b){let d='';for(let i=0;i<=22;i++){const q=i/22*Math.PI*2,r=i%2?50:95;d+=`${i?'L':'M'}${x+Math.cos(q)*r},${y+Math.sin(q)*r*0.8}`}
 return yol(d+'Z',a,KIR,7)+yazi(x,y+20,L.cat,58,KIR,b,'middle','Baloo',800,-8)}

const CRP=[600,740];
function poz(z){let vx,vy,mx;
 if(z<1){vx=lerp(170,430,eout(z));vy=800;mx=lerp(960,760,eout(z))}
 else if(z<1.7){const k=(z-1)/0.7;vx=lerp(430,535,k);vy=lerp(800,728,ease(k));mx=lerp(760,650,k)}
 else{const k=(z-1.7)/0.6;vy=lerp(728,800,cl(k*2));vx=535+(k<0.3?0:ease((k-0.3)/0.7)*480);mx=650}
 return {vx,vy,mx,my:720}}
function sahne(z,p,lab){const q=poz(z);let o=yolH(p,true);
 o+=vanH(q.vx,q.vy,p,z>1&&z<1.7?-14:0);
 o+=z>1.7?motoH(q.mx+30,q.my-40,p,70):motoH(q.mx,q.my,p);
 if(lab){o+=yazi(q.vx,q.vy+70,L.van,40,KUR,lab)+yazi(q.mx,q.my-50,L.moto,38,KUR,lab)+yazi(300,640,L.dur,38,KIR,lab)}
 return o}
function isaret(i,a){return [daire(470,760,90,60,a),yazi(820,1040,'1,96‰',90,KIR,ease(a),'middle','Baloo',800),yazi(820,1170,'sicil',70,KIR,ease(a),'middle','Kalam',700)][i]}
const IK1=kamyonetI,IK2=yazilI('2,4‰');
function kacti(tv,cr){return tv>cr+1.4?ok(600,880,900,880,cl((tv-cr-1.4)/0.6))+yazi(930,900,'kaçtı',52,KIR,ease((tv-cr-1.6)/0.4),'start','Baloo',800):''}
const L={etiket:'Gece · iki yönlü yol · Yargıtay dosyası',baslik:['Kazadan sonra kaçmak','kurtarır mı?'],van:'kamyonet',moto:'motosiklet + yolcu',dur:'devamlı çizgi',bilgi:'gece · iki yönlü yol · devamlı çizgi',cat:'ÇAT!',kirik:'sürücü öldü · yolcu ağır yaralı',soru:'Kaçmak ne kazandırdı?',sik:['A) Hiçbir şey olmadı','B) Sadece trafik cezası','C) 9 yıl hapis'],ip:['devamlı çizgiyi geçti','3 saat sonra: 1,96 promil','eski alkol hükmü'],kv:['Kamyonet sürücüsü','ASLİ KUSUR','9 yıl hapis · indirim yok','ehliyet 3 yıl geri alındı'],km:['Kaza anı alkol','≈ 2,4 PROMİL',['geri hesapla bulundu','kaçmak işe yaramadı']],dogru:'Doğru şık: C',efsane:'"Kaçarsam kurtulurum"',kural:['1. Kaza yaptıysan DUR','2. 112\'yi ara, yardım et','3. Alkollüysen direksiyona geçme'],yav:'Kaçmak seni KURTARMAZ!',onay:'YARGITAY ONADI',yorum:'cevabını yoruma yaz',geri:'geri saralım',karar:'KARAR',son:'Sen hangi şıkkı seçtin?',kanal:'KARA KUTU',not:'Yargıtay kararından uyarlanmıştır · Kişi, plaka ve yer bilgisi yok · Hukuki danışmanlık değildir',sag:'',anahtar:['DUR','kusur','asli','tali','Yargıtay','Danıştay','yavaş','kural','ceza','ehliyet','onadı','hapis','alkol','promil','kaç','buz','yaya','mahkûm']};

function bolum(t){const P=K.parca;for(const k of ['V7','V6','V5','V4','V3','V2','V1'])if(t>=P[k][0])return k;return 'V1'}
function kagit(){let o=`<rect width="1080" height="1920" fill="#2a2622"/>`;
 // yırtık alt kenarlı kâğıt
 let d='M30,40 L1050,40 L1050,1690';for(let i=0;i<=40;i++){const x=1050-i*1020/40,y=1690+(h(i+900)-0.5)*36;d+=` L${x},${y}`}d+=' Z';
 o+=`<path d="${d}" fill="${KAG}" stroke="#cdbb93" stroke-width="3"/>`;
 for(let i=0;i<26;i++)o+=`<line x1="60" y1="${130+i*60}" x2="1020" y2="${130+i*60}" stroke="#e3d5b3" stroke-width="2"/>`;
 o+=`<line x1="120" y1="40" x2="120" y2="1690" stroke="#e8b9a8" stroke-width="3"/>`;
 return o}

function kare(t){SID=0;const P=K.parca,v=bolum(t),tv=t-P[v][0],dv=P[v][1]-P[v][0],u=tv/dv;
 let o=kagit();
 // sol üst el yazısı etiket + kırmızı alt çizgi
 o+=yazi(150,120,L.etiket,Math.min(44,1480/L.etiket.length),KUR,1,'start',  'Kalam',700,-2)+cz(150,138,640,132,1,KIR,6);
 o+=yazi(1000,118,L.kanal,40,KIR,1,'end','Baloo',800);
 const A=(a0,d=0.8)=>cl((tv-a0)/d);   // bölüm içi çizim ilerlemesi
 const zA=t=>{if(t<P.V2[0])return 0;if(t<P.V3[0])return cl((t-P.V2[0])/(P.V2[1]-P.V2[0]))*0.98;const ct=K.carp-P.V3[0];const k=cl((t-P.V3[0])/ct);return 1+k*0.7+(k>=1?cl((t-K.carp)/3.0)*0.6:0)};
 if(v==='V1'){
  o+=yolH(A(0,1.6),false);
  o+=yazi(560,330,L.baslik[0],78,KUR,ease(A(0.2,0.5)),'middle','Baloo',800)+yazi(560,420,L.baslik[1],80,KIR,ease(A(0.6,0.5)),'middle','Baloo',800);
  o+=daire(560,1060,120,120,A(1.4,0.8))+yazi(560,1095,'?',140,KIR,ease(A(1.6,0.4)),'middle','Baloo',800);
 }
 if(v==='V2'){
  o+=sahne(zA(t),A(0,0.8),ease(A(1.0,0.5)));
  o+=yazi(560,1230,L.bilgi,46,GRI,ease(A(dv*0.3,0.5)));
 }
 if(v==='V3'){
  const cr=(K.carp-P.V3[0]);o+=sahne(zA(t),1,0);
  if(tv>=cr){o+=daire(CRP[0],CRP[1],110,90,A(cr,0.5))+patla(CRP[0]+150,CRP[1]-170,A(cr,0.4),ease(A(cr+0.2,0.3)));
   o+=yazi(560,1180,L.kirik,52,KUR,ease(A(cr+0.8,0.5)))+cz(330,1200,790,1195,A(cr+1.1,0.6),KIR,6);
   if(typeof kacti==='function')o+=kacti(tv,cr)}
 }
 if(v==='V4'){
  o+=yazi(560,330,L.soru,96,KUR,ease(A(0,0.4)),'middle','Baloo',800)+cz(330,360,800,354,A(0.3,0.6),KIR,7);
  L.sik.forEach((s,i)=>{const y=560+i*200,a=A(0.5+i*0.5,0.7);o+=yol(`M200,${y-70} h680 v130 h-680 Z`,a,KUR,6)+yazi(250,y+15,s,Math.min(62,1250/s.length),KUR,ease(a*1.5-0.5),'start','Kalam',700)});
  const [c0,c1]=K.sayac;
  if(t>=c0&&t<c1){const n=Math.ceil(c1-t);o+=daire(560,1220,110,110,1-((c1-t)%1),KIR,10)+yazi(560,1265,String(n),140,KUR,1,'middle','Baloo',800)}
  else if(t<c0)o+=yazi(560,1230,L.yorum,56,GRI,ease(A(2.4,0.5)));
 }
 if(v==='V5'){
  o+=sahne(1.6,1,1);
  o+=yol('M350,1340 l60,-45 v90 Z M440,1340 l60,-45 v90 Z',A(0,0.6),KUR,7)+yazi(560,1360,L.geri,60,KUR,ease(A(0.4,0.4)),'start');
  const ip=K.ip.map(x=>x-P.V5[0]);
  ip.forEach((x,i)=>{if(tv>x){o+=isaret(i,A(x,0.6))+yazi(160,440+i*60,(i+1)+' · '+L.ip[i],46,KIR,ease(A(x+0.3,0.4)),'start')}});
 }
 if(v==='V6'){
  o+=yazi(560,300,L.karar,110,KUR,ease(A(0,0.4)),'middle','Baloo',800)+cz(390,330,730,324,A(0.3,0.5),KIR,8);
  o+=IK1(320,520,1.1,A(0.4,1.0))+yazi(320,640,L.kv[0],48,KUR,ease(A(0.8,0.4)));
  o+=damga(320,740,L.kv[1],A(0.9,0.5),KIR,-8,48)+yazi(320,850,L.kv[2],34,KUR,ease(A(1.3,0.5)))+yazi(320,900,L.kv[3],34,KUR,ease(A(1.5,0.5)));
  const tl=K.tali-P.V6[0];
  o+=IK2(800,530,1.1,A(tl,1.0))+yazi(800,640,L.km[0],48,KUR,ease(A(tl+0.3,0.4)));
  o+=damga(800,740,L.km[1],A(tl+0.4,0.5),'#b8860b',6,48)+yazi(800,850,L.km[2][0],32,KUR,ease(A(tl+0.8,0.5)))+yazi(800,900,L.km[2][1],32,KUR,ease(A(tl+1.0,0.5)));
  o+=cz(560,470,560,940,A(0.5,0.8),GRI,4,0.3);
  const on=K.onayT-P.V6[0];o+=damga(560,1080,L.onay,A(on,0.5),KIR,-6,60);
  o+=yazi(560,1230,L.dogru,64,KUR,ease(A(on+0.6,0.4)),'middle','Baloo',800)+daire(560,1210,230,60,A(on+0.9,0.6),KIR,7);
 }
