<script>
const KOK = 'https://raw.githubusercontent.com/ekinciomer-ai/epias-ptf/main/';
const LIMIT_2026 = 2905914;
const ESLE = { T1: 'fusionsolar:NE=59224704', T2: 'fusionsolar:NE=73686040', YD: 'sungrow:5064453', Anka: 'sungrow:5038906', AE: 'inavitas:189' }, ESLE_KISA = { T1: 'Sera-1', T2: 'Sera-2' };
const SAYAC = [
  { key: 'tekyildiz_1', kod: 'T1', ad: 'Tekyıldız 1', renk: '#2a78d6', mahsup: true, uretir: true },
  { key: 'tekyildiz_2', kod: 'T2', ad: 'Tekyıldız 2', renk: '#eb6834', mahsup: true, uretir: true },
  { key: 'aksaray_3', kod: 'A3', ad: 'Aksaray 3', renk: '#1baf7a', mahsup: true, uretir: false },
  { key: 'yilmaz_darilmaz', kod: 'YD', ad: 'Yılmaz Darılmaz', renk: '#C98500', mahsup: false, uretir: true },
  { key: 'anka_mineral', kod: 'Anka', ad: 'Anka Mineral', renk: '#d55181', mahsup: false, uretir: true },
  { key: 'aksaray_enerji', kod: 'AE', ad: 'Aksaray Enerji Üretim', renk: '#6b5bd6', mahsup: false, uretir: true }
];
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
let D = null, gunSayisi = 30, secAy = null;

const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const say = (v, h = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('tr-TR', { minimumFractionDigits: h, maximumFractionDigits: h });
const trSimdi = () => new Date(Date.now() + 3 * 3600000);
const bugunTR = () => trSimdi().toISOString().slice(0, 10);
const gunEkle = (g, n) => new Date(Date.parse(g + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const saatTR = iso => { if (!iso) return '—'; const d = new Date(new Date(iso).getTime() + 3 * 3600000); return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0'); };
const tarihK = g => { const [y, a, d] = g.split('-').map(Number); return d + ' ' + AYK[a - 1]; };
const ICON_K = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.2" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';
const ICON_U = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A5B00" stroke-width="2.2" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3l10 18H2z"/><path d="M12 10v4.5M12 17.5v.5"/></svg>';
const TIK = c => '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.5" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>';
const UNL = c => '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';

async function al(yol) {
  const r = await fetch(KOK + yol + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(yol + ' okunamadı (HTTP ' + r.status + ')');
  return r.json();
}

// OSOS: gün → { veris, cekis } toplamları ve saatlik mahsup
function gunluk(osos, key, gun) {
  const v = ((osos[key] || {}).veri || {})[gun];
  if (!v) return null;
  let veris = 0, cekis = 0, saat = 0;
  for (const [s, x] of Object.entries(v)) { veris += Number(x.veris) || 0; cekis += Number(x.cekis) || 0; saat = Math.max(saat, parseInt(s, 10) + 1); }
  return { veris, cekis, saat };
}
const MAN_A3 = { '2026-01': 29373.75, '2026-02': 63949.58, '2026-03': 89689.95, '2026-04': 191206.98 };
const AB = { T1: 'tekyildiz_1', T2: 'tekyildiz_2', A3: 'aksaray_3' };
function saatVeri(osos, gun, s) {
  const v = k => ((((osos[AB[k]] || {}).veri || {})[gun] || {})[s]) || null;
  const x1 = v('T1'), x2 = v('T2'), x3 = v('A3');
  return { var: !!(x1 || x2 || x3), u: { T1: x1 ? +x1.veris || 0 : 0, T2: x2 ? +x2.veris || 0 : 0 }, t: { T1: x1 ? +x1.cekis || 0 : 0, T2: x2 ? +x2.cekis || 0 : 0, A3: x3 ? +x3.cekis || 0 : 0 } };
}
// Ofis paneli "kaynak takipli havuz": üreticiler büyükten küçüğe; her üreticiden önce T2, sonra A3, en son T1; artan bedelli
function havuz(u, t) {
  const tuk = { ...t }, mahsup = { T1: 0, T2: 0, A3: 0 }, kaynak = { T1: { T1: 0, T2: 0, A3: 0, bedelli: 0 }, T2: { T1: 0, T2: 0, A3: 0, bedelli: 0 } };
  for (const [ges, mik] of Object.entries(u).sort((a, b) => b[1] - a[1])) {
    let kal = mik;
    for (const ab of ['T2', 'A3', 'T1']) { if (kal <= 0 || tuk[ab] <= 0) continue; const m = Math.min(kal, tuk[ab]); kaynak[ges][ab] += m; mahsup[ab] += m; kal -= m; tuk[ab] -= m; }
    if (kal > 0) kaynak[ges].bedelli += kal;
  }
  return { mahsup, kaynak, sonra: tuk, bedelli: kaynak.T1.bedelli + kaynak.T2.bedelli, mTop: mahsup.T1 + mahsup.T2 + mahsup.A3 };
}
function mahsupGun(osos, gun) {
  const r = { uretim: 0, tuketim: 0, mahsup: 0, bedelli: 0, sebeke: 0, saatler: [] };
  for (let h = 0; h < 24; h++) {
    const s = String(h).padStart(2, '0');
    const v = saatVeri(osos, gun, s);
    const hv = havuz(v.u, v.t);
    const U = v.u.T1 + v.u.T2, T = v.t.T1 + v.t.T2 + v.t.A3;
    r.saatler.push({ saat: s, var: v.var, u: v.u, t: v.t, U, T, ...hv });
    r.uretim += U; r.tuketim += T; r.mahsup += hv.mTop; r.bedelli += hv.bedelli; r.sebeke += T - hv.mTop;
  }
  return r;
}
// Ay sonucu: 2026 Mayıs öncesi aylık (Ocak–Nisan A3 manuel mahsup), sonrası saatlik
function aySonuc(osos, ay) {
  const gunler = Object.keys((osos.tekyildiz_1 || {}).veri || {}).filter(g => g.startsWith(ay)).sort();
  const t = { uretim: 0, tuketim: 0, mahsup: 0, bedelli: 0, sebeke: 0, gunler, aylik: false, ab: { T1: 0, T2: 0, A3: 0 }, tAb: { T1: 0, T2: 0, A3: 0 }, uAb: { T1: 0, T2: 0 }, kaynak: { T1: { T1: 0, T2: 0, A3: 0, bedelli: 0 }, T2: { T1: 0, T2: 0, A3: 0, bedelli: 0 } } };
  for (const g of gunler) {
    const m = mahsupGun(osos, g);
    t.uretim += m.uretim; t.tuketim += m.tuketim;
    for (const sa of m.saatler) {
      for (const k of ['T1', 'T2', 'A3']) { t.tAb[k] += sa.t[k]; }
      t.uAb.T1 += sa.u.T1; t.uAb.T2 += sa.u.T2;
      for (const k of ['T1', 'T2', 'A3']) t.ab[k] += sa.mahsup[k];
      for (const ges of ['T1', 'T2']) for (const k of ['T1', 'T2', 'A3', 'bedelli']) t.kaynak[ges][k] += sa.kaynak[ges][k];
    }
    t.mahsup += m.mahsup; t.bedelli += m.bedelli;
  }
  if (ay < '2026-05') {
    t.aylik = true;
    let kal = t.uretim; const ab = { T1: 0, T2: 0, A3: 0 };
    if (MAN_A3[ay] !== undefined) {
      ab.A3 = Math.min(MAN_A3[ay], t.tAb.A3); kal -= ab.A3;
      for (const k of ['T2', 'T1']) if (kal > 0 && t.tAb[k] > 0) { ab[k] = Math.min(kal, t.tAb[k]); kal -= ab[k]; }
    } else {
      for (const k of ['T1', 'T2', 'A3'].sort((a, b) => t.tAb[b] - t.tAb[a])) { const m = Math.min(Math.max(kal, 0), t.tAb[k]); ab[k] = m; kal -= m; }
    }
    t.ab = ab; t.mahsup = ab.T1 + ab.T2 + ab.A3; t.bedelli = Math.max(0, kal); t.kaynak = null;
  }
  t.sebeke = t.tuketim - t.mahsup;
  return t;
}
function sonOsosSaati(osos) {
  let enSon = null;
  for (const sc of SAYAC) {
    const v = (osos[sc.key] || {}).veri || {};
    const g = Object.keys(v).sort().pop(); if (!g) continue;
    const s = Object.keys(v[g]).sort().pop();
    const t = g + ' ' + s; if (!enSon || t > enSon) enSon = t;
  }
  return enSon;
}

function spark(degerler, renk, etiket, etiketler, birim) {
  const max = Math.max(1, ...degerler);
  const n = degerler.length;
  const x = i => n > 1 ? i * 174 / (n - 1) : 0;
  const pts = degerler.map((v, i) => x(i).toFixed(1) + ',' + (38 - v / max * 36).toFixed(1)).join(' ');
  const hit = etiketler ? degerler.map((v, i) => '<rect class="hit" x="' + Math.max(0, x(i) - 87 / Math.max(1, n - 1)).toFixed(1) + '" y="0" width="' + (174 / Math.max(1, n - 1)).toFixed(1) + '" height="40" fill="transparent" data-tip="' + esc(etiketler[i] + ': ' + say(v) + ' ' + (birim || 'kWh')) + '"/>').join('') : '';

const INV_KAYNAK = { sungrow: 'Sungrow', inavitas: 'Inavitas', fusionsolar: 'FusionSolar' };
const INV_CACHE = {};
let invSec = { santral: 'hepsi', yil: null, donem: 'son30' }, invYukleniyor = false;
async function invYilYukle(yil) {
  if (INV_CACHE[yil]) return INV_CACHE[yil];
  const r = await Promise.all(Object.keys(INV_KAYNAK).map(k => al('inverter/' + k + '_' + yil + '.json').catch(() => null)));
  return (INV_CACHE[yil] = r.filter(Boolean));
}
function invBirlestir(dosyalar) {
  const S = {};
  for (const f of dosyalar) for (const [id, s] of Object.entries(f.santraller || {})) {
    const key = f.kaynak + ':' + id;
    const t = S[key] || (S[key] = { key, kaynak: f.kaynak, id, ad: s.ad, kwp: s.kwp, gun: {}, ay: {}, inv: {} });
    if (s.kwp) t.kwp = s.kwp;
    Object.assign(t.gun, s.gun || {}); Object.assign(t.ay, s.ay || {});
    if (s.saat) t.saat = Object.assign(t.saat || {}, s.saat);
    for (const [ik, iv] of Object.entries(s.inv || {})) {
      const ti = t.inv[ik] || (t.inv[ik] = { key: ik, ad: iv.ad, kwp: iv.kwp, gun: {}, ay: {} });
      if (iv.kwp) ti.kwp = iv.kwp;
      Object.assign(ti.gun, iv.gun || {}); Object.assign(ti.ay, iv.ay || {});
    }
  }
  return S;
}
const ayGunSay = m => { const [y, a] = m.split('-').map(Number); return new Date(Date.UTC(y, a, 0)).getUTCDate(); };
// Ay toplamı: günlük veri ayın tamamını (ya da dünü) kapsıyorsa günlerden, yoksa aylık tablodan
function ayToplam(o, m) {
  const gs = Object.keys(o.gun).filter(g => g.startsWith(m));
  const dun = gunEkle(bugunTR(), -1);
  const beklenen = m === dun.slice(0, 7) ? Number(dun.slice(8)) : ayGunSay(m);
  if (gs.length >= beklenen || o.ay[m] == null) return gs.length ? gs.reduce((t, g) => t + (+o.gun[g] || 0), 0) : null;
  return +o.ay[m];
}
function invDonem(yil, donem) {
  const dun = gunEkle(bugunTR(), -1);
  if (donem === 'son30') return { tip: 'gun', gunler: Array.from({ length: 30 }, (_, i) => gunEkle(dun, i - 29)), ad: 'Son 30 gün' };
  if (donem === 'yil') { const aylar = []; for (let a = 1; a <= 12; a++) { const m = yil + '-' + String(a).padStart(2, '0'); if (m <= dun.slice(0, 7)) aylar.push(m); } return { tip: 'ay', aylar, ad: yil + ' yılı' }; }
  const n = ayGunSay(donem), gunler = [];
  for (let d = 1; d <= n; d++) { const g = donem + '-' + String(d).padStart(2, '0'); if (g <= dun) gunler.push(g); }
  return { tip: 'gun', gunler, ad: AYLAR[Number(donem.slice(5)) - 1] + ' ' + donem.slice(0, 4) };
}
const birimKaydir = (gunler, n) => gunler.map(g => (Number(g.slice(0, 4)) + n) + g.slice(4)).filter(g => !g.endsWith('02-29'));
function seriTopla(o, D_) { return D_.tip === 'gun' ? D_.gunler.map(g => o.gun[g] == null ? null : +o.gun[g]) : D_.aylar.map(m => ayToplam(o, m)); }
const toplamN = a => a.reduce((t, v) => t + (v || 0), 0);
const medyan = a => { const b = a.filter(v => v != null && !isNaN(v)).sort((x, y) => x - y); if (!b.length) return null; const k = b.length >> 1; return b.length % 2 ? b[k] : (b[k - 1] + b[k]) / 2; };
const enerji = v => v == null ? '—' : Math.abs(v) >= 1e6 ? say(v / 1e6, 2) + ' GWh' : Math.abs(v) >= 1e4 ? say(v / 1e3, 1) + ' MWh' : say(v) + ' kWh';
const invSirala = (a, b) => String(a.ad).localeCompare(String(b.ad), 'tr', { numeric: true });

// İnverter bazında günlük kıyas: inverterin (kWp başına) değeri / santralin o günkü medyanı, sonra inverterin kendi normaline bölünür
function invAnaliz(S, gunler) {
  const iv = Object.values(S.inv).sort(invSirala);
  const kwpVar = iv.length && iv.every(x => x.kwp);
  const norm = x => (v => v == null ? null : kwpVar ? v / x.kwp : v);
  const gunMed = {};
  for (const g of gunler) gunMed[g] = medyan(iv.map(x => norm(x)(x.gun[g])));
  return iv.map(x => {
    const n = norm(x);
    const oran = gunler.map(g => { const v = n(x.gun[g]), m = gunMed[g]; return v == null || !m ? null : v / m; });
    const normal = medyan(oran) || 1;
    const durma = gunler.filter((g, i) => gunMed[g] > 0 && x.gun[g] != null && oran[i] != null && oran[i] < 0.05).length;
    const top = toplamN(gunler.map(g => x.gun[g]));
    return { x, oran, normal, durma, top, veriGun: gunler.filter(g => x.gun[g] != null).length, hucre: oran.map(o => o == null ? null : o / normal) };
  });
}

  if (epSec.ay !== 'yil' && !aylar.includes(epSec.ay)) epSec.ay = 'yil';
  const donemGun = gunler.filter(g => epSec.ay === 'yil' ? g.startsWith(ylS) : g.startsWith(epSec.ay)).filter(g => g <= yarin);

  document.getElementById('kontrol').innerHTML = '<label class="k" style="display:flex;align-items:center;gap:8px">Yıl <select onchange="epSec.yil=Number(this.value);epSec.ay=\'yil\';cizEpias()">' + yillar.map(y => '<option' + (y === epSec.yil ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></label>'
    + '<label class="k" style="display:flex;align-items:center;gap:8px">Dönem <select onchange="epSec.ay=this.value;cizEpias()"><option value="yil">Tüm yıl</option>' + aylar.slice().reverse().map(m => '<option value="' + m + '"' + (m === epSec.ay ? ' selected' : '') + '>' + AYLAR[Number(m.slice(5)) - 1] + '</option>').join('') + '</select></label>'
    + '<button class="btn" type="button" onclick="epCsv()">CSV indir</button>';
  document.getElementById('altBaslik').textContent = 'PTF (GÖP), SMF (DGP) ve YEKDEM birim bedeli, TL/MWh. Veri ' + tarihK(gunler[0]) + ' ' + gunler[0].slice(0, 4) + ' – ' + tarihK(gunler[gunler.length - 1]) + ' ' + gunler[gunler.length - 1].slice(0, 4) + ' · güncelleme ' + saatTR(EP.guncellendi);

  // Özet kartları
  const pAll = donemGun.flatMap(g => epDolu(EP.ptf[g])), sAll = donemGun.flatMap(g => epDolu((EP.smf || {})[g]));
  const ayOz = (epSec.ay === 'yil' ? aylar : [epSec.ay]).map(epAyOzet);
  const ykAgir = (() => { let t = 0, n = 0; for (const o of ayOz) if (o.yk && o.pOrt != null) { t += o.yk.deger * o.gun; n += o.gun; } return n ? t / n : null; })();
  const pOrt = epOrt(pAll), yp = EP.ptf[yarin] ? epOrt(EP.ptf[yarin]) : null, bp = EP.ptf[bugun] ? epOrt(EP.ptf[bugun]) : null;
  const kart = (ad, v, alt, renk) => '<div class="panel" style="gap:6px;padding:18px 20px"><div class="k">' + ad + '</div><div class="num" style="font-size:28px;font-weight:700;color:' + (renk || '#10233F') + '">' + say(v, 0) + '</div><div class="k">' + alt + '</div></div>';
  let h = '<div class="kartlar5">'
    + kart('Bugün PTF ort.', bp, tarihK(bugun), EP_RENK.ptf)
    + kart('Yarın PTF ort.', yp, yp == null ? 'henüz yayınlanmadı' : tarihK(yarin), EP_RENK.ptf)
    + kart('Dönem PTF ort.', pOrt, pAll.length ? 'min ' + say(Math.min(...pAll)) + ' · max ' + say(Math.max(...pAll)) : '—', EP_RENK.ptf)
    + kart('Dönem SMF ort.', epOrt(sAll), sAll.length + ' saat', EP_RENK.smf)
    + kart('PTF + YEKDEM', pOrt != null && ykAgir != null ? pOrt + ykAgir : null, 'YEKDEM ' + (ykAgir == null ? 'yok' : say(ykAgir, 2)), EP_RENK.top)
    + '</div>';

  // Günlük ortalama grafiği
  const gEt = donemGun.map(tarihK);
  h += '<section class="panel"><div class="bas"><h2>Günlük ortalama fiyat</h2><span class="k">' + (epSec.ay === 'yil' ? ylS : AYLAR[Number(epSec.ay.slice(5)) - 1] + ' ' + ylS) + '</span></div>'
    + epCizgi([{ ad: 'PTF', renk: EP_RENK.ptf, v: donemGun.map(g => epOrt(EP.ptf[g])) }, { ad: 'SMF', renk: EP_RENK.smf, v: donemGun.map(g => epOrt((EP.smf || {})[g])) }], gEt, 'TL/MWh') + '</section>';

  // Saatlik profil (dönem ortalaması)
  const prof = k => Array.from({ length: 24 }, (_, s) => epOrt(donemGun.map(g => ((EP[k] || {})[g] || [])[s])));
  const pp = prof('ptf'), sp = prof('smf'), pmx = Math.max(1, ...epDolu(pp), ...epDolu(sp));
  h += '<section class="panel"><div class="bas"><h2>Saatlik profil</h2><span class="k">dönem ortalaması, TL/MWh</span></div><div style="display:grid;grid-template-columns:repeat(24,1fr);gap:4px;align-items:end;height:160px">'
    + pp.map((v, s) => '<div title="' + String(s).padStart(2, '0') + ':00 · PTF ' + say(v) + ' · SMF ' + say(sp[s]) + '" style="display:flex;gap:1px;align-items:end;height:100%"><div style="flex:1;background:' + EP_RENK.ptf + ';height:' + ((v || 0) / pmx * 100).toFixed(1) + '%;border-radius:2px 2px 0 0"></div><div style="flex:1;background:' + EP_RENK.smf + ';opacity:.8;height:' + ((sp[s] || 0) / pmx * 100).toFixed(1) + '%;border-radius:2px 2px 0 0"></div></div>').join('')
    + '</div><div style="display:grid;grid-template-columns:repeat(24,1fr);gap:4px" class="k">' + pp.map((_, s) => '<div style="text-align:center;font-size:11px">' + (s % 3 === 0 ? s : '') + '</div>').join('') + '</div>'
    + '<div class="k"><span style="display:inline-block;width:10px;height:10px;background:' + EP_RENK.ptf + ';margin-right:6px"></span>PTF <span style="display:inline-block;width:10px;height:10px;background:' + EP_RENK.smf + ';margin:0 6px 0 14px"></span>SMF. Öğle saatlerindeki düşük fiyatlar mahsuplaşma dışı satışın değerini gösterir.</div></section>';

  // Aylık tablo
  const ykHucre = yk => yk ? '<span title="' + esc(yk.ad + (yk.ongoru != null ? ' · öngörü ' + say(yk.ongoru, 2) : '') + (yk.kat ? ' · önceki ay katsayısı ' + yk.kat.toFixed(4) : '') + (yk.not ? ' · ' + yk.not : '')) + '">' + say(yk.deger, 2) + ' <span style="font-size:11px;font-weight:700;color:' + (yk.durum === 'kesin' ? '#1E7A3C' : yk.durum === 'tahmin' ? '#9A5B00' : '#B54708') + '">' + yk.ad + '</span></span>' : '—';
  h += '<section class="panel"><div class="bas"><h2>Aylık özet</h2><span class="k">TL/MWh</span></div><div class="tablo-kutu"><table class="tb"><thead><tr><th class="sol">Ay</th><th>Gün</th><th>PTF ort.</th><th>PTF min</th><th>PTF max</th><th>≈0 TL saat</th><th class="ayr">SMF ort.</th><th class="ayr">YEKDEM</th><th>PTF + YEKDEM</th></tr></thead><tbody>'
    + aylar.slice().reverse().map(epAyOzet).map(o => '<tr' + (o.ay === epSec.ay ? ' style="background:#EEF5FD"' : '') + '><td class="sol"><a href="#epias" onclick="epSec.ay=\'' + o.ay + '\';cizEpias();return false">' + AYLAR[Number(o.ay.slice(5)) - 1] + '</a></td><td>' + o.gun + '</td><td><b>' + say(o.pOrt, 2) + '</b></td><td>' + say(o.pMin) + '</td><td>' + say(o.pMax) + '</td><td' + (o.sifir ? '' : ' class="sifir"') + '>' + o.sifir + '</td><td class="ayr">' + say(o.sOrt, 2) + '</td><td class="ayr">' + ykHucre(o.yk) + '</td><td><b>' + say(o.toplam, 2) + '</b></td></tr>').join('')
    + '</tbody></table></div><div class="k">≈0 TL saat: PTF ≤ 1 TL/MWh olan saat sayısı. Enerji maliyeti eski paneldeki gibi (PTF + YEKDEM) × 1,035 / 1000 TL/kWh olarak hesaplanır.</div></section>';

  // YEKDEM kartları
  const ykAylar = Object.keys(EP.yekdem || {}).sort();
  if (ykAylar.length) {
    const renk = { kesin: ['#E7F6EC', '#1E7A3C'], tahmin: ['#FFF4DC', '#9A5B00'], ongoru: ['#FEF0E6', '#B54708'] };
    h += '<section class="panel"><div class="bas"><h2>YEKDEM birim bedelleri</h2><span class="k">TL/MWh · yeşil gerçekleşen, sarı önceki ay sapmasıyla tahmin, turuncu resmi öngörü</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">'
      + ykAylar.map(ay => { const yk = yekdemAy(ay); if (!yk) return ''; const [bg, fg] = renk[yk.durum];
        const alt = yk.durum === 'kesin' && yk.ongoru ? 'Öngörü ' + say(yk.ongoru, 2) + ' (' + ((yk.gercek / yk.ongoru - 1) * 100 >= 0 ? '+' : '') + say((yk.gercek / yk.ongoru - 1) * 100, 1) + '%)' : yk.durum === 'tahmin' ? 'Öngörü ' + say(yk.ongoru, 2) + ' × ' + yk.kat.toFixed(3) : 'Ay sonu kesinleşir';
        return '<div style="background:' + bg + ';border-radius:10px;padding:12px 14px" title="' + esc(yk.not || '') + '"><div class="k" style="font-weight:700;text-transform:uppercase;font-size:11px">' + AYLAR[Number(ay.slice(5)) - 1] + ' ' + ay.slice(0, 4) + '</div><div class="num" style="font-size:22px;font-weight:700;color:' + fg + '">' + say(yk.deger, 2) + '</div><div style="font-size:12px;color:' + fg + ';font-weight:600">' + yk.ad + '</div><div class="k" style="font-size:11px;margin-top:4px">' + alt + '</div></div>'; }).join('')
      + '</div></section>';
  }

  // Gün detayı
  const gg = epSec.gun, pd = EP.ptf[gg] || [], sd = (EP.smf || {})[gg] || [], ud = (EP.ptf_usd || {})[gg] || [], ykG = yekdemAy(gg.slice(0, 7));
  h += '<section class="panel"><div class="bas"><h2>Saatlik fiyatlar · ' + tarihK(gg) + ' ' + gg.slice(0, 4) + ' ' + GUNLER[new Date(gg + 'T12:00:00Z').getUTCDay()] + '</h2><label class="k" style="display:flex;align-items:center;gap:8px">Gün <input type="date" value="' + gg + '" min="' + gunler[0] + '" max="' + gunler[gunler.length - 1] + '" onchange="if(this.value){epSec.gun=this.value;cizEpias()}"></label></div>'
    + '<div class="tablo-kutu"><table class="tb"><thead><tr><th class="sol">Saat</th><th>PTF</th><th>PTF ($)</th><th>SMF</th><th>SMF − PTF</th><th class="ayr">PTF + YEKDEM</th><th>Maliyet TL/kWh</th></tr></thead><tbody>'
    + Array.from({ length: 24 }, (_, s) => { const p = pd[s], sm = sd[s], top = p != null && ykG ? p + ykG.deger : null;
        return '<tr><td class="saat">' + String(s).padStart(2, '0') + ':00</td><td' + (p != null && p <= 1 ? ' class="sifir"' : '') + '>' + say(p, 2) + '</td><td>' + say(ud[s], 2) + '</td><td>' + say(sm, 2) + '</td><td>' + (p != null && sm != null ? say(sm - p, 2) : '—') + '</td><td class="ayr">' + say(top, 2) + '</td><td>' + (top != null ? say(top * 1.035 / 1000, 3) : '—') + '</td></tr>'; }).join('')
    + '<tr class="top"><td class="sol">Ortalama</td><td>' + say(epOrt(pd), 2) + '</td><td>' + say(epOrt(ud), 2) + '</td><td>' + say(epOrt(sd), 2) + '</td><td></td><td class="ayr">' + say(epOrt(pd) != null && ykG ? epOrt(pd) + ykG.deger : null, 2) + '</td><td></td></tr></tbody></table></div>'
    + '<div class="k">SMF gün içinde saatlik kesinleşir; boş saatler henüz yayınlanmamış demektir.' + (ykG ? ' YEKDEM: ' + say(ykG.deger, 2) + ' (' + ykG.ad.toLowerCase() + ').' : '') + '</div></section>';

  ic.innerHTML = h;
}
function epCsv() {
  if (!EP) return;
  const ylS = String(epSec.yil), gunler = Object.keys(EP.ptf).filter(g => epSec.ay === 'yil' ? g.startsWith(ylS) : g.startsWith(epSec.ay)).sort();
  const sat = ['Tarih;Saat;PTF (TL/MWh);PTF ($/MWh);SMF (TL/MWh);YEKDEM (TL/MWh)'];
  const f = v => v == null ? '' : String(v).replace('.', ',');
  for (const g of gunler) { const yk = yekdemAy(g.slice(0, 7)); for (let s = 0; s < 24; s++) sat.push([g, String(s).padStart(2, '0') + ':00', f((EP.ptf[g] || [])[s]), f(((EP.ptf_usd || {})[g] || [])[s]), f(((EP.smf || {})[g] || [])[s]), f(yk ? Math.round(yk.deger * 1000) / 1000 : null)].join(';')); }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + sat.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'epias_' + (epSec.ay === 'yil' ? ylS : epSec.ay) + '.csv';
  a.click();
}

function ciz() {
  const h0 = location.hash || '#genel';
  const sayfa = h0.startsWith('#epias') ? 'epias' : h0.startsWith('#sayac') ? 'sayac' : h0.startsWith('#inverter') && !h0.startsWith('#inverterler') ? 'inverter' : 'genel';
  document.querySelectorAll('.nav a[data-sayfa]').forEach(a => a.classList.toggle('aktif', a.dataset.sayfa === sayfa));
  if (sayfa === 'epias') cizEpias(); else if (sayfa === 'inverter') cizInverter(); else if (sayfa === 'sayac') cizSayac(); else { cizGenel(); const h = location.hash.slice(1); if (h && h !== 'genel') { const el = document.getElementById(h); if (el) el.scrollIntoView(); } }
}
window.addEventListener('hashchange', () => { if (D) { ciz(); if (location.hash.startsWith('#sayac') || location.hash === '#inverter' || location.hash === '#epias') window.scrollTo(0, 0); } });

async function yukle() {
  try {
    const [son, osos, mad, fs] = await Promise.all([
      al('n8n/aesun_son.json').catch(() => null),
      al('2026_osos_endeks.json'),
      al('antminer_panel.json').catch(() => null),
      al('n8n/fusionsolar_son.json').catch(() => null)
    ]);
    D = { son: son && Array.isArray(son.son) ? son : null, osos, mad, fs };
    ciz();
  } catch (e) {
    if (!D) document.getElementById('icerik').innerHTML = '<div class="panel hata">Veri okunamadı: ' + esc(e.message || e) + '</div>';
  }
}
yukle();
setInterval(yukle, 180000);
let boyutZ = null, sonGen = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(boyutZ); boyutZ = setTimeout(() => { if (D && Math.abs(window.innerWidth - sonGen) > 40) { sonGen = window.innerWidth; ciz(); } }, 300); });
</script>
</body>
