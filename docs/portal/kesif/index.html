<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Araç Kütüphanesi · Aksaray Enerji</title>
<link rel="icon" href="../../favicon.svg">
<style>
:root{--k:#D7262E;--kk:#B91C24;--a:#2B2F35;--z:#F6F5F3;--y:#fff;--c:#E4E1DC;--s:#6B6F76;--yes:#1F8A4C;--mav:#2463B5;--tur:#C26A12}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--z);color:var(--a)}
header{background:var(--y);border-bottom:1px solid var(--c);padding:14px 16px;position:sticky;top:0;z-index:5}
.ust{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.amb{width:30px;height:30px;flex:none}
h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.alt{color:var(--s);font-size:13px}
.ara{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--c);border-radius:10px;font:inherit;background:var(--z)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.sat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cip{border:1px solid var(--c);background:var(--y);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--a)}
.cip[aria-pressed=true]{background:var(--a);color:#fff;border-color:var(--a)}
.cip.kir[aria-pressed=true]{background:var(--k);border-color:var(--k)}
.cip b{font-weight:600;opacity:.6;margin-left:4px}
.ozet{color:var(--s);font-size:13px;margin:6px 0 12px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.kart{background:var(--y);border:1px solid var(--c);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kart.oneri{border-color:var(--k);box-shadow:inset 3px 0 0 var(--k)}
.kart a.ad{color:var(--a);font-weight:650;text-decoration:none;word-break:break-word}
.kart a.ad:hover{color:var(--k)}
.acik{color:#45494f;font-size:13.5px}
.rz{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;font-size:12px}
.rz span{padding:2px 8px;border-radius:6px;background:var(--z);color:var(--s)}
.rz .mit{background:#E6F4EC;color:var(--yes)}.rz .izinli{background:#E7EFFA;color:var(--mav)}.rz .dikkat{background:#FBEFE2;color:var(--tur)}
.rz .yeni{background:var(--k);color:#fff}
.bos{padding:40px;text-align:center;color:var(--s)}
.not{background:var(--y);border:1px solid var(--c);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--s);margin-bottom:10px}
.daha{display:block;margin:14px auto 0;padding:10px 18px}
@media(max-width:600px){.sat{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.cip{flex:none}.not{font-size:12px}}
</style>
</head>
<body>
<header><div class="ust">
<svg class="amb" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2a14 14 0 0 0 0 28z" fill="#D7262E"/><path d="M16 2a14 14 0 0 1 0 28z" fill="#2B2F35"/><path d="M18 6l-7 11h5l-2 9 7-12h-5z" fill="#fff"/></svg>
<div><h1>Araç Kütüphanesi</h1><div class="alt" id="tarih">Yükleniyor…</div></div>
<input class="ara" id="ara" type="search" placeholder="Ara: seslendirme, altyazı, güvenlik, solar…" aria-label="Ara">
</div></header>
<main>
<div class="not">Her sabah GitHub, public-apis ve awesome-selfhosted otomatik taranır. <b>Önerilen</b> kartlar denendi ya da kurulması önerildi. Diğerleri keşif listesidir; hiçbiri tampon bölgede denenmeden sisteme kurulmaz. 🟢 MIT · 🔵 izin verici lisans · 🟠 dikkat (GPL vb.)</div>
<div class="sat" id="gruplar" role="group" aria-label="Grup"></div>
<div class="sat" id="kaynak" role="group" aria-label="Kaynak"></div>
<div class="sat" role="group" aria-label="Süzgeç">
<button class="cip kir" id="fMit" aria-pressed="false">Yalnız MIT</button>
<button class="cip kir" id="fYeni" aria-pressed="false">Son 7 günde yeni</button>
<button class="cip kir" id="fAnah" aria-pressed="false">Anahtarsız servis</button>
</div>
<div class="ozet" id="ozet"></div>
<div class="izgara" id="liste"></div>
<button class="cip daha" id="daha" hidden>Daha fazla göster</button>
</main>
<script>
const $=i=>document.getElementById(i), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const KAY={oneri:'Önerilen',github:'GitHub',sunucu:'Sunucuya kurulur',api:'Hazır servis (API)'};
let V={kayit:[],gruplar:{}}, S={g:'hepsi',k:'hepsi',mit:false,yeni:false,anah:false,q:'',n:60};
const yedi=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
function cips(el,ops,anah){el.innerHTML=ops.map(([v,t,n])=>`<button class="cip" data-v="${v}" aria-pressed="${S[anah]===v}">${esc(t)}<b>${n}</b></button>`).join('');
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[anah]=b.dataset.v;S.n=60;ciz()}}
function uy(x,haric){const q=S.q;
 return (haric==='g'||S.g==='hepsi'||x.g===S.g)&&(haric==='k'||S.k==='hepsi'||x.k===S.k)&&(!S.mit||x.ls==='mit')&&(!S.yeni||(x.ilk>=yedi&&x.k!=='api'))
  &&(!S.anah||x.y==='Anahtarsız')&&(!q||(x.ad+' '+x.a+' '+(x.konu||'')+' '+(x.kat||'')).toLocaleLowerCase('tr').includes(q))}
function ciz(){
 const say=(f,a,v)=>V.kayit.filter(x=>uy(x,a)&&(v==='hepsi'||x[f]===v)).length;
 cips($('gruplar'),[['hepsi','Tümü',say('g','g','hepsi')],...Object.entries(V.gruplar).map(([k,t])=>[k,t,say('g','g',k)])],'g');
 cips($('kaynak'),[['hepsi','Tüm kaynaklar',say('k','k','hepsi')],...Object.entries(KAY).map(([k,t])=>[k,t,say('k','k',k)])],'k');
 ['fMit','fYeni','fAnah'].forEach((i,j)=>$(i).setAttribute('aria-pressed',[S.mit,S.yeni,S.anah][j]));
 const sira={oneri:0,github:1,sunucu:2,api:3};
 const l=V.kayit.filter(x=>uy(x)).sort((a,b)=>(sira[a.k]-sira[b.k])||((typeof b.y==='number'?b.y:0)-(typeof a.y==='number'?a.y:0)));
 $('ozet').textContent=l.length+' kayıt';
 $('liste').innerHTML=l.length?l.slice(0,S.n).map(x=>{
  const lis=x.ls?`<span class="${x.ls}">${esc(x.l||'lisans ?')}</span>`:'';
  const yil=typeof x.y==='number'?`<span>⭐ ${x.y.toLocaleString('tr')}</span>`:(x.y?`<span>${esc(x.y)}</span>`:'');
  return `<article class="kart${x.k==='oneri'?' oneri':''}"><a class="ad" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">${esc(x.ad)}</a>
  <div class="acik">${esc(x.a)}</div><div class="rz">${x.ilk>=yedi&&x.k!=='api'&&x.k!=='oneri'?'<span class="yeni">yeni</span>':''}<span>${esc(V.gruplar[x.g])}</span>${lis}${yil}<span>${esc(KAY[x.k])}</span>${x.gun?`<span>güncel ${esc(x.gun)}</span>`:''}</div></article>`}).join(''):'<div class="bos">Sonuç yok.</div>';
 $('daha').hidden=l.length<=S.n;
}
$('daha').onclick=()=>{S.n+=60;ciz()};
$('fMit').onclick=()=>{S.mit=!S.mit;ciz()};$('fYeni').onclick=()=>{S.yeni=!S.yeni;ciz()};$('fAnah').onclick=()=>{S.anah=!S.anah;ciz()};
let zt;$('ara').oninput=e=>{clearTimeout(zt);zt=setTimeout(()=>{S.q=e.target.value.trim().toLocaleLowerCase('tr');S.n=60;ciz()},150)};
fetch('katalog.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{V=d;$('tarih').textContent='Son tarama: '+d.tarih+' UTC · '+d.kayit.length+' kayıt';ciz()})
 .catch(()=>{$('tarih').textContent='Katalog henüz oluşmadı';$('liste').innerHTML='<div class="bos">İlk tarama bekleniyor.</div>'});
</script>
</body>
</html>
