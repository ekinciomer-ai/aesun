name: LVL MAX önizleme dalı
# Sunucu işinin "disari" çıktısındaki LVL MAX önizlemelerini ayrı "lvlmax-onizleme" dalına koyar
# (ana dal şişmez; Claude oturumu ve telefon bu daldan izleyebilir). 1080p dosyası sunucuda kalır.
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "sunucu_islem çalıştırma no", required: true}
permissions: {contents: write, actions: read}
concurrency: {group: lvlmax-onizleme}
jobs:
  koy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: disari, path: /tmp/d, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - name: Dala koy
        run: |
          mkdir -p /tmp/x && for f in /tmp/d/lvlmax_*.tgz; do tar xzf "$f" -C /tmp/x; done
          cd /tmp && rm -rf o && mkdir o && cd o && git init -q
          git config user.name "lvlmax-bot"; git config user.email "lvlmax-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin lvlmax-onizleme; then git checkout -q -b lvlmax-onizleme FETCH_HEAD; else git checkout -q --orphan lvlmax-onizleme; fi
          cp /tmp/x/*onizleme*.mp4 /tmp/x/*.json . 2>/dev/null || true
          ls -la
          git add -A && git commit -qm "LVL MAX önizleme (run ${{ inputs.run_id }})" || exit 0
          git push -q origin HEAD:lvlmax-onizleme
