name: TikTok profil güncelle (hesap seçmeli, kilit beklemez)
# sunucu/profil.json'daki ad/biyografi/logo ile o hesabın TikTok profilini günceller. Ekran görüntüleri yapıt olarak saklanır.
on:
  workflow_dispatch:
    inputs:
      hesap:
        description: "boş = @antikstudyo, yr = @yolu.se"
        required: false
        default: "yr"
permissions:
  contents: write
jobs:
  profil:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            sunucu/islem_tt_profil.sh
            sunucu/profil.json
          sparse-checkout-cone-mode: false
      - name: Güncelle
        env:
          ANAHTAR: ${{ secrets.SUNUCU_SSH }}
          ADRES: ${{ secrets.SUNUCU_ADRES }}
          GH_TOKEN: ${{ github.token }}
          H: ${{ inputs.hesap }}
        run: |
          case "$H" in ""|yr) ;; *) echo "::error::geçersiz hesap"; exit 1;; esac
          mkdir -p ~/.ssh ekran
          printf '%s' "$ANAHTAR" | python3 -c "import sys,re; t=sys.stdin.read().replace(chr(13),''); m=re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \\1-----', t, re.S); g=re.sub(r'\\s+','',m.group(2)); print('-----BEGIN '+m.group(1)+'-----'); [print(g[i:i+70]) for i in range(0,len(g),70)]; print('-----END '+m.group(1)+'-----')" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          O="-i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          tar czf /tmp/p.tgz sunucu
          ssh $O root@$ADRES "rm -rf /tmp/ttp && mkdir -p /tmp/ttp && tar xzf - -C /tmp/ttp && TT_HESAP=$H bash /tmp/ttp/sunucu/islem_tt_profil.sh; rm -rf /tmp/ttp" < /tmp/p.tgz | sed 's/^NOT: */::notice::/'
          scp -q $O "root@$ADRES:/opt/aesun/tiktok${H:+_$H}/adim/profil_*.png" ekran/ 2>/dev/null || true
          rm -f ~/.ssh/k
          for y in ekran/*.png; do [ -f "$y" ] || continue; d="docs/tampon/tiktok${H:+_$H}/profil/$(basename $y)"; sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$d?ref=main" --jq .sha 2>/dev/null || true); gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$d" -f message="TikTok profil ekranı ${H:-as}" -f content="$(base64 -w0 $y)" ${sha:+-f sha=$sha} >/dev/null || echo "::warning::$d yazılamadı"; done
